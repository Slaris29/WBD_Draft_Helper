            </button>
            <div className="grid grid-cols-2 gap-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                return (
                  <button key={mId} onClick={() => handleChoicePlayer(mId)}
                    className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                    <div className="font-bold text-base">{m?.name}</div>
                    <div className="text-xs text-slate-400 mt-1">최종 {t.maxTotal}P 차감 → 잔여 {m?.p - t.maxTotal}P</div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })()}

      {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
    </PhaseLayout>
  );
}

// ============================================================
// S2 PHASE (6명 그룹 × 3 자유 입찰 + 유찰 라운드)
// ============================================================
function S2Phase({ state, setState }) {
  const [detailP, setDetailP] = useState(null);
  
  // 초기화: 매물 추첨 단계 - 풀이 비면 유찰 풀에서 자동 추첨 (6명씩 계속)
  useEffect(() => {
    if (state.s2_step === 'lot' && state.s2_currentLot.length === 0) {
      // 우선순위: 1) 아직 추첨 안 된 S2 풀 → 2) 유찰 풀
      const relegSet = new Set(state.s2_relegPool || []);
      const freshPool = state.players.filter(p => p.section === 'S2' && !p.takenBy && !relegSet.has(p.id));
      let nextLot, fromRelegation = false;
      if (freshPool.length > 0) {
        nextLot = shuffle(freshPool).slice(0, Math.min(6, freshPool.length));
      } else {
        // 유찰 풀에서 (현재 takenBy 안 된 것만)
        const relegPool = state.players.filter(p => relegSet.has(p.id) && !p.takenBy);
        nextLot = shuffle(relegPool).slice(0, Math.min(6, relegPool.length));
        fromRelegation = true;
      }
      if (nextLot.length === 0) {
        // 더 이상 추첨할 매물 없음 → S3로
        setState(s => ({...s, section: 'S3', s2_step: 'lot', s2_currentLot: [], s2_inRelegation: false}));
      } else {
        // 유찰 풀에서 추첨한 매물은 relegPool에서 일시 제거 (재유찰 되면 다시 들어감)
        setState(s => {
          const ns = {...s, s2_currentLot: nextLot.map(p=>p.id), s2_step: 'bid', s2_bids: {}, s2_inRelegation: fromRelegation};
          if (fromRelegation) {
            const lotIds = new Set(nextLot.map(p=>p.id));
            ns.s2_relegPool = (ns.s2_relegPool || []).filter(pid => !lotIds.has(pid));
          }
          return ns;
        });
      }
    }
  }, [state.s2_step, state.s2_currentLot.length, state.s2_relegPool, state.players]);

  const lotPlayers = state.s2_currentLot.map(pid => state.players.find(p => p.id === pid)).filter(p => p && !p.takenBy);
  const activeMgrs = state.managers.filter(m => m.sectionCounts.S2 < SECTION_SLOTS.S2);

  const updateBid = (mgrId, playerId, v) => setState(s => ({
    ...s, s2_bids: {...s.s2_bids, [mgrId]: {...(s.s2_bids[mgrId]||{}), [playerId]: v}}
  }));

  // S2 AI 자동 입찰: 다중 매물 (한 감독이 여러 매물에 베팅, 총합 잔여 P 안에)
  const handleAIBidS2 = () => {
    const lotPlayers = (state.s2_currentLot || []).map(pid => state.players.find(p => p.id === pid)).filter(Boolean);
    if (lotPlayers.length === 0) return;
    const scarcity = computePositionScarcity(state.players);
    const aiBids = { ...state.s2_bids };
    activeMgrs.forEach(m => {
      if (state.myManagerId === m.id) return;
      aiBids[m.id] = { ...(aiBids[m.id] || {}) };
      const pConf0 = AI_PERSONALITIES[m.personality || 'BALANCED'];
      // 잔여 P 적응: P 많이 남으면 임계 낮춰서 더 자주 본격 베팅
      const slotsLeft2 = Math.max(1, 11 - (m.picks || []).length);
      const avgPS2 = m.p / slotsLeft2;
      let thresholdAdj = 0;
      if (avgPS2 > 25) thresholdAdj = -0.15;
      else if (avgPS2 > 18) thresholdAdj = -0.08;
      else if (avgPS2 > 13) thresholdAdj = -0.03;
      const baseTh = pConf0.capRatio ? 0.50 : (pConf0.rookieMult ? 0.25 : (pConf0.starBoost ? 0.40 : 0.35));
      const threshold = Math.max(0.15, baseTh + thresholdAdj);
      // 1단계: 매물별 관심도 측정 (베팅 아직 X)
      const interests = lotPlayers.map(player => {
        const pub = computePublicValue(player, pConf0.careerWeight || 1.0);
        return { player, pub, interest: computeInterest(player, m, pub, state.players, state.managers) };
      });
      const maxInterest = Math.max(0, ...interests.map(x => x.interest));
      // 2단계: 상대 우위 + 절대 임계 통과한 매물만 베팅
      //   - 최고 매물보다 0.12+ 낮으면 베팅 X (더 나은 거 있으면 그쪽에 집중)
      //   - 절대 임계 미통과면 베팅 X
      // P 많이 남으면 상대 우위 검사도 완화 (여러 매물 베팅 가능)
      const relGapS2 = avgPS2 > 20 ? 0.25 : 0.12;
      const maxBidRatioS2 = avgPS2 > 20 ? 0.30 : 0.18;
      const evalList = interests.map(({ player, pub, interest }) => {
        const passAbs = interest >= threshold;
        const passRel = (maxInterest - interest) <= relGapS2;
        const bid = (passAbs && passRel) ? computeAIBid(player, m, state.players, { scarcity, minBid: 5, maxBidRatio: maxBidRatioS2, allManagers: state.managers, sectionKey: 'S2' }) : 0;
        return { player, bid, interest };
      });
      // 룰: 잔여 슬롯 수만큼만 베팅 가능 (베팅값 큰 순으로 N개만 남기고 나머지 0)
      const slotsLeft = Math.max(0, SECTION_SLOTS.S2 - m.sectionCounts.S2);
      const sorted = [...evalList].sort((a, b) => b.bid - a.bid);
      const keepIds = new Set(sorted.slice(0, slotsLeft).filter(x => x.bid > 0).map(x => x.player.id));
      // 총합이 잔여 P 넘으면 비례 축소 (선택된 것만 대상)
      const keptList = evalList.filter(x => keepIds.has(x.player.id));
      const totalBid = keptList.reduce((s, x) => s + x.bid, 0);
      const cap = m.p * 0.85;
      const scale = totalBid > cap ? cap / totalBid : 1;
      evalList.forEach(({ player, bid }) => {
        if (!keepIds.has(player.id)) {
          aiBids[m.id][player.id] = 0;  // 잔여 슬롯 초과 매물은 0P
        } else {
          const final = scale < 1 ? Math.max(5, Math.round((bid * scale) / 5) * 5) : bid;
          aiBids[m.id][player.id] = final;
        }
      });
    });
    setState(s => ({ ...s, s2_bids: aiBids }));
  };

  const handleAIBidS2TIE = () => {
    if (state.s2_step !== 'tie' || !state.s2_currentTie) return;
    const t = state.s2_currentTie;
    const player = state.players.find(p => p.id === t.playerId);
    if (!player) return;
    const pub = computePublicValue(player, 1.0);
    const aiTie = {};
    (t.mgrIds || []).forEach(mid => {
      if (state.myManagerId === mid) return;
      const mgr = state.managers.find(m => m.id === mid);
      if (!mgr) return;
      const pConf = AI_PERSONALITIES[mgr.personality || 'BALANCED'];
      const interest = computeInterest(player, mgr, pub, state.players, state.managers);
      let add;
      const r = Math.random();
      if (interest < 0.50) add = r < 0.8 ? 0 : 5;
      else if (interest < 0.70) add = r < 0.25 ? 0 : (r < 0.95 ? 5 : 10);
      else if (interest < 0.85) add = r < 0.05 ? 0 : (r < 0.65 ? 5 : 10);
      else add = r < 0.30 ? 5 : (r < 0.80 ? 10 : (r < 0.95 ? 15 : 20));
      if (pConf.capRatio && add === 5 && Math.random() < 0.4) add = 0;
      const baseCost = t.baseCost || 0;
      const remaining = mgr.p - baseCost;
      add = Math.max(0, Math.min(add, remaining));
      aiTie[mid] = add;
    });
    setState(s => ({ ...s, s2_tieBids: { ...s.s2_tieBids, ...aiTie } }));
  };

  const bidValidation = useMemo(() => {
    if (state.s2_step !== 'bid') return [];
    const errs = [];
    activeMgrs.forEach(m => {
      const bids = state.s2_bids[m.id] || {};
      let total = 0;
      let count = 0;
      Object.entries(bids).forEach(([pid, v]) => {
        if (v === '' || v === undefined || v === '0' || parseInt(v) === 0) return;
        const c = parseInt(v);
        if (isNaN(c) || c < 0) { errs.push(`${m.name}: ${pid} 음수 불가`); return; }
        if (c % PICK_STEP !== 0) { errs.push(`${m.name}: ${PICK_STEP}P 단위`); return; }
        total += c; count++;
      });
      if (total > m.p) errs.push(`${m.name}: 총 입찰 ${total}P > 잔여 ${m.p}P (모두 픽 받으면 초과)`);
      const slotsLeft = SECTION_SLOTS.S2 - m.sectionCounts.S2;
      if (count > slotsLeft) errs.push(`${m.name}: ${count}명 입찰 > 잔여 슬롯 ${slotsLeft}개`);
    });
    return errs;
  }, [state.s2_step, state.s2_bids, activeMgrs]);

  // 처리: 매물별 최고가 산출
  const handleProcessBid = () => {
    setState(s => {
      let ns = {...s};
      const conflicts = [];
      lotPlayers.forEach(p => {
        const bidders = [];
        activeMgrs.forEach(m => {
          const v = (s.s2_bids[m.id] || {})[p.id];
          if (v !== undefined && v !== '' && parseInt(v) > 0) {
            bidders.push({mgrId: m.id, cost: parseInt(v)});
          }
        });
        if (bidders.length === 0) return; // 유찰
        const maxCost = Math.max(...bidders.map(b => b.cost));
        const top = bidders.filter(b => b.cost === maxCost);
        if (top.length === 1) {
          // 단독 픽: 위로 X (룰: 추가입찰 동률 → 선수 선택일 때만 위로)
          ns = applyPickStateUpdate(ns, top[0].mgrId, p.id, maxCost, s.s2_inRelegation ? 'S2-유' : 'S2', [], 'S2');
        } else {
          // 충돌 - 추가입찰 대기열
          // baseCost = maxCost, 비충돌 입찰자(낮은 P)도 위로 보너스 대상
          const losers = bidders.filter(b => b.cost < maxCost).map(b => b.mgrId);
          conflicts.push({playerId: p.id, mgrIds: top.map(t=>t.mgrId), baseCost: maxCost, losers});
        }
      });
      if (conflicts.length > 0) {
        const first = conflicts[0];
        ns.s2_step = 'tie';
        ns.s2_currentTie = {...first, remaining: conflicts.slice(1)};
        ns.s2_tieBids = {};
      } else {
        ns = advanceS2Group(ns);
      }
      return ns;
    });
  };

  const advanceS2Group = (s) => {
    const ns = {...s};
    // 현재 추첨에서 픽 안 된 매물은 유찰 풀로 누적
    const newlyRelegated = s.s2_currentLot.filter(pid => {
      const p = ns.players.find(pp => pp.id === pid);
      return p && !p.takenBy;
    });
    if (newlyRelegated.length > 0) {
      ns.s2_relegPool = [...(ns.s2_relegPool || []), ...newlyRelegated];
    }
    // 다음 추첨 트리거: currentLot 비우고 step을 lot으로 → useEffect가 자동 추첨
    ns.s2_currentLot = [];
    ns.s2_step = 'lot';
    ns.s2_bids = {};
    ns.s2_group_idx = (s.s2_group_idx || 0) + 1;  // 추첨 카운터 (표시용)
    // 활성 감독 없으면 즉시 S3로
    const stillActive = ns.managers.filter(m => m.sectionCounts.S2 < SECTION_SLOTS.S2);
    if (stillActive.length === 0) {
      ns.section = 'S3';
      ns.s2_inRelegation = false;
    }
    return ns;
  };

  const updateTieBid = (mgrId, v) => setState(s => ({...s, s2_tieBids: {...s.s2_tieBids, [mgrId]: v}}));

  const tieValidation = useMemo(() => {
    if (state.s2_step !== 'tie' || !state.s2_currentTie) return [];
    const errs = [];
    const t = state.s2_currentTie;
    t.mgrIds.forEach(mId => {
      const mgr = state.managers.find(m=>m.id===mId);
      const v = state.s2_tieBids[mId];
      if (v === undefined || v === '') { errs.push(`${mgr?.name}: 추가 P 미입력`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c < 0) errs.push(`${mgr?.name}: 0 이상`);
      else if (c % PICK_STEP !== 0) errs.push(`${mgr?.name}: ${PICK_STEP}P 단위`);
      else if (t.baseCost + c > mgr.p) errs.push(`${mgr?.name}: 잔여 P 초과`);
    });
    return errs;
  }, [state.s2_step, state.s2_currentTie, state.s2_tieBids, state.managers]);

  const handleTieProcess = () => {
    setState(s => {
      const t = s.s2_currentTie;
      const entries = t.mgrIds.map(mId => ({mgrId: mId, total: t.baseCost + parseInt(s.s2_tieBids[mId])}));
      const maxTotal = Math.max(...entries.map(e => e.total));
      const top = entries.filter(e => e.total === maxTotal);
      let ns = {...s};
      if (top.length === 1) {
        const winnerMgrId = top[0].mgrId;
        const comfortMgrs = []; // 추가입찰 단독 승자: 위로 X
        ns = applyPickStateUpdate(ns, winnerMgrId, t.playerId, maxTotal, s.s2_inRelegation ? 'S2-유' : 'S2', comfortMgrs, 'S2');
        ns = advanceS2TieQueue(ns);
      } else {
        ns.s2_step = 'choice';
        ns.s2_currentTie = {...t, mgrIds: top.map(e=>e.mgrId)};
      }
      return ns;
    });
  };

  const advanceS2TieQueue = (s) => {
    const ns = {...s};
    if (s.s2_currentTie.remaining && s.s2_currentTie.remaining.length > 0) {
      const next = s.s2_currentTie.remaining[0];
      ns.s2_currentTie = {...next, remaining: s.s2_currentTie.remaining.slice(1)};
      ns.s2_step = 'tie';
      ns.s2_tieBids = {};
    } else {
      return advanceS2Group({...ns, s2_currentTie: null});
    }
    return ns;
  };

  const handleChoicePlayer = (chosenMgrId) => {
    setState(s => {
      const t = s.s2_currentTie;
      const finalCost = t.baseCost + parseInt(s.s2_tieBids[chosenMgrId]);
      const comfortMgrs = t.mgrIds.filter(mId => mId !== chosenMgrId); // 1차 패자는 위로 X
      let ns = applyPickStateUpdate(s, chosenMgrId, t.playerId, finalCost, s.s2_inRelegation ? 'S2-유' : 'S2', comfortMgrs, 'S2');
      ns = advanceS2TieQueue(ns);
      return ns;
    });
  };

  // 풀 카운트 (남은 신규 + 유찰 풀)
  const s2FreshLeft = state.players.filter(p => p.section === 'S2' && !p.takenBy && !((state.s2_relegPool||[]).includes(p.id)) && !state.s2_currentLot.includes(p.id)).length;
  const s2RelegLeft = (state.s2_relegPool || []).filter(pid => {
    const p = state.players.find(pp => pp.id === pid);
    return p && !p.takenBy;
  }).length;
  const groupTitle = state.s2_inRelegation 
    ? `🔁 유찰 풀에서 추첨 (${lotPlayers.length}명 공개 · 신규 ${s2FreshLeft} · 유찰풀 ${s2RelegLeft})` 
    : `🥈 추첨 ${(state.s2_group_idx||0)+1}차 (${lotPlayers.length}명 공개 · 신규 ${s2FreshLeft} · 유찰풀 ${s2RelegLeft})`;

  // ============== 간이 모드 분기 ==============
  if (state.mode === 'quick') {
    const handleQuickS2 = ({matches, comfortMgrs}) => {
      setState(s => {
        let ns = s;
        matches.forEach(m => {
          ns = applyPickStateUpdate(ns, m.mgrId, m.playerId, m.cost, s.s2_inRelegation ? 'S2-유' : 'S2', [], 'S2');
        });
        ns = {...ns, managers: ns.managers.map(mm => comfortMgrs.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        ns = advanceS2Group(ns);
        return ns;
      });
    };
    // ★ 매물 1개 즉시 처리
    const handlePickOneS2 = ({playerId, mgrIds, cost, otherCheckedMgrIds}) => {
      setState(s => {
        let winner, losers = [];
        if (mgrIds.length === 1) winner = mgrIds[0];
        else {
          winner = mgrIds[Math.floor(Math.random() * mgrIds.length)];
          losers = mgrIds.filter(mid => mid !== winner);
        }
        let ns = applyPickStateUpdate(s, winner, playerId, cost, s.s2_inRelegation ? 'S2-유' : 'S2', [], 'S2');
        const otherSet = new Set(otherCheckedMgrIds || []);
        const autoComfort = losers.filter(l => !otherSet.has(l));
        if (autoComfort.length > 0) {
          ns = {...ns, managers: ns.managers.map(mm => autoComfort.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        }
        // 그룹의 활성 매물 없거나 활성 감독 다 픽 했으면 다음 그룹/유찰 라운드/S3로
        const remainingInLot = ns.players.filter(p => ns.s2_currentLot.includes(p.id) && !p.takenBy);
        const stillActive = ns.managers.filter(m => m.sectionCounts.S2 < SECTION_SLOTS.S2);
        if (remainingInLot.length === 0 || stillActive.length === 0) {
          ns = advanceS2Group(ns);
        }
        return ns;
      });
    };
    const goNextGroupS2 = () => {
      if (confirm('남은 매물은 유찰 풀로 보내고 다음 그룹/단계로 진행할까요?')) {
        setState(s => advanceS2Group(s));
      }
    };
    return (
      <PhaseLayout state={state} setState={setState}
        title={'⚡ ' + SECTION_LABELS['S2']}
        subtitle={`${state.s2_inRelegation?'🔁 유찰풀 추첨':'추첨 '+((state.s2_group_idx||0)+1)+'차'} · 활성 ${activeMgrs.length}감독 (간이)`}>
        <div className="bg-slate-800/30 rounded p-3 mb-3">
          <div className="text-sm font-bold text-slate-300 mb-2">{groupTitle}</div>
        </div>
        <QuickMultiInput state={state} players={lotPlayers}
          activeMgrIds={activeMgrs.map(m=>m.id)} allowZero={true}
          onSubmit={handleQuickS2} onPickOne={handlePickOneS2}
          onOpenDetail={(p) => setDetailP(p)}/>
        {activeMgrs.length > 0 && lotPlayers.length > 0 && (
          <button onClick={goNextGroupS2} className="mt-3 w-full py-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">
            ⏭ 다음 그룹/단계로 (남은 매물 유찰)
          </button>
        )}
        {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
      </PhaseLayout>
    );
  }
  // ============== 상세 모드 (기존) ==============

  return (
    <PhaseLayout state={state} setState={setState}
      title={SECTION_LABELS['S2']}
      subtitle={`${state.s2_inRelegation?'🔁 유찰풀 추첨':'추첨 '+((state.s2_group_idx||0)+1)+'차'} · 활성 ${activeMgrs.length}감독`}>
      <div className="bg-slate-800/30 rounded p-3 mb-4">
        <div className="text-sm font-bold text-slate-300 mb-2">{groupTitle}</div>
        <div className="grid grid-cols-3 gap-2">
          {lotPlayers.map(p => (
            <MiniPlayerCard key={p.id} player={p} photoTpl={state.photoTpl} onClick={()=>setDetailP(p)}/>
          ))}
        </div>
      </div>

      {state.s2_step === 'bid' && (
        <div className="bg-slate-800/50 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold text-emerald-300">💰 자유 입찰 (감독 × 매물)</div>
            <button onClick={handleAIBidS2} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 입찰</button>
          </div>
          <div className="text-xs text-slate-400 mb-3">한 감독이 여러 선수에게 동시 입찰 가능 · 0P/공란=입찰 안 함 · 5P 단위 · 총 합 ≤ 잔여 P · 입찰 수 ≤ 잔여 슬롯</div>
          <div className="overflow-x-auto">
            <table className="text-xs w-full">
              <thead>
                <tr className="text-slate-400">
                  <th className="text-left p-1 w-32">감독</th>
                  <th className="text-center p-1 w-14">잔여P</th>
                  <th className="text-center p-1 w-14">슬롯</th>
                  {lotPlayers.map(p => (
                    <th key={p.id} className="text-center p-1 min-w-[80px]">
                      <div className="truncate font-bold text-emerald-300">{p.name}</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {state.managers.map(m => {
                  const inactive = m.sectionCounts.S2 >= SECTION_SLOTS.S2;
                  const slotsLeft = SECTION_SLOTS.S2 - m.sectionCounts.S2;
                  return (
                    <tr key={m.id} className={inactive?'opacity-30':''}>
                      <td className="p-1 font-bold">{m.name}</td>
                      <td className="text-center text-emerald-400">{m.p}</td>
                      <td className="text-center text-slate-400">{slotsLeft}</td>
                      {lotPlayers.map(p => (
                        <td key={p.id} className="p-1">
                          {!inactive && (
                            <input type="number" min={0} step={PICK_STEP} max={m.p}
                              value={(state.s2_bids[m.id]||{})[p.id] ?? ''}
                              onChange={e => updateBid(m.id, p.id, e.target.value)}
                              placeholder="0"
                              className="w-full bg-slate-800 border border-slate-700 rounded px-1 py-0.5 text-right focus:outline-none focus:border-emerald-500"/>
                          )}
                        </td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {bidValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{bidValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcessBid} disabled={bidValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 자유 입찰 처리
          </button>
        </div>
      )}

      {state.s2_step === 'tie' && state.s2_currentTie && (() => {
        const t = state.s2_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-amber-900/30 border-2 border-amber-500 rounded-lg p-4">
            <div className="flex items-center justify-between mb-1">
              <div className="text-base font-bold text-amber-300">⚖️ 동률 매물: {player?.name}</div>
              <button onClick={handleAIBidS2TIE} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동</button>
            </div>
            <div className="text-xs text-amber-200/80 mb-3">최고가 {t.baseCost}P 동률 {t.mgrIds.length}명 · 추가입찰</div>
            <div className="space-y-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                return (
                  <div key={mId} className="flex items-center gap-3 bg-slate-900/60 p-2 rounded">
                    <div className="w-28 font-bold">{m?.name}</div>
                    <div className="text-xs text-slate-400 w-16">잔여 {m?.p}P</div>
                    <span className="text-xs text-slate-500">추가 +</span>
                    <input type="number" min={0} step={PICK_STEP} max={m.p - t.baseCost}
                      value={state.s2_tieBids[mId] ?? ''} onChange={e => updateTieBid(mId, e.target.value)}
                      className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                    <span className="text-xs text-slate-500">P</span>
                  </div>
                );
              })}
            </div>
            {tieValidation.length > 0 && (
              <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
                <ul className="list-disc list-inside">{tieValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
              </div>
            )}
            <button onClick={handleTieProcess} disabled={tieValidation.length>0}
              className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
              ✅ 추가입찰 처리
            </button>
          </div>
        );
      })()}

      {state.s2_step === 'choice' && state.s2_currentTie && (() => {
        const t = state.s2_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-purple-900/30 border-2 border-purple-500 rounded-lg p-4">
            <div className="text-base font-bold text-purple-300 mb-1">🎯 추가입찰도 동률 → 선수가 선택</div>
            <div className="text-xs text-purple-200/80 mb-3"><b>{player?.name}</b>이 선택:</div>
            <button onClick={() => handleChoicePlayer(t.mgrIds[Math.floor(Math.random()*t.mgrIds.length)])}
              className="w-full py-2 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
              🎲 랜덤 선택 (동률 감독 {t.mgrIds.length}명 중)
            </button>
            <div className="grid grid-cols-2 gap-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                const finalCost = t.baseCost + parseInt(state.s2_tieBids[mId]);
                return (
                  <button key={mId} onClick={() => handleChoicePlayer(mId)}
                    className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                    <div className="font-bold text-base">{m?.name}</div>
                    <div className="text-xs text-slate-400 mt-1">최종 {finalCost}P 차감</div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })()}

      {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
    </PhaseLayout>
  );
}

// ============================================================
// S3 PHASE (3명 그룹 × 12 + 각 그룹 후 유찰)
// ============================================================
function S3Phase({ state, setState }) {
  const [detailP, setDetailP] = useState(null);

  // 초기화: S3 풀 미선정이면 36명 무작위 선정
  useEffect(() => {
    if (state.s3_pool.length === 0) {
      const candidates = state.players.filter(p => p.section === 'S3/4' && !p.takenBy);
      const pool = shuffle(candidates).slice(0, 36).map(p => p.id);
      setState(s => ({...s, s3_pool: pool}));
    }
  }, [state.s3_pool.length]);

  // 그룹 추첨
  useEffect(() => {
    if (state.s3_pool.length > 0 && state.s3_step === 'lot' && state.s3_currentLot.length === 0) {
      const poolPlayers = state.players.filter(p => state.s3_pool.includes(p.id) && !p.takenBy);
      const lot = shuffle(poolPlayers).slice(0, Math.min(3, poolPlayers.length));
      if (lot.length === 0) {
        // S3 종료 → S4 (유찰 잔여는 S4 풀로 흡수됨)
        setState(s => ({...s, section: 'S4', s3_step: 'lot', s3_currentLot: []}));
      } else {
        setState(s => ({...s, s3_currentLot: lot.map(p=>p.id), s3_step: 'bid', s3_bids: {}}));
      }
    }
  }, [state.s3_pool.length, state.s3_step, state.s3_currentLot.length]);

  const lotPlayers = state.s3_currentLot.map(pid => state.players.find(p => p.id === pid)).filter(p => p && !p.takenBy);
  const activeMgrs = state.managers.filter(m => m.sectionCounts.S3 < SECTION_SLOTS.S3);

  const updateBid = (mgrId, playerId, v) => setState(s => ({
    ...s, s3_bids: {...s.s3_bids, [mgrId]: {...(s.s3_bids[mgrId]||{}), [playerId]: v}}
  }));

  // S3 AI 자동 입찰 (S2와 동일 패턴, S3는 잔여 적으니 캡 더 조임)
  const handleAIBidS3 = () => {
    const lotPlayers = (state.s3_currentLot || []).map(pid => state.players.find(p => p.id === pid)).filter(Boolean);
    if (lotPlayers.length === 0) return;
    const scarcity = computePositionScarcity(state.players);
    const aiBids = { ...state.s3_bids };
    activeMgrs.forEach(m => {
      if (state.myManagerId === m.id) return;
      aiBids[m.id] = { ...(aiBids[m.id] || {}) };
      const pConf0 = AI_PERSONALITIES[m.personality || 'BALANCED'];
      // 잔여 P 적응: P 남으면 임계 낮춰서 적극 베팅
      const slotsLeft3 = Math.max(1, 11 - (m.picks || []).length);
      const avgPS3 = m.p / slotsLeft3;
      let thresholdAdj3 = 0;
      if (avgPS3 > 25) thresholdAdj3 = -0.18;
      else if (avgPS3 > 18) thresholdAdj3 = -0.10;
      else if (avgPS3 > 13) thresholdAdj3 = -0.03;
      const baseTh3 = pConf0.capRatio ? 0.55 : ((pConf0.rookieMult || pConf0.starBoost) ? 0.30 : 0.40);
      const threshold = Math.max(0.15, baseTh3 + thresholdAdj3);
      // 1단계: 관심도 측정
      const interests = lotPlayers.map(player => {
        const pub = computePublicValue(player, pConf0.careerWeight || 1.0);
        return { player, pub, interest: computeInterest(player, m, pub, state.players, state.managers) };
      });
      const maxInterest = Math.max(0, ...interests.map(x => x.interest));
      // 2단계: 상대 우위 (최고 매물 대비 0.10 이내) + 절대 임계 통과만 베팅
      const relGapS3 = avgPS3 > 20 ? 0.22 : 0.10;
      const maxBidRatioS3 = avgPS3 > 20 ? 0.28 : 0.15;
      const evalList = interests.map(({ player, pub, interest }) => {
        const passAbs = interest >= threshold;
        const passRel = (maxInterest - interest) <= relGapS3;
        const bid = (passAbs && passRel) ? computeAIBid(player, m, state.players, { scarcity, minBid: 5, maxBidRatio: maxBidRatioS3, allManagers: state.managers, sectionKey: 'S3' }) : 0;
        return { player, bid, interest };
      });
      // 룰: 잔여 슬롯 수만큼만 베팅 가능
      const slotsLeft = Math.max(0, SECTION_SLOTS.S3 - m.sectionCounts.S3);
      const sorted = [...evalList].sort((a, b) => b.bid - a.bid);
      const keepIds = new Set(sorted.slice(0, slotsLeft).filter(x => x.bid > 0).map(x => x.player.id));
      const keptList = evalList.filter(x => keepIds.has(x.player.id));
      const totalBid = keptList.reduce((s, x) => s + x.bid, 0);
      const cap = m.p * 0.80;
      const scale = totalBid > cap ? cap / totalBid : 1;
      evalList.forEach(({ player, bid }) => {
        if (!keepIds.has(player.id)) {
          aiBids[m.id][player.id] = 0;
        } else {
          const final = scale < 1 ? Math.max(5, Math.round((bid * scale) / 5) * 5) : bid;
          aiBids[m.id][player.id] = final;
        }
      });
    });
    setState(s => ({ ...s, s3_bids: aiBids }));
  };

  const handleAIBidS3TIE = () => {
    if (state.s3_step !== 'tie' || !state.s3_currentTie) return;
    const t = state.s3_currentTie;
    const player = state.players.find(p => p.id === t.playerId);
    if (!player) return;
    const pub = computePublicValue(player, 1.0);
    const aiTie = {};
    (t.mgrIds || []).forEach(mid => {
      if (state.myManagerId === mid) return;
      const mgr = state.managers.find(m => m.id === mid);
      if (!mgr) return;
      const pConf = AI_PERSONALITIES[mgr.personality || 'BALANCED'];
      const interest = computeInterest(player, mgr, pub, state.players, state.managers);
      let add;
      const r = Math.random();
      if (interest < 0.50) add = r < 0.8 ? 0 : 5;
      else if (interest < 0.70) add = r < 0.25 ? 0 : (r < 0.95 ? 5 : 10);
      else if (interest < 0.85) add = r < 0.05 ? 0 : (r < 0.65 ? 5 : 10);
      else add = r < 0.30 ? 5 : (r < 0.80 ? 10 : (r < 0.95 ? 15 : 20));
      if (pConf.capRatio && add === 5 && Math.random() < 0.4) add = 0;
      const baseCost = t.baseCost || 0;
      const remaining = mgr.p - baseCost;
      add = Math.max(0, Math.min(add, remaining));
      aiTie[mid] = add;
    });
    setState(s => ({ ...s, s3_tieBids: { ...s.s3_tieBids, ...aiTie } }));
  };

  const bidValidation = useMemo(() => {
    if (state.s3_step !== 'bid') return [];
    const errs = [];
    activeMgrs.forEach(m => {
      const bids = state.s3_bids[m.id] || {};
      let total = 0, count = 0;
      Object.entries(bids).forEach(([pid, v]) => {
        if (v === '' || v === undefined || parseInt(v) === 0) return;
        const c = parseInt(v);
        if (isNaN(c) || c < 0) { errs.push(`${m.name}: 음수 불가`); return; }
        if (c % PICK_STEP !== 0) { errs.push(`${m.name}: ${PICK_STEP}P 단위`); return; }
        total += c; count++;
      });
      if (total > m.p) errs.push(`${m.name}: 총 ${total}P > 잔여 ${m.p}P`);
      const slotsLeft = SECTION_SLOTS.S3 - m.sectionCounts.S3;
      if (count > slotsLeft) errs.push(`${m.name}: ${count}명 입찰 > 슬롯 ${slotsLeft}`);
    });
    return errs;
  }, [state.s3_step, state.s3_bids, activeMgrs]);

  const handleProcessBid = () => {
    setState(s => {
      let ns = {...s};
      const conflicts = [];
      const groupPicked = []; // 이번 그룹에서 픽 한 감독들
      const groupLosers = []; // 이번 그룹 동률에서 못 받은 감독들
      const relegated = []; // 유찰 선수 ids

      lotPlayers.forEach(p => {
        const bidders = [];
        activeMgrs.forEach(m => {
          const v = (s.s3_bids[m.id] || {})[p.id];
          if (v !== undefined && v !== '' && parseInt(v) > 0) {
            bidders.push({mgrId: m.id, cost: parseInt(v)});
          }
        });
        if (bidders.length === 0) {
          relegated.push(p.id);
          return;
        }
        const maxCost = Math.max(...bidders.map(b => b.cost));
        const top = bidders.filter(b => b.cost === maxCost);
        if (top.length === 1) {
          // 단독 픽: 위로 X (룰: 추가입찰 동률 → 선수 선택일 때만 위로)
          ns = applyPickStateUpdate(ns, top[0].mgrId, p.id, maxCost, 'S3', [], 'S3');
          groupPicked.push(top[0].mgrId);
        } else {
          const losers = bidders.filter(b => b.cost < maxCost).map(b => b.mgrId);
          conflicts.push({playerId: p.id, mgrIds: top.map(t=>t.mgrId), baseCost: maxCost, losers});
        }
      });

      // 충돌 처리 후 유찰 처리는 advanceS3 가서 함
      ns.s3_excludedMgrs = groupPicked;
      ns.s3_relegationQueue = relegated;

      if (conflicts.length > 0) {
        const first = conflicts[0];
        ns.s3_step = 'tie';
        ns.s3_currentTie = {...first, remaining: conflicts.slice(1)};
        ns.s3_tieBids = {};
      } else {
        ns = startS3Relegation(ns);
      }
      return ns;
    });
  };

  const startS3Relegation = (s) => {
    const ns = {...s};
    if (ns.s3_relegationQueue.length === 0) {
      return advanceS3Group(ns);
    }
    ns.s3_step = 'relegation';
    return ns;
  };

  const advanceS3Group = (s) => {
    const ns = {...s};
    ns.s3_group_idx = s.s3_group_idx + 1;
    ns.s3_currentLot = [];
    ns.s3_step = 'lot';
    ns.s3_bids = {};
    ns.s3_excludedMgrs = [];
    ns.s3_relegationQueue = [];
    return ns;
  };

  const updateTieBid = (mgrId, v) => setState(s => ({...s, s3_tieBids: {...s.s3_tieBids, [mgrId]: v}}));

  const tieValidation = useMemo(() => {
    if (state.s3_step !== 'tie' || !state.s3_currentTie) return [];
    const errs = [];
    const t = state.s3_currentTie;
    t.mgrIds.forEach(mId => {
      const mgr = state.managers.find(m=>m.id===mId);
      const v = state.s3_tieBids[mId];
      if (v === undefined || v === '') { errs.push(`${mgr?.name}: 추가 P 미입력`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c < 0) errs.push(`${mgr?.name}: 0 이상`);
      else if (c % PICK_STEP !== 0) errs.push(`${mgr?.name}: ${PICK_STEP}P 단위`);
      else if (t.baseCost + c > mgr.p) errs.push(`${mgr?.name}: 잔여 P 초과`);
    });
    return errs;
  }, [state.s3_step, state.s3_currentTie, state.s3_tieBids, state.managers]);

  const handleTieProcess = () => {
    setState(s => {
      const t = s.s3_currentTie;
      const entries = t.mgrIds.map(mId => ({mgrId: mId, total: t.baseCost + parseInt(s.s3_tieBids[mId])}));
      const maxTotal = Math.max(...entries.map(e => e.total));
      const top = entries.filter(e => e.total === maxTotal);
      let ns = {...s};
      if (top.length === 1) {
        const winnerMgrId = top[0].mgrId;
        const comfortMgrs = []; // 추가입찰 단독 승자: 위로 X
        ns = applyPickStateUpdate(ns, winnerMgrId, t.playerId, maxTotal, 'S3', comfortMgrs, 'S3');
        ns.s3_excludedMgrs = [...ns.s3_excludedMgrs, winnerMgrId, ...t.mgrIds.filter(mId => mId !== winnerMgrId)];
        ns = advanceS3TieQueue(ns);
      } else {
        ns.s3_step = 'choice';
        ns.s3_currentTie = {...t, mgrIds: top.map(e=>e.mgrId)};
      }
      return ns;
    });
  };

  const advanceS3TieQueue = (s) => {
    const ns = {...s};
    if (s.s3_currentTie.remaining && s.s3_currentTie.remaining.length > 0) {
      const next = s.s3_currentTie.remaining[0];
      ns.s3_currentTie = {...next, remaining: s.s3_currentTie.remaining.slice(1)};
      ns.s3_step = 'tie';
      ns.s3_tieBids = {};
    } else {
      return startS3Relegation({...ns, s3_currentTie: null});
    }
    return ns;
  };

  const handleChoicePlayer = (chosenMgrId) => {
    setState(s => {
      const t = s.s3_currentTie;
      const finalCost = t.baseCost + parseInt(s.s3_tieBids[chosenMgrId]);
      const comfortMgrs = t.mgrIds.filter(mId => mId !== chosenMgrId); // 1차 패자는 위로 X
      let ns = applyPickStateUpdate(s, chosenMgrId, t.playerId, finalCost, 'S3', comfortMgrs, 'S3');
      ns.s3_excludedMgrs = [...ns.s3_excludedMgrs, chosenMgrId, ...t.mgrIds.filter(mId => mId !== chosenMgrId)];
      ns = advanceS3TieQueue(ns);
      return ns;
    });
  };

  // 유찰 선수가 감독 선택
  const handleRelegationChoice = (playerId, chosenMgrId) => {
    setState(s => {
      let ns = applyFreePick(s, chosenMgrId, playerId, 'S3-유', 'S3');
      ns.s3_relegationQueue = ns.s3_relegationQueue.filter(pid => pid !== playerId);
      if (ns.s3_relegationQueue.length === 0) {
        ns = advanceS3Group(ns);
      }
      return ns;
    });
  };

  const handleSkipRelegation = (playerId) => {
    // 감독 못 받음 → s3_pool에서 제거해 S4로 이동
    setState(s => {
      const ns = {...s};
      ns.s3_relegationQueue = ns.s3_relegationQueue.filter(pid => pid !== playerId);
      ns.s3_pool = ns.s3_pool.filter(pid => pid !== playerId);
      if (ns.s3_relegationQueue.length === 0) {
        return advanceS3Group(ns);
      }
      return ns;
    });
  };

  // ============== 간이 모드 분기 ==============
  if (state.mode === 'quick') {
    // 유찰 선수 팀 선택 단계 (간이/상세 공통 흐름)
    if (state.s3_step === 'relegation') {
      const playerId = state.s3_relegationQueue[0];
      const player = state.players.find(p => p.id === playerId);
      // 룰: 유찰 강제 배정 - 슬롯 미가득이면 모두 후보 (그룹 픽 받았어도 OK)
      const eligibleMgrs = state.managers.filter(m =>
        m.sectionCounts.S3 < SECTION_SLOTS.S3
      );
      return (
        <PhaseLayout state={state} setState={setState}
          title={'⚡ ' + SECTION_LABELS['S3']}
          subtitle={`🥉 유찰 선수 팀 선택 (${state.s3_relegationQueue.length}명 남음) · 활성 ${activeMgrs.length}감독 (간이)`}>
          <div className="bg-orange-900/30 border-2 border-orange-500 rounded-lg p-4">
            <div className="text-base font-bold text-orange-300 mb-2">🥉 유찰 선수가 감독 선택</div>
            <div className="bg-slate-900/60 rounded-lg p-3 mb-3 flex items-center gap-3">
              <button onClick={() => setDetailP(player)} className="hover:scale-105 transition flex-shrink-0">
                <PlayerPhoto player={player} photoTpl={state.photoTpl} size={64}/>
              </button>
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-2 mb-1">
                  {player?.index && <span className="text-xs text-slate-500 font-mono">#{player.index}</span>}
                  <button onClick={() => setDetailP(player)} className="font-bold text-lg text-emerald-300 hover:text-emerald-100 truncate">{player?.name}</button>
                </div>
                <div className="flex flex-wrap gap-1 text-[10px]">
                  {player?.region && REGION_BY_VALUE_SIM[player.region] && (
                    <span className={`px-1.5 py-0.5 rounded font-mono font-bold ${REGION_BY_VALUE_SIM[player.region].color} ${REGION_BY_VALUE_SIM[player.region].bg} border ${REGION_BY_VALUE_SIM[player.region].border}`}>{REGION_BY_VALUE_SIM[player.region].label}</span>
                  )}
                  {Array.isArray(player?.positions) && player.positions.slice(0,5).map(pv => {
                    const po = POS_BY_VALUE_SIM[pv];
                    return po ? <span key={'m'+pv} className={`px-1.5 py-0.5 rounded font-mono font-bold ${po.color} bg-slate-800/80`}>{po.short}</span> : null;
                  })}
                </div>
              </div>
            </div>
            <div className="text-xs text-orange-200/80 mb-3">
              제외: 슬롯 가득찬 감독 · <b className="text-amber-300">0P 차감 (유찰 강제 배정)</b>
            </div>
            {eligibleMgrs.length === 0 ? (
              <div className="bg-slate-800 rounded p-3 text-sm text-slate-300">
                선택 가능한 감독 없음 → 4차로 이동
                <button onClick={() => handleSkipRelegation(playerId)}
                  className="ml-3 px-3 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-xs">건너뛰기</button>
              </div>
            ) : (
              <>
                {eligibleMgrs.length > 1 && (
                  <button onClick={() => {
                    const random = eligibleMgrs[Math.floor(Math.random() * eligibleMgrs.length)];
                    handleRelegationChoice(playerId, random.id);
                  }} className="w-full py-2.5 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
                    🎲 랜덤 배정 ({eligibleMgrs.length}명 중)
                  </button>
                )}
                <div className="grid grid-cols-3 gap-2">
                  {eligibleMgrs.map(m => (
                    <button key={m.id} onClick={() => handleRelegationChoice(playerId, m.id)}
                      className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                      <div className="font-bold">{m.name}</div>
                      <div className="text-xs text-slate-400">잔여 {m.p}P · S3 {m.sectionCounts.S3}/{SECTION_SLOTS.S3}</div>
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
          {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
        </PhaseLayout>
      );
    }
    const handleQuickS3 = ({matches, comfortMgrs}) => {
      setState(s => {
        let ns = s;
        matches.forEach(m => {
          ns = applyPickStateUpdate(ns, m.mgrId, m.playerId, m.cost, 'S3', [], 'S3');
        });
        ns = {...ns, managers: ns.managers.map(mm => comfortMgrs.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        // 유찰 매물 처리는 별도 단계 (endS3GroupQuick) — 그 단계에서 유찰 선수가 팀 선택
        ns = endS3GroupQuick(ns);
        return ns;
      });
    };
    // ★ 매물 1개 즉시 처리
    const handlePickOneS3 = ({playerId, mgrIds, cost, otherCheckedMgrIds}) => {
      setState(s => {
        let winner, losers = [];
        if (mgrIds.length === 1) winner = mgrIds[0];
        else {
          winner = mgrIds[Math.floor(Math.random() * mgrIds.length)];
          losers = mgrIds.filter(mid => mid !== winner);
        }
        let ns = applyPickStateUpdate(s, winner, playerId, cost, 'S3', [], 'S3');
        const otherSet = new Set(otherCheckedMgrIds || []);
        const autoComfort = losers.filter(l => !otherSet.has(l));
        if (autoComfort.length > 0) {
          ns = {...ns, managers: ns.managers.map(mm => autoComfort.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        }
        const remainingInLot = ns.players.filter(p => ns.s3_currentLot.includes(p.id) && !p.takenBy);
        const stillActive = ns.managers.filter(m => m.sectionCounts.S3 < SECTION_SLOTS.S3);
        if (remainingInLot.length === 0 || stillActive.length === 0) {
          ns = endS3GroupQuick(ns);
        }
        return ns;
      });
    };
    // 그룹 종료: 유찰 매물 있으면 relegation 단계로, 없으면 다음 그룹
    const endS3GroupQuick = (s) => {
      let ns = {...s};
      // 그룹에서 픽 받은 감독 = excludedMgrs (유찰 선수가 선택 불가)
      const pickedInGroup = s.s3_currentLot
        .map(pid => s.players.find(p => p.id === pid))
        .filter(p => p && p.takenBy)
        .map(p => p.takenBy);
      ns.s3_excludedMgrs = Array.from(new Set(pickedInGroup));
      // 픽 안 된 매물 → relegationQueue
      const releg = s.s3_currentLot.filter(pid => {
        const p = ns.players.find(pp => pp.id === pid);
        return p && !p.takenBy;
      });
      if (releg.length === 0) {
        return advanceS3Group(ns);
      }
      ns.s3_relegationQueue = releg;
      ns.s3_step = 'relegation';
      return ns;
    };
    const goNextGroupS3 = () => {
      if (confirm('남은 매물 처리(유찰 선수가 팀 선택)로 넘어갈까요?')) {
        setState(s => endS3GroupQuick(s));
      }
    };
    return (
      <PhaseLayout state={state} setState={setState}
        title={'⚡ ' + SECTION_LABELS['S3']}
        subtitle={`그룹 ${state.s3_group_idx+1}/12 · 활성 ${activeMgrs.length}감독 (간이)`}>
        <div className="bg-slate-800/30 rounded p-3 mb-3">
          <div className="text-sm font-bold text-slate-300 mb-2">🥉 그룹 {state.s3_group_idx+1}/12 (3명 공개)</div>
        </div>
        <QuickMultiInput state={state} players={lotPlayers}
          activeMgrIds={activeMgrs.map(m=>m.id)} allowZero={true}
          onSubmit={handleQuickS3} onPickOne={handlePickOneS3}
          onOpenDetail={(p) => setDetailP(p)}/>
        {activeMgrs.length > 0 && lotPlayers.length > 0 && (
          <button onClick={goNextGroupS3} className="mt-3 w-full py-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">
            ⏭ 다음 그룹으로 (남은 매물은 S4로)
          </button>
        )}
        {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
      </PhaseLayout>
    );
  }
  // ============== 상세 모드 (기존) ==============

  return (
    <PhaseLayout state={state} setState={setState}
      title={SECTION_LABELS['S3']}
      subtitle={`그룹 ${state.s3_group_idx+1}/12 · S3 풀 36명 (남은 ${state.players.filter(p=>state.s3_pool.includes(p.id)&&!p.takenBy).length}명) · 활성 ${activeMgrs.length}감독`}>
      <div className="bg-slate-800/30 rounded p-3 mb-4">
        <div className="text-sm font-bold text-slate-300 mb-2">🥉 그룹 {state.s3_group_idx+1}/12 (3명 공개)</div>
        <div className="grid grid-cols-3 gap-2">
          {lotPlayers.map(p => (
            <MiniPlayerCard key={p.id} player={p} photoTpl={state.photoTpl} onClick={()=>setDetailP(p)}/>
          ))}
        </div>
      </div>

      {state.s3_step === 'bid' && (
        <div className="bg-slate-800/50 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold text-emerald-300">💰 자유 입찰 (3명 매물)</div>
            <button onClick={handleAIBidS3} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 입찰</button>
          </div>
          <div className="text-xs text-slate-400 mb-3">자유 입찰 · 5P 단위 · 0P/공란=입찰 안 함 · 매물별 최고가 → 동률 추가입찰</div>
          <div className="overflow-x-auto">
            <table className="text-xs w-full">
              <thead>
                <tr className="text-slate-400">
                  <th className="text-left p-1 w-32">감독</th>
                  <th className="text-center p-1 w-14">잔여P</th>
                  <th className="text-center p-1 w-14">슬롯</th>
                  {lotPlayers.map(p => (
                    <th key={p.id} className="text-center p-1 min-w-[100px]">
                      <div className="truncate font-bold text-emerald-300">{p.name}</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {state.managers.map(m => {
                  const inactive = m.sectionCounts.S3 >= SECTION_SLOTS.S3;
                  const slotsLeft = SECTION_SLOTS.S3 - m.sectionCounts.S3;
                  return (
                    <tr key={m.id} className={inactive?'opacity-30':''}>
                      <td className="p-1 font-bold">{m.name}</td>
                      <td className="text-center text-emerald-400">{m.p}</td>
                      <td className="text-center text-slate-400">{slotsLeft}</td>
                      {lotPlayers.map(p => (
                        <td key={p.id} className="p-1">
                          {!inactive && (
                            <input type="number" min={0} step={PICK_STEP} max={m.p}
                              value={(state.s3_bids[m.id]||{})[p.id] ?? ''}
                              onChange={e => updateBid(m.id, p.id, e.target.value)}
                              placeholder="0"
                              className="w-full bg-slate-800 border border-slate-700 rounded px-1 py-0.5 text-right focus:outline-none focus:border-emerald-500"/>
                          )}
                        </td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {bidValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{bidValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcessBid} disabled={bidValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 자유 입찰 처리
          </button>
        </div>
      )}

      {state.s3_step === 'tie' && state.s3_currentTie && (() => {
        const t = state.s3_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-amber-900/30 border-2 border-amber-500 rounded-lg p-4">
            <div className="flex items-center justify-between mb-1">
              <div className="text-base font-bold text-amber-300">⚖️ 동률 매물: {player?.name}</div>
              <button onClick={handleAIBidS3TIE} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동</button>
            </div>
            <div className="text-xs text-amber-200/80 mb-3">최고가 {t.baseCost}P 동률 {t.mgrIds.length}명</div>
            <div className="space-y-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                return (
                  <div key={mId} className="flex items-center gap-3 bg-slate-900/60 p-2 rounded">
                    <div className="w-28 font-bold">{m?.name}</div>
                    <div className="text-xs text-slate-400 w-16">잔여 {m?.p}P</div>
                    <span className="text-xs text-slate-500">추가 +</span>
                    <input type="number" min={0} step={PICK_STEP} max={m.p - t.baseCost}
                      value={state.s3_tieBids[mId] ?? ''} onChange={e => updateTieBid(mId, e.target.value)}
                      className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                    <span className="text-xs text-slate-500">P</span>
                  </div>
                );
              })}
            </div>
            {tieValidation.length > 0 && (
              <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
                <ul className="list-disc list-inside">{tieValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
              </div>
            )}
            <button onClick={handleTieProcess} disabled={tieValidation.length>0}
              className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
              ✅ 추가입찰 처리
            </button>
          </div>
        );
      })()}

      {state.s3_step === 'choice' && state.s3_currentTie && (() => {
        const t = state.s3_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-purple-900/30 border-2 border-purple-500 rounded-lg p-4">
            <div className="text-base font-bold text-purple-300 mb-1">🎯 선수가 선택</div>
            <div className="text-xs text-purple-200/80 mb-3"><b>{player?.name}</b>이 선택:</div>
            <button onClick={() => handleChoicePlayer(t.mgrIds[Math.floor(Math.random()*t.mgrIds.length)])}
              className="w-full py-2 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
              🎲 랜덤 선택 (동률 감독 {t.mgrIds.length}명 중)
            </button>
            <div className="grid grid-cols-2 gap-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                const finalCost = t.baseCost + parseInt(state.s3_tieBids[mId]);
                return (
                  <button key={mId} onClick={() => handleChoicePlayer(mId)}
                    className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                    <div className="font-bold">{m?.name}</div>
                    <div className="text-xs text-slate-400 mt-1">최종 {finalCost}P</div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })()}

      {state.s3_step === 'relegation' && (() => {
        const playerId = state.s3_relegationQueue[0];
        const player = state.players.find(p => p.id === playerId);
        // 가능한 감독: 이 그룹에서 제외된 감독 X, 슬롯 남은 감독만
        // 룰: 유찰 강제 배정 - 슬롯 미가득이면 모두 후보
        const eligibleMgrs = state.managers.filter(m => 
          m.sectionCounts.S3 < SECTION_SLOTS.S3
        );
        return (
          <div className="bg-orange-900/30 border-2 border-orange-500 rounded-lg p-4">
            <div className="text-base font-bold text-orange-300 mb-1">🥉 유찰 선수가 감독 선택 ({state.s3_relegationQueue.length}명 남음)</div>
            <div className="text-xs text-orange-200/80 mb-3">
              유찰 선수 <b className="text-emerald-300">{player?.name}</b>이 감독 선택<br/>
              <span className="text-[10px]">제외: 이 그룹 픽 받은 감독 / 이 그룹 동률 못받은 감독 / 슬롯 가득찬 감독</span>
            </div>
            {eligibleMgrs.length === 0 ? (
              <div className="bg-slate-800 rounded p-3 text-sm text-slate-300">
                선택 가능한 감독 없음 → 4차로 이동
                <button onClick={() => handleSkipRelegation(playerId)}
                  className="ml-3 px-3 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-xs">건너뛰기</button>
              </div>
            ) : (
              <>
                {eligibleMgrs.length > 1 && (
                  <button onClick={() => {
                    const random = eligibleMgrs[Math.floor(Math.random() * eligibleMgrs.length)];
                    handleRelegationChoice(playerId, random.id);
                  }} className="w-full py-2.5 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
                    🎲 랜덤 배정 ({eligibleMgrs.length}명 중)
                  </button>
                )}
                <div className="grid grid-cols-3 gap-2">
                  {eligibleMgrs.map(m => (
                    <button key={m.id} onClick={() => handleRelegationChoice(playerId, m.id)}
                      className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                      <div className="font-bold">{m.name}</div>
                      <div className="text-xs text-slate-400">잔여 {m.p}P · S3 {m.sectionCounts.S3}/{SECTION_SLOTS.S3}</div>
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
        );
      })()}

      {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
    </PhaseLayout>
  );
}

// ============================================================
// S4 PHASE (잔여 순서 입찰, 12명 도달까지)
// ============================================================
function S4Phase({ state, setState }) {
  const [detailP, setDetailP] = useState(null);

  // S4 풀: S3에서 안 뽑힌 선수 + S3/4 풀에서 S3로 안 들어간 선수 (= 모든 picked되지 않은 S3/4 선수)
  const s4Pool = state.players.filter(p => p.section === 'S3/4' && !p.takenBy);
  
  // 활성 감독: 12명 미만 (감독 자신 + 픽 < 12)
  // 룰: "감독 포함 12명에 도달할 때까지" → 픽 11명까지 (감독 자신이 1명)
  // 다만 1팀은 12픽 = 감독 포함 13명
  const TARGET_PICKS = 11; // 감독 자신 1 + 11픽 = 12명
  const activeMgrs = state.managers.filter(m => m.picks.length < TARGET_PICKS);

  // 마지막 1명 처리: 풀이 1명이고 모든 감독이 11픽 도달이면 본인이 팀 선택
  const allReachedTarget = state.managers.every(m => m.picks.length >= TARGET_PICKS);
  const isLastOne = s4Pool.length === 1 && allReachedTarget;

  const updateBid = (mgrId, v) => setState(s => ({...s, s4_bids: {...s.s4_bids, [mgrId]: v}}));

  // S4 AI 자동 입찰: 마지막 라운드, 잔여 P 적음 (0P 가능)
  const handleAIBidS4 = () => {
    const aiBids = {};
    activeMgrs.forEach(m => {
      if (state.myManagerId === m.id) return;
      const pConf = AI_PERSONALITIES[m.personality || 'BALANCED'];
      // 성격별 베팅 비율 (잔여 P 대비)
      let ratio;
      if (pConf.starBoost) ratio = 0.30;
      else if (pConf.capRatio) ratio = 0.14;
      else if (pConf.focusBonus) ratio = 0.22;
      else if (pConf.rookieMult) ratio = 0.20;
      else ratio = 0.22;
      ratio *= (m.bidScale || 1.0);
      const slotsLeft4 = 11 - (m.picks || []).length;
      const avgPS = m.p / Math.max(1, slotsLeft4);
      if (avgPS > 25) ratio *= 1.5;       // P 많이 남으면 +50%
      else if (avgPS > 15) ratio *= 1.25;
      // 노이즈 ±70%
      ratio *= 1 + (Math.random() - 0.5) * 1.40;
      let bid = m.p * ratio;
      bid = Math.round(bid / 5) * 5;
      // S4는 0P 가능 (단 잔여 P 한도)
      bid = Math.max(0, Math.min(bid, m.p));
      aiBids[m.id] = bid;
    });
    setState(s => ({ ...s, s4_bids: { ...s.s4_bids, ...aiBids } }));
  };

  // S4 AI 자동 선택: 그룹에서 관심도 가장 높은 매물 선택
  const handleAIPickS4 = () => {
    if (state.s4_step !== 'pick' || !currentGroup) return;
    const selections = { ...state.s4_groupSelections };
    currentGroup.forEach(e => {
      if (state.myManagerId === e.mgrId) return;
      const m = state.managers.find(mm => mm.id === e.mgrId);
      if (!m) return;
      const scored = s4Pool.map(p => {
        const pConf = AI_PERSONALITIES[m.personality || 'BALANCED'];
        const pub = computePublicValue(p, pConf.careerWeight || 1.0);
        const interest = computeInterest(p, m, pub, state.players, state.managers);
        return { p, interest };
      });
      scored.sort((a, b) => b.interest - a.interest);
      if (scored.length > 0) selections[e.mgrId] = [scored[0].p.id];
    });
    setState(s => ({ ...s, s4_groupSelections: selections }));
  };

  const bidValidation = useMemo(() => {
    if (state.s4_step !== 'bid') return [];
    const errs = [];
    activeMgrs.forEach(m => {
      const v = state.s4_bids[m.id];
      if (v === undefined || v === '') { errs.push(`${m.name}: P 미입력 (0 가능)`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c < 0) errs.push(`${m.name}: 0 이상`);
      else if (c % PICK_STEP !== 0) errs.push(`${m.name}: ${PICK_STEP}P 단위`);
      else if (c > m.p) errs.push(`${m.name}: 잔여 P (${m.p}) 초과`);
    });
    return errs;
  }, [state.s4_step, state.s4_bids, activeMgrs]);

  const handleProcessBid = () => {
    const entries = activeMgrs.map(m => ({
      mgrId: m.id, p: parseInt(state.s4_bids[m.id]),
      slotsLeft: TARGET_PICKS - m.picks.length
    }));
    const sortedDesc = [...entries].sort((a,b)=>b.p-a.p);
    const groups = [];
    let curGroup = [], curP = null;
    sortedDesc.forEach(e => {
      if (curP === null || e.p === curP) {
        curGroup.push(e); curP = e.p;
      } else {
        groups.push(curGroup); curGroup = [e]; curP = e.p;
      }
    });
    if (curGroup.length) groups.push(curGroup);
    setState(s => ({...s, s4_step: 'pick', s4_groups: groups, s4_currentGroupIdx: 0, s4_groupSelections: {}}));
  };

  const currentGroup = state.s4_groups[state.s4_currentGroupIdx];

  // S4 pick 단계: 한 그룹에서 모든 감독이 1명씩 선택 (사이클 단위)
  // 룰: "각 감독이 12명 도달까지 반복" — 한 사이클당 1명씩
  const toggleSelection = (mgrId, playerId) => {
    setState(s => {
      const cur = (s.s4_groupSelections[mgrId] || []);
      let next;
      if (cur.includes(playerId)) next = cur.filter(pid => pid !== playerId);
      else next = [playerId]; // S4는 한 사이클당 1명만
      return {...s, s4_groupSelections: {...s.s4_groupSelections, [mgrId]: next}};
    });
  };

  const pickValidation = useMemo(() => {
    if (state.s4_step !== 'pick' || !currentGroup) return [];
    const errs = [];
    currentGroup.forEach(e => {
      const sel = state.s4_groupSelections[e.mgrId] || [];
      if (sel.length !== 1) {
        const mgr = state.managers.find(m=>m.id===e.mgrId);
        errs.push(`${mgr?.name}: 1명 선택 필요`);
      }
    });
    return errs;
  }, [state.s4_step, currentGroup, state.s4_groupSelections, state.managers]);

  const handleProcessGroup = () => {
    setState(s => {
      const g = s.s4_groups[s.s4_currentGroupIdx];
      const groupP = g[0].p;
      const allPicks = [];
      g.forEach(e => {
        (s.s4_groupSelections[e.mgrId] || []).forEach(pid => {
          allPicks.push({mgrId: e.mgrId, playerId: pid});
        });
      });
      const playerToMgrs = {};
      allPicks.forEach(({mgrId, playerId}) => {
        if (!playerToMgrs[playerId]) playerToMgrs[playerId] = [];
        playerToMgrs[playerId].push(mgrId);
      });
      let ns = {...s};
      const choices = [];
      Object.keys(playerToMgrs).forEach(playerId => {
        const mgrs = playerToMgrs[playerId];
        if (mgrs.length === 1) {
          ns = applyPickStateUpdate(ns, mgrs[0], playerId, groupP, 'S4', [], 'S4');
        } else {
          // S4 충돌: 추가입찰 없이 바로 선수가 선택
          choices.push({playerId, mgrIds: mgrs, baseGroupP: groupP});
        }
      });
      if (choices.length > 0) {
        const first = choices[0];
        ns.s4_step = 'choice';
        ns.s4_currentTie = {...first, remaining: choices.slice(1)};
      } else {
        ns = advanceS4Group(ns);
      }
      return ns;
    });
  };

  const advanceS4Group = (s) => {
    const ns = {...s};
    const nextIdx = s.s4_currentGroupIdx + 1;
    if (nextIdx >= s.s4_groups.length) {
      // 사이클 끝 → 다음 사이클
      const pool = ns.players.filter(p => p.section === 'S3/4' && !p.takenBy);
      const stillActive = ns.managers.filter(m => m.picks.length < TARGET_PICKS);
      if (pool.length === 0 || stillActive.length === 0) {
        // 매물 남아있으면 강제 배정 ('last' step에서 한 명씩 처리)
        if (pool.length >= 1) {
          return {...ns, s4_step: 'last', s4_groups: [], s4_currentGroupIdx: 0, s4_groupSelections: {}, s4_bids: {}, s4_currentTie: null};
        }
        return {...ns, section: 'finished', s4_step: 'bid'};
      }
      return {...ns, s4_cycle: s.s4_cycle+1, s4_step: 'bid', s4_bids: {}, s4_groups: [], s4_currentGroupIdx: 0, s4_groupSelections: {}};
    }
    return {...ns, s4_currentGroupIdx: nextIdx, s4_groupSelections: {}, s4_step: 'pick'};
  };

  const handleChoicePlayer = (chosenMgrId) => {
    setState(s => {
      const t = s.s4_currentTie;
      const comfortMgrs = t.mgrIds.filter(mId => mId !== chosenMgrId);
      let ns = applyPickStateUpdate(s, chosenMgrId, t.playerId, t.baseGroupP, 'S4', comfortMgrs, 'S4');
      if (t.remaining && t.remaining.length > 0) {
        const next = t.remaining[0];
        ns.s4_currentTie = {...next, remaining: t.remaining.slice(1)};
        ns.s4_step = 'choice';
      } else {
        ns.s4_currentTie = null;
        ns = advanceS4Group(ns);
      }
      return ns;
    });
  };

  const handleLastOneChoice = (chosenMgrId) => {
    setState(s => {
      const lastPlayer = s4Pool[0];
      let ns = applyFreePick(s, chosenMgrId, lastPlayer.id, 'S4-마지막', 'S4');
      // 매물이 더 남으면 'last' 유지 (다음 매물 자동 처리), 다 처리되면 finished
      const remaining = ns.players.filter(p => p.section === 'S3/4' && !p.takenBy);
      if (remaining.length === 0) ns.section = 'finished';
      return ns;
    });
  };

  // 자동 진입 체크
  useEffect(() => {
    if (state.s4_step === 'bid' && state.s4_groups.length === 0 && s4Pool.length === 0) {
      setState(s => ({...s, section: 'finished'}));
    }
  }, [state.s4_step, state.s4_groups.length, s4Pool.length]);

  if (s4Pool.length === 0 && activeMgrs.length === 0) {
    return (
      <PhaseLayout state={state} setState={setState} title="S4 완료" subtitle="">
        <div className="p-6 text-emerald-300">S4 종료. Finished 화면으로 이동 중...</div>
      </PhaseLayout>
    );
  }

  // ============== 간이 모드 분기 ==============
  if (state.mode === 'quick') {
    const allReached = state.managers.every(m => m.picks.length >= TARGET_PICKS);

    // ⭐ N명 오버 처리: 활성 감독 0명인데 풀 남아있음 → 매물이 직접 팀 선택 (감독+1픽)
    // 매물 N명 = 9감독×11 + N 일 때, N팀이 12픽. 1명씩 본인 선택 반복.
    if (activeMgrs.length === 0 && s4Pool.length > 0) {
      const last = s4Pool[0];
      return (
        <PhaseLayout state={state} setState={setState}
          title={'⚡ ' + SECTION_LABELS['S4'] + ' - 오버 매물 본인 선택'}
          subtitle={`잔여 ${s4Pool.length}명 · 매물이 직접 팀 선택 (감독+1픽, 12픽)`}>
          <div className="bg-fuchsia-900/30 border-2 border-fuchsia-500 rounded-lg p-4">
            <div className="text-base font-bold text-fuchsia-300 mb-1">⭐ <b className="text-emerald-300">{last.name}</b>이 직접 들어갈 팀 선택 ({s4Pool.length}명 남음)</div>
            <div className="text-xs text-slate-400 mb-3">9감독 × 11픽 초과 매물. 선택한 팀은 12픽이 됨.</div>
            <div className="grid grid-cols-3 gap-2 mt-3">
              {state.managers.map(m => (
                <button key={m.id} onClick={() => setState(s => {
                  let ns = applyFreePick(s, m.id, last.id, 'S4-오버', 'S4');
                  const remainingPool = ns.players.filter(p => p.section === 'S3/4' && !p.takenBy);
                  if (remainingPool.length === 0) ns.section = 'finished';
                  return ns;
                })} className="p-3 bg-slate-800 hover:bg-fuchsia-700 border border-slate-700 rounded text-left">
                  <div className="font-bold">{m.name}</div>
                  <div className="text-xs text-slate-400">현재 픽 {m.picks.length}명</div>
                </button>
              ))}
            </div>
          </div>
        </PhaseLayout>
      );
    }

    // 마지막 1명 + 모든 감독 목표 달성 → 본인 선택
    if (s4Pool.length === 1 && allReached) {
      const last = s4Pool[0];
      return (
        <PhaseLayout state={state} setState={setState}
          title={'⚡ ' + SECTION_LABELS['S4'] + ' - 마지막 1명'}
          subtitle="본인이 팀 선택 (간이)">
          <div className="bg-amber-900/30 border-2 border-amber-500 rounded-lg p-4">
            <div className="text-base font-bold text-amber-300 mb-1">⭐ 마지막 1명: <b className="text-emerald-300">{last.name}</b>이 직접 들어갈 팀 선택</div>
            <div className="grid grid-cols-3 gap-2 mt-3">
              {state.managers.map(m => (
                <button key={m.id} onClick={() => setState(s => {
                  let ns = applyFreePick(s, m.id, last.id, 'S4-마지막', 'S4');
                  ns.section = 'finished';
                  return ns;
                })} className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 rounded text-left">
                  <div className="font-bold">{m.name}</div>
                  <div className="text-xs text-slate-400">현재 픽 {m.picks.length}명</div>
                </button>
              ))}
            </div>
          </div>
        </PhaseLayout>
      );
    }

    // 종료 체크: 풀 비었음 (활성 감독 0명은 위에서 N명 오버 처리)
    if (s4Pool.length === 0) {
      setTimeout(() => setState(s => ({...s, section: 'finished'})), 0);
      return <div className="p-6 text-emerald-300">S4 종료. Finished 화면으로 이동 중...</div>;
    }

    // 전체 처리 (옵션 - 한 번에 모든 매물 처리)
    const handleQuickS4Bulk = ({matches, comfortMgrs}) => {
      setState(s => {
        let ns = s;
        matches.forEach(m => {
          ns = applyPickStateUpdate(ns, m.mgrId, m.playerId, m.cost, 'S4', [], 'S4');
        });
        ns = {...ns, managers: ns.managers.map(mm => comfortMgrs.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        const stillActive = ns.managers.filter(m => m.picks.length < TARGET_PICKS);
        const remainingPool = ns.players.filter(p => p.section === 'S3/4' && !p.takenBy);
        if (stillActive.length === 0 || remainingPool.length === 0) {
          ns.section = 'finished';
        }
        return ns;
      });
    };

    // ★ 매물 1개 즉시 처리
    const handlePickOneS4 = ({playerId, mgrIds, cost, otherCheckedMgrIds}) => {
      setState(s => {
        let winner, losers = [];
        if (mgrIds.length === 1) winner = mgrIds[0];
        else {
          winner = mgrIds[Math.floor(Math.random() * mgrIds.length)];
          losers = mgrIds.filter(mid => mid !== winner);
        }
        let ns = applyPickStateUpdate(s, winner, playerId, cost, 'S4', [], 'S4');
        const otherSet = new Set(otherCheckedMgrIds || []);
        const autoComfort = losers.filter(l => !otherSet.has(l));
        if (autoComfort.length > 0) {
          ns = {...ns, managers: ns.managers.map(mm => autoComfort.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        }
        const stillActive = ns.managers.filter(m => m.picks.length < TARGET_PICKS);
        const remainingPool = ns.players.filter(p => p.section === 'S3/4' && !p.takenBy);
        if (stillActive.length === 0 || remainingPool.length === 0) {
          ns.section = 'finished';
        }
        return ns;
      });
    };

    return (
      <PhaseLayout state={state} setState={setState}
        title={'⚡ ' + SECTION_LABELS['S4']}
        subtitle={`잔여 풀 ${s4Pool.length}명 · 활성 ${activeMgrs.length}감독 (간이 · 순서 입찰)`}>
        <div className="bg-blue-900/20 border border-blue-700/40 rounded p-3 mb-3 text-xs text-blue-200/90">
          💡 S4 룰: 매물별로 어느 감독이 가져갈지 + 얼마 P에 가져갈지 입력. 사진 클릭=픽 입력 펼치기. 매물별 🎲 처리로 1개씩 진행 권장.
        </div>
        <QuickMultiInput state={state} players={s4Pool}
          activeMgrIds={activeMgrs.map(m=>m.id)} allowZero={true}
          onSubmit={handleQuickS4Bulk} onPickOne={handlePickOneS4}
          onOpenDetail={(p) => setDetailP(p)}/>
        {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
      </PhaseLayout>
    );
  }
  // ============== 상세 모드 (기존) ==============

  return (
    <PhaseLayout state={state} setState={setState}
      title={SECTION_LABELS['S4']}
      subtitle={`사이클 ${state.s4_cycle+1} · 잔여 매물 ${s4Pool.length}명 · 활성 ${activeMgrs.length}감독 (목표 ${TARGET_PICKS}픽)`}>
      <div className="bg-slate-800/30 rounded p-3 mb-4">
        <div className="text-xs font-bold text-slate-400 mb-2">📋 4차 풀 ({s4Pool.length}명)</div>
        <div className="grid grid-cols-4 gap-2 max-h-64 overflow-y-auto">
          {s4Pool.map(p => (
            <MiniPlayerCard key={p.id} player={p} photoTpl={state.photoTpl} onClick={()=>setDetailP(p)}/>
          ))}
        </div>
      </div>

      {state.s4_step === 'bid' && !isLastOne && (
        <div className="bg-slate-800/50 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold text-emerald-300">💰 비공개 P 제출 (5P 단위, 0P 가능)</div>
            <button onClick={handleAIBidS4} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 입찰</button>
          </div>
          <div className="text-xs text-slate-400 mb-3">잔여 P 없는 감독도 0P 입찰 가능 · 동률 시 추가입찰 없이 즉시 선수가 선택</div>
          <div className="space-y-2">
            {state.managers.map(m => {
              const inactive = m.picks.length >= TARGET_PICKS;
              return (
                <div key={m.id} className={`flex items-center gap-3 p-2 rounded ${inactive?'bg-slate-900/30 opacity-40':'bg-slate-900/60'}`}>
                  <div className="w-28 truncate font-bold text-sm">{m.name}</div>
                  <div className="text-xs text-slate-400 w-16">잔여 <b className="text-emerald-400">{m.p}P</b></div>
                  <div className="text-xs text-slate-400 w-20">픽 {m.picks.length}/{TARGET_PICKS}</div>
                  {inactive ? <div className="text-xs text-slate-500 italic flex-1">목표 달성</div> : (
                    <Fragment>
                      <input type="number" min={0} max={m.p} step={PICK_STEP}
                        value={state.s4_bids[m.id] ?? ''} onChange={e => updateBid(m.id, e.target.value)}
                        placeholder="0,5,10..."
                        className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                      <span className="text-xs text-slate-500">P</span>
                    </Fragment>
                  )}
                </div>
              );
            })}
          </div>
          {bidValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{bidValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcessBid} disabled={bidValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 입찰 처리 → 그룹화
          </button>
        </div>
      )}

      {state.s4_step === 'pick' && currentGroup && (
        <div className="bg-emerald-900/20 border border-emerald-700/40 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold text-emerald-300">🎯 그룹 {state.s4_currentGroupIdx+1}/{state.s4_groups.length} (P={currentGroup[0].p})</div>
            <button onClick={handleAIPickS4} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 픽</button>
          </div>
          <div className="text-xs text-emerald-200/80 mb-3">
            각 감독이 비공개로 1명 선택. 충돌 시 추가입찰 없이 즉시 선수가 감독 선택.
          </div>
          {currentGroup.map(e => {
            const m = state.managers.find(mm => mm.id === e.mgrId);
            const sel = state.s4_groupSelections[e.mgrId] || [];
            return (
              <div key={e.mgrId} className="bg-slate-900/60 rounded p-3 mb-2">
                <div className="mb-2"><b className="text-emerald-300">{m?.name}</b> <span className="text-xs text-slate-500">잔여 {m?.p}P</span></div>
                <div className="grid grid-cols-3 gap-1">
                  {s4Pool.map(p => (
                    <MiniPlayerCard key={p.id} player={p} photoTpl={state.photoTpl}
                      onClick={() => toggleSelection(e.mgrId, p.id)}
                      selected={sel.includes(p.id)}/>
                  ))}
                </div>
              </div>
            );
          })}
          {pickValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{pickValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcessGroup} disabled={pickValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 그룹 처리
          </button>
        </div>
      )}

      {state.s4_step === 'choice' && state.s4_currentTie && (() => {
        const t = state.s4_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-purple-900/30 border-2 border-purple-500 rounded-lg p-4">
            <div className="text-base font-bold text-purple-300 mb-1">🎯 동률 → 선수가 즉시 선택 (S4는 추가입찰 X)</div>
            <div className="text-xs text-purple-200/80 mb-3"><b>{player?.name}</b>이 선택 · P {t.baseGroupP} 차감</div>
            <button onClick={() => handleChoicePlayer(t.mgrIds[Math.floor(Math.random()*t.mgrIds.length)])}
              className="w-full py-2 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
              🎲 랜덤 선택 (동률 감독 {t.mgrIds.length}명 중)
            </button>
            <div className="grid grid-cols-2 gap-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                return (
                  <button key={mId} onClick={() => handleChoicePlayer(mId)}
                    className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                    <div className="font-bold">{m?.name}</div>
                    <div className="text-xs text-slate-400 mt-1">{t.baseGroupP}P 차감 → 잔여 {m?.p - t.baseGroupP}P</div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })()}

      {(state.s4_step === 'last' || isLastOne) && s4Pool[0] && (() => {
        // 슬롯 미가득(픽 < TARGET_PICKS) 감독만 후보
        // 룰: 11픽 다 채운 감독만 후보 (이미 추가 매물 받은 감독은 제외 - 한 감독당 추가 1명만)
        const eligibleMgrs = state.managers.filter(m => m.picks.length <= TARGET_PICKS);
        return (
        <div className="bg-amber-900/30 border-2 border-amber-500 rounded-lg p-4">
          <div className="text-base font-bold text-amber-300 mb-1">⭐ 유찰 잔여 매물 강제 배정 ({s4Pool.length}명 남음)</div>
          <div className="text-xs text-amber-200/80 mb-3">
            <b className="text-emerald-300">{s4Pool[0].name}</b>이 직접 들어갈 팀 선택 · 이미 추가 매물 받은 감독은 제외 (한 감독 추가 1명만)
          </div>
          {eligibleMgrs.length === 0 ? (
            <div className="bg-slate-800 rounded p-3 text-sm text-slate-300">
              선택 가능한 감독 없음 (전원 슬롯 가득)
            </div>
          ) : (
            <>
              {eligibleMgrs.length > 1 && (
                <button onClick={() => {
                  const random = eligibleMgrs[Math.floor(Math.random() * eligibleMgrs.length)];
                  handleLastOneChoice(random.id);
                }} className="w-full py-2.5 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
                  🎲 랜덤 배정 ({eligibleMgrs.length}명 중)
                </button>
              )}
              <div className="grid grid-cols-3 gap-2">
                {eligibleMgrs.map(m => (
                  <button key={m.id} onClick={() => handleLastOneChoice(m.id)}
                    className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                    <div className="font-bold">{m.name}</div>
                    <div className="text-xs text-slate-400">현재 픽 {m.picks.length}명 · 잔여 {m.p}P</div>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
        );
      })()}

      {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
    </PhaseLayout>
  );
}

// ============================================================
