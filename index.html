function S11Phase({ state, setState }) {
  const [detailP, setDetailP] = useState(null);
  const player = state.players.find(p => p.id === state.s1_1_currentPlayerId);
  const activeMgrs = state.managers.filter(m => m.sectionCounts.S1 === 0);

  useEffect(() => {
    if (!state.s1_1_currentPlayerId && state.s1_1_cycle < 9) {
      const remaining = state.players.filter(p => p.section === 'S1' && !p.takenBy);
      const next = shuffle(remaining)[0];
      if (next) setState(s => ({...s, s1_1_currentPlayerId: next.id}));
    }
  }, [state.s1_1_currentPlayerId, state.s1_1_cycle]);

  const updateBid = (mgrId, value) => setState(s => ({...s, s1_1_bids: {...s.s1_1_bids, [mgrId]: value}}));

  // AI 자동 입찰 (현재 매물에 활성 감독 전원 자동)
  const handleAIBidS11 = () => {
    if (!player) return;
    const activeIds = activeMgrs.map(m => m.id);
    // S1-1은 핵심 매물이라 한 픽 최대 잔여 P의 40% 까지 허용
    const aiBids = applyAIBidsToActive(state, activeIds, [player], { minBid: 5, maxBidRatio: 0.32, sectionKey: 'S1', excludeMgrIds: state.myManagerId ? [state.myManagerId] : [] });
    setState(s => ({ ...s, s1_1_bids: { ...s.s1_1_bids, ...aiBids } }));
  };
  const handleAIBidS11TIE = () => {
    // 타이브레이크: 추가 입찰은 진짜 먹고 싶은 경우만. 대부분 0P, 일부 5P, 드물게 10P
    if (state.s1_1_tieStage !== 1 || !player) return;
    const scarcity = computePositionScarcity(state.players);
    const pub = computePublicValue(player, 1.0);
    const aiTie = {};
    state.s1_1_tieList.forEach(mid => {
      if (state.myManagerId === mid) return;  // 사용자 감독 제외
      const mgr = state.managers.find(m => m.id === mid);
      if (!mgr) return;
      const pConf = AI_PERSONALITIES[mgr.personality || 'BALANCED'];
      // 동률 발생 = 원래 관심 있던 감독. 그 안에서 다시 관심도 측정
      const interest = computeInterest(player, mgr, pub, state.players, state.managers);
      // 추가 입찰 분포 (타이브레이크 = 이미 같은 금액 적은 사람들, 본격 베팅한 사람들)
      //   관심 < 0.50 : 80% 0P / 20% 5P (희박 — 1차 무관심층 동률은 드묾)
      //   0.50~0.70   : 70% 5P / 25% 0P / 5% 10P
      //   0.70~0.85   : 60% 5P / 35% 10P / 5% 0P
      //   0.85+       : 50% 10P / 30% 5P / 15% 15P / 5% 20P (드문 경쟁심)
      let add;
      const r = Math.random();
      if (interest < 0.50) add = r < 0.8 ? 0 : 5;
      else if (interest < 0.70) add = r < 0.25 ? 0 : (r < 0.95 ? 5 : 10);
      else if (interest < 0.85) add = r < 0.05 ? 0 : (r < 0.65 ? 5 : 10);
      else add = r < 0.30 ? 5 : (r < 0.80 ? 10 : (r < 0.95 ? 15 : 20));
      // 보수형은 5P를 0P로 다운그레이드 가능 (절약 성향)
      if (pConf.capRatio && add === 5 && Math.random() < 0.4) add = 0;
      // 잔여 P 한도
      const baseCost = Math.max(...state.s1_1_tieList.map(mId => parseInt(state.s1_1_bids[mId]) || 0));
      const remaining = mgr.p - baseCost;
      add = Math.max(0, Math.min(add, remaining));
      aiTie[mid] = add;
    });
    setState(s => ({ ...s, s1_1_tieBids: { ...s.s1_1_tieBids, ...aiTie } }));
  };

  const updateTieBid = (mgrId, value) => setState(s => ({...s, s1_1_tieBids: {...s.s1_1_tieBids, [mgrId]: value}}));

  const validation = useMemo(() => {
    if (state.s1_1_tieStage !== 0) return [];
    const errs = [];
    activeMgrs.forEach(m => {
      const v = state.s1_1_bids[m.id];
      if (v === undefined || v === '') { errs.push(`${m.name}: 입찰 P 미입력`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c <= 0) errs.push(`${m.name}: S1은 1P 이상 (0P 불가)`);
      else if (c % PICK_STEP !== 0) errs.push(`${m.name}: ${PICK_STEP}P 단위`);
      else if (c > m.p) errs.push(`${m.name}: 잔여 P (${m.p}) 초과`);
    });
    return errs;
  }, [state.s1_1_bids, state.s1_1_tieStage, activeMgrs]);

  const tieValidation = useMemo(() => {
    if (state.s1_1_tieStage !== 1) return [];
    const errs = [];
    const baseCost = Math.max(...state.s1_1_tieList.map(mId => parseInt(state.s1_1_bids[mId])));
    state.s1_1_tieList.forEach(mId => {
      const mgr = state.managers.find(m=>m.id===mId);
      const v = state.s1_1_tieBids[mId];
      if (v === undefined || v === '') { errs.push(`${mgr?.name}: 추가 P 미입력`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c < 0) errs.push(`${mgr?.name}: 0 이상`);
      else if (c % PICK_STEP !== 0) errs.push(`${mgr?.name}: ${PICK_STEP}P 단위`);
      else if (baseCost + c > mgr.p) errs.push(`${mgr?.name}: 잔여 P 초과`);
    });
    return errs;
  }, [state.s1_1_tieBids, state.s1_1_tieStage, state.s1_1_tieList, state.s1_1_bids, state.managers]);

  const finalizePick = (winnerMgrId, finalCost, customComfort) => {
    setState(s => {
      // customComfort 지정되면 그걸 사용 (충돌 케이스), 아니면 활성 전체 (단독 픽 케이스)
      const comfortMgrs = Array.isArray(customComfort)
        ? customComfort
        : activeMgrs.filter(m => m.id !== winnerMgrId).map(m => m.id);
      let ns = applyPickStateUpdate(s, winnerMgrId, s.s1_1_currentPlayerId, finalCost, 'S1-1', comfortMgrs, 'S1');
      const nextCycle = s.s1_1_cycle + 1;
      ns = {...ns, s1_1_bids: {}, s1_1_tieStage: 0, s1_1_tieList: [], s1_1_tieBids: {}, s1_1_cycle: nextCycle};
      if (nextCycle >= 9) {
        ns.section = 'S1-2';
        ns.s1_1_currentPlayerId = null;
      } else {
        const remaining = ns.players.filter(p => p.section === 'S1' && !p.takenBy);
        const next = shuffle(remaining)[0];
        ns.s1_1_currentPlayerId = next?.id || null;
      }
      return ns;
    });
  };

  const handleProcess = () => {
    const entries = activeMgrs.map(m => ({ mgrId: m.id, cost: parseInt(state.s1_1_bids[m.id]) }));
    const maxCost = Math.max(...entries.map(e => e.cost));
    const topMgrs = entries.filter(e => e.cost === maxCost);
    if (topMgrs.length === 1) {
      finalizePick(topMgrs[0].mgrId, maxCost, []); // 단독 픽: 위로 X
    } else {
      setState(s => ({...s, s1_1_tieStage: 1, s1_1_tieList: topMgrs.map(t=>t.mgrId), s1_1_tieBids: {}}));
    }
  };

  const handleTieProcess = () => {
    const baseCost = Math.max(...state.s1_1_tieList.map(mId => parseInt(state.s1_1_bids[mId])));
    const tieEntries = state.s1_1_tieList.map(mId => ({
      mgrId: mId, totalCost: baseCost + parseInt(state.s1_1_tieBids[mId])
    }));
    const maxTotal = Math.max(...tieEntries.map(e => e.totalCost));
    const topTie = tieEntries.filter(e => e.totalCost === maxTotal);
    if (topTie.length === 1) {
      finalizePick(topTie[0].mgrId, maxTotal, []); // 추가입찰 단독 승자: 위로 X (선수가 선택 안 했음)
    } else {
      setState(s => ({...s, s1_1_tieStage: 2, s1_1_tieList: topTie.map(t=>t.mgrId)}));
    }
  };

  const handlePlayerChoice = (chosenMgrId) => {
    const baseCost = Math.max(...state.s1_1_tieList.map(mId => parseInt(state.s1_1_bids[mId])));
    const finalCost = baseCost + parseInt(state.s1_1_tieBids[chosenMgrId]);
    finalizePick(chosenMgrId, finalCost, state.s1_1_tieList.filter(id => id !== chosenMgrId)); // 충돌: 동률 후보 중 chosen 아닌 사람만 위로
  };

  if (!player) return <div className="p-6 text-slate-400">매물 추첨 중...</div>;
  const baseCost = state.s1_1_tieStage > 0 ? Math.max(...state.s1_1_tieList.map(mId => parseInt(state.s1_1_bids[mId]))) : 0;

  // ============== 간이 모드 분기 ==============
  if (state.mode === 'quick') {
    const handleQuickS11 = ({mgrId, cost, comfortMgrs}) => {
      setState(s => {
        let ns = applyPickStateUpdate(s, mgrId, s.s1_1_currentPlayerId, cost, 'S1-1', comfortMgrs, 'S1');
        const nextCycle = s.s1_1_cycle + 1;
        ns.s1_1_cycle = nextCycle;
        if (nextCycle >= 9) {
          ns.section = 'S1-2';
          ns.s1_1_currentPlayerId = null;
        } else {
          const remaining = ns.players.filter(p => p.section === 'S1' && !p.takenBy);
          const next = shuffle(remaining)[0];
          ns.s1_1_currentPlayerId = next?.id || null;
        }
        return ns;
      });
    };
    return (
      <PhaseLayout state={state} setState={setState}
        title={'⚡ ' + SECTION_LABELS['S1-1']}
        subtitle={`사이클 ${state.s1_1_cycle + 1}/9 · S1 남은 ${state.players.filter(p=>p.section==='S1'&&!p.takenBy).length}명 · 활성 ${activeMgrs.length}감독 (간이)`}>
        <CurrentPlayerCard player={player} photoTpl={state.photoTpl} accent="amber"
          sectionLabel="1차(특A)" subtitle="🎲 무작위 추첨됨"
          onOpenDetail={() => setDetailP(player)}/>
        <QuickSimpleInput state={state} activeMgrIds={activeMgrs.map(m=>m.id)} allowZero={false} onSubmit={handleQuickS11}/>
        {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
      </PhaseLayout>
    );
  }
  // ============== 상세 모드 (기존) ==============

  return (
    <PhaseLayout state={state} setState={setState}
      title={SECTION_LABELS['S1-1']}
      subtitle={`사이클 ${state.s1_1_cycle + 1}/9 · S1 남은 ${state.players.filter(p=>p.section==='S1'&&!p.takenBy).length}명 · 활성 ${activeMgrs.length}감독`}>
      <CurrentPlayerCard player={player} photoTpl={state.photoTpl} accent="amber"
        sectionLabel="1차(특A)"
        subtitle={state.s1_1_tieStage === 0 && Object.keys(state.s1_1_bids||{}).length === 0 ? '🎲 무작위 추첨됨' : null}
        onOpenDetail={() => setDetailP(player)}/>
      {state.s1_1_tieStage === 0 && (
        <div className="bg-slate-800/50 rounded-lg p-4">
          <div className="flex items-center justify-between mb-3">
            <div className="text-sm font-bold text-emerald-300">💰 9감독 비공개 입찰 (활성 {activeMgrs.length}명 · 5P 단위 · 0P 불가)</div>
            <button onClick={handleAIBidS11} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 입찰</button>
          </div>
          <div className="space-y-2">
            {state.managers.map(m => {
              const inactive = m.sectionCounts.S1 >= 1;
              return (
                <div key={m.id} className={`flex items-center gap-3 p-2 rounded ${inactive?'bg-slate-900/30 opacity-40':'bg-slate-900/60'}`}>
                  <div className="w-28 truncate font-bold text-slate-200 text-sm">{m.name}</div>
                  <div className="text-xs text-slate-400 w-16">잔여 <b className="text-emerald-400">{m.p}P</b></div>
                  <div className="text-xs text-slate-400 w-20">S1 {m.sectionCounts.S1}/2</div>
                  {inactive ? <div className="text-xs text-slate-500 italic flex-1">S1-1 픽 완료 (불참)</div> : (
                    <Fragment>
                      <input type="number" min={PICK_STEP} max={m.p} step={PICK_STEP}
                        value={state.s1_1_bids[m.id] ?? ''}
                        onChange={e => updateBid(m.id, e.target.value)}
                        placeholder="5P 이상"
                        className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                      <span className="text-xs text-slate-500">P</span>
                    </Fragment>
                  )}
                </div>
              );
            })}
          </div>
          {validation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <div className="font-bold mb-1">⚠ 검증 오류:</div>
              <ul className="list-disc list-inside">{validation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcess} disabled={validation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:cursor-not-allowed text-white rounded-lg font-bold">
            ✅ 입찰 처리
          </button>
        </div>
      )}
      {state.s1_1_tieStage === 1 && (
        <div className="bg-amber-900/30 border-2 border-amber-500 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-base font-bold text-amber-300">⚖️ 동률 발생! 추가입찰</div>
            <button onClick={handleAIBidS11TIE} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동</button>
          </div>
          <div className="text-xs text-amber-200/80 mb-3">기존 최고 <b>{baseCost}P</b> · 추가로 더할 P를 5P 단위로 비공개 제출</div>
          <div className="space-y-2">
            {state.s1_1_tieList.map(mId => {
              const m = state.managers.find(mm => mm.id === mId);
              return (
                <div key={mId} className="flex items-center gap-3 bg-slate-900/60 p-2 rounded">
                  <div className="w-28 font-bold">{m?.name}</div>
                  <div className="text-xs text-slate-400 w-16">잔여 {m?.p}P</div>
                  <div className="text-xs text-slate-400 w-20">기존 {baseCost}P</div>
                  <span className="text-xs text-slate-500">추가 +</span>
                  <input type="number" min={0} step={PICK_STEP} max={m.p - baseCost}
                    value={state.s1_1_tieBids[mId] ?? ''}
                    onChange={e => updateTieBid(mId, e.target.value)}
                    placeholder="0,5,10..."
                    className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                  <span className="text-xs text-slate-500">P</span>
                </div>
              );
            })}
          </div>
          {tieValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{tieValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleTieProcess} disabled={tieValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 추가입찰 처리
          </button>
        </div>
      )}
      {state.s1_1_tieStage === 2 && (
        <div className="bg-purple-900/30 border-2 border-purple-500 rounded-lg p-4">
          <div className="text-base font-bold text-purple-300 mb-1">🎯 추가입찰도 동률 → 선수가 선택</div>
          <div className="text-xs text-purple-200/80 mb-3"><b>{player.name}</b>이 다음 감독 중 1명 선택:</div>
          <button onClick={() => handlePlayerChoice(state.s1_1_tieList[Math.floor(Math.random()*state.s1_1_tieList.length)])}
            className="w-full py-2 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
            🎲 랜덤 선택 (동률 감독 {state.s1_1_tieList.length}명 중)
          </button>
          <div className="grid grid-cols-2 gap-2">
            {state.s1_1_tieList.map(mId => {
              const m = state.managers.find(mm => mm.id === mId);
              const finalCost = baseCost + parseInt(state.s1_1_tieBids[mId]);
              return (
                <button key={mId} onClick={() => handlePlayerChoice(mId)}
                  className="p-3 bg-slate-800 hover:bg-emerald-700 border border-slate-700 hover:border-emerald-400 rounded text-left transition">
                  <div className="font-bold text-base">{m?.name}</div>
                  <div className="text-xs text-slate-400 mt-1">최종 {finalCost}P 차감 → 잔여 {m?.p - finalCost}P</div>
                </button>
              );
            })}
          </div>
        </div>
      )}
      {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
    </PhaseLayout>
  );
}

// ============================================================
// S1-2 PHASE (순서 입찰)
// ============================================================
function S12Phase({ state, setState }) {
  const [detailP, setDetailP] = useState(null);
  const remainingPlayers = state.players.filter(p => p.section === 'S1' && !p.takenBy);
  const activeMgrs = state.managers.filter(m => m.sectionCounts.S1 < SECTION_SLOTS.S1);

  // S1-2 초기화: 진입 시 그룹 미생성이면 bid 단계
  const updateBid = (mgrId, v) => setState(s => ({...s, s1_2_bids: {...s.s1_2_bids, [mgrId]: v}}));

  // S1-2 AI 자동 입찰: 잔여 P의 일정 비율 (특정 선수가 아닌 선택권 베팅)
  const handleAIBidS12 = () => {
    const aiBids = {};
    activeMgrs.forEach(m => {
      if (state.myManagerId === m.id) return;  // 사용자 제외
      const pConf = AI_PERSONALITIES[m.personality || 'BALANCED'];
      // 성격별 베팅 비율 (잔여 P 대비)
      let ratio;
      if (pConf.starBoost) ratio = 0.20;
      else if (pConf.capRatio) ratio = 0.09;
      else if (pConf.focusBonus) ratio = 0.15;
      else if (pConf.rookieMult) ratio = 0.12;
      else ratio = 0.14;
      // 개인 bidScale 적용
      ratio *= (m.bidScale || 1.0);
      // 노이즈 ±50%
      ratio *= 1 + (Math.random() - 0.5) * 1.0;
      let bid = m.p * ratio;
      bid = Math.round(bid / 5) * 5;
      bid = Math.max(5, Math.min(bid, m.p));
      aiBids[m.id] = bid;
    });
    setState(s => ({ ...s, s1_2_bids: { ...s.s1_2_bids, ...aiBids } }));
  };

  // S1-2 타이브레이크 AI 자동 (S1-1과 동일 분포 - 5P 기본, 강한 관심만 10P+)
  const handleAIBidS12TIE = () => {
    if (state.s1_2_step !== 'tie' || !state.s1_2_currentTie) return;
    const t = state.s1_2_currentTie;
    const player = state.players.find(p => p.id === t.playerId);
    if (!player) return;
    const pub = computePublicValue(player, 1.0);
    const aiTie = {};
    t.mgrIds.forEach(mid => {
      if (state.myManagerId === mid) return;
      const mgr = state.managers.find(m => m.id === mid);
      if (!mgr) return;
      const pConf = AI_PERSONALITIES[mgr.personality || 'BALANCED'];
      const interest = computeInterest(player, mgr, pub, state.players, state.managers);
      let add;
      const r = Math.random();
      if (interest < 0.50) add = r < 0.8 ? 0 : 5;
      else if (interest < 0.70) add = r < 0.25 ? 0 : (r < 0.95 ? 5 : 10);
      else if (interest < 0.85) add = r < 0.05 ? 0 : (r < 0.65 ? 5 : 10);
      else add = r < 0.30 ? 5 : (r < 0.80 ? 10 : (r < 0.95 ? 15 : 20));
      if (pConf.capRatio && add === 5 && Math.random() < 0.4) add = 0;
      const remaining = mgr.p - (t.baseGroupP || 0);
      add = Math.max(0, Math.min(add, remaining));
      aiTie[mid] = add;
    });
    setState(s => ({ ...s, s1_2_tieBids: { ...s.s1_2_tieBids, ...aiTie } }));
  };

  const bidValidation = useMemo(() => {
    if (state.s1_2_step !== 'bid') return [];
    const errs = [];
    activeMgrs.forEach(m => {
      const v = state.s1_2_bids[m.id];
      if (v === undefined || v === '') { errs.push(`${m.name}: P 미입력`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c <= 0) errs.push(`${m.name}: S1은 0P 불가`);
      else if (c % PICK_STEP !== 0) errs.push(`${m.name}: ${PICK_STEP}P 단위`);
      else if (c > m.p) errs.push(`${m.name}: 잔여 P (${m.p}) 초과`);
    });
    return errs;
  }, [state.s1_2_bids, state.s1_2_step, activeMgrs]);

  // bid 처리: 그룹화 + 첫 그룹으로 이동
  const handleProcessBid = () => {
    const entries = activeMgrs.map(m => ({
      mgrId: m.id, p: parseInt(state.s1_2_bids[m.id]),
      slotsLeft: SECTION_SLOTS.S1 - m.sectionCounts.S1
    }));
    const sortedDesc = [...entries].sort((a,b)=>b.p-a.p);
    const groups = [];
    let curGroup = [];
    let curP = null;
    sortedDesc.forEach(e => {
      if (curP === null || e.p === curP) {
        curGroup.push(e); curP = e.p;
      } else {
        groups.push(curGroup); curGroup = [e]; curP = e.p;
      }
    });
    if (curGroup.length) groups.push(curGroup);
    const firstGroupMgrs = groups[0].map(e => e.mgrId);
    setState(s => ({...s, s1_2_step: 'pick', s1_2_groups: groups, s1_2_currentGroupIdx: 0, s1_2_groupSelections: {}, s1_2_currentGroupMgrs: firstGroupMgrs}));
  };

  const currentGroup = state.s1_2_groups[state.s1_2_currentGroupIdx];
  const currentGroupMgrSet = new Set(state.s1_2_currentGroupMgrs || []);
  // 현재 그룹에서 아직 픽 못한 감독들만 렌더링
  const activeInGroup = currentGroup ? currentGroup.filter(e => currentGroupMgrSet.has(e.mgrId)) : [];

  // pick 단계: 그룹의 각 감독이 1매물씩 비공개 지명 (재지명 포함)
  const toggleSelection = (mgrId, playerId) => {
    setState(s => {
      const cur = s.s1_2_groupSelections[mgrId] || [];
      const next = cur.includes(playerId) ? [] : [playerId];
      return {...s, s1_2_groupSelections: {...s.s1_2_groupSelections, [mgrId]: next}};
    });
  };

  // S1-2 AI 자동 픽
  const handleAIPickS12 = () => {
    if (state.s1_2_step !== 'pick' || !currentGroup) return;
    const selections = { ...state.s1_2_groupSelections };
    activeInGroup.forEach(e => {
      if (state.myManagerId === e.mgrId) return;
      const m = state.managers.find(mm => mm.id === e.mgrId);
      if (!m) return;
      const scored = remainingPlayers.map(p => {
        const pConf = AI_PERSONALITIES[m.personality || 'BALANCED'];
        const pub = computePublicValue(p, pConf.careerWeight || 1.0);
        const interest = computeInterest(p, m, pub, state.players, state.managers);
        return { p, interest };
      });
      scored.sort((a, b) => b.interest - a.interest);
      if (scored.length > 0) selections[e.mgrId] = [scored[0].p.id];
    });
    setState(s => ({ ...s, s1_2_groupSelections: selections }));
  };

  const pickValidation = useMemo(() => {
    if (state.s1_2_step !== 'pick' || !currentGroup) return [];
    const errs = [];
    activeInGroup.forEach(e => {
      const sel = state.s1_2_groupSelections[e.mgrId] || [];
      if (sel.length !== 1) {
        const mgr = state.managers.find(m=>m.id===e.mgrId);
        errs.push(`${mgr?.name}: 매물 1명 선택 필요`);
      }
    });
    return errs;
  }, [state.s1_2_step, currentGroup, activeInGroup, state.s1_2_groupSelections, state.managers]);

  // 그룹 처리: 충돌 시 추가입찰 단계로
  const handleProcessGroup = () => {
    setState(s => {
      const g = s.s1_2_groups[s.s1_2_currentGroupIdx];
      const groupP = g[0].p;
      const remaining = new Set(s.s1_2_currentGroupMgrs);
      const allPicks = [];
      g.forEach(e => {
        if (!remaining.has(e.mgrId)) return;
        (s.s1_2_groupSelections[e.mgrId] || []).forEach(pid => {
          allPicks.push({mgrId: e.mgrId, playerId: pid});
        });
      });
      const playerToMgrs = {};
      allPicks.forEach(({mgrId, playerId}) => {
        if (!playerToMgrs[playerId]) playerToMgrs[playerId] = [];
        playerToMgrs[playerId].push(mgrId);
      });
      let ns = {...s};
      const conflicts = [];
      Object.keys(playerToMgrs).forEach(playerId => {
        const mgrs = playerToMgrs[playerId];
        if (mgrs.length === 1) {
          // 단독 → 즉시 픽 (위로 X)
          ns = applyPickStateUpdate(ns, mgrs[0], playerId, groupP, 'S1-2', [], 'S1');
          remaining.delete(mgrs[0]);
        } else {
          conflicts.push({playerId, mgrIds: mgrs, baseGroupP: groupP});
        }
      });
      ns.s1_2_currentGroupMgrs = Array.from(remaining);
      ns.s1_2_groupSelections = {};
      if (conflicts.length > 0) {
        // 충돌 → 추가입찰 단계
        const first = conflicts[0];
        ns.s1_2_step = 'tie';
        ns.s1_2_currentTie = {...first, remaining: conflicts.slice(1)};
        ns.s1_2_tieBids = {};
      } else if (ns.s1_2_currentGroupMgrs.length === 0) {
        ns = advanceGroupOrFinishS12(ns);
      } else {
        // 안 픽한 감독 남았는데 충돌도 없음 → 재pick
        ns.s1_2_step = 'pick';
      }
      return ns;
    });
  };

  const advanceGroupOrFinishS12 = (s) => {
    const nextIdx = s.s1_2_currentGroupIdx + 1;
    if (nextIdx >= s.s1_2_groups.length) {
      return {...s, section: 'S2', s1_2_step: 'bid', s1_2_bids: {}, s1_2_groups: [], s1_2_groupSelections: {}, s1_2_currentTie: null, s1_2_currentGroupMgrs: []};
    }
    const nextGroup = s.s1_2_groups[nextIdx];
    return {...s, s1_2_currentGroupIdx: nextIdx, s1_2_groupSelections: {}, s1_2_step: 'pick', s1_2_currentGroupMgrs: nextGroup.map(e=>e.mgrId), s1_2_currentTie: null};
  };

  // tie 단계: 추가입찰
  const updateTieBid = (mgrId, v) => setState(s => ({...s, s1_2_tieBids: {...s.s1_2_tieBids, [mgrId]: v}}));

  const tieValidation = useMemo(() => {
    if (state.s1_2_step !== 'tie' || !state.s1_2_currentTie) return [];
    const errs = [];
    const t = state.s1_2_currentTie;
    t.mgrIds.forEach(mId => {
      const mgr = state.managers.find(m=>m.id===mId);
      const v = state.s1_2_tieBids[mId];
      if (v === undefined || v === '') { errs.push(`${mgr?.name}: 추가 P 미입력`); return; }
      const c = parseInt(v);
      if (isNaN(c) || c < 0) errs.push(`${mgr?.name}: 0 이상`);
      else if (c % PICK_STEP !== 0) errs.push(`${mgr?.name}: ${PICK_STEP}P 단위`);
      else if (t.baseGroupP + c > mgr.p) errs.push(`${mgr?.name}: 잔여 P 초과`);
    });
    return errs;
  }, [state.s1_2_step, state.s1_2_currentTie, state.s1_2_tieBids, state.managers]);

  const handleTieProcess = () => {
    setState(s => {
      const t = s.s1_2_currentTie;
      const entries = t.mgrIds.map(mId => ({mgrId: mId, total: t.baseGroupP + parseInt(s.s1_2_tieBids[mId])}));
      const maxTotal = Math.max(...entries.map(e => e.total));
      const top = entries.filter(e => e.total === maxTotal);
      let ns = {...s};
      if (top.length === 1) {
        // 추가입찰 단독 → 픽 (위로 X, 떨어진 감독은 재지명 가능)
        const winnerMgrId = top[0].mgrId;
        ns = applyPickStateUpdate(ns, winnerMgrId, t.playerId, maxTotal, 'S1-2', [], 'S1');
        ns.s1_2_currentGroupMgrs = ns.s1_2_currentGroupMgrs.filter(mid => mid !== winnerMgrId);
        ns = advanceTieQueueS12(ns);
      } else {
        // 추가입찰도 동률 → 선수 선택 단계 (위로는 choice에서)
        ns.s1_2_step = 'choice';
        ns.s1_2_currentTie = {...t, mgrIds: top.map(e=>e.mgrId), maxTotal};
      }
      return ns;
    });
  };

  const advanceTieQueueS12 = (s) => {
    const ns = {...s};
    if (s.s1_2_currentTie && s.s1_2_currentTie.remaining && s.s1_2_currentTie.remaining.length > 0) {
      const next = s.s1_2_currentTie.remaining[0];
      ns.s1_2_currentTie = {...next, remaining: s.s1_2_currentTie.remaining.slice(1)};
      ns.s1_2_step = 'tie';
      ns.s1_2_tieBids = {};
    } else {
      // 큐 끝
      ns.s1_2_currentTie = null;
      if (ns.s1_2_currentGroupMgrs.length > 0) {
        // 못 받은 감독 남음 → 재지명
        ns.s1_2_step = 'pick';
        ns.s1_2_groupSelections = {};
        ns.s1_2_tieBids = {};
      } else {
        return advanceGroupOrFinishS12(ns);
      }
    }
    return ns;
  };

  const handleChoicePlayer = (chosenMgrId) => {
    setState(s => {
      const t = s.s1_2_currentTie;
      const finalCost = t.maxTotal;  // 추가입찰까지 합친 P
      const comfortMgrs = t.mgrIds.filter(mId => mId !== chosenMgrId);
      // 픽 + 위로 (못 받은 감독 +5P)
      let ns = applyPickStateUpdate(s, chosenMgrId, t.playerId, finalCost, 'S1-2', comfortMgrs, 'S1');
      // currentGroupMgrs에서 픽한 감독만 제거 (못 받은 감독은 남김 → 재지명)
      ns.s1_2_currentGroupMgrs = ns.s1_2_currentGroupMgrs.filter(mid => mid !== chosenMgrId);
      // 다음 충돌 큐 항목 / 큐 끝나면 재지명 또는 다음 그룹
      ns = advanceTieQueueS12(ns);
      return ns;
    });
  };

  // ============== 간이 모드 분기 ==============
  if (state.mode === 'quick') {
    const handleQuickS12 = ({matches, comfortMgrs}) => {
      setState(s => {
        let ns = s;
        matches.forEach(m => {
          ns = applyPickStateUpdate(ns, m.mgrId, m.playerId, m.cost, 'S1-2', [], 'S1');
        });
        // 위로 보너스: 모든 매물에 대해 한 번에
        ns = {...ns, managers: ns.managers.map(mm => comfortMgrs.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        ns.section = 'S2';
        return ns;
      });
    };
    // ★ 매물 1개 즉시 처리 - 떨어진 감독은 다른 매물에 체크되어 있으면 살아남음, 아니면 자동 위로
    const handlePickOneS12 = ({playerId, mgrIds, cost, otherCheckedMgrIds}) => {
      setState(s => {
        let winner, losers = [];
        if (mgrIds.length === 1) {
          winner = mgrIds[0];
        } else {
          winner = mgrIds[Math.floor(Math.random() * mgrIds.length)];
          losers = mgrIds.filter(mid => mid !== winner);
        }
        let ns = applyPickStateUpdate(s, winner, playerId, cost, 'S1-2', [], 'S1');
        // 떨어진 감독 중 다른 매물에 체크 안 된 감독만 자동 위로 +5P
        const otherSet = new Set(otherCheckedMgrIds || []);
        const autoComfort = losers.filter(l => !otherSet.has(l));
        if (autoComfort.length > 0) {
          ns = {...ns, managers: ns.managers.map(mm => autoComfort.includes(mm.id) ? {...mm, p: mm.p + COMFORT_BONUS} : mm)};
        }
        // 모든 활성 감독이 픽 완료되면 S2로 자동 이동
        const stillActive = ns.managers.filter(m => m.sectionCounts.S1 < SECTION_SLOTS.S1);
        if (stillActive.length === 0) ns.section = 'S2';
        return ns;
      });
    };
    const goNextSection = () => {
      if (confirm('남은 S1 매물은 다음 시즌으로 (유찰). S2로 진행할까요?')) {
        setState(s => ({...s, section: 'S2'}));
      }
    };
    return (
      <PhaseLayout state={state} setState={setState}
        title={'⚡ ' + SECTION_LABELS['S1-2']}
        subtitle={`남은 S1 매물 ${remainingPlayers.length}명 · 활성 ${activeMgrs.length}감독 (간이)`}>
        <QuickMultiInput state={state} players={remainingPlayers}
          activeMgrIds={activeMgrs.map(m=>m.id)} allowZero={false}
          onSubmit={handleQuickS12} onPickOne={handlePickOneS12}
          onOpenDetail={(p) => setDetailP(p)}/>
        {activeMgrs.length > 0 && remainingPlayers.length > 0 && (
          <button onClick={goNextSection} className="mt-3 w-full py-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">
            ⏭ S2로 진행 (남은 매물 유찰)
          </button>
        )}
        {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
      </PhaseLayout>
    );
  }
  // ============== 상세 모드 (기존) ==============

  return (
    <PhaseLayout state={state} setState={setState}
      title={SECTION_LABELS['S1-2']}
      subtitle={`남은 S1 매물 ${remainingPlayers.length}명 · 활성 ${activeMgrs.length}감독`}>
      <div className="bg-slate-800/30 rounded p-3 mb-4">
        <div className="text-xs font-bold text-slate-400 mb-2">📋 남은 S1 매물 ({remainingPlayers.length}명)</div>
        <div className="grid grid-cols-3 gap-2">
          {remainingPlayers.map(p => (
            <MiniPlayerCard key={p.id} player={p} photoTpl={state.photoTpl} onClick={()=>setDetailP(p)}/>
          ))}
        </div>
      </div>

      {state.s1_2_step === 'bid' && (
        <div className="bg-slate-800/50 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold text-emerald-300">💰 비공개 P 제출 (5P 단위, 0P 불가)</div>
            <button onClick={handleAIBidS12} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 입찰</button>
          </div>
          <div className="text-xs text-slate-400 mb-3">높은 P 순서대로 선수 선택권 부여 · 같은 P는 충돌 시 추가입찰</div>
          <div className="space-y-2">
            {state.managers.map(m => {
              const inactive = m.sectionCounts.S1 >= SECTION_SLOTS.S1;
              const slotsLeft = SECTION_SLOTS.S1 - m.sectionCounts.S1;
              return (
                <div key={m.id} className={`flex items-center gap-3 p-2 rounded ${inactive?'bg-slate-900/30 opacity-40':'bg-slate-900/60'}`}>
                  <div className="w-28 truncate font-bold text-sm">{m.name}</div>
                  <div className="text-xs text-slate-400 w-16">잔여 <b className="text-emerald-400">{m.p}P</b></div>
                  <div className="text-xs text-slate-400 w-24">S1 잔여 슬롯 <b>{slotsLeft}</b></div>
                  {inactive ? <div className="text-xs text-slate-500 italic flex-1">S1 픽 완료</div> : (
                    <Fragment>
                      <input type="number" min={PICK_STEP} max={m.p} step={PICK_STEP}
                        value={state.s1_2_bids[m.id] ?? ''} onChange={e => updateBid(m.id, e.target.value)}
                        placeholder="5P 이상"
                        className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                      <span className="text-xs text-slate-500">P</span>
                    </Fragment>
                  )}
                </div>
              );
            })}
          </div>
          {bidValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{bidValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcessBid} disabled={bidValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 입찰 처리 → 그룹화
          </button>
        </div>
      )}

      {state.s1_2_step === 'pick' && currentGroup && (
        <div className="bg-amber-900/20 border border-amber-700/40 rounded-lg p-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold text-amber-300">🎯 그룹 {state.s1_2_currentGroupIdx+1}/{state.s1_2_groups.length} 선택 (P={currentGroup[0].p})</div>
            <button onClick={handleAIPickS12} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동 픽</button>
          </div>
          <div className="text-xs text-amber-200/80 mb-3">
            그룹 감독들이 비공개 1매물 지명. 충돌(같은 매물) → 선수가 1명 선택 + 못 받은 감독은 위로 +5P 후 재지명.
            {activeInGroup.length === 1 ? ' (단독 - 충돌 없음)' : ` (${activeInGroup.length}명 - 충돌 가능)`}
          </div>
          {activeInGroup.map(e => {

                    return (

          {pickValidation.length > 0 && (
            <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
              <ul className="list-disc list-inside">{pickValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <button onClick={handleProcessGroup} disabled={pickValidation.length>0}
            className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
            ✅ 그룹 처리
          </button>
        </div>
      )}

      {state.s1_2_step === 'tie' && state.s1_2_currentTie && (() => {
        const t = state.s1_2_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-amber-900/30 border-2 border-amber-500 rounded-lg p-4">
            <div className="flex items-center justify-between mb-1">
              <div className="text-base font-bold text-amber-300">⚖️ 충돌! 같은 선수 선택 - 추가입찰</div>
              <button onClick={handleAIBidS12TIE} className="text-xs px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-600/50 rounded font-bold transition">🤖 AI 자동</button>
            </div>
            <div className="text-xs text-amber-200/80 mb-3">매물 <b className="text-emerald-300">{player?.name}</b>에 대해 {t.mgrIds.length}명 충돌 · 기존 그룹 P {t.baseGroupP}P</div>
            <div className="space-y-2">
              {t.mgrIds.map(mId => {
                const m = state.managers.find(mm => mm.id === mId);
                return (
                  <div key={mId} className="flex items-center gap-3 bg-slate-900/60 p-2 rounded">
                    <div className="w-28 font-bold">{m?.name}</div>
                    <div className="text-xs text-slate-400 w-16">잔여 {m?.p}P</div>
                    <span className="text-xs text-slate-500">추가 +</span>
                    <input type="number" min={0} step={PICK_STEP} max={m.p - t.baseGroupP}
                      value={state.s1_2_tieBids[mId] ?? ''} onChange={e => updateTieBid(mId, e.target.value)}
                      className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-right focus:outline-none focus:border-emerald-500"/>
                    <span className="text-xs text-slate-500">P</span>
                  </div>
                );
              })}
            </div>
            {tieValidation.length > 0 && (
              <div className="bg-red-900/30 border border-red-700 rounded p-3 mt-3 text-xs text-red-300">
                <ul className="list-disc list-inside">{tieValidation.map((e,i)=><li key={i}>{e}</li>)}</ul>
              </div>
            )}
            <button onClick={handleTieProcess} disabled={tieValidation.length>0}
              className="mt-3 w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-lg font-bold">
              ✅ 추가입찰 처리
            </button>
          </div>
        );
      })()}

      {state.s1_2_step === 'choice' && state.s1_2_currentTie && (() => {
        const t = state.s1_2_currentTie;
        const player = state.players.find(p => p.id === t.playerId);
        return (
          <div className="bg-purple-900/30 border-2 border-purple-500 rounded-lg p-4">
            <div className="text-base font-bold text-purple-300 mb-1">🎯 추가입찰도 동률 → 선수가 선택</div>
            <div className="text-xs text-purple-200/80 mb-3"><b>{player?.name}</b>이 다음 {t.mgrIds.length}명 감독 중 1명 선택 · 최종 {t.maxTotal}P 차감 · 못 받은 감독은 위로 +5P 후 재지명</div>
            <button onClick={() => handleChoicePlayer(t.mgrIds[Math.floor(Math.random()*t.mgrIds.length)])}
              className="w-full py-2 mb-3 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm">
