  const [detailP, setDetailP] = useState(null);
  return (
    <div className="max-w-[1400px] mx-auto p-4">
      <div className="flex items-center justify-between mb-4">
        <div>
          <div className="text-3xl font-bold text-emerald-400">🏆 드래프트 완료!</div>
          <div className="text-xs text-slate-400">총 {state.log.length}건 픽 · {state.players.filter(p=>p.takenBy).length}명 배정</div>
        </div>
        <button onClick={() => {
          if (!window.confirm('처음부터 다시 시작할까요?')) return;
          setState(createInitialState());
        }} className="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm">🔄 새 드래프트</button>
      </div>

      <div className="grid grid-cols-3 gap-3">
        {state.managers.map(m => (
          <div key={m.id} className="bg-slate-800/40 rounded-lg p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="font-bold text-emerald-300">{m.name}</div>
              <div className="text-xs text-slate-400">{m.p}P 잔여 · {m.picks.length}픽</div>
            </div>
            <div className="space-y-1">
              {m.picks.map((pk, i) => {
                const p = state.players.find(pp => pp.id === pk.playerId);
                return (
                  <button key={i} onClick={()=>setDetailP(p)}
                    className="w-full flex items-center gap-2 bg-slate-900/60 hover:bg-slate-900 p-1.5 rounded text-left">
                    <PlayerPhoto player={p} photoTpl={state.photoTpl} size={28}/>
                    <div className="flex-1 min-w-0">
                      <div className="text-xs text-slate-500">{pk.round}</div>
                      <div className="text-sm font-bold truncate">{pk.playerName}</div>
                    </div>
                    <div className="text-xs text-amber-300 font-bold">{pk.cost}P</div>
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      {detailP && <PlayerDetailModal player={detailP} photoTpl={state.photoTpl} onClose={()=>setDetailP(null)}/>}
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App({helperPlayers}) {
  const [state, setState] = useState(() => loadState(helperPlayers));
  const [debugOpen, setDebugOpen] = useState(false);
  useEffect(()=>{ saveState(state); }, [state]);

  // 헬퍼에서 player 데이터 갱신 시 시뮬도 반영 (단, setup 단계에서만)
  useEffect(() => {
    if (!helperPlayers || helperPlayers.length === 0) return;
    if (state.phase !== 'setup') return;
    setState(s => ({
      ...s,
      players: helperPlayers.map((p,i)=>({...p, id:'P'+i, takenBy:null, cost:null, round:null}))
    }));
  }, [helperPlayers]);

  const handleReset = () => {
    if (confirm('시뮬레이터를 초기화합니다. 헬퍼의 현재 선수 데이터로 다시 시작합니다.')) {
      try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
      setState(createInitialState(helperPlayers));
    }
  };

  const handleStart = () => {
    setState(s => ({...s, phase: 'progress', section: 'S1-1', s1_1_cycle: 0}));
  };

  // ============== 🐛 디버그: 섹션 자동 채우기 + 점프 ==============
  // maxPicksPerMgr: 감독당 최대 픽 수 제한 (null=섹션 슬롯 한도까지)
  const autoFillOneSection = (s, sectionKey, costPerPick, limitCount, maxPicksPerMgr) => {
    let ns = {...s, players: s.players.map(p => ({...p})), managers: s.managers.map(m => ({...m, sectionCounts: {...m.sectionCounts}, picks: [...m.picks]}))};
    let players;
    if (sectionKey === 'S3') {
      const candidates = ns.players.filter(p => p.section === 'S3/4' && !p.takenBy);
      players = shuffle(candidates).slice(0, limitCount || 36);
    } else {
      players = shuffle(ns.players.filter(p => p.section === sectionKey && !p.takenBy));
      if (limitCount) players = players.slice(0, limitCount);
    }
    const slotLimit = maxPicksPerMgr != null ? maxPicksPerMgr : SECTION_SLOTS[sectionKey];
    let mgrIdx = 0;
    let totalAttempts = 0;
    const maxAttempts = players.length * ns.managers.length * 2;
    for (const p of players) {
      let placed = false;
      let tries = 0;
      while (!placed && tries < ns.managers.length && totalAttempts < maxAttempts) {
        const mgr = ns.managers[mgrIdx];
        if (mgr.sectionCounts[sectionKey] < slotLimit && mgr.p >= costPerPick) {
          const playerInState = ns.players.find(pp => pp.id === p.id);
          if (playerInState) {
            playerInState.takenBy = mgr.id;
            playerInState.cost = costPerPick;
            playerInState.round = sectionKey + '-자동';
          }
          mgr.p -= costPerPick;
          mgr.sectionCounts[sectionKey] = (mgr.sectionCounts[sectionKey] || 0) + 1;
          mgr.picks = [...mgr.picks, {playerId: p.id, cost: costPerPick, round: sectionKey + '-자동'}];
          placed = true;
        }
        mgrIdx = (mgrIdx + 1) % ns.managers.length;
        tries++;
        totalAttempts++;
      }
      if (!placed) break;
    }
    return ns;
  };

  // 섹션별 평균 P 추정 (디버그 자동 채우기용)
  const debugCosts = { S1: 35, S2: 18, S3: 8 };

  const jumpToSection = (targetSection) => {
    if (!confirm(`🐛 디버그: ${targetSection} 시작 시점까지 자동 채우기 후 점프할까요?`)) return;
    setState(s => {
      let ns = {...s, phase: 'progress'};
      const order = ['S1-1', 'S1-2', 'S2', 'S3', 'S4'];
      const targetIdx = order.indexOf(targetSection);
      if (targetIdx < 0) return s;

      // S1-2 직전: S1 감독당 1픽 (S1-1 완료)
      // S2 직전: S1 풀 가득 / S3 직전: +S2 / S4 직전: +S3
      if (targetIdx === 1) {
        ns = autoFillOneSection(ns, 'S1', debugCosts.S1, null, 1);
      } else if (targetIdx >= 2) {
        ns = autoFillOneSection(ns, 'S1', debugCosts.S1);
      }
      if (targetIdx >= 3) ns = autoFillOneSection(ns, 'S2', debugCosts.S2);
      if (targetIdx >= 4) ns = autoFillOneSection(ns, 'S3', debugCosts.S3, 36);

      // 섹션별 상태 초기화
      ns.section = targetSection;
      // S1-1
      ns.s1_1_cycle = 0;
      ns.s1_1_currentPlayerId = null;
      ns.s1_1_bids = {};
      ns.s1_1_tieStage = 0;
      ns.s1_1_tieList = [];
      ns.s1_1_tieBids = {};
      ns.s1_1_excludedMgrs = [];
      // S1-2
      ns.s1_2_step = 'bid';
      ns.s1_2_bids = {};
      ns.s1_2_groups = [];
      ns.s1_2_currentGroupIdx = 0;
      ns.s1_2_groupSelections = {};
      ns.s1_2_currentTie = null;
      ns.s1_2_tieBids = {};
      ns.s1_2_currentGroupMgrs = [];
      // S2
      ns.s2_step = 'lot';
      ns.s2_currentLot = [];
      ns.s2_bids = {};
      ns.s2_groups = [];
      ns.s2_groupSelections = {};
      ns.s2_currentTie = null;
      ns.s2_tieBids = {};
      ns.s2_group_idx = 0;
      ns.s2_inRelegation = false;
      ns.s2_relegPool = [];
      // S3
      ns.s3_step = 'lot';
      ns.s3_currentLot = [];
      ns.s3_bids = {};
      ns.s3_group_idx = 0;
      ns.s3_excludedMgrs = [];
      ns.s3_relegationQueue = [];
      ns.s3_currentTie = null;
      ns.s3_tieBids = {};
      ns.s3_pool = [];  // S3 진입 시 자동 추첨 (useEffect)
      // S4
      ns.s4_step = 'bid';
      ns.s4_cycle = 0;
      ns.s4_bids = {};
      ns.s4_groups = [];
      ns.s4_currentGroupIdx = 0;
      ns.s4_groupSelections = {};
      ns.s4_currentTie = null;
      ns.s4_pool = [];
      ns.s4_currentPlayerId = null;
      ns.s4_quick_pickQueue = [];
      ns.s4_quick_currentIdx = 0;
      return ns;
    });
  };

  // 진행 단계 정보 표시용
  const progressLabel = useMemo(() => {
    if (state.phase === 'setup') return null;
    const sec = state.section;
    if (sec === 'S1-1') return `진행 중: S1-1 ${state.s1_1_cycle + 1}/9 사이클`;
    if (sec === 'S1-2') return `진행 중: S1-2 ${state.s1_2_currentGroupIdx + 1}그룹째`;
    if (sec === 'S2') return `진행 중: S2 추첨 ${(state.s2_group_idx || 0)+1}차`;
    if (sec === 'S3') return `진행 중: S3 ${state.s3_group_idx + 1}그룹째`;
    if (sec === 'S4') return `진행 중: S4`;
    if (sec === 'finished') return '✅ 드래프트 완료';
    return null;
  }, [state.phase, state.section, state.s1_1_cycle, state.s1_2_currentGroupIdx, state.s2_group_idx, state.s3_group_idx]);

  return (
    <div className="min-h-screen pb-10">
      <div className="max-w-6xl mx-auto px-4 pt-3 flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2 text-xs">
          <span className="text-purple-300/80">🎲 모의드래프트 · {helperPlayers && helperPlayers.length > 0 ? `헬퍼 연동 (${helperPlayers.length}명)` : '내장 시드'}</span>
          {progressLabel && (
            <span className="px-2 py-0.5 bg-emerald-700/30 text-emerald-300 rounded font-bold border border-emerald-600/40">{progressLabel}</span>
          )}
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setDebugOpen(o => !o)}
            className={`text-xs px-2 py-0.5 rounded border ${debugOpen ? 'bg-red-900/40 text-red-300 border-red-600/50' : 'text-slate-500 hover:text-red-400 border-slate-700/50'}`}>
            🐛 디버그
          </button>
          <button onClick={handleReset} className="text-xs text-slate-500 hover:text-red-400">🔄 시뮬 초기화</button>
        </div>
      </div>

      {debugOpen && (
        <div className="max-w-6xl mx-auto px-4 mt-2">
          <div className="bg-red-950/30 border-2 border-red-700/60 rounded-lg p-3">
            <div className="text-xs font-bold text-red-300 mb-2">🐛 디버그 - 섹션 자동 채우기 + 점프 (실제 진행 룰 무시, 평균 P로 라운드 로빈 분배)</div>
            <div className="flex flex-wrap gap-2 mb-2">
              <button onClick={() => jumpToSection('S1-1')}
                className="px-3 py-1.5 bg-amber-700/40 hover:bg-amber-600/60 text-amber-200 border border-amber-600/50 rounded text-xs font-bold">
                S1-1 시작 (초기화)
              </button>
              <button onClick={() => jumpToSection('S1-2')}
                className="px-3 py-1.5 bg-amber-700/40 hover:bg-amber-600/60 text-amber-200 border border-amber-600/50 rounded text-xs font-bold">
                S1-2 시작 (S1-1 직후)
              </button>
              <button onClick={() => jumpToSection('S2')}
                className="px-3 py-1.5 bg-blue-700/40 hover:bg-blue-600/60 text-blue-200 border border-blue-600/50 rounded text-xs font-bold">
                S2 시작 (S1 채워둠)
              </button>
              <button onClick={() => jumpToSection('S3')}
                className="px-3 py-1.5 bg-emerald-700/40 hover:bg-emerald-600/60 text-emerald-200 border border-emerald-600/50 rounded text-xs font-bold">
                S3 시작 (S1+S2 채워둠)
              </button>
              <button onClick={() => jumpToSection('S4')}
                className="px-3 py-1.5 bg-purple-700/40 hover:bg-purple-600/60 text-purple-200 border border-purple-600/50 rounded text-xs font-bold">
                S4 시작 (S1+S2+S3 채워둠)
              </button>
            </div>
            <div className="text-[10px] text-slate-400 leading-relaxed">
              · 점프하면 이전 섹션 매물을 평균 P (S1={debugCosts.S1}P · S2={debugCosts.S2}P · S3={debugCosts.S3}P) 로 9감독에게 라운드 로빈 분배<br/>
              · 픽 기록에 <b className="text-amber-300">"자동"</b> 표시. 정상 진행하려면 "시뮬 초기화" 권장<br/>
              · 시뮬 상태/매물 데이터를 덮어쓰므로 진짜 진행 중에는 사용 금지
            </div>
          </div>
        </div>
      )}

      {state.phase === 'setup' && <Setup state={state} setState={setState} onStart={handleStart}/>}
      {state.phase === 'progress' && state.section === 'S1-1' && <S11Phase state={state} setState={setState}/>}
      {state.phase === 'progress' && state.section === 'S1-2' && <S12Phase state={state} setState={setState}/>}
      {state.phase === 'progress' && state.section === 'S2' && <S2Phase state={state} setState={setState}/>}
      {state.phase === 'progress' && state.section === 'S3' && <S3Phase state={state} setState={setState}/>}
      {state.phase === 'progress' && state.section === 'S4' && <S4Phase state={state} setState={setState}/>}
      {state.phase === 'progress' && state.section === 'finished' && <FinishedPhase state={state} setState={setState}/>}
    </div>
  );
}

  return App;

const H_INI = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const H_MED = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];

function buildSyl(ini, med, fin = '') {
  const i = H_INI.indexOf(ini), m = H_MED.indexOf(med), f = H_FIN.indexOf(fin);
  if (i < 0 || m < 0) return '';
  return String.fromCharCode(0xAC00 + i * 588 + m * 28 + (f >= 0 ? f : 0));
}

function jpToKo(text) {
  if (!text) return '';
  let out = '';
  let prev = null; // 직전 음절 정보 {ini, med, pos: out.length-1}
  const flushFinal = (fin) => {
    if (!prev) { out += fin; return; }
    out = out.slice(0, prev.pos) + buildSyl(prev.ini, prev.med, fin);
    prev = null;
  };
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (c === 'ー' || c === '〜') continue; // 장음 무시
    if (c === 'っ' || c === 'ッ') { flushFinal('ㅅ'); continue; }
    if (c === 'ん' || c === 'ン') { flushFinal('ㄴ'); continue; }
    // 요음 결합
    if (KANA_MAP[c] && YOUON[n]) {
      const [ini] = KANA_MAP[c];
      const med = YOUON[n];
      prev = { ini, med, pos: out.length };
      out += buildSyl(ini, med);
      i++; continue;
    }
    // 작은 모음 결합 (ティ, ディ 등)
    if (KANA_MAP[c] && SMALL_VOWELS[n]) {
      const [ini] = KANA_MAP[c];
      const med = SMALL_VOWELS[n];
      prev = { ini, med, pos: out.length };
      out += buildSyl(ini, med);
      i++; continue;
    }
    if (KANA_MAP[c]) {
      const [ini, med] = KANA_MAP[c];
      prev = { ini, med, pos: out.length };
      out += buildSyl(ini, med);
      continue;
    }
    out += c;
    prev = null;
  }
  return out;
}

// 검색 인덱스: 한 선수의 모든 검색 가능한 텍스트를 하나로
function buildSearchIndex(player) {
  const parts = [];
  const name = player.name || '';
  parts.push(name.toLowerCase());
  // 일본어 → 한국어
  if (/[\u3040-\u30FF]/.test(name)) {
    parts.push(jpToKo(name));
  }
  // 메모/태그도 검색 대상
  if (player.memo) parts.push(player.memo.toLowerCase());
  if (player.tags) parts.push(player.tags.join(' ').toLowerCase());
  parts.push(String(player.index || ''));
  return parts.join(' ');
}

function matchSearch(player, query) {
  if (!query) return true;
  const q = query.toLowerCase().trim();
  if (!q) return true;
  const idx = player._searchIndex || buildSearchIndex(player);
  if (idx.includes(q)) return true;
  // 검색어가 일본어면 한국어로도 변환해서 비교
  if (/[\u3040-\u30FF]/.test(query)) {
    const qKo = jpToKo(query);
    if (idx.includes(qKo)) return true;
  }
  return false;
}

const getStarColor = (rating) => {
  if (rating >= 4.5) return 'bg-gradient-to-r from-amber-300 to-amber-500';
  if (rating >= 3.5) return 'bg-gradient-to-r from-red-400 to-red-600';
  if (rating >= 2.5) return 'bg-gradient-to-r from-orange-400 to-orange-600';
  if (rating >= 1.5) return 'bg-gradient-to-r from-yellow-600 to-yellow-700';
  if (rating >= 0.5) return 'bg-slate-500';
  return 'bg-slate-800';
};

    },
    budget: {}, // 라운드별 계획 P { 'S1-1': 30, 'S2-1': 25, ... }
    // 뎁스차트: 포지션별 배열 (인덱스 0=주전, 1~3=백업1~3, 총 4슬롯)
    // 투수: P_starter(5칸 선발) / P_sub(5칸 서브)
    depth: {
      C: ['', '', '', ''], '1B': ['', '', '', ''], '2B': ['', '', '', ''], '3B': ['', '', '', ''], SS: ['', '', '', ''],
      LF: ['', '', '', ''], CF: ['', '', '', ''], RF: ['', '', '', ''], DH: ['', '', '', ''],
      P_starter: ['', '', '', '', ''],
      P_sub: ['', '', '', '', '']
    },
    memo: '', log: []
  };
}

// ============================================================
// STORAGE
// ============================================================
function loadState() {
  let migrated = false;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      // 압축 데이터인지 평문인지 자동 판별
      let json = raw;
      if (raw[0] !== '{' && raw[0] !== '[') {
        // 평문 JSON이 아니면 LZ-String 압축으로 가정
        try {
          const decompressed = (typeof LZString !== 'undefined' && LZString.decompressFromUTF16)
            ? LZString.decompressFromUTF16(raw)
            : null;
          if (decompressed && (decompressed[0] === '{' || decompressed[0] === '[')) {
            json = decompressed;
          }
        } catch (e) { console.warn('[loadState] decompress 실패, raw 시도', e); }
      }
      const parsed = JSON.parse(json);
      const def = createDefaultState();
      const merged = { ...def, ...parsed, settings: { ...def.settings, ...(parsed.settings || {}) } };
      // 선수 데이터 마이그레이션
      const seedByName = Object.fromEntries(SEED_PLAYERS.map(s => [s.name, { index: s.index, section: s.section, region: s.region || '' }]));
      if (Array.isArray(merged.players)) {
        merged.players = merged.players.map(p => {
          let np = { ...p };

          // 1) position(단일) → positions/subPositions(배열)
          if (!Array.isArray(np.positions)) {
            let positions = [];
            if (np.position === 'pitcher' || np.position === 'both') positions = ['P'];
            const { position, ...rest } = np;
            np = { ...rest, positions, subPositions: Array.isArray(np.subPositions) ? np.subPositions : [] };
          }

          // 2) 단일 스탯 필드 → stats 배열로 이동
          if (!Array.isArray(np.stats)) {
            const oldKeys = [...HIT_KEYS, ...PIT_KEYS];
            const hasAny = oldKeys.some(k => p[k] !== '' && p[k] !== null && p[k] !== undefined);
            const stats = [];
            if (hasAny) {
              const entry = newSeasonEntry('기본');
              oldKeys.forEach(k => { if (p[k] !== undefined) entry[k] = p[k]; });
              stats.push(entry);
            }
            const cleaned = { ...np };
            oldKeys.forEach(k => delete cleaned[k]);
            np = { ...cleaned, stats };
          }

          // 3) S3/S4 통합 (랜덤 배정이므로 같은 풀)
          if (np.section === 'S3' || np.section === 'S4') {
            np = { ...np, section: 'S3/4' };
          }

          // 4) 시드에서 인덱스 자동 동기화 (이름 매칭, 인덱스 비어있는 경우만)
          if ((!np.index || np.index === '') && seedByName[np.name]) {
            const seedIdx = seedByName[np.name].index;
            if (seedIdx) np = { ...np, index: seedIdx };
          }

          // 지역(region) 필드: 사용자가 지정한 값 우선, 비어있으면 시드에서 가져오기
          if (!np.region || !['KR','JP','EN'].includes(np.region)) {
            const seed = seedByName[np.name];
            np = { ...np, region: (seed && seed.region) ? seed.region : '' };
          }

          return np;
        });

        // 5) 시드에 새로 추가된 선수는 기존 데이터에 자동 추가
        const existingNames = new Set(merged.players.map(p => p.name));
        SEED_PLAYERS.forEach(seed => {
          if (!existingNames.has(seed.name)) {
            merged.players.push({
              id: 'P' + Date.now() + Math.random().toString(36).slice(2, 6),
              index: seed.index,
              name: seed.name,
              section: seed.section,
              region: seed.region || '',
              positions: seed.positions || [],
              subPositions: seed.subPositions || [],
              intro: seed.intro || '',
              rating: 0,
              targetP: '',
              memo: '',
              tags: [],
              favorite: false,
              replacements: [],
              stats: (seed.seedStats || []).map((s, i) => ({ ...s, id: 'S' + Date.now() + '_' + i + Math.random().toString(36).slice(2, 4), note: '' }))
            });
          }
        });

        // 6) 기존 사용자 데이터의 분리된 stats 병합 (같은 season+isCareer는 한 객체로)
        //    이전 버전에서 타격/투수가 별도 stat으로 저장된 경우 자동 정리
        merged.players = merged.players.map(p => {
          if (!Array.isArray(p.stats) || p.stats.length === 0) return p;
          const byKey = {};
          const order = [];
          p.stats.forEach(s => {
            const key = `${s.season || ''}|${s.isCareer ? 'c' : 'n'}`;
            if (!byKey[key]) {
              byKey[key] = { ...s };
              // kind 필드는 병합 시 의미 없으므로 제거
              delete byKey[key].kind;
              order.push(key);
            } else {
              // 같은 시즌의 다른 객체 → 빈 필드만 채워서 병합
              const existing = byKey[key];
              for (const k in s) {
                if (k === 'kind' || k === 'id') continue;
                const v = s[k];
                if (v === '' || v === null || v === undefined) continue;
                // 기존 값이 비어있으면 새 값 채움
                const ev = existing[k];
                if (ev === '' || ev === null || ev === undefined) {
                  existing[k] = v;
                }
                // note는 합치기
                if (k === 'note' && v && ev && ev !== v) {
                  existing.note = ev + ' / ' + v;
                }
              }
            }
          });
          return { ...p, stats: order.map(k => byKey[k]) };
        });

        // 7) 기존 선수에 시드의 확장 데이터 보강 (사용자 데이터 우선, 빈 값만 채움)
        const seedExtraByName = Object.fromEntries(SEED_PLAYERS.map(s => [s.name, s]));
        merged.players = merged.players.map(p => {
          const sd = seedExtraByName[p.name];
          if (!sd) return p;
          const np = { ...p };
          // 빈 값만 시드로 채움
          if (!np.intro && sd.intro) np.intro = sd.intro;
          if ((!np.positions || np.positions.length === 0) && sd.positions && sd.positions.length > 0) np.positions = [...sd.positions];
          if ((!np.subPositions || np.subPositions.length === 0) && sd.subPositions && sd.subPositions.length > 0) np.subPositions = [...sd.subPositions];
          // seedStats: 같은 season+isCareer 조합이 없는 것만 추가
          if (Array.isArray(sd.seedStats) && sd.seedStats.length > 0) {
            const existing = new Set((np.stats || []).map(s => `${s.season || ''}|${s.isCareer ? 'c' : 'n'}`));
            const toAdd = sd.seedStats
              .filter(s => !existing.has(`${s.season || ''}|${s.isCareer ? 'c' : 'n'}`))
              .map((s, i) => ({ ...s, id: 'S' + Date.now() + '_' + i + Math.random().toString(36).slice(2, 4), note: '' }));
            if (toAdd.length > 0) np.stats = [...(np.stats || []), ...toAdd];
          }
          return np;
        });

        // 8) 시드 v2 마이그레이션: 잘못된 positions/subPositions 패턴 자동 정정
        //    이전 버전 버그로 인해 주포지션이 비었고 부포지션에 ALL이 들어간 케이스
        if (!merged.__seedMigrationV2) {
          merged.players = merged.players.map(p => {
            const sd = seedExtraByName[p.name];
            if (!sd) return p;
            const np = { ...p };
            const userPos = np.positions || [];
            const userSub = np.subPositions || [];
            const seedPos = sd.positions || [];
            const seedSub = sd.subPositions || [];
            // 사용자 sub이 야수 9포지션을 모두 포함하고 user pos가 비어있으면 → 시드로 덮어씀
            const FIELDS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
            const subHasAllFields = FIELDS.every(f => userSub.includes(f));
            if (subHasAllFields && userPos.length === 0 && seedPos.length > 0) {
              np.positions = [...seedPos];
              np.subPositions = [...seedSub];
            }
            return np;
          });
          merged.__seedMigrationV2 = true;
          migrated = true;
        }
        // V3 마이그레이션: 투수 stat placeholder 정리 + games_p 분리
        // ByeolBam 같은 야수에 ERA=99.99 같은 placeholder P 데이터가 들어간 문제 해결
        if (!merged.__seedMigrationV3) {
          merged.players = merged.players.map(p => {
            if (!Array.isArray(p.stats) || p.stats.length === 0) return p;
            const cleanedStats = p.stats.map(s => {
              const cleaned = { ...s };
              const ip = Number(cleaned.IP) || 0;
              const k = Number(cleaned.K) || 0;
              const ha = Number(cleaned.H_a) || 0;
              const er = Number(cleaned.ER) || 0;
              const era = Number(cleaned.ERA) || 0;
              const eraPlus = Number(cleaned.ERA_plus) || 0;
              // placeholder 판정: ERA가 99 이상 (99.99 등), 또는 ERA+가 5 미만 (4.4473 등) + IP 없음
              const isPlaceholder = era >= 99 || (eraPlus > 0 && eraPlus < 5 && ip <= 0);
              // 의미있는 P 활동: IP > 0, K > 0, H_a > 0, ER > 0 중 하나라도
              const hasRealPitching = ip > 0 || k > 0 || ha > 0 || er > 0;
              if (isPlaceholder || !hasRealPitching) {
                // P 필드 모두 제거 (HIT_KEYS와 겹치지 않는 키만)
                ['IP','W','L','SV','HLD','QS','K','H_a','HR_a','ER','BB_p','HBP_p','WP',
                 'ERA','WHIP','ERA_plus','K_9','BB_9','K_pct','BB_pct','games_p'].forEach(key => {
                  delete cleaned[key];
                });
              } else {
                // P 활동 있음: games_p 없으면 games 값 사용 (시드 분리 한계)
                if (cleaned.games_p === undefined && cleaned.games !== undefined) {
                  cleaned.games_p = cleaned.games;
                }
              }
              return cleaned;
            });
            return { ...p, stats: cleanedStats };
          });
          merged.__seedMigrationV3 = true;
          migrated = true;
        }
        // SEED 버전 마커: SEED 갱신 시 빈/부분 데이터 자동 보강 (감독 수정 보존)
        // 휴리스틱: 사용자 값이 SEED의 부분집합이면 옛 데이터 잔재로 보고 SEED로 갱신,
        //          다른 값이면 감독이 의도적으로 수정한 거로 보고 유지
        if (merged.__seedVersion !== SEED_VERSION) {
          const isSubset = (userArr, seedArr) => {
            if (!Array.isArray(userArr) || !Array.isArray(seedArr)) return false;
            if (userArr.length === 0) return true;
            if (userArr.length >= seedArr.length) return false;
            const seedSet = new Set(seedArr);
            return userArr.every(x => seedSet.has(x));
          };
          merged.players = merged.players.map(p => {
            const sd = seedExtraByName[p.name];
            if (!sd) return p;
            const np = { ...p };
            // intro: 비어있거나 SEED와 같으면 (옛 버전 SEED 그대로) → 최신 SEED로
            // 감독이 수정한 intro면 사용자 값 보존
            if (!np.intro || np.intro === '') {
              if (sd.intro) np.intro = sd.intro;
            }
            // positions: 부분집합이면 옛 데이터 잔재 → SEED로 갱신
            // 감독이 의도적으로 수정한 거(다른 조합)면 보존
            if (sd.positions && sd.positions.length > 0) {
              if (!np.positions || np.positions.length === 0 || isSubset(np.positions, sd.positions)) {
                np.positions = [...sd.positions];
              }
            }
            // subPositions도 동일 로직
            if (sd.subPositions && sd.subPositions.length > 0) {
              if (!np.subPositions || np.subPositions.length === 0 || isSubset(np.subPositions, sd.subPositions)) {
                np.subPositions = [...sd.subPositions];
              }
            } else if (!np.subPositions) {
              np.subPositions = [];
            }
            return np;
          });
          merged.__seedVersion = SEED_VERSION;
          migrated = true;
        }
        // 안전망: SEED 부분집합 불일치 발견 시 자동 복구
        try {
          const eveInState = merged.players.find(p => p.name === 'ʚEveɞ');
          const eveInSeed = SEED_PLAYERS.find(p => p.name === 'ʚEveɞ');
          if (eveInState && eveInSeed && eveInState.positions && eveInSeed.positions &&
              eveInState.positions.length < eveInSeed.positions.length) {
            const seedSet = new Set(eveInSeed.positions);
            const isSubset = eveInState.positions.every(x => seedSet.has(x));
            if (isSubset) {
              console.warn('[자동복구] SEED 부분집합 불일치 감지 → 전체 갱신');
              merged.players = merged.players.map(p => {
                const sd = SEED_PLAYERS.find(x => x.name === p.name);
                if (!sd || !sd.positions || sd.positions.length === 0) return p;
                if (!p.positions || p.positions.length === 0) return { ...p, positions: [...sd.positions] };
                const seedS = new Set(sd.positions);
                if (p.positions.length < sd.positions.length && p.positions.every(x => seedS.has(x))) {
                  return { ...p, positions: [...sd.positions] };
                }
                return p;
              });
              merged.__seedVersion = SEED_VERSION;
              migrated = true;
            }
          }
        } catch (e) {}
      }
      // 감독 데이터 마이그레이션: name 매칭으로 index 자동 채움
      const seedMgrByName = Object.fromEntries(SEED_MANAGERS.map(m => [m.name, m.index]));
      if (Array.isArray(merged.managers)) {
        merged.managers = merged.managers.map(m => {
          if (m.index !== undefined && m.index !== null && m.index !== '') return m;
          const seedIdx = seedMgrByName[m.name];
          if (seedIdx) return { ...m, index: seedIdx };
          return { ...m, index: m.index || '' };
        });
      }
      // best12 슬롯 마이그레이션
      if (Array.isArray(merged.best12)) {
        merged.best12 = merged.best12.map(sl => {
          if (Array.isArray(sl.positions)) return sl;
          let positions = [];
          if (sl.position === 'pitcher') positions = ['P'];
          else if (sl.position === 'hitter') positions = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
          const { position, ...rest } = sl;
          return { ...rest, positions };
        });
      }
      // budget 필드 보장 (없으면 빈 객체)
      if (!merged.budget || typeof merged.budget !== 'object') merged.budget = {};

      // 중복 픽 정리: 한 선수는 한 감독의 picks에 한 번만 (앞에 나온 것 유지)
      // 잘못 들어간 중복 픽의 비용을 잔여 P로 복구
      if (Array.isArray(merged.managers)) {
        const globalSeen = new Set();
        merged.managers = merged.managers.map(m => {
          if (!Array.isArray(m.picks)) return m;
          const localSeen = new Set();
          let refund = 0;
          const cleanedPicks = [];
          for (const p of m.picks) {
            if (!p || !p.playerId) continue;
            if (localSeen.has(p.playerId) || globalSeen.has(p.playerId)) {
              refund += p.cost || 0;
              console.warn('중복 픽 제거:', p.playerId, '환불 +', p.cost);
              continue;
            }
            localSeen.add(p.playerId);
            globalSeen.add(p.playerId);
            cleanedPicks.push(p);
          }
          return { ...m, picks: cleanedPicks, remainP: (m.remainP || 0) + refund };
        });
      }
      // depth 필드 보장 + 슬롯 길이 보정
      const defaultDepth = {
        C: ['', '', '', ''], '1B': ['', '', '', ''], '2B': ['', '', '', ''], '3B': ['', '', '', ''], SS: ['', '', '', ''],
        LF: ['', '', '', ''], CF: ['', '', '', ''], RF: ['', '', '', ''], DH: ['', '', '', ''],
        P_starter: ['', '', '', '', ''], P_sub: ['', '', '', '', '']
      };
      if (!merged.depth || typeof merged.depth !== 'object') {
        merged.depth = defaultDepth;
      } else {
        // 누락된 키 채우기 + 길이 보정
        Object.keys(defaultDepth).forEach(k => {
          if (!Array.isArray(merged.depth[k])) merged.depth[k] = [...defaultDepth[k]];
          while (merged.depth[k].length < defaultDepth[k].length) merged.depth[k].push('');
        });
      }
      // 마이그레이션 발생 시 즉시 저장 (마커가 다음 로드 때 인식되도록)
      if (migrated) {
        try {
          const json = JSON.stringify(merged);
          const data = (typeof LZString !== 'undefined' && LZString.compressToUTF16)
            ? LZString.compressToUTF16(json) : json;
          localStorage.setItem(STORAGE_KEY, data);
        }
        catch (e) { console.error('[loadState save after migrate]', e); }
      }
      return merged;
    }
  } catch (e) { console.error('[loadState]', e); }
  return createDefaultState();
}

function saveStateNow(state) {
    // 초기화 진행 중에는 저장 skip (pagehide/beforeunload flush가 데이터 복원하는 것 방지)
    if (typeof window !== 'undefined' && window.__wbdResetInProgress) return true;
  try {
    const json = JSON.stringify(state);
    // LZ-String UTF16 압축 사용 (보통 50-70% 압축)
    const data = (typeof LZString !== 'undefined' && LZString.compressToUTF16)
      ? LZString.compressToUTF16(json)
      : json;
    localStorage.setItem(STORAGE_KEY, data);
    // 검증: 다시 읽어서 동일한지
    const verify = localStorage.getItem(STORAGE_KEY);
    if (verify !== data) {
      console.error('[saveStateNow] 검증 실패! expected len:', data.length, 'got len:', verify ? verify.length : 'null');
      return false;
    }
    return true;
  } catch (e) {
    let origSize = 0, compSize = 0;
    try {
      const json = JSON.stringify(state);
      origSize = json.length;
      if (typeof LZString !== 'undefined') compSize = LZString.compressToUTF16(json).length;
    } catch {}
    console.error('[saveStateNow] 저장 실패:', e.name, e.message, '/ 원본:', origSize, '압축후:', compSize, 'chars');
    return false;
  }
}

// ============================================================
// SIMILARITY
// ============================================================
function computeSimilarity(target, candidate) {
  if (target.id === candidate.id) return { score: -1, parts: {} };
  const parts = { pos: 0, rating: 0, hit: 0, pit: 0, tags: 0, targetP: 0, section: 0 };

  // 포지션 겹침 (주포지션 교집합 + 부포지션 일부 가중)
  const tAll = new Set([...(target.positions || []), ...(target.subPositions || [])]);
  const cAll = new Set([...(candidate.positions || []), ...(candidate.subPositions || [])]);
  const tMain = new Set(target.positions || []);
  const cMain = new Set(candidate.positions || []);

  let posScore = 0;
  for (const p of tMain) if (cMain.has(p)) posScore += 25;
  for (const p of tMain) if (cAll.has(p) && !cMain.has(p)) posScore += 10;
  for (const p of cMain) if (tAll.has(p) && !tMain.has(p)) posScore += 10;
  const tGroups = new Set([...tAll].map(p => POS_BY_VALUE[p]?.group).filter(Boolean));
  const cGroups = new Set([...cAll].map(p => POS_BY_VALUE[p]?.group).filter(Boolean));
  for (const g of tGroups) if (cGroups.has(g)) posScore += 5;
  parts.pos = Math.min(50, posScore);

  // 별점 비교: 둘 다 평가 매겨진 경우에만 (한쪽이라도 0이면 평가 못 함 → skip)
  if ((target.rating || 0) > 0 && (candidate.rating || 0) > 0) {
    const rd = Math.abs(target.rating - candidate.rating);
    parts.rating = Math.max(0, 25 - rd * 4);  // 가중치 8→4 완화 (5점 차이도 5점은 줌)
  }

  const isHitter = (p) => [...(p.positions||[]),...(p.subPositions||[])].some(x => x !== 'P');
  const isPitcher = (p) => [...(p.positions||[]),...(p.subPositions||[])].includes('P');

  const ts = getDisplayStats(target) || {};
  const cs = getDisplayStats(candidate) || {};
  const num = (v) => { const n = Number(v); return isNaN(n) ? 0 : n; };
  // 핵심 스탯 존재 여부 (둘 다 있어야 비교)
  const hasHitStats = (s) => num(s.AVG) > 0 || num(s.OBP) > 0 || num(s.SLG) > 0;
  const hasPitStats = (s) => num(s.ERA) > 0 || num(s.WHIP) > 0 || num(s.IP) > 0;

  if (isHitter(target) && isHitter(candidate) && hasHitStats(ts) && hasHitStats(cs)) {
    const a = Math.abs(num(ts.AVG)-num(cs.AVG))*80;
    const sl = Math.abs(num(ts.SLG)-num(cs.SLG))*40;
    const o = Math.abs(num(ts.OBP)-num(cs.OBP))*60;
    const h = Math.abs(num(ts.HR)-num(cs.HR))*1.2;
    parts.hit = Math.max(0, 30 - a - sl - o - h);
  }
  if (isPitcher(target) && isPitcher(candidate) && hasPitStats(ts) && hasPitStats(cs)) {
    const e = Math.abs(num(ts.ERA)-num(cs.ERA))*3;
    const w = Math.abs(num(ts.WHIP)-num(cs.WHIP))*10;
    parts.pit = Math.max(0, 25 - e - w);
  }
  if (target.tags && candidate.tags) {
    const ov = target.tags.filter(t => candidate.tags.includes(t)).length;
    parts.tags = ov * 8;
  }
  // 타겟 P 비교: 둘 다 설정된 경우만
  if ((target.targetP || 0) > 0 && (candidate.targetP || 0) > 0) {
    const pd = Math.abs(target.targetP - candidate.targetP);
    parts.targetP = Math.max(0, 10 - pd * 0.2);
  }
  // 섹션 일치 가중치 5→15 (같은 섹션 픽 라운드라 비교 가치 큼)
  if (target.section === candidate.section) parts.section = 15;

  const score = parts.pos + parts.rating + parts.hit + parts.pit + parts.tags + parts.targetP + parts.section;
  return { score, parts };
}

function findReplacements(player, allPlayers, statusMap, limit = 6, options = {}) {
  const manual = (player.replacements || [])
    .map(id => allPlayers.find(p => p.id === id))
    .filter(p => p && !statusMap[p.id]);
  const cands = allPlayers.filter(p => p.id !== player.id && !statusMap[p.id] && !manual.find(m => m.id === p.id));
  // 내 로스터 보완 보너스 계산
  const emptySlotPos = options.emptySlotPositions instanceof Set ? options.emptySlotPositions : new Set();
  const overstuffedPos = options.overstuffedPositions instanceof Set ? options.overstuffedPositions : new Set();
  const computeRosterBonus = (cand) => {
    const candPos = [...(cand.positions || []), ...(cand.subPositions || [])];
    if (candPos.length === 0) return 0;
    let bonus = 0;
    // 내 빈 슬롯에 맞는 포지션이 있으면 +20
    if (candPos.some(p => emptySlotPos.has(p))) bonus += 20;
    // 이미 과적재된 포지션이면 -15
    if (candPos.some(p => overstuffedPos.has(p)) && !candPos.some(p => emptySlotPos.has(p))) bonus -= 15;
    return bonus;
  };
  const auto = cands.map(c => {
    const sim = computeSimilarity(player, c);
    const roster = computeRosterBonus(c);
    return { p: c, s: sim.score + roster, parts: { ...sim.parts, roster } };
  })
    .sort((a, b) => b.s - a.s)
    .slice(0, Math.max(1, limit - manual.length))
    .map(x => ({ player: x.p, score: x.s, parts: x.parts }));
  return { manual, auto };
}

// 시즌 우선순위 (높을수록 최신) — KR > JP > EN, 각 그룹 안에서는 최신 시즌
const SEASON_PRIORITY = {
  '25 FW KR':       100,  // KR 최신
  '25 Summer KR':    90,
  '26 Season4 JP':   80,  // JP 최신
  '25 Season3 JP':   70,
  '25 Summer JP':    60,
  '25 Spring JP':    50,
  '26 EN':           40,  // EN (하나)
  '통산 KR':         20,  // 통산은 가장 낮은 우선순위
};
const seasonPriority = (s) => {
  if (!s) return 0;
  if (s.isCareer) return SEASON_PRIORITY['통산 KR'] || 20;
  const sn = s.season || '';
  if (SEASON_PRIORITY[sn] !== undefined) return SEASON_PRIORITY[sn];
  // 시즌 이름이 우선순위 표에 없으면 통산보다 살짝 낮게 (수동 입력 시즌 등)
  return 10;
};

// 카드/비교에 표시할 대표 스탯: 시즌 우선순위 기반 (KR FW > KR Summer > JP S4 > ... > 통산)
function getDisplayStats(player) {
  const stats = player.stats || [];
  if (stats.length === 0) return null;
  // 유효한 stat만 (실제 값이 있는 것)
  const allKeys = [...HIT_KEYS, ...PIT_KEYS];
  const isValid = (s) => allKeys.some(k => {
    const v = s[k];
    return v !== '' && v !== null && v !== undefined && !isNaN(Number(v)) && Number(v) !== 0;
  });
  const valid = stats.filter(isValid);
  const pool = valid.length > 0 ? valid : stats;
  // 우선순위 내림차순 정렬해서 첫 번째 반환
  const sorted = [...pool].sort((a, b) => seasonPriority(b) - seasonPriority(a));
  return sorted[0];
}

const hasHitStats = (s) => HIT_KEYS.some(k => s[k] !== '' && s[k] !== null && s[k] !== undefined && !isNaN(Number(s[k])));
const hasPitStats = (s) => PIT_KEYS.some(k => s[k] !== '' && s[k] !== null && s[k] !== undefined && !isNaN(Number(s[k])));

const StarRating = memo(function StarRating({ value = 0, onChange, size = 'md', readonly = false }) {
  const sizes = { sm: 11, md: 15, lg: 22 };
  const px = sizes[size];
  const handleClick = (e, idx) => {
    if (readonly) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const half = (e.clientX - rect.left) < rect.width / 2;
    const v = idx + (half ? 0.5 : 1);
    onChange && onChange(v === value ? Math.max(0, value - 0.5) : v);
  };
  return (
    <div className="inline-flex items-center gap-0.5" style={{ height: px + 2 }}>
      {[0, 1, 2, 3, 4].map(idx => {
        const filled = value >= idx + 1;
        const half = !filled && value >= idx + 0.5;
        return (
          <div key={idx} onClick={(e) => handleClick(e, idx)}
            className={`relative ${readonly ? '' : 'cursor-pointer hover:scale-125 transition-transform'}`}
            style={{ width: px, height: px }}>
            <Star size={px} className="absolute inset-0 text-slate-700" fill="currentColor"/>
            {filled && <Star size={px} className="absolute inset-0 text-amber-400" fill="currentColor"/>}
            {half && (
              <div className="absolute inset-0 overflow-hidden" style={{ width: '50%' }}>
                <Star size={px} className="text-amber-400" fill="currentColor"/>
              </div>
            )}
          </div>
        );
      })}
      {size !== 'sm' && (
        <span className="ml-1.5 text-[10px] font-mono text-slate-500 tabular-nums">{value.toFixed(1)}</span>
      )}
    </div>
  );
});

function QuickPickModal({ player, managers, myManagerId, mode, bonusAmount, onConfirm, onClose }) {
  // mode: 'mine' | 'taken'
  const [managerId, setManagerId] = useState(mode === 'mine' ? myManagerId : (managers.find(m => m.id !== myManagerId && m.id !== 'UNKNOWN')?.id || ''));
  const [cost, setCost] = useState(player.targetP || 5);
  const [bonusIds, setBonusIds] = useState([]); // 위로 보너스 받을 감독들
  const inputRef = useRef(null);

  useEffect(() => {
    setTimeout(() => inputRef.current?.focus(), 30);
  }, []);

  const toggleBonus = (id) => {
    setBonusIds(b => b.includes(id) ? b.filter(x => x !== id) : [...b, id]);
  };

  const selectAllOthers = () => {
    const others = managers
      .filter(m => m.id !== managerId && m.id !== 'UNKNOWN')
      .map(m => m.id);
    setBonusIds(others);
  };

  const handleSubmit = () => {
    const c = Math.max(0, Math.floor(Number(cost) / 5) * 5);
    onConfirm(managerId, c, bonusIds);
  };

  const handleKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); handleSubmit(); }
    else if (e.key === 'Escape') onClose();
  };

  const remainP = managers.find(m => m.id === managerId)?.remainP || 0;
  const otherManagers = managers.filter(m => m.id !== managerId && m.id !== 'UNKNOWN');

  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose} onKeyDown={handleKey}>
      <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-md anim-in" onClick={e => e.stopPropagation()}>
        <div className={`px-4 py-3 border-b border-slate-800 ${mode === 'mine' ? 'bg-cyan-950/30' : 'bg-red-950/20'}`}>
          <div className="flex items-center gap-2">
            <div className={`px-2 py-0.5 rounded text-[10px] font-bold tracking-widest ${mode === 'mine' ? 'bg-cyan-500 text-slate-950' : 'bg-red-500 text-white'}`}>
              {mode === 'mine' ? 'MY PICK' : 'TAKEN'}
            </div>
            <span className="text-xs font-mono text-slate-500">#{player.index}</span>
            <span className="text-sm font-bold text-slate-100 truncate">{player.name}</span>
          </div>
        </div>
        <div className="p-4 space-y-3">
          {mode === 'taken' && (
            <div>
              <div className="text-[10px] tracking-widest text-slate-500 uppercase mb-1">감독</div>
              <select value={managerId} onChange={e => setManagerId(e.target.value)} className="input">
                {managers.filter(m => m.id !== myManagerId && m.id !== 'UNKNOWN').map(m => (
                  <option key={m.id} value={m.id}>{m.name} ({m.remainP}P)</option>
                ))}
                <option value="UNKNOWN">(미지정)</option>
              </select>
            </div>
          )}
          <div>
            <div className="text-[10px] tracking-widest text-slate-500 uppercase mb-1 flex justify-between">
              <span>포인트 (5P 단위)</span>
              {remainP > 0 && <span className="text-slate-400">잔여 {remainP}P</span>}
            </div>
            <div className="flex gap-2">
              <input ref={inputRef} type="number" step="5" min="0" value={cost}
                onChange={e => setCost(e.target.value)} onKeyDown={handleKey}
                className="input flex-1 font-mono text-lg !py-2 text-center" />
              <button onClick={() => setCost(c => Math.max(0, Number(c) - 5))} className="btn btn-secondary">-5</button>
              <button onClick={() => setCost(c => Number(c) + 5)} className="btn btn-secondary">+5</button>
            </div>
            <div className="flex gap-1 mt-2">
              {[0, 5, 10, 20, 30, 50, 80].map(v => (
                <button key={v} onClick={() => setCost(v)}
                  className="flex-1 text-[10px] py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 font-mono">
                  {v}
                </button>
              ))}
            </div>
          </div>

          {/* 위로 보너스 분배 */}
          <div className="pt-2 border-t border-slate-800">
            <div className="flex items-center justify-between mb-1.5">
              <div className="text-[10px] tracking-widest text-slate-500 uppercase">
                위로 보너스 <span className="text-amber-400 font-mono">+{bonusAmount}P</span>
              </div>
              <div className="flex gap-1">
                <button onClick={selectAllOthers} className="text-[9px] text-slate-500 hover:text-slate-300 underline">전체</button>
                <span className="text-slate-700">|</span>
                <button onClick={() => setBonusIds([])} className="text-[9px] text-slate-500 hover:text-slate-300 underline">해제</button>
              </div>
            </div>
            <div className="text-[9px] text-slate-600 mb-1">동률 후 선택받지 못한 감독을 체크 →</div>
            <div className="grid grid-cols-2 gap-1">
              {otherManagers.map(m => {
                const on = bonusIds.includes(m.id);
                return (
                  <button key={m.id} onClick={() => toggleBonus(m.id)}
                    className={`text-[10px] px-2 py-1 rounded border flex items-center gap-1.5 transition-colors ${on ? 'bg-amber-500/20 border-amber-500/60 text-amber-300' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>

          <button onClick={onClose} className="btn btn-secondary">취소 (Esc)</button>
          <button onClick={handleSubmit} className={`btn ${mode === 'mine' ? 'btn-primary' : 'btn-danger'}`}>
            확정 (Enter)
          </button>
        </div>
      </div>
    </div>
  );
}

              if (!showHit && !showPit) return null;
              return (
                <div className="mt-1 flex items-center gap-1.5 flex-wrap text-[9px] font-mono">
                  {ds.isCareer && <span className="text-amber-400 font-bold">통산</span>}
                  {!ds.isCareer && ds.season && <span className="text-slate-500">{ds.season}</span>}
                  {showHit && (
                    <span className="text-slate-300">
                      {ds.HR ? <><span className="text-orange-400">{ds.HR}</span>HR </> : ''}
                      {ds.AVG ? <span className="text-orange-300">{fmtRate(ds.AVG)}</span> : ''}
                    </span>
                  )}
                  {showPit && (
                    <span className="text-slate-300">
                      {ds.ERA ? <><span className="text-sky-400">{Number(ds.ERA).toFixed(2)}</span> </> : ''}
                      {ds.K ? <><span className="text-sky-300">{ds.K}</span>K</> : ''}
                    </span>
                  )}
                  {(player.stats || []).length > 1 && (
                    <span className="text-slate-600 ml-auto">+{(player.stats||[]).length - 1}</span>
                  )}
                </div>
              );
            })()}
            {!compact && player.tags && player.tags.length > 0 && (
              <div className="flex flex-wrap gap-0.5 mt-1">
                {player.tags.slice(0, 3).map(t => (
                  <span key={t} className="text-[8px] px-1 bg-slate-800 text-slate-400 rounded">{t}</span>
                ))}
              </div>
            )}
            {!compact && player.intro && (
              <div className="text-[10px] text-slate-500 mt-1 line-clamp-1 italic leading-snug" title={player.intro}>
                {player.intro.split('\n').filter(l => l.trim()).slice(0, 1).join('')}
              </div>
            )}
            {!compact && player.memo && (
              <div className="text-[10px] text-purple-400/80 mt-0.5 line-clamp-1 leading-snug flex items-center gap-1" title={player.memo}>
                <span className="text-[9px]">📝</span>
                <span className="truncate">{player.memo.split('\n').filter(l => l.trim()).slice(0, 1).join('')}</span>
              </div>
            )}
          </div>
        </div>
        {mode === 'live' && (
          <div className="flex gap-1 mt-1.5 pt-1.5 border-t border-slate-800">
            {isTaken || isMine ? (
              <button onClick={(e) => { e.stopPropagation(); onUnmark(player); }}
                className="flex-1 text-[10px] py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center gap-1">
                <Undo size={9}/> 되돌리기
              </button>
            ) : (
              <>
                <button onClick={(e) => { e.stopPropagation(); onMarkMine(player); }}
                  className="flex-1 text-[10px] py-0.5 rounded bg-cyan-600 hover:bg-cyan-500 text-white font-bold tracking-wider">
                  내 픽
                </button>
                <button onClick={(e) => { e.stopPropagation(); onMarkTaken(player); }}
                  className="flex-1 text-[10px] py-0.5 rounded bg-red-600/70 hover:bg-red-600 text-white font-bold tracking-wider">
                  뽑힘
                </button>
              </>
            )}
          </div>
        )}
        {mode === 'prep' && (
          <button onClick={(e) => { e.stopPropagation(); onSelect(player); }}
            className={`absolute bottom-1.5 right-1.5 w-3.5 h-3.5 rounded border ${selected ? 'bg-amber-400 border-amber-400' : 'border-slate-600 bg-slate-900'} flex items-center justify-center`}>
            {selected && <Check size={10} className="text-slate-900"/>}
          </button>
        )}
      </div>
    </div>
  );
});

// ============================================================
// FORM HELPERS
// ============================================================
function Sec({ title, hint, children }) {
  return (
    <div>
      <div className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2 flex items-center gap-2">
        {title}
        {hint && <span className="text-[9px] normal-case font-normal text-slate-500">— {hint}</span>}
      </div>
      <div className="space-y-2">{children}</div>
    </div>
  );
}

function Fld({ label, hint, children }) {
  return (
    <div>
      <label className="text-[11px] text-slate-400 block mb-0.5">
        {label}
        {hint && <span className="text-slate-600 ml-1">({hint})</span>}
      </label>
      {children}
    </div>
  );
}

// ============================================================
// PLAYER EDIT MODAL
// ============================================================
function PlayerEditModal({ player, allPlayers, settings, onSave, onDelete, onClose }) {
  const [form, setForm] = useState(() => player
    ? { ...player, positions: player.positions||[], subPositions: player.subPositions||[], stats: Array.isArray(player.stats) ? player.stats : [], region: player.region || '' }
    : {
      id: genId(), index: '', name: '', positions: [], subPositions: [], section: 'S3/4',
      region: '',
      intro: '', rating: 0, targetP: 0, memo: '', tags: [], favorite: false, replacements: [],
      stats: []
    });
  const [tagInput, setTagInput] = useState('');
  const [replSearch, setReplSearch] = useState('');
  const [lightboxUrl, setLightboxUrl] = useState(null);

  const allPos = [...(form.positions||[]), ...(form.subPositions||[])];
  const isHit = allPos.some(p => p !== 'P');
  const isPit = allPos.includes('P');
  const up = (k, v) => setForm(f => ({ ...f, [k]: v }));

  // 포지션 토글: 클릭 = 주포지션 추가/제거 ↔ 부포지션, Shift-클릭 = 부포지션 직접 토글
  const togglePos = (pv, asSub = false) => {
    setForm(f => {
      const main = new Set(f.positions || []);
      const sub = new Set(f.subPositions || []);
      if (asSub) {
        if (sub.has(pv)) sub.delete(pv);
        else { sub.add(pv); main.delete(pv); }
      } else {
        if (main.has(pv)) main.delete(pv);
        else { main.add(pv); sub.delete(pv); }
      }
      return { ...f, positions: [...main], subPositions: [...sub] };
    });
  };

  const addTag = () => { if (!tagInput.trim()) return; up('tags', [...new Set([...(form.tags||[]), tagInput.trim()])]); setTagInput(''); };
  const rmTag = (t) => up('tags', (form.tags||[]).filter(x => x !== t));
  const addRepl = (p) => { if ((form.replacements||[]).includes(p.id)) return; up('replacements', [...(form.replacements||[]), p.id]); setReplSearch(''); };
  const rmRepl = (id) => up('replacements', (form.replacements||[]).filter(x => x !== id));

  const replOpts = useMemo(() => {
    if (!replSearch) return [];
    return allPlayers.filter(p => p.id !== form.id && !(form.replacements||[]).includes(p.id))
      .filter(p => matchSearch(p, replSearch))
      .slice(0, 8);
  }, [replSearch, allPlayers, form.id, form.replacements]);

  const handleSave = useCallback(() => onSave(form), [form, onSave]);
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); handleSave(); } };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [handleSave, onClose]);

  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto scrollbar anim-in" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-slate-900 border-b border-slate-800 px-5 py-3 flex items-center justify-between z-10">
          <div className="flex items-center gap-3">
            <PlayerPhoto player={form} settings={settings} size={36}/>
            <div>
              <div className="text-[10px] font-mono text-slate-500">#{form.index || '?'}</div>
              <h2 className="text-base font-bold text-slate-100 leading-tight">{form.name || (player ? '선수 편집' : '새 선수')}</h2>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={handleSave} className="btn btn-primary text-xs">저장 (Ctrl+S)</button>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1"><X size={18}/></button>
          </div>
        </div>
        <div className="p-5 space-y-4">
          <Sec title="기본 정보">
            <div className="flex gap-3">
              {/* 좌측: 큰 프로필 사진 */}
              <div className="flex-shrink-0 flex flex-col items-center gap-1">
                <button
                  onClick={() => {
                    const url = getPhoto(form, settings);
                    if (url) setLightboxUrl(url);
                  }}
                  className="block rounded-lg overflow-hidden border border-slate-700 hover:border-slate-500 transition-colors cursor-zoom-in"
                  title="클릭하여 크게 보기">
                  <PlayerPhoto player={form} settings={settings} size={140}/>
                </button>
                {form.index && getPhoto(form, settings) && (
                  <span className="text-[9px] text-slate-500">클릭 = 확대</span>
                )}
              </div>
              {/* 우측: 입력 필드들 */}
              <div className="flex-1 space-y-2">
                <div className="grid grid-cols-2 gap-2">
                  <Fld label="인덱스 #" hint="프로필 사진 자동 갱신">
                    <input type="text" value={form.index} onChange={e => up('index', e.target.value)} className="input"/>
                  </Fld>
                  <Fld label="이름">
                    <input type="text" value={form.name} onChange={e => up('name', e.target.value)} className="input"/>
                  </Fld>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <Fld label="섹션">
                    <select value={form.section} onChange={e => up('section', e.target.value)} className="input">
                      <option value="S1">S1</option>
                      <option value="S2">S2</option>
                      <option value="S3/4">S3/4 (랜덤 배정 풀)</option>
                      <option value="S3">S3 (확정)</option>
                      <option value="S4">S4 (확정)</option>
                    </select>
                  </Fld>
                  <Fld label="지역" hint="수동 선택 · 다시 클릭하면 해제">
                    <div className="flex gap-1">
                      {REGIONS.map(r => {
                        const active = form.region === r.value;
                        return (
                          <button key={r.value} type="button"
                            onClick={() => up('region', active ? '' : r.value)}
                            className={`flex-1 px-2 py-1.5 rounded text-xs font-bold border transition-all flex items-center justify-center gap-1 ${
                              active ? `${r.bg} ${r.color} ${r.border} ring-1 ring-current`
                              : 'bg-slate-900 text-slate-500 border-slate-800 hover:border-slate-600'
                            }`}>
                            <span>{r.flag}</span>
                            <span>{r.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </Fld>
                </div>
              </div>
            </div>
            <Fld label="포지션" hint="클릭 = 주포지션 / Shift+클릭 = 부포지션 / 다시 클릭 = 해제">
              <div className="space-y-2">
                {POS_GROUPS.map(grp => (
                  <div key={grp.value} className="flex items-center gap-2">
                    <span className="text-[10px] tracking-widest text-slate-500 w-8 flex-shrink-0">{grp.label}</span>
                    <div className="flex flex-wrap gap-1 flex-1">
                      {grp.members.map(pv => {
                        const p = POS_BY_VALUE[pv];
                        const isMain = (form.positions||[]).includes(pv);
                        const isSub = (form.subPositions||[]).includes(pv);
                        return (
                          <button
                            key={pv}
                            onClick={(e) => togglePos(pv, e.shiftKey)}
                            className={`px-2.5 py-1 rounded text-xs font-mono font-bold border-2 transition-all ${
                              isMain ? `${p.bg} ${p.color} ring-1 ring-current border-current`
                              : isSub ? `${p.bg} ${p.color} border-dashed border-current/60`
                              : 'bg-slate-900 text-slate-500 border-slate-800 hover:border-slate-600 hover:text-slate-300'
                            }`}
                            title={`${p.label} ${isMain ? '(주)' : isSub ? '(부)' : ''}`}>
                            {p.short}
                            {isMain && <span className="ml-1 text-[8px]">●</span>}
                            {isSub && <span className="ml-1 text-[8px]">○</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
                {(form.positions?.length || 0) === 0 && (form.subPositions?.length || 0) === 0 && (
                  <div className="text-[10px] text-slate-600">포지션을 선택하지 않으면 미정으로 처리됩니다</div>
                )}
              </div>
            </Fld>
            <Fld label="자기소개">
              <textarea value={form.intro} onChange={e => up('intro', e.target.value)}
                className="input min-h-[140px] resize-y leading-relaxed"
                style={{ fontSize: '13px' }}
                rows={6}/>
            </Fld>
          </Sec>

          <Sec title="평가">
            <div className="grid grid-cols-2 gap-2">
              <Fld label="별점 (0.5 단위)">
                <div className="h-9 flex items-center">
                  <StarRating value={form.rating || 0} size="lg" onChange={v => up('rating', v)}/>
                </div>
              </Fld>
              <Fld label="입찰 희망 P">
                <input type="number" step="5" min="0" value={form.targetP || 0} onChange={e => up('targetP', Number(e.target.value) || 0)} className="input"/>
              </Fld>
            </div>
            <Fld label="메모">
              <textarea value={form.memo} onChange={e => up('memo', e.target.value)}
                className="input min-h-[100px] resize-y leading-relaxed"
                style={{ fontSize: '13px' }}
                rows={4}/>
            </Fld>
            <Fld label="태그">
              <div className="flex flex-wrap gap-1 mb-1.5 min-h-[20px]">
                {(form.tags||[]).map(t => (
                  <span key={t} className="inline-flex items-center gap-1 text-xs px-2 py-0.5 bg-slate-800 text-slate-300 rounded border border-slate-700">
                    {t}<button onClick={() => rmTag(t)} className="hover:text-red-400"><X size={10}/></button>
                  </span>
                ))}
              </div>
              <div className="flex gap-1">
                <input type="text" value={tagInput} onChange={e => setTagInput(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } }}
                  className="input flex-1" placeholder="태그 + Enter"/>
                <button onClick={addTag} className="btn btn-secondary">추가</button>
              </div>
            </Fld>
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked={form.favorite || false} onChange={e => up('favorite', e.target.checked)} className="w-4 h-4 accent-rose-400"/>
              <span className="text-sm text-slate-300">즐겨찾기</span>
            </label>
          </Sec>

          <Sec title="기록" hint="시즌별·통산 기록을 여러 개 보관 가능 · ↑↓로 순서 변경">
            <div className="space-y-2">
              {(form.stats || []).map((s, idx) => {
                const updateStat = (patch) => {
                  setForm(f => ({ ...f, stats: f.stats.map((x, i) => i === idx ? { ...x, ...patch } : x) }));
                };
                const updateField = (k, v) => updateStat({ [k]: v });
                const removeStat = () => {
                  if (!confirm('이 기록을 삭제하시겠습니까?')) return;
                  setForm(f => ({ ...f, stats: f.stats.filter((_, i) => i !== idx) }));
                };
                const moveStat = (dir) => {
                  setForm(f => {
                    const arr = [...f.stats];
                    const newIdx = idx + dir;
                    if (newIdx < 0 || newIdx >= arr.length) return f;
                    [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
                    return { ...f, stats: arr };
                  });
                };
                const totalStats = (form.stats || []).length;
                const isFirst = idx === 0;
                const isLast = idx === totalStats - 1;
                const hasHit = hasHitStats(s);
                const hasPit = hasPitStats(s);
                const showHit = hasHit || (isHit && !hasPit) || (!hasHit && !hasPit);
                const showPit = hasPit || (isPit && !hasHit) || (!hasHit && !hasPit);

                return (
                  <div key={s.id || idx} className={`border rounded-lg p-2.5 ${s.isCareer ? 'bg-amber-950/20 border-amber-700/40' : 'bg-slate-950/40 border-slate-800'}`}>
                    {/* 헤더: 순서 변경 + 시즌명 + 통산 토글 + 삭제 */}
                    <div className="flex items-center gap-1.5 mb-2">
                      {/* 순서 변경 버튼 */}
                      <div className="flex flex-col flex-shrink-0">
                        <button onClick={() => moveStat(-1)} disabled={isFirst}
                          className={`text-[10px] leading-none px-1 py-0.5 rounded-t border border-slate-700 ${isFirst ? 'text-slate-700 cursor-not-allowed' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                          title="위로 이동">↑</button>
                        <button onClick={() => moveStat(1)} disabled={isLast}
                          className={`text-[10px] leading-none px-1 py-0.5 rounded-b border border-t-0 border-slate-700 ${isLast ? 'text-slate-700 cursor-not-allowed' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                          title="아래로 이동">↓</button>
                      </div>
                      <span className="text-[10px] font-mono text-slate-600 w-5 text-center flex-shrink-0">{idx + 1}</span>
                      <input type="text" value={s.season || ''}
                        onChange={e => updateField('season', e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded px-2 py-0.5 text-xs text-slate-100 font-medium flex-1 outline-none focus:border-slate-500"
                        placeholder="시즌 이름 (예: 2025 Spring, 2024 Fall)"/>
                      <label className="flex items-center gap-1 cursor-pointer text-[10px] text-slate-400 hover:text-amber-300">
                        <input type="checkbox" checked={s.isCareer || false}
                          onChange={e => updateField('isCareer', e.target.checked)}
                          className="w-3 h-3 accent-amber-400"/>
                        <span className={s.isCareer ? 'text-amber-400 font-bold' : ''}>통산</span>
                      </label>
                      <button onClick={removeStat} className="text-slate-500 hover:text-red-400 p-1">
                        <Trash size={11}/>
                      </button>
                    </div>

                    {/* 타격 스탯 */}
                    {showHit && (
                      <div className="mb-1.5">
                        <div className="text-[9px] tracking-widest text-orange-400/80 uppercase mb-1">타격</div>
                        <div className="grid grid-cols-6 gap-1">
                          {HIT_FIELDS.map(f => (
                            <div key={f.key}>
                              <label className="text-[9px] text-slate-500 block">{f.label}</label>
                              <input type="number" step={f.step}
                                value={s[f.key] || ''}
                                onChange={e => updateField(f.key, e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-slate-100 font-mono outline-none focus:border-slate-500"/>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* 투수 스탯 */}
                    {showPit && (
                      <div>
                        <div className="text-[9px] tracking-widest text-sky-400/80 uppercase mb-1">투수</div>
                        <div className="grid grid-cols-6 gap-1">
                          {PIT_FIELDS.map(f => (
                            <div key={f.key}>
                              <label className="text-[9px] text-slate-500 block">{f.label}</label>
                              <input type="number" step={f.step}
                                value={s[f.key] || ''}
                                onChange={e => updateField(f.key, e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-slate-100 font-mono outline-none focus:border-slate-500"/>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* 메모 */}
                    <input type="text" value={s.note || ''}
                      onChange={e => updateField('note', e.target.value)}
                      className="w-full mt-1.5 bg-slate-900 border border-slate-700 rounded px-2 py-0.5 text-[11px] text-slate-300 outline-none focus:border-slate-500"
                      placeholder="기록 메모 (예: 부상 결장, MVP, 우승 등)"/>
                  </div>
                );
              })}

              {/* 추가 버튼 */}
              <div className="flex gap-1">
                <button onClick={() => setForm(f => ({ ...f, stats: [...(f.stats || []), newSeasonEntry('')] }))}
                  className="flex-1 btn btn-secondary !text-xs !py-1.5 flex items-center justify-center gap-1">
                  <Plus size={11}/> 시즌 추가
                </button>
                <button onClick={() => setForm(f => ({ ...f, stats: [...(f.stats || []), { ...newSeasonEntry('통산'), isCareer: true }] }))}
                  className="flex-1 text-xs py-1.5 rounded bg-amber-900/40 hover:bg-amber-900/60 text-amber-300 border border-amber-700/40 font-medium flex items-center justify-center gap-1">
                  <Trophy size={11}/> 통산 추가
                </button>
              </div>

              {(!form.stats || form.stats.length === 0) && (
                <div className="text-[10px] text-slate-500 text-center py-3">
                  아직 기록이 없습니다. 시즌별 또는 통산 기록을 추가하세요.
                </div>
              )}
            </div>
          </Sec>

          <Sec title="대체 선수" hint="뽑히면 우선 추천될 선수들">
            <div className="space-y-1 mb-1">
              {(form.replacements||[]).map((id, idx) => {
                const p = allPlayers.find(x => x.id === id);
                if (!p) return null;
                return (
                  <div key={id} className="flex items-center gap-2 bg-slate-800/60 rounded px-2 py-1">
                    <span className="text-xs font-mono text-slate-500 w-4">{idx + 1}</span>
                    <span className="text-xs font-mono text-slate-500">#{p.index}</span>
                    <span className="text-sm text-slate-200 flex-1 truncate">{p.name}</span>
                    <StarRating value={p.rating||0} size="sm" readonly/>
                    <button onClick={() => rmRepl(id)} className="text-slate-500 hover:text-red-400"><X size={12}/></button>
                  </div>
                );
              })}
            </div>
            <div className="relative">
              <input type="text" value={replSearch} onChange={e => setReplSearch(e.target.value)}
                className="input" placeholder="이름/인덱스로 검색"/>
              {replOpts.length > 0 && (
                <div className="absolute top-full mt-1 left-0 right-0 bg-slate-800 border border-slate-700 rounded-lg max-h-48 overflow-y-auto scrollbar z-20">
                  {replOpts.map(p => (

// REPLACEMENT PANEL
// ============================================================
function ReplPanel({ trigger, allPlayers, statusMap, settings, myManager, best12, onClose, onPlayerClick }) {
  const [mode, setMode] = useState('balanced');
  if (!trigger) return null;
  const player = allPlayers.find(p => p.id === trigger.playerId);
  if (!player) return null;
  // 내 로스터 보완 보너스 계산용 set
  const emptySlotPositions = React.useMemo(() => {
    const s = new Set();
    if (Array.isArray(best12)) {
      best12.forEach(slot => {
        if (!Array.isArray(slot.candidates) || slot.candidates.length === 0) {
          (slot.positions || []).forEach(p => s.add(p));
        }
      });
    }
    return s;
  }, [best12]);
  const overstuffedPositions = React.useMemo(() => {
    const s = new Set();
    if (myManager && Array.isArray(myManager.picks)) {
      const posCount = {};
      myManager.picks.forEach(pk => {
        const ply = allPlayers.find(x => x.id === pk.playerId);
        if (!ply) return;
        (ply.positions || []).forEach(pos => { posCount[pos] = (posCount[pos]||0)+1; });
      });
      Object.entries(posCount).forEach(([pos, n]) => { if (n >= 2) s.add(pos); });
    }
    return s;
  }, [myManager, allPlayers]);
  const { manual, auto } = findReplacements(player, allPlayers, statusMap, 7, { emptySlotPositions, overstuffedPositions, mode });

  return (
    <div className="fixed right-3 top-20 bottom-3 w-80 bg-slate-900/95 backdrop-blur border border-amber-500/40 rounded-xl shadow-2xl shadow-amber-500/10 z-40 flex flex-col slide-in-r">
      <div className="px-3 py-2.5 border-b border-slate-800 flex items-center justify-between bg-gradient-to-r from-amber-950/40 to-transparent">
        <div className="min-w-0">
          <div className="text-[9px] tracking-[0.2em] text-amber-400 font-bold uppercase flex items-center gap-1">
            <Zap size={9}/> 대체 추천
          </div>
          <div className="text-sm text-slate-100 font-bold truncate flex items-center gap-1.5">
            <span className="text-xs font-mono text-slate-500">#{player.index}</span>
            {player.name}
          </div>
        </div>
        <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1"><X size={14}/></button>
      </div>
      <div className="flex-1 overflow-y-auto p-2 space-y-2 scrollbar">
        {manual.length > 0 && (
          <div>
            <div className="text-[9px] tracking-widest text-cyan-400 font-bold uppercase mb-1 flex items-center gap-1 px-1">
              <Target size={9}/> 수동 지정
            </div>
            <div className="space-y-1">
              {manual.map(p => <ReplCard key={p.id} player={p} settings={settings} onClick={() => onPlayerClick(p)}/>)}
            </div>
          </div>
        )}
        {auto.length > 0 && (
          <div>
            <div className="flex items-center justify-between mb-1 px-1">
              <div className="text-[9px] tracking-widest text-slate-400 font-bold uppercase">자동 추천</div>
              <div className="flex items-center gap-0.5">
                {[
                  { key: 'balanced', label: '균형' },
                  { key: 'position', label: '포지션' },
                  { key: 'roster', label: '로스터' },
                ].map(m => (
                  <button key={m.key} onClick={() => setMode(m.key)}
                    className={`text-[9px] px-1.5 py-0.5 rounded font-bold transition ` +
                      (mode === m.key
                        ? 'bg-emerald-600/30 text-emerald-200 border border-emerald-600/50'
                        : 'bg-slate-800/50 text-slate-500 border border-transparent hover:text-slate-300')}>
                    {m.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="space-y-1">
              {auto.map(({player, score, parts}) => <ReplCard key={player.id} player={player} settings={settings} simScore={score} simParts={parts} onClick={() => onPlayerClick(player)}/>)}
            </div>
          </div>
        )}
        {manual.length === 0 && auto.length === 0 && (
          <div className="text-center text-slate-500 text-sm py-8">추천할 선수가 없습니다</div>
        )}
      </div>
    </div>
  );
}

function ReplCard({ player, settings, onClick, simScore, simParts }) {
  const mainPos = player.positions || [];
  // 점수 분해 (자동 추천 카드에만 표시)
  const hasBreakdown = typeof simScore === 'number' && simParts;
  const breakdownItems = hasBreakdown ? [
    { key: '포', val: simParts.pos, color: 'text-cyan-400' },
    { key: '별', val: simParts.rating, color: 'text-amber-400' },
    { key: '타', val: simParts.hit, color: 'text-emerald-400' },
    { key: '투', val: simParts.pit, color: 'text-rose-400' },
    { key: '태', val: simParts.tags, color: 'text-purple-400' },
    { key: 'P', val: simParts.targetP, color: 'text-yellow-400' },
    { key: '섹', val: simParts.section, color: 'text-slate-400' },
    { key: '로', val: simParts.roster, color: (simParts.roster||0) >= 0 ? 'text-pink-400' : 'text-red-500' },
  ].filter(x => Math.abs(x.val || 0) > 0.5) : [];
  return (
    <button onClick={onClick} className="w-full text-left bg-slate-800/60 hover:bg-slate-800 rounded-lg p-1.5 flex items-center gap-2">
      <PlayerPhoto player={player} settings={settings} size={32}/>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1 flex-wrap">
          <span className="text-[9px] font-mono text-slate-500">#{player.index}</span>
          {mainPos.length > 0 ? mainPos.slice(0,3).map(pv => {
            const p = POS_BY_VALUE[pv];
            return p ? <span key={pv} className={`text-[9px] font-mono font-bold ${p.color}`}>{p.short}</span> : null;
          }) : <span className="text-[9px] font-mono text-slate-600">?</span>}
          <span className="text-[8px] text-slate-500">{player.section}</span>
          {hasBreakdown && <span className="text-[9px] font-mono font-bold text-emerald-300 ml-auto">{Math.round(simScore)}</span>}
        </div>
        <div className="text-xs text-slate-100 font-semibold truncate">{player.name}</div>
        <div className="flex items-center justify-between gap-1">
          <StarRating value={player.rating||0} size="sm" readonly/>
          {player.targetP > 0 && <span className="text-[9px] font-mono text-emerald-400 font-bold">{player.targetP}P</span>}
        </div>
        {hasBreakdown && breakdownItems.length > 0 && (
          <div className="flex items-center gap-1 mt-0.5 flex-wrap">
            {breakdownItems.map(b => (
              <span key={b.key} className={`text-[8.5px] font-mono ${b.color}`}>{b.key}{b.val >= 0 ? '+' : ''}{Math.round(b.val)}</span>
            ))}
          </div>
        )}
      </div>
    </button>
  );
}
