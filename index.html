// DRAFT BOARD MODAL — 전체 감독 × 라운드 그리드
// ============================================================
function DraftBoardModal({ managers, allPlayers, log, settings, onClose, onPlayerClick, onChangePickRound, onDeletePick }) {
  const [pickEdit, setPickEdit] = useState(null); // {mgrId, pickIdx, currentRound}

  // 감독별 보너스 합산
  const bonusByMgr = useMemo(() => {
    const m = {};
    managers.forEach(mg => m[mg.id] = 0);
    log.forEach(e => {
      if (e.type === 'pick' && Array.isArray(e.bonusIds)) {
        e.bonusIds.forEach(id => {
          if (m[id] !== undefined) m[id] += (e.bonusAmount || 0);
        });
      }
    });
    return m;
  }, [managers, log]);

  // 통계
  const stats = useMemo(() => {
    const real = managers.filter(m => m.id !== 'UNKNOWN');
    const totalPicks = real.reduce((s, m) => s + (m.picks||[]).length, 0);
    const totalSpent = real.reduce((s, m) => s + (m.picks||[]).reduce((a, p) => a + (p.cost||0), 0), 0);
    return { totalPicks, totalSpent, totalRemain: real.reduce((s,m) => s + m.remainP, 0) };
  }, [managers]);

  // 감독별 라운드→픽 매핑: 명시적 round 있는 픽이 우선, 나머지는 빈 라운드에 순서대로
  const getPickMap = (manager) => {
    const picks = manager.picks || [];
    const map = {}; // round → { pick, idx }
    const usedRounds = new Set();
    const remainingPickIdxs = [];

    picks.forEach((p, i) => {
      if (p.round && ROUND_LABELS.includes(p.round)) {
        map[p.round] = { pick: p, idx: i };
        usedRounds.add(p.round);
      } else {
        remainingPickIdxs.push(i);
      }
    });

    let ri = 0;
    for (const r of ROUND_LABELS) {
      if (!usedRounds.has(r) && remainingPickIdxs[ri] !== undefined) {
        map[r] = { pick: picks[remainingPickIdxs[ri]], idx: remainingPickIdxs[ri] };
        ri++;
      }
    }
    return map;
  };

  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col p-4" onClick={onClose}>
      <div className="bg-slate-900 border border-slate-700 rounded-xl flex-1 flex flex-col overflow-hidden anim-in" onClick={e => e.stopPropagation()}>
        {/* 헤더 */}
        <div className="px-5 py-3 border-b border-slate-800 flex items-center justify-between flex-shrink-0">
          <div className="flex items-center gap-3">
            <Trophy size={18} className="text-amber-400"/>
            <h2 className="text-lg font-bold">드래프트 보드</h2>
            <span className="text-xs text-slate-500">
              총 {stats.totalPicks}픽 · 소비 {stats.totalSpent}P · 잔여 {stats.totalRemain}P
            </span>
          </div>
          <div className="flex items-center gap-2">
            <span className="text-[10px] text-slate-500">ESC / B 키로 닫기</span>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1"><X size={18}/></button>
          </div>
        </div>

        {/* 보드 */}
        <div className="flex-1 overflow-auto scrollbar p-2">
          <table className="border-collapse" style={{ minWidth: '100%' }}>
            <thead className="sticky top-0 z-10 bg-slate-900">
              <tr>
                <th className="sticky left-0 z-20 bg-slate-900 p-2 border border-slate-800 w-10 text-center text-xs text-slate-500 font-bold">#</th>
                <th className="sticky left-10 z-20 bg-slate-900 p-2 border border-slate-800 text-left text-xs text-slate-300 font-bold" style={{ minWidth: '220px' }}>감독</th>
                <th className="p-2 border border-slate-800 text-center text-[10px] text-slate-400 font-bold tracking-wider uppercase" style={{ width: '60px' }}>Start</th>
                <th className="p-2 border border-slate-800 text-center text-[10px] text-slate-400 font-bold tracking-wider uppercase" style={{ width: '60px' }}>Bonus</th>
                <th className="p-2 border border-slate-800 text-center text-[10px] text-slate-400 font-bold tracking-wider uppercase" style={{ width: '60px' }}>Left</th>
                <th className="p-2 border border-slate-800 text-center text-[10px] text-slate-400 font-bold tracking-wider uppercase" style={{ width: '55px' }}>Pick</th>
                {ROUND_LABELS.map(r => {
                  const c = ROUND_COLORS[r];
                  return (
                    <th key={r} className={`p-2 border border-slate-800 text-center text-sm font-mono font-bold tracking-wider ${c.head}`} style={{ minWidth: '170px' }}>
                      {r}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {managers.filter(m => m.id !== 'UNKNOWN').map((m, idx) => {
                const isMe = m.id === settings.myManagerId;
                const picks = m.picks || [];
                const bonus = bonusByMgr[m.id] || 0;
                const pickMap = getPickMap(m);
                return (
                  <tr key={m.id} className={isMe ? 'bg-cyan-950/20' : ''}>
                    <td className={`sticky left-0 z-10 ${isMe ? 'bg-cyan-950/40' : 'bg-slate-900'} p-2 border border-slate-800 text-center text-sm font-bold ${isMe ? 'text-cyan-400' : 'text-slate-400'}`}>
                      {String.fromCharCode(65 + idx)}
                    </td>
                    <td className={`sticky left-10 z-10 ${isMe ? 'bg-cyan-950/40' : 'bg-slate-900'} p-2 border border-slate-800`}>
                      <div className="flex items-center gap-2">
                        <PlayerPhoto player={m} settings={settings} size={44}/>
                        <div className="flex-1 min-w-0">
                          <div className={`text-sm font-bold truncate ${isMe ? 'text-cyan-300' : 'text-slate-100'}`}>
                            {m.name}
                            {isMe && <span className="ml-1.5 text-[9px] bg-cyan-500 text-slate-950 px-1.5 py-0.5 rounded font-black">ME</span>}
                          </div>
                          {m.index && <div className="text-[10px] font-mono text-slate-500">#{m.index}</div>}
                        </div>
                      </div>
                    </td>
                    <td className="p-2 border border-slate-800 text-center font-mono text-slate-300 text-sm">{m.startP || 150}</td>
                    <td className={`p-2 border border-slate-800 text-center font-mono text-sm ${bonus > 0 ? 'text-amber-400 font-bold' : 'text-slate-600'}`}>
                      {bonus || '0'}
                    </td>
                    <td className={`p-2 border border-slate-800 text-center font-mono font-bold text-base ${m.remainP < 30 ? 'text-red-400' : 'text-emerald-400'}`}>
                      {m.remainP}
                    </td>
                    <td className="p-2 border border-slate-800 text-center font-mono text-slate-300 text-sm">
                      <span className="font-bold">{picks.length}</span><span className="text-slate-600">/11</span>
                    </td>
                    {ROUND_LABELS.map((r) => {
                      const slot = pickMap[r];
                      const c = ROUND_COLORS[r];
                      if (!slot) {
                        return (
                          <td key={r} className={`p-1.5 border border-slate-800 ${c.bg} opacity-25 text-center`} style={{ minHeight: '64px' }}>
                            <span className="text-[10px] text-slate-600">─</span>
                          </td>
                        );
                      }
                      const { pick, idx: pickIdx } = slot;
                      const p = allPlayers.find(x => x.id === pick.playerId);
                      if (!p) return <td key={r} className="p-1 border border-slate-800"></td>;
                      const isEditing = pickEdit && pickEdit.mgrId === m.id && pickEdit.pickIdx === pickIdx;
                      const mainPos = p.positions || [];
                      const subPos = p.subPositions || [];
                      const secColor = SECTION_COLORS[p.section] || SECTION_COLORS['S3/4'];
                      return (
                        <td key={r} className={`p-1.5 border border-slate-800 ${c.bg} relative group ${isEditing ? 'ring-2 ring-amber-400 z-20' : ''}`}>
                          <div className="flex gap-2 cursor-pointer hover:brightness-150" onClick={() => onPlayerClick(p)}>
                            <PlayerPhoto player={p} settings={settings} size={42}/>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-1 mb-0.5">
                                {p.index && <span className="text-[9px] font-mono text-slate-500">#{p.index}</span>}
                                <span className={`text-[8px] font-mono px-1 rounded ${secColor.text} ${secColor.bg}`}>{p.section}</span>
                                <span className={`text-xs font-mono font-black ml-auto ${c.text}`}>{pick.cost || 0}<span className="text-[10px]">P</span></span>
                              </div>
                              <div className="text-[13px] font-bold text-slate-100 truncate leading-tight" title={p.name}>
                                {p.name}
                              </div>
                              <div className="flex items-center gap-1 mt-1 flex-wrap">
                                {mainPos.slice(0, 3).map(pv => {
                                  const po = POS_BY_VALUE[pv];
                                  return po ? <span key={pv} className={`text-[10px] font-mono font-bold px-1 rounded ${po.color} bg-slate-900/60`}>{po.short}</span> : null;
                                })}
                                {subPos.length > 0 && (
                                  <>
                                    <span className="text-[9px] text-slate-600 font-mono">+</span>
                                    {subPos.slice(0, 2).map(pv => {
                                      const po = POS_BY_VALUE[pv];
                                      return po ? <span key={pv} className={`text-[10px] font-mono font-bold px-0.5 rounded ${po.color} opacity-70 border border-dashed border-current/40`}>{po.short}</span> : null;
                                    })}
                                  </>
                                )}
                                {(p.rating || 0) > 0 && (
                                  <span className="text-[10px] text-amber-400 font-bold ml-auto flex items-center gap-0.5">
                                    ★ {p.rating}
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>
                          {/* 호버 시 편집 버튼 */}
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              setPickEdit(isEditing ? null : { mgrId: m.id, pickIdx, currentRound: r });
                            }}
                            className={`absolute top-1 right-1 w-5 h-5 rounded text-xs flex items-center justify-center ${isEditing ? 'bg-amber-500 text-slate-950' : 'opacity-0 group-hover:opacity-100 bg-slate-900/80 hover:bg-slate-800 text-slate-300'}`}
                            title="픽 편집 (라운드 변경/삭제)">
                            ⋯
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* 픽 편집 팝업 (보드 하단 도크) */}
        {pickEdit && (() => {
          const m = managers.find(x => x.id === pickEdit.mgrId);
          if (!m) return null;
          const pk = m.picks[pickEdit.pickIdx];
          if (!pk) return null;
          const player = allPlayers.find(x => x.id === pk.playerId);
          const usedRounds = new Set(
            Object.entries(getPickMap(m))
              .filter(([r, slot]) => slot.idx !== pickEdit.pickIdx)
              .map(([r]) => r)
          );

          return (
            <div className="border-t-2 border-amber-500 bg-slate-950 px-4 py-3 flex-shrink-0">
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 flex-shrink-0">
                  {player && <PlayerPhoto player={player} settings={settings} size={32}/>}
                  <div>
                    <div className="text-[10px] text-slate-500">{m.name} · 픽 편집</div>
                    <div className="text-sm font-bold text-slate-100">{player ? player.name : '?'}</div>
                  </div>
                </div>
                <div className="flex-1">
                  <div className="text-[10px] tracking-widest text-slate-500 uppercase mb-1.5">라운드 변경</div>
                  <div className="grid grid-cols-11 gap-1">
                    {ROUND_LABELS.map(r => {
                      const c = ROUND_COLORS[r];
                      const isCurrent = r === pickEdit.currentRound;
                      const isUsed = usedRounds.has(r);
                      return (
                        <button key={r}
                          onClick={() => {
                            if (!isCurrent && !isUsed) {
                              onChangePickRound(m.id, pickEdit.pickIdx, r);
                              setPickEdit(null);
                            }
                          }}
                          disabled={isUsed && !isCurrent}
                          className={`text-xs py-2 rounded font-mono font-bold ${
                            isCurrent ? `${c.head} ring-2 ring-amber-400`
                            : isUsed ? 'bg-slate-900 text-slate-700 cursor-not-allowed'
                            : `${c.bg} ${c.text} hover:brightness-150 cursor-pointer`
                          }`}
                          title={isUsed && !isCurrent ? '이미 다른 픽이 있는 라운드' : isCurrent ? '현재 라운드' : `${r}로 이동`}>
                          {r}
                        </button>
                      );
                    })}
                  </div>
                </div>
                <button
                  onClick={() => {
                    if (confirm(`${player?.name || '이 픽'}을(를) 삭제하시겠습니까?\nP가 복구되고 위로 보너스도 회수됩니다.`)) {
                      onDeletePick(player);
                      setPickEdit(null);
                    }
                  }}
                  className="px-3 py-2 rounded bg-red-900/40 hover:bg-red-900/60 border border-red-700/50 text-red-300 text-xs font-bold flex items-center gap-1 flex-shrink-0">
                  <Trash size={11}/> 픽 삭제
                </button>
                <button
                  onClick={() => setPickEdit(null)}
                  className="px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex-shrink-0">
                  닫기
                </button>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

// ============================================================
// CONTEXT MENU — 카드 우클릭 빠른 액션
// ============================================================
function ContextMenu({ x, y, player, onClose, onEdit, onToggleFav, onSetRating, onCompare, onMarkMine, onMarkTaken, onUnmark, onQuickMemo, status, mode, isInCompare }) {
  const menuRef = useRef(null);
  const [memoOpen, setMemoOpen] = useState(false);
  const [memoText, setMemoText] = useState('');
  const memoRef = useRef(null);

  useEffect(() => {
    const h = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) onClose();
    };
    setTimeout(() => document.addEventListener('mousedown', h), 0);
    return () => document.removeEventListener('mousedown', h);
  }, [onClose]);
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') { if (memoOpen) setMemoOpen(false); else onClose(); } };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose, memoOpen]);
  useEffect(() => {
    if (memoOpen && memoRef.current) memoRef.current.focus();
  }, [memoOpen]);

  const saveMemo = () => {
    const text = memoText.trim();
    if (!text) { setMemoOpen(false); return; }
    onQuickMemo(player, text);
    setMemoText('');
    setMemoOpen(false);
    onClose();
  };

  // 화면 밖으로 안 나가게 보정
  const adjustedX = Math.min(x, window.innerWidth - 240);
  const adjustedY = Math.min(y, window.innerHeight - (memoOpen ? 420 : 340));

  return (
    <div ref={menuRef}
      className="fixed z-50 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl w-56 py-1 anim-in"
      style={{ left: adjustedX, top: adjustedY }}>
      <div className="px-3 py-1.5 border-b border-slate-800 text-xs text-slate-400 truncate">
        <span className="font-mono text-slate-500">#{player.index || '?'}</span> {player.name}
      </div>

      <button onClick={() => { onEdit(player); onClose(); }}
        className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-slate-300">
        <Edit size={11}/> 편집
      </button>

      <button onClick={() => { onToggleFav(player); onClose(); }}
        className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-slate-300">
        <Heart size={11} className={player.favorite ? 'text-rose-400' : 'text-slate-500'} fill={player.favorite ? 'currentColor' : 'none'}/>
        {player.favorite ? '즐겨찾기 해제' : '즐겨찾기'}
      </button>

      <button onClick={() => { onCompare(player); onClose(); }}
        className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-slate-300">
        {isInCompare ? <><X size={11} className="text-amber-400"/> 비교에서 제거</> : <><Plus size={11}/> 비교 추가</>}
      </button>

      {/* 빠른 메모 */}
      <div className="border-t border-slate-800 mt-1 pt-1">
        {!memoOpen ? (
          <button onClick={() => setMemoOpen(true)}
            className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-purple-300">
            <Edit size={11}/> 빠른 메모 추가
          </button>
        ) : (
          <div className="px-2 py-1.5 bg-slate-950/50">
            <div className="text-[10px] tracking-widest text-purple-400 uppercase mb-1 flex items-center gap-1">
              📝 메모 추가 <span className="text-slate-600 ml-auto text-[9px]">Enter 저장 · Esc 취소</span>
            </div>
            <textarea ref={memoRef}
              value={memoText}
              onChange={(e) => setMemoText(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveMemo(); }
              }}
              placeholder="한 줄 메모 (Shift+Enter로 줄바꿈)"
              className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-100 outline-none focus:border-purple-500 resize-none"
              rows="2"/>
            {player.memo && (
              <div className="text-[9px] text-slate-500 mt-1 line-clamp-2 italic">
                기존: {player.memo.split('\n').filter(Boolean).slice(0,1).join('')}
                <span className="text-slate-600"> (위에 새 줄로 추가됨)</span>
              </div>
            )}
            <div className="flex gap-1 mt-1.5">
              <button onClick={saveMemo}
                className="flex-1 px-2 py-1 rounded bg-purple-600 hover:bg-purple-500 text-white text-[10px] font-bold">
                저장
              </button>
              <button onClick={() => { setMemoOpen(false); setMemoText(''); }}
                className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px]">
                취소
              </button>
            </div>
          </div>
        )}
      </div>

      <div className="border-t border-slate-800 mt-1 pt-1">
        <div className="px-3 py-1 text-[10px] tracking-widest text-slate-600 uppercase">빠른 별점</div>
        <div className="flex gap-0.5 px-2 pb-1">
          {[0, 1, 2, 3, 4, 5].map(r => (
            <button key={r}
              onClick={() => { onSetRating(player, r); onClose(); }}
              className={`flex-1 text-[10px] py-1 rounded hover:bg-slate-700 ${(player.rating || 0) === r ? 'bg-amber-500/20 text-amber-300 font-bold' : 'text-slate-400'}`}>
              {r}
            </button>
          ))}
        </div>
      </div>

      {/* 픽 되돌리기는 prep/live 모두에서 가능 (이미 픽된 선수에 한해) */}
      {(status === STATUS.TAKEN || status === STATUS.MINE) && (
        <div className="border-t border-slate-800 mt-1 pt-1">
          <button onClick={() => { onUnmark(player); onClose(); }}
            className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-slate-300">
            <Undo size={11}/> 픽 되돌리기
          </button>
        </div>
      )}

      {/* 픽 처리는 live 모드에서만 (안 뽑힌 선수에 한해) */}
      {mode === 'live' && !status && (
        <div className="border-t border-slate-800 mt-1 pt-1">
          <button onClick={() => { onMarkMine(player); onClose(); }}
            className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-cyan-400 font-bold">
            <Target size={11}/> 내 픽으로
          </button>
          <button onClick={() => { onMarkTaken(player); onClose(); }}
            className="w-full text-left px-3 py-1.5 text-xs hover:bg-slate-800 flex items-center gap-2 text-red-400 font-bold">
            <X size={11}/> 다른 감독이 뽑음
          </button>
        </div>
      )}
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [state, setState] = useState(loadState);
  const [mode, setMode] = useState('prep');
  const [view, setView] = useState('grid');

  // 필터
  const [search, setSearch] = useState('');
  const [filterPos, setFilterPos] = useState([]);  // 선택된 포지션 배열 (OR 필터)
  const [filterPosMain, setFilterPosMain] = useState(false);  // 주포지션만 검색할지
  const [filterSec, setFilterSec] = useState('all');
  const [filterRegion, setFilterRegion] = useState('all');
  const [filterMinR, setFilterMinR] = useState(0);
  const [filterTag, setFilterTag] = useState('');
  const [filterFav, setFilterFav] = useState(false);
  // 상태 필터는 모드별로 분리해서 기억
  const [filterStatusByMode, setFilterStatusByMode] = useState({ prep: 'all', live: 'available' });
  const filterStatus = filterStatusByMode[mode] || 'all';
  const setFilterStatus = (v) => setFilterStatusByMode(s => ({ ...s, [mode]: v }));
  const [sortBy, setSortBy] = useState('index');
  const [sortDir, setSortDir] = useState('asc');

  // 모달
  const [editPlayer, setEditPlayer] = useState(null);
  const [editOpen, setEditOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [bulkOpen, setBulkOpen] = useState(false);
  const [compareP, setCompareP] = useState(null);
  const [selectedIds, setSelectedIds] = useState([]);
  const [replTrig, setReplTrig] = useState(null);
  const [sidePanel, setSidePanel] = useState('best12');
  const [pickModal, setPickModal] = useState(null); // {player, mode}
  const [boardOpen, setBoardOpen] = useState(false);
  const [depthOpen, setDepthOpen] = useState(false);
  const [diamondMgr, setDiamondMgr] = useState(null);
  const [contextMenu, setContextMenu] = useState(null); // {player, x, y}
  const [helpOpen, setHelpOpen] = useState(false);

  // 저장
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const [saveErrorDismissed, setSaveErrorDismissed] = useState(false);
  const [saveErrorSize, setSaveErrorSize] = useState(0);
  const saveTimerRef = useRef(null);
  const firstRef = useRef(true);
  const stateRef = useRef(state);
  stateRef.current = state;

  // 첫 마운트 시 진단 정보 콘솔 출력 + 디버그 객체 노출
    useEffect(() => {
    if (firstRef.current) { firstRef.current = false; return; }
    setSaving(true);
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      const ok = saveStateNow(state);
      setSaving(false);
      if (ok) {
        setSavedAt(new Date());
        setSaveError(null);
        setSaveErrorDismissed(false);  // 성공하면 다음 실패 때 다시 모달 표시
      } else {
        // 실패: saveError가 이미 set되어 있으면 그대로 두고 dismissed는 사용자 선택 존중
        // 즉 사용자가 한번 모달 닫았으면 같은 실패 상태에선 모달 다시 안 뜸
        setSaveError('localStorage 저장 실패');
        try { setSaveErrorSize(JSON.stringify(state).length); } catch {}
        console.warn('[저장 실패] 우상단 ⚠ 클릭하거나 종료 시 다시 안내됩니다.');
      }
    }, 200);
    return () => clearTimeout(saveTimerRef.current);
  }, [state]);

  // 수동 저장 (사용자가 명시적으로 트리거)
  const manualSave = useCallback(() => {
    clearTimeout(saveTimerRef.current);
    const ok = saveStateNow(stateRef.current);
    if (ok) {
      setSavedAt(new Date());
      setSaveError(null);
      setSaveErrorDismissed(false);
      // 짧은 피드백
      setSaving(true);
      setTimeout(() => setSaving(false), 200);
    } else {
      setSaveError('localStorage 저장 실패');
      setSaveErrorDismissed(false);  // 수동 저장 실패 시 무조건 모달 표시
      try { setSaveErrorSize(JSON.stringify(stateRef.current).length); } catch {}
    }
  }, []);

  // Ctrl+S → 수동 저장
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        manualSave();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [manualSave]);

  useEffect(() => {
    const flush = () => {
      try {
        clearTimeout(saveTimerRef.current);
        saveStateNow(stateRef.current);
      } catch (e) { console.error('[flush]', e); }
    };
    const warnIfSaveFailed = (e) => {
      flush();
      if (saveErrorRef.current) {
        // 모달 다시 표시 (사용자가 confirm에서 취소하면 보이도록)
        setSaveErrorDismissed(false);
        const msg = '⚠ 저장이 실패한 상태입니다! JSON 내보내기 안 하면 데이터가 사라집니다.';
        e.preventDefault();
        e.returnValue = msg;
        return msg;
      }
    };
    window.addEventListener('beforeunload', warnIfSaveFailed);
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
    });
    return () => {
      window.removeEventListener('beforeunload', warnIfSaveFailed);
      window.removeEventListener('pagehide', flush);
    };
  }, []);

  // 상태 맵
  const statusMap = useMemo(() => {
    const m = {};
    for (const mgr of state.managers) {
      for (const pk of mgr.picks) {
        m[pk.playerId] = mgr.id === state.settings.myManagerId ? STATUS.MINE : STATUS.TAKEN;
      }
    }
    return m;
  }, [state.managers, state.settings.myManagerId]);

  // 필터링
  const filtered = useMemo(() => {
    let arr = state.players;
    if (filterStatus === 'available') arr = arr.filter(p => !statusMap[p.id]);
    else if (filterStatus === 'mine') arr = arr.filter(p => statusMap[p.id] === STATUS.MINE);
    else if (filterStatus === 'taken') arr = arr.filter(p => statusMap[p.id] === STATUS.TAKEN);

    if (search) {
      arr = arr.filter(p => matchSearch(p, search));
    }
    if (filterPos.length > 0) {
      arr = arr.filter(p => {
        const main = p.positions || [];
        const sub = p.subPositions || [];
        if (filterPosMain) {
          return filterPos.some(fp => main.includes(fp));
        }
        return filterPos.some(fp => main.includes(fp) || sub.includes(fp));
      });
    }
    if (filterSec !== 'all') {
      if (filterSec === 'S3/4') {
        arr = arr.filter(p => p.section === 'S3/4' || p.section === 'S3' || p.section === 'S4');
      } else {
        arr = arr.filter(p => p.section === filterSec);
      }
    }
    if (filterRegion !== 'all') {
      if (filterRegion === '_none') arr = arr.filter(p => !p.region);
      else arr = arr.filter(p => p.region === filterRegion);
    }
    if (filterMinR > 0) arr = arr.filter(p => (p.rating||0) >= filterMinR);
    if (filterTag) arr = arr.filter(p => (p.tags||[]).includes(filterTag));
    if (filterFav) arr = arr.filter(p => p.favorite);

    arr = [...arr].sort((a, b) => {
      const statKey = [...HIT_KEYS, ...PIT_KEYS].includes(sortBy);
      let av, bv;
      if (statKey) {
        // 스탯은 항상 숫자로 비교 (input value는 string이라 변환 필요)
        const sa = getDisplayStats(a) || {};
        const sb = getDisplayStats(b) || {};
        av = Number(sa[sortBy]); bv = Number(sb[sortBy]);
        if (!isFinite(av)) av = -Infinity;
        if (!isFinite(bv)) bv = -Infinity;
        return sortDir === 'asc' ? (av - bv) : (bv - av);
      }
      av = a[sortBy]; bv = b[sortBy];
      if (sortBy === 'index') {
        av = Number(av); bv = Number(bv);
        if (!isFinite(av)) av = -Infinity;
        if (!isFinite(bv)) bv = -Infinity;
        return sortDir === 'asc' ? (av - bv) : (bv - av);
      }
      // 일반 필드: 둘 다 string일 때만 localeCompare, 그 외에는 숫자 비교
      const aEmpty = av === undefined || av === null || av === '';
      const bEmpty = bv === undefined || bv === null || bv === '';
      if (aEmpty && bEmpty) return 0;
      if (aEmpty) return 1;  // 빈 값은 항상 뒤로
      if (bEmpty) return -1;
      if (typeof av === 'string' && typeof bv === 'string') {
        return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      const na = Number(av), nb = Number(bv);
      if (isFinite(na) && isFinite(nb)) {
        return sortDir === 'asc' ? (na - nb) : (nb - na);
      }
      // fallback: 문자열로 변환해 비교
      return sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
    return arr;
  }, [state.players, statusMap, search, filterPos, filterPosMain, filterSec, filterRegion, filterMinR, filterTag, filterFav, filterStatus, sortBy, sortDir]);

  const allTags = useMemo(() => {
    const s = new Set();
    state.players.forEach(p => (p.tags||[]).forEach(t => s.add(t)));
    return [...s].sort();
  }, [state.players]);

  // CRUD
  const savePlayer = useCallback((p) => {
    setState(s => {
      const idx = s.players.findIndex(x => x.id === p.id);
      const next = { ...s, players: idx >= 0 ? s.players.map(x => x.id === p.id ? p : x) : [...s.players, p] };
      try { saveStateNow(next); } catch(e) { console.error('[savePlayer]', e); }
      return next;
    });
    setEditOpen(false); setEditPlayer(null);
  }, []);

  const deletePlayer = useCallback((id) => {
    setState(s => {
      const next = {
        ...s,
        players: s.players.filter(p => p.id !== id),
        managers: s.managers.map(m => ({ ...m, picks: m.picks.filter(pk => pk.playerId !== id) })),
        best12: s.best12.map(sl => ({ ...sl, candidates: sl.candidates.filter(x => x !== id) }))
      };
      try { saveStateNow(next); } catch(e) { console.error('[deletePlayer]', e); }
      return next;
    });
    setEditOpen(false); setEditPlayer(null);
  }, []);

  const toggleFav = useCallback((p) => {
    setState(s => {
      const next = { ...s, players: s.players.map(x => x.id === p.id ? { ...x, favorite: !x.favorite } : x) };
      try { saveStateNow(next); } catch(e) { console.error('[toggleFav]', e); }
      return next;
    });
  }, []);

  // 픽
  const markPicked = (player, managerId, cost, bonusIds = []) => {
    setState(s => {
      // 중복 픽 방지: 이미 어떤 감독에 픽된 선수면 무시
      const alreadyPicked = s.managers.some(m =>
        (m.picks || []).some(p => p.playerId === player.id)
      );
      if (alreadyPicked) {
        console.warn('중복 픽 방지 — 이미 픽된 선수:', player.name);
        return s;
      }
      const bonusAmount = s.settings.bonusAmount || 5;
      return {
        ...s,
        managers: s.managers.map(m => {
          if (m.id === managerId) {
            return { ...m, remainP: Math.max(0, m.remainP - cost), picks: [...m.picks, { playerId: player.id, cost, ts: Date.now() }] };
          }
          if (bonusIds.includes(m.id)) {
            return { ...m, remainP: m.remainP + bonusAmount };
          }
          return m;
        }),
        log: [{
          ts: Date.now(),
          type: 'pick',
          playerId: player.id,
          managerId,
          cost,
          bonusIds,
          bonusAmount
        }, ...s.log].slice(0, 100)
      };
    });
    if (mode === 'live' && managerId !== state.settings.myManagerId) {
      setReplTrig({ playerId: player.id, ts: Date.now() });
    }
  };

  const markMine = useCallback((player) => {
    setPickModal({ player, mode: 'mine' });
  }, []);

  const markTaken = useCallback((player) => {
    // UNKNOWN 감독 자동 생성
    if (!state.managers.find(m => m.id === 'UNKNOWN')) {
      setState(s => ({
        ...s,
        managers: [...s.managers, { id: 'UNKNOWN', name: '(미지정)', startP: 0, remainP: 0, picks: [] }]
      }));
    }
    setPickModal({ player, mode: 'taken' });
  }, [state.managers]);

  const handlePickConfirm = (managerId, cost, bonusIds) => {
    if (!pickModal) return;
    const player = pickModal.player;
    setPickModal(null); // 먼저 모달 닫아 이중 클릭 방지
    markPicked(player, managerId, cost, bonusIds);
  };

  const unmark = useCallback((player) => {
    setState(s => {
      // 해당 픽의 로그 찾기 (위로 보너스 환불 위해)
      const logEntry = s.log.find(e => e.type === 'pick' && e.playerId === player.id);
      const bonusAmount = logEntry?.bonusAmount || 0;
      const bonusIds = logEntry?.bonusIds || [];

      return {
        ...s,
        managers: s.managers.map(m => {
          const i = m.picks.findIndex(pk => pk.playerId === player.id);
          if (i >= 0) {
            return { ...m, remainP: m.remainP + (m.picks[i].cost || 0), picks: m.picks.filter((_, j) => j !== i) };
          }
          // 위로 보너스 환불
          if (bonusIds.includes(m.id)) {
            return { ...m, remainP: Math.max(0, m.remainP - bonusAmount) };
          }
          return m;
        }),
        log: s.log.filter(e => !(e.type === 'pick' && e.playerId === player.id))
      };
    });
  }, []);

  // 픽 라운드 변경 (드래프트 보드에서 잘못 들어간 픽 수정용)
  const changePickRound = useCallback((mgrId, pickIdx, newRound) => {
    setState(s => ({
      ...s,
      managers: s.managers.map(m => m.id === mgrId
        ? { ...m, picks: m.picks.map((p, i) => i === pickIdx ? { ...p, round: newRound } : p) }
        : m)
    }));
  }, []);

  // 비교
  const toggleSelect = useCallback((p) => {
    setSelectedIds(arr => arr.includes(p.id) ? arr.filter(x => x !== p.id) : (arr.length < 4 ? [...arr, p.id] : arr));
  }, []);

  // Best 12 / Manager
  const updateB12 = useCallback((id, sl) => setState(s => ({ ...s, best12: s.best12.map(x => x.id === id ? sl : x) })), []);
  const updateMgr = useCallback((id, m) => setState(s => ({ ...s, managers: s.managers.map(x => x.id === id ? m : x) })), []);
  const setMyMgr = useCallback((id) => setState(s => ({ ...s, settings: { ...s.settings, myManagerId: id } })), []);
  const updateSettings = useCallback((ns) => setState(s => ({ ...s, settings: { ...s.settings, ...ns } })), []);

  // Export/Import
  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wbd-draft-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (confirm('현재 데이터를 덮어쓰시겠습니까?')) {
          const def = createDefaultState();
          setState({ ...def, ...d, settings: { ...def.settings, ...(d.settings||{}) } });
        }
      } catch (err) { alert('JSON 파싱 실패: ' + err.message); }
    };
    r.readAsText(file);
    e.target.value = '';
  };

  const resetAll = () => {
    if (!confirm('⚠ 모든 데이터를 초기화하시겠습니까?\n\n• 모든 평가, 메모, 별점, 픽 기록이 삭제됩니다\n• 기본 100명 + 9감독으로 다시 시작합니다\n• 복구할 수 없습니다\n\n정말 진행하시겠습니까?')) return;
    // 가드 플래그: pagehide/beforeunload flush가 메모리 state를 다시 저장하는 것 방지
    window.__wbdResetInProgress = true;
    try { localStorage.clear(); } catch (e) {
      // 폴백: 키별 삭제
      try { Object.keys(localStorage).forEach(k => { try { localStorage.removeItem(k); } catch(_) {} }); } catch(_) {}
    }
    try { sessionStorage.clear(); } catch (e) {}
    location.replace(location.pathname + '?t=' + Date.now());
  };

  const resetPicksOnly = () => {
    if (confirm('픽 기록만 초기화 (선수 평가 데이터는 유지)?\n\n• 모든 감독의 픽이 사라집니다\n• 사용 포인트가 복구됩니다')) {
      const next = {
        ...state,
        managers: state.managers.filter(m => m.id !== 'UNKNOWN').map(m => ({ ...m, remainP: m.startP || 150, picks: [] })),
        log: []
      };
      setState(next);
      saveStateNow(next);  // 즉시 저장
    }
  };

  // 키보드
  const selectedIdsRef = useRef([]);
  selectedIdsRef.current = selectedIds;

  useEffect(() => {
    const h = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (e.key === '/') { e.preventDefault(); document.getElementById('main-search')?.focus(); }
      else if (e.key === 'n' || e.key === 'N') { if (!editOpen) { setEditPlayer(null); setEditOpen(true); } }
      else if (e.key === 'p' || e.key === 'P') { setMode(m => m === 'sim' ? 'sim' : (m === 'prep' ? 'live' : 'prep')); }
      else if (e.key === 's' || e.key === 'S') { setMode(m => m === 'sim' ? 'prep' : 'sim'); }
      else if (e.key === 'b' || e.key === 'B') { setBoardOpen(b => !b); }
      else if (e.key === 'd' || e.key === 'D') { setDepthOpen(o => !o); }
      else if (e.key === 'c' || e.key === 'C') {
        // 비교: 선택된 선수 2명 이상이면 비교 모달 열기
        const ids = selectedIdsRef.current;
        if (ids.length >= 2) {
          const players = ids.map(id => state.players.find(p => p.id === id)).filter(Boolean);
          if (players.length >= 2) setCompareP(players);
        } else if (ids.length === 1) {
          // 1명만 선택된 경우 안내
          console.log('비교하려면 2명 이상 선택');
        }
      }
      else if (e.key === '?' || e.key === 'h' || e.key === 'H') { setHelpOpen(o => !o); }
      else if (e.key === 'Escape') {
        setEditOpen(false); setBulkOpen(false); setSettingsOpen(false);
        setCompareP(null); setReplTrig(null); setPickModal(null); setBoardOpen(false); setContextMenu(null);
        setHelpOpen(false); setDiamondMgr(null); setDepthOpen(false);
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [editOpen, state.players]);

  // 브라우저 뒤로가기 → 모달 닫기 (페이지 떠남 방지)
  // 매 렌더마다 어떤 모달이 열렸는지 ref에 동기화
  const modalsOpenRef = useRef(false);
  modalsOpenRef.current = !!(editOpen || settingsOpen || bulkOpen || compareP || pickModal || boardOpen || contextMenu || helpOpen || replTrig || diamondMgr || depthOpen);

  useEffect(() => {
    // 첫 진입 시 history에 더미 상태 push (뒤로가기 잡기 위함)
    if (!window.history.state || !window.history.state.wbdApp) {
      window.history.pushState({ wbdApp: true }, '', '');
    }

    const handler = (e) => {
      if (modalsOpenRef.current) {
        setEditOpen(false); setBulkOpen(false); setSettingsOpen(false);
        setCompareP(null); setReplTrig(null); setPickModal(null);
        setBoardOpen(false); setContextMenu(null); setHelpOpen(false);
        setDiamondMgr(null); setDepthOpen(false);
        window.history.pushState({ wbdApp: true }, '', '');
      }
    };
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, []);

  // 추천 자동닫기
  useEffect(() => {
    if (!replTrig) return;
    const t = setTimeout(() => setReplTrig(null), 20000);
    return () => clearTimeout(t);
  }, [replTrig]);

  const myMgr = state.managers.find(m => m.id === state.settings.myManagerId) || state.managers[0];
  const myRemain = myMgr?.remainP || 0;
  const myPicks = myMgr?.picks.length || 0;
  const myStartP = myMgr?.startP || 150;

  // 섹션별 카운트 (남은 선수)
  const secCounts = useMemo(() => {
    const counts = { S1: 0, S2: 0, 'S3/4': 0 };
    state.players.forEach(p => {
      if (statusMap[p.id]) return;
      const sec = (p.section === 'S3' || p.section === 'S4') ? 'S3/4' : p.section;
      if (counts[sec] !== undefined) counts[sec]++;
    });
    return counts;
  }, [state.players, statusMap]);

  // 포지션별 잔여 인원 (주포지션 기준)
  const posCounts = useMemo(() => {
    const counts = { P: 0, C: 0, '1B': 0, '2B': 0, '3B': 0, SS: 0, LF: 0, CF: 0, RF: 0, DH: 0, none: 0 };
    state.players.forEach(p => {
      if (statusMap[p.id]) return;
      const main = p.positions || [];
      if (main.length === 0) counts.none++;
      else main.forEach(pv => { if (counts[pv] !== undefined) counts[pv]++; });
    });
    return counts;
  }, [state.players, statusMap]);

  // Top Picks: 살아있는 선수 중 별점 높은 순 (포지션 그룹별)
  const topPicks = useMemo(() => {
    // 살아있는 선수 중 별점 있거나 즐겨찾기된 선수
    const alive = state.players.filter(p => !statusMap[p.id] && ((p.rating || 0) > 0 || p.favorite));
    // 즐겨찾기 먼저, 그 다음 별점 높은 순, 그 다음 희망 P 높은 순
    alive.sort((a, b) => {
      if ((a.favorite ? 1 : 0) !== (b.favorite ? 1 : 0)) return (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0);
      return (b.rating || 0) - (a.rating || 0) || (b.targetP || 0) - (a.targetP || 0);
    });
    return alive;
  }, [state.players, statusMap]);

  return (
    <>
    {/* SIM 영역 - 항상 mount, mode === 'sim'일 때만 보임. 이 구조로 시뮬 진행 상태 유지됨 */}
    <div className={mode === 'sim' ? 'min-h-screen bg-slate-950 text-slate-100' : 'hidden'}>
      <div className="border-b border-purple-700/40 bg-gradient-to-r from-purple-950/60 to-slate-900/60 px-4 py-2 flex items-center justify-between sticky top-0 z-50">
        <div className="flex items-center gap-3">
          <button onClick={() => setMode('prep')}
            className="px-2.5 py-1 text-[11px] font-bold tracking-wider rounded transition-colors bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center gap-1.5">
            ← 헬퍼로
          </button>
          <div className="flex items-center gap-2">
            <span className="text-lg">🎲</span>
            <div className="leading-tight">
              <div className="text-[8px] tracking-[0.2em] text-purple-300/70">WBD</div>
              <div className="text-sm font-black tracking-wide text-purple-200">MOCK DRAFT SIM</div>
            </div>
          </div>
        </div>
        <div className="text-[10px] text-slate-500 hidden md:block">
          헬퍼 PREP 선수 데이터 연동 중 ({state.players.length}명) · S키로 토글 · 진행 상태 자동 저장됨
        </div>
      </div>
      <SimApp helperPlayers={state.players}/>
    </div>

    {/* 헬퍼 본체 - mode === 'sim'일 땐 hidden */}
    <div className={mode === 'sim' ? 'hidden' : 'min-h-screen bg-slate-950 text-slate-100'}>
      {/* TOP BAR */}
      <div className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800">
        <div className="px-3 py-2 flex items-center gap-3">
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 rounded-md bg-gradient-to-br from-amber-400 to-red-600 flex items-center justify-center shadow-md shadow-amber-500/30">
              <span className="text-slate-950 font-black text-xs">⚾</span>
            </div>
            <div>
              <div className="text-[8px] tracking-[0.2em] text-slate-500 leading-none">WBD</div>
              <div className="text-xs font-bold tracking-wide leading-none mt-0.5">DRAFT HELPER</div>
            </div>
          </div>

          <div className="flex bg-slate-900 rounded-md p-0.5 ml-1">
            <button onClick={() => setMode('prep')}
              className={`px-2.5 py-1 text-[10px] font-bold tracking-wider rounded-sm transition-colors ${mode === 'prep' ? 'bg-slate-700 text-slate-100' : 'text-slate-500 hover:text-slate-300'}`}>PREP</button>
            <button onClick={() => setMode('live')}
              className={`px-2.5 py-1 text-[10px] font-bold tracking-wider rounded-sm transition-colors flex items-center gap-1 ${mode === 'live' ? 'bg-red-600 text-white shadow-md shadow-red-500/30' : 'text-slate-500 hover:text-slate-300'}`}>
              {mode === 'live' && <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"/>} LIVE
            </button>
          </div>

          <div className="flex items-center gap-3 ml-2">
            <div className="text-center min-w-[40px]">
              <div className="text-[8px] tracking-widest text-slate-500 uppercase">My P</div>
              <div className={`text-sm font-mono font-black tabular-nums leading-tight ${myRemain < 30 ? 'text-red-400' : 'text-emerald-400'}`}>{myRemain}</div>
            </div>
            <div className="text-center min-w-[40px]">
              <div className="text-[8px] tracking-widest text-slate-500 uppercase">Roster</div>
              <div className="text-sm font-mono font-black tabular-nums leading-tight">{myPicks}<span className="text-slate-500 text-xs">/12</span></div>
            </div>
          </div>

          {/* 섹션별 남은 인원 */}
          <div className="flex items-center gap-1 ml-2">
            {SECTIONS.map(s => {
              const c = SECTION_COLORS[s];
              return (
                <div key={s} className={`text-[9px] px-1.5 py-0.5 rounded border ${c.bg} ${c.text} ${c.border} font-mono`}>
                  {s}: {secCounts[s]}
                </div>
              );
            })}
          </div>

          <div className="ml-auto flex items-center gap-2">
            <div className="text-[9px] flex items-center gap-1">
              {saveError ? (
                <button
                  onClick={() => setSaveErrorDismissed(false)}
                  className="text-red-400 font-bold animate-pulse hover:text-red-300 cursor-pointer"
                  title="클릭해서 자세히 보기">⚠ 저장실패 (클릭)</button>
              ) : saving ? (
                <span className="text-slate-500 flex items-center gap-1"><span className="w-1 h-1 rounded-full bg-amber-400 animate-pulse"/> 저장</span>
              ) : savedAt ? (
                <span className="text-slate-500 flex items-center gap-1"><Check size={9} className="text-emerald-500"/> 저장됨</span>
              ) : null}
            </div>
            {/* 수동 저장 버튼 */}
            <button
              onClick={manualSave}
              className={`text-[10px] px-2 py-1 rounded font-bold transition flex items-center gap-1 ${
                saveError
                  ? 'bg-red-600/40 hover:bg-red-600/60 text-red-200 border border-red-500'
                  : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'
              }`}
              title="수동 저장 (Ctrl+S)">
              💾 저장
            </button>
            {/* JSON 백업 빠른 버튼 (저장 실패 시 강조) */}
            <button
              onClick={exportJSON}
              className={`text-[10px] px-2 py-1 rounded font-bold transition flex items-center gap-1 ${
                saveError
                  ? 'bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-400 animate-pulse'
                  : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'
              }`}
              title="JSON 파일로 백업 다운로드">
              📥 백업
            </button>
            <button onClick={() => setDepthOpen(true)}
              className="text-emerald-400 hover:text-emerald-300 p-1 rounded hover:bg-slate-800 flex items-center gap-1 text-[11px] font-bold"
              title="뎁스차트 (D)">
              📋 뎁스
            </button>
            <button onClick={() => setBoardOpen(true)}
              className="text-amber-400 hover:text-amber-300 p-1 rounded hover:bg-slate-800 flex items-center gap-1 text-[11px] font-bold"
              title="드래프트 보드 (B)">
              <Trophy size={13}/> 보드
            </button>
            {/* SIM 진입 - 별도 위치 */}
            <button onClick={() => setMode('sim')}
              className="ml-1 px-2 py-1 rounded font-bold text-[11px] bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white border border-purple-400/50 shadow-md shadow-purple-500/20 flex items-center gap-1 transition-all"
              title="모의드래프트 시뮬레이터 (S)">
              🎲 SIM
            </button>
            <button onClick={() => setHelpOpen(true)}
              className="text-slate-400 hover:text-slate-100 p-1 rounded hover:bg-slate-800 flex items-center justify-center w-7 h-7 font-bold text-base"
              title="도움말 (? 또는 H)">
              ?
            </button>
            <button onClick={() => setSettingsOpen(true)} className="text-slate-400 hover:text-slate-100 p-1 rounded hover:bg-slate-800">
              <Gear size={14}/>
            </button>
          </div>
        </div>
      </div>

      <div className="flex">
        {/* SIDEBAR */}
        <div className="w-56 border-r border-slate-800 p-2.5 space-y-2.5 sticky top-[52px] h-[calc(100vh-52px)] overflow-y-auto scrollbar">
          {/* 포지션별 잔여 인원 */}
          <div className="bg-slate-900/50 border border-slate-800 rounded-lg p-2">
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1.5 flex items-center justify-between">
              <span>포지션별 잔여</span>
              {posCounts.none > 0 && <span className="text-slate-600">미정 {posCounts.none}</span>}
            </div>
            <div className="grid grid-cols-5 gap-0.5">
              {POSITIONS.map(p => {
                const cnt = posCounts[p.value] || 0;
                const dim = cnt === 0;
                return (
                  <div key={p.value}
                    className={`flex flex-col items-center justify-center py-1 rounded ${dim ? 'bg-slate-950/40 opacity-40' : 'bg-slate-950/60'}`}
                    title={`${p.label}: ${cnt}명 잔여`}>
                    <div className={`text-[9px] font-mono font-bold leading-tight ${p.color}`}>{p.short}</div>
                    <div className="text-[10px] font-mono text-slate-200 leading-tight tabular-nums">{cnt}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="relative">
            <Search size={12} className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500"/>
            <input id="main-search" type="text" value={search} onChange={e => setSearch(e.target.value)}
              className="input pl-7 text-xs" placeholder="검색 (/)"/>
            {search && (
              <button onClick={() => setSearch('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                <X size={11}/>
              </button>
            )}
          </div>

          <div>
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1 flex items-center justify-between">
              <span>상태</span>
              {mode === 'prep' && filterStatus !== 'all' && (
                <span className="text-[9px] text-amber-400/70">Prep용</span>
              )}
            </div>
            <div className="grid grid-cols-2 gap-0.5">
              {[{v:'all',l:'전체'},{v:'available',l:'남음'},{v:'mine',l:'내 픽'},{v:'taken',l:'뽑힘'}].map(o => (
                <button key={o.v} onClick={() => setFilterStatus(o.v)}
                  className={`text-[10px] py-1 rounded ${filterStatus === o.v ? 'bg-slate-700 text-slate-100' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>{o.l}</button>
              ))}
            </div>
          </div>

          <div>
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1 flex items-center justify-between">
              <span>포지션 {filterPos.length > 0 && <span className="text-amber-400">({filterPos.length})</span>}</span>
              {filterPos.length > 0 && (
                <button onClick={() => setFilterPos([])} className="text-[9px] text-slate-500 hover:text-slate-300">해제</button>
              )}
            </div>
            {/* 그룹 빠른 선택 */}
            <div className="grid grid-cols-4 gap-0.5 mb-1">
              {POS_GROUPS.map(grp => {
                const allSelected = grp.members.every(m => filterPos.includes(m));
                return (
                  <button key={grp.value}
                    onClick={() => {
                      if (allSelected) {
                        setFilterPos(prev => prev.filter(p => !grp.members.includes(p)));
                      } else {
                        setFilterPos(prev => [...new Set([...prev, ...grp.members])]);
                      }
                    }}
                    className={`text-[10px] py-0.5 rounded ${allSelected ? 'bg-slate-700 text-slate-100' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>
                    {grp.label}
                  </button>
                );
              })}
            </div>
            {/* 개별 포지션 */}
            <div className="grid grid-cols-5 gap-0.5">
              {POSITIONS.map(p => {
                const on = filterPos.includes(p.value);
                return (
                  <button key={p.value}
                    onClick={() => setFilterPos(prev => prev.includes(p.value) ? prev.filter(x => x !== p.value) : [...prev, p.value])}
                    className={`text-[10px] py-1 rounded font-mono font-bold ${on ? `${p.bg} ${p.color} ring-1 ring-current` : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>
                    {p.short}
                  </button>
                );
              })}
            </div>
            <label className="flex items-center gap-1.5 mt-1 cursor-pointer text-[10px] text-slate-500 hover:text-slate-300">
              <input type="checkbox" checked={filterPosMain} onChange={e => setFilterPosMain(e.target.checked)} className="w-3 h-3 accent-amber-400"/>
              주포지션만
            </label>
          </div>

          <div>
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1">섹션</div>
            <div className="grid grid-cols-4 gap-0.5">
              <button onClick={() => setFilterSec('all')} className={`text-[10px] py-1 rounded ${filterSec === 'all' ? 'bg-slate-700 text-slate-100' : 'bg-slate-900 text-slate-500'}`}>All</button>
              {SECTIONS.map(s => (
                <button key={s} onClick={() => setFilterSec(s)} className={`text-[10px] py-1 rounded ${filterSec === s ? 'bg-slate-700 text-slate-100' : 'bg-slate-900 text-slate-500'}`}>{s}</button>
              ))}
            </div>
          </div>

          <div>
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1">지역</div>
            <div className="grid grid-cols-5 gap-0.5">
              <button onClick={() => setFilterRegion('all')} className={`text-[10px] py-1 rounded ${filterRegion === 'all' ? 'bg-slate-700 text-slate-100' : 'bg-slate-900 text-slate-500'}`}>All</button>
              {REGIONS.map(r => (
                <button key={r.value} onClick={() => setFilterRegion(r.value)}
                  className={`text-[10px] py-1 rounded flex items-center justify-center gap-0.5 ${filterRegion === r.value ? `${r.bg} ${r.color} ring-1 ring-current` : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>
                  <span>{r.flag}</span> {r.label}
                </button>
              ))}
              <button onClick={() => setFilterRegion('_none')}
                className={`text-[10px] py-1 rounded ${filterRegion === '_none' ? 'bg-slate-700 text-slate-100' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}
                title="아직 지역 지정 안 한 선수">?</button>
            </div>
          </div>

          <div>
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1 flex justify-between">별점 ≥ <span className="font-mono text-amber-400">{filterMinR}</span></div>
            <input type="range" min="0" max="5" step="0.5" value={filterMinR} onChange={e => setFilterMinR(Number(e.target.value))} className="w-full accent-amber-400"/>
          </div>

          {allTags.length > 0 && (
            <div>
              <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1">태그</div>
              <select value={filterTag} onChange={e => setFilterTag(e.target.value)} className="input text-xs !py-1">
                <option value="">전체</option>
                {allTags.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          )}

          <label className="flex items-center gap-1.5 cursor-pointer text-xs text-slate-400 hover:text-slate-200">
            <input type="checkbox" checked={filterFav} onChange={e => setFilterFav(e.target.checked)} className="w-3.5 h-3.5 accent-rose-400"/>
            <Heart size={11} className={filterFav ? 'text-rose-400' : 'text-slate-500'} fill={filterFav ? 'currentColor' : 'none'}/>
            즐겨찾기만
          </label>

          <div>
            <div className="text-[9px] tracking-widest text-slate-500 uppercase mb-1">정렬</div>
            <div className="flex gap-0.5">
              <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="input text-xs !py-1 flex-1">
                <option value="index">#</option>
                <option value="rating">별점</option>
                <option value="targetP">희망P</option>
                <option value="name">이름</option>
                <option value="HR">HR</option><option value="AVG">AVG</option>
                <option value="OBP">OBP</option><option value="SLG">SLG</option><option value="wRC">wRC+</option>
                <option value="ERA">ERA</option><option value="K">K</option><option value="WHIP">WHIP</option>
              </select>
              <button onClick={() => setSortDir(d => d === 'asc' ? 'desc' : 'asc')} className="btn btn-secondary !px-2 !py-0">
                {sortDir === 'asc' ? '↑' : '↓'}
              </button>
            </div>
          </div>

          <button onClick={() => { setSearch(''); setFilterPos([]); setFilterPosMain(false); setFilterSec('all'); setFilterMinR(0); setFilterTag(''); setFilterFav(false); }}
            className="w-full text-[9px] py-1 text-slate-500 hover:text-slate-300 flex items-center justify-center gap-1">
            <RotateIcon size={9}/> 필터 초기화
          </button>

          <div className="border-t border-slate-800 pt-2 space-y-1">
            <button onClick={() => { setEditPlayer(null); setEditOpen(true); }} className="w-full btn btn-secondary !text-xs !py-1.5 flex items-center justify-center gap-1">
              <Plus size={11}/> 선수 추가 (N)
            </button>
          </div>

          <div className="text-[9px] text-slate-600 text-center pt-1">
            {filtered.length} / {state.players.length} 명
          </div>
        </div>

        {/* MAIN */}
        <div className="flex-1 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-500 tracking-wider">{filtered.length} 명</span>
              {selectedIds.length > 0 && (
                <>
                  <button onClick={() => setCompareP(selectedIds.map(id => state.players.find(p => p.id === id)).filter(Boolean))}
                    className="btn btn-secondary !text-xs !py-1"
                    title="단축키: C">
                    비교 ({selectedIds.length}) {selectedIds.length >= 2 && <span className="text-[9px] opacity-60 ml-0.5">C</span>}
                  </button>
                  <button onClick={() => setSelectedIds([])} className="text-[10px] text-slate-500 hover:text-slate-300">해제</button>
                </>
              )}
            </div>
            <div className="flex items-center gap-1">
              <button onClick={() => setView('grid')} className={`p-1 rounded ${view === 'grid' ? 'bg-slate-700' : 'hover:bg-slate-800'}`}><Grid size={12}/></button>
              <button onClick={() => setView('list')} className={`p-1 rounded ${view === 'list' ? 'bg-slate-700' : 'hover:bg-slate-800'}`}><ListIcon size={12}/></button>
            </div>
          </div>

          {filtered.length === 0 ? (
            <div className="text-center text-slate-500 py-20">
              <div className="text-5xl mb-3">⚾</div>
              <div className="text-sm">조건에 맞는 선수가 없습니다</div>
              <div className="text-xs text-slate-600 mt-1">필터를 조정해보세요</div>
            </div>
          ) : (
            <div className={view === 'grid' ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-1.5' : 'space-y-1'}>
              {filtered.map(p => (
                <PlayerCard key={p.id} player={p} status={statusMap[p.id]} settings={state.settings} mode={mode}
                  compact={view === 'list'} selected={selectedIds.includes(p.id)}
                  onClick={(pl) => { setEditPlayer(pl); setEditOpen(true); }}
                  onToggleFav={toggleFav} onMarkMine={markMine} onMarkTaken={markTaken}
                  onUnmark={unmark} onSelect={toggleSelect}
                  onContextMenu={(e, pl) => setContextMenu({ player: pl, x: e.clientX, y: e.clientY })}/>
              ))}
            </div>
          )}
        </div>

        {/* RIGHT PANEL */}
        <div className="w-72 border-l border-slate-800 p-2.5 sticky top-[52px] h-[calc(100vh-52px)] overflow-y-auto scrollbar">
          <div className="flex bg-slate-900 rounded-md p-0.5 mb-2">
            {[{v:'top', l:'Top', Icon: Zap},{v:'best12', l:'Best12', Icon: Trophy},{v:'budget', l:'예산', Icon: null, emoji:'💰'},{v:'managers', l:'감독', Icon: Users},{v:'log', l:'로그', Icon: FileTxt},{v:'memo', l:'메모', Icon: Edit}].map(t => (
              <button key={t.v} onClick={() => setSidePanel(t.v)}
                className={`flex-1 text-[10px] py-1 rounded-sm flex items-center justify-center gap-0.5 transition-colors ${sidePanel === t.v ? 'bg-slate-700 text-slate-100' : 'text-slate-500 hover:text-slate-300'}`}>
                {t.Icon ? <t.Icon size={10}/> : <span className="text-[10px]">{t.emoji}</span>} {t.l}
              </button>
            ))}
          </div>
          {sidePanel === 'top' && (
            <TopPicksPanel topPicks={topPicks} allPlayers={state.players} statusMap={statusMap}
              settings={state.settings} mode={mode}
              onPlayerClick={(p) => { setEditPlayer(p); setEditOpen(true); }}
              onMarkMine={markMine} onMarkTaken={markTaken}/>
          )}
          {sidePanel === 'best12' && (
            <Best12 best12={state.best12} allPlayers={state.players} statusMap={statusMap}
              myStartP={myStartP} onUpdateSlot={updateB12}
              onPlayerClick={(p) => { setEditPlayer(p); setEditOpen(true); }}/>
          )}
          {sidePanel === 'budget' && (() => {
            const myMgr = state.managers.find(m => m.id === state.settings.myManagerId);
            return (
              <BudgetPanel budget={state.budget || {}} myPicks={myMgr?.picks || []} myStartP={myMgr?.startP || 150}
                onUpdateBudget={(b) => setState(s => ({ ...s, budget: b }))}/>
            );
          })()}
          {sidePanel === 'managers' && (
            <MgrPanel managers={state.managers.filter(m => m.id !== 'UNKNOWN')}
              allPlayers={state.players} settings={state.settings}
              onUpdate={updateMgr} onSetMy={setMyMgr}
              onShowDiamond={(m) => setDiamondMgr(m)}/>
          )}
          {sidePanel === 'log' && (
            <LogPanel log={state.log} allPlayers={state.players} managers={state.managers}
              onUndo={(entry) => {
                const p = state.players.find(x => x.id === entry.playerId);
                if (p) unmark(p);
              }}
              onClear={() => setState(s => ({ ...s, log: [] }))}/>
          )}
          {sidePanel === 'memo' && (
            <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-3">
              <div className="text-[10px] font-bold tracking-widest text-slate-300 uppercase mb-2 flex items-center gap-1">
                <FileTxt size={12} className="text-purple-400"/> 전략 메모
              </div>
              <textarea value={state.memo} onChange={e => setState(s => ({ ...s, memo: e.target.value }))}
                className="input min-h-[500px] font-mono text-xs leading-relaxed resize-none"
                placeholder="드래프트 전략, 메모..."/>
            </div>
          )}
        </div>
      </div>

      {replTrig && mode === 'live' && (
        <ReplPanel trigger={replTrig} allPlayers={state.players} statusMap={statusMap}
          settings={state.settings}
          myManager={state.managers && state.managers.find(m => m.id === state.settings.myManagerId)}
          best12={state.best12}
          onClose={() => setReplTrig(null)}
          onPlayerClick={(p) => { setEditPlayer(p); setEditOpen(true); setReplTrig(null); }}/>
      )}
      {editOpen && (
        <PlayerEditModal player={editPlayer} allPlayers={state.players} settings={state.settings}
          onSave={savePlayer} onDelete={deletePlayer}
          onClose={() => { setEditOpen(false); setEditPlayer(null); }}/>
      )}
      {compareP && <CompareModal players={compareP} onClose={() => setCompareP(null)}/>}
      {pickModal && (
        <QuickPickModal player={pickModal.player} managers={state.managers}
          myManagerId={state.settings.myManagerId} mode={pickModal.mode}
          bonusAmount={state.settings.bonusAmount || 5}
          onConfirm={handlePickConfirm} onClose={() => setPickModal(null)}/>
      )}
      {boardOpen && (
        <DraftBoardModal managers={state.managers} allPlayers={state.players}
          log={state.log} settings={state.settings}
          onClose={() => setBoardOpen(false)}
          onPlayerClick={(p) => { setBoardOpen(false); setEditPlayer(p); setEditOpen(true); }}
          onChangePickRound={changePickRound}
          onDeletePick={unmark}/>
      )}
      {contextMenu && (
        <ContextMenu x={contextMenu.x} y={contextMenu.y} player={contextMenu.player}
          status={statusMap[contextMenu.player.id]} mode={mode}
          isInCompare={selectedIds.includes(contextMenu.player.id)}
          onClose={() => setContextMenu(null)}
          onEdit={(p) => { setEditPlayer(p); setEditOpen(true); }}
          onToggleFav={toggleFav}
          onSetRating={(p, r) => setState(s => {
            const next = { ...s, players: s.players.map(x => x.id === p.id ? { ...x, rating: r } : x) };
            try { saveStateNow(next); } catch(e) { console.error('[setRating]', e); }
            return next;
          })}
          onCompare={toggleSelect}
          onQuickMemo={(p, text) => setState(s => {
            const next = {
              ...s,
              players: s.players.map(x => x.id === p.id
                ? { ...x, memo: text + (x.memo ? '\n' + x.memo : '') }
                : x)
            };
            try { saveStateNow(next); } catch(e) { console.error('[quickMemo]', e); }
            return next;
          })}
          onMarkMine={markMine} onMarkTaken={markTaken} onUnmark={unmark}/>
      )}
      {depthOpen && (
        <DepthChartModal
          depth={state.depth || {}}
          allPlayers={state.players}
          managers={state.managers}
          myManagerId={state.settings.myManagerId}
          statusMap={statusMap}
          settings={state.settings}
          onUpdateDepth={(updater) => setState(s => ({ ...s, depth: typeof updater === 'function' ? updater(s.depth || {}) : updater }))}
          onClose={() => setDepthOpen(false)}
          onPlayerClick={(p) => { setDepthOpen(false); setEditPlayer(p); setEditOpen(true); }}/>
      )}
      {diamondMgr && (
        <RosterDiamondModal
          manager={state.managers.find(m => m.id === diamondMgr.id) || diamondMgr}
          allPlayers={state.players}
          settings={state.settings}
          onClose={() => setDiamondMgr(null)}
          onPlayerClick={(p) => { setDiamondMgr(null); setEditPlayer(p); setEditOpen(true); }}/>
      )}
      {helpOpen && <HelpModal onClose={() => setHelpOpen(false)}/>}
      {saveError && !saveErrorDismissed && (
        <SaveErrorModal
          dataSize={saveErrorSize}
          onExport={() => { exportJSON(); /* 모달은 열어둠 - 사용자가 확인 후 닫도록 */ }}
          onClose={() => setSaveErrorDismissed(true)}/>
      )}
      {settingsOpen && (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setSettingsOpen(false)}>
          <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-lg w-full anim-in" onClick={e => e.stopPropagation()}>
            <div className="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
              <h2 className="text-base font-bold">설정</h2>
              <button onClick={() => setSettingsOpen(false)} className="text-slate-400 hover:text-slate-100 p-1"><X size={18}/></button>
            </div>
            <div className="p-5 space-y-4">
              <Sec title="위로 보너스">
                <Fld label="기본 보너스 P" hint="동률에서 선택받지 못한 감독에게 자동 지급">
                  <div className="flex gap-2 items-center">
                    <input type="number" step="5" min="0"
                      value={state.settings.bonusAmount || 5}
                      onChange={e => updateSettings({ bonusAmount: Number(e.target.value) || 0 })}
                      className="input font-mono w-24"/>
                    <span className="text-xs text-slate-500">P (룰 기본값: 5P)</span>
                  </div>
                </Fld>
              </Sec>
              <Sec title="프로필 사진 URL">
                <Fld label="URL 템플릿" hint="{index}는 인덱스로 치환">
                  <input type="text" value={state.settings.photoUrlTemplate}
                    onChange={e => updateSettings({ photoUrlTemplate: e.target.value })}
                    className="input font-mono text-xs"
                    placeholder="https://images.vrcbaseball.com/pfp/{index}.png"/>
                </Fld>
                <div className="text-[10px] text-slate-500 leading-relaxed">
                  기본값: VRCBaseball 공식 프로필 사진 URL<br/>
                  선수 편집에서 <span className="text-amber-400">인덱스 수정 시 사진 자동 갱신</span>
                </div>
                <button onClick={() => updateSettings({ photoUrlTemplate: 'https://images.vrcbaseball.com/pfp/{index}.png' })}
                  className="w-full text-xs py-1.5 text-slate-400 hover:bg-slate-800 rounded border border-slate-700">
                  기본값으로 복원
                </button>
              </Sec>
              <Sec title="데이터">
                <div className="flex gap-2">
                  <button onClick={exportJSON} className="btn btn-secondary !text-xs flex items-center gap-1 flex-1 justify-center">
                    <Download size={11}/> JSON 저장
                  </button>
                  <label className="btn btn-secondary !text-xs flex items-center gap-1 flex-1 justify-center cursor-pointer">
                    <Upload size={11}/> JSON 불러오기
                    <input type="file" accept=".json" onChange={importJSON} className="hidden"/>
                  </label>
                </div>
                <div className="text-[10px] text-slate-500 leading-relaxed">
                  💾 본인 평가 채워둔 후 JSON 저장 → 프리셋으로 보관/공유 가능
                </div>
                <button onClick={resetPicksOnly} className="w-full text-xs py-2 text-amber-400 hover:bg-amber-950/30 rounded border border-amber-800/40">
                  픽 기록만 초기화 (드래프트 끝나고 다시 시작)
                </button>
                <button onClick={resetAll} className="w-full text-xs py-2 text-red-400 hover:bg-red-950/30 rounded border border-red-800/40">
                  ⚠ 전체 초기화 (기본 100명 다시 로드)
                </button>
              </Sec>
              <Sec title="검색 팁">
                <div className="text-[11px] text-slate-400 space-y-1 leading-relaxed">
                  <div>• 일본어 닉네임을 <span className="text-amber-400">한국어로 비슷하게</span> 입력해도 검색됩니다</div>
                  <div className="font-mono text-[10px] text-slate-500">
                    예: "마토토마토" → まととまと<br/>
                    "윳치" → ゆっち－<br/>
                    "아쿠세루" → あくせる<br/>
                    "냔코" → にゃんこ3K
                  </div>
                  <div>• 영어 닉네임은 영어 그대로 입력하세요 (자동 한글 변환 없음)</div>
                </div>
              </Sec>
              <Sec title="단축키">
                <div className="text-[11px] text-slate-400 space-y-1">
                  <div><kbd>/</kbd> 검색</div>
                  <div><kbd>N</kbd> 새 선수</div>
                  <div><kbd>P</kbd> Prep ↔ Live 전환</div>
                  <div><kbd>B</kbd> 드래프트 보드</div>
                  <div><kbd>C</kbd> 선수 비교 (선택 2명+)</div>
                  <div><kbd>?</kbd> 또는 <kbd>H</kbd> 도움말</div>
                  <div><kbd>Esc</kbd> 모달 닫기</div>
                  <div><kbd>Ctrl/⌘+S</kbd> (편집 중) 저장</div>
                  <div><kbd>Enter</kbd> (픽 모달) 확정</div>
                  <div><kbd>우클릭</kbd> 카드 빠른 액션</div>
                </div>
              </Sec>
              <button onClick={() => { setSettingsOpen(false); setHelpOpen(true); }}
                className="w-full text-sm py-2.5 mt-1 rounded-lg bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-700/40 font-bold flex items-center justify-center gap-2">
                <span className="text-base">?</span> 전체 도움말 · 사용 설명서 열기
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
    </>
  );
}

// ============================================================
// ERROR BOUNDARY — 런타임 에러 발생 시 검은 화면 대신 안내
// ============================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null, info: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { this.setState({ info }); console.error('App Error:', error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-6 flex items-center justify-center">
          <div className="max-w-2xl w-full bg-slate-900 border border-red-700/50 rounded-xl p-6">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-2xl">⚠️</span>
              <h1 className="text-xl font-bold text-red-300">앗, 화면 렌더링 중 오류가 발생했어요</h1>
            </div>
            <div className="text-sm text-slate-400 mb-4">
              이 화면이 보인다면 페이지 새로고침해 보세요. 그래도 안 되면 아래 옵션을 시도해 보세요. 저장된 데이터는 그대로 있습니다.
            </div>
            <div className="bg-slate-950 border border-slate-800 rounded p-3 mb-4 text-xs font-mono text-red-300 max-h-40 overflow-auto">
              {this.state.error?.message || String(this.state.error)}
              {this.state.info?.componentStack && (
                <pre className="text-[10px] text-slate-500 mt-2 whitespace-pre-wrap">{this.state.info.componentStack}</pre>
              )}
            </div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={() => location.reload()} className="px-3 py-1.5 rounded bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold">
                새로고침
              </button>
              <button onClick={() => this.setState({ hasError: false, error: null, info: null })}
                className="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-100 text-sm">
                일단 계속 시도
              </button>
              <button onClick={() => {
                if (confirm('정렬 설정을 인덱스 기본값으로 초기화합니다. 데이터는 유지됩니다. 계속할까요?')) {
                  try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                      const parsed = JSON.parse(raw);
                      // 정렬 관련은 state라서 localStorage에 없음, 그냥 새로고침이 답
                    }
                  } catch (e) {}
                  location.reload();
                }
              }} className="px-3 py-1.5 rounded bg-amber-700 hover:bg-amber-600 text-white text-sm">
                정렬 리셋 후 새로고침
              </button>
              <button onClick={() => {
                if (confirm('⚠ 모든 평가 데이터를 삭제하고 처음부터 시작합니다. 정말 진행할까요?')) {
                  // 모든 wbd 관련 키 청소 (혹시 다른 키도 남아있을 경우 대비)
                  try {
                    const toRemove = [];
                    for (let i = 0; i < localStorage.length; i++) {
                      const k = localStorage.key(i);
                      if (k && (k.includes('wbd') || k.includes('draft'))) toRemove.push(k);
                    }
                    toRemove.forEach(k => localStorage.removeItem(k));
                  } catch (e) {}
                  // sessionStorage도 청소
                  try {
                    const toRemove = [];
                    for (let i = 0; i < sessionStorage.length; i++) {
                      const k = sessionStorage.key(i);
                      if (k && (k.includes('wbd') || k.includes('draft'))) toRemove.push(k);
                    }
                    toRemove.forEach(k => sessionStorage.removeItem(k));
                  } catch (e) {}
                  // 강제 새로고침 (캐시 무시)
                  location.replace(location.pathname + '?t=' + Date.now());
                }
              }} className="px-3 py-1.5 rounded bg-red-900 hover:bg-red-800 text-white text-sm">
                전체 초기화 (최후의 수단)
              </button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
