function CompareModal({ players, onClose }) {
  if (!players?.length) return null;
  const hasNonP = (p) => [...(p.positions||[]),...(p.subPositions||[])].some(x => x !== 'P');
  const hasP = (p) => [...(p.positions||[]),...(p.subPositions||[])].includes('P');
  // 각 선수의 표시용 스탯 (통산 우선, 없으면 가장 최근)
  const playerStats = players.map(p => getDisplayStats(p) || {});
  const playerStatsHasHit = playerStats.map(s => hasHitStats(s));
  const playerStatsHasPit = playerStats.map(s => hasPitStats(s));
  const anyH = players.some(hasNonP) || playerStatsHasHit.some(x => x);
  const anyP = players.some(hasP) || playerStatsHasPit.some(x => x);
  const hStats = [['AB','타수',0],['H','안타',0],['HR','홈런',0],['SB','도루',0],['AVG','타율',3,1],['OBP','출루',3,1],['SLG','장타',3,1],['wRC_plus','wRC+',0]];
  const pStats = [['games_p','등판',0],['IP','이닝',1],['ERA','방어율',2,0,1],['K','탈삼진',0],['WHIP','WHIP',2,0,1],['QS','QS',0]];

  const renderRow = ([key, label, dec, isRate, lowBetter]) => {
    const vs = playerStats.map(s => Number(s[key]));
    const valid = vs.filter(v => !isNaN(v) && v !== 0);
    if (!valid.length) return null;
    const best = lowBetter ? Math.min(...valid) : Math.max(...valid);
    return (
      <tr key={key} className="border-b border-slate-800/50">
        <td className="p-1.5 text-xs text-slate-400 font-medium">{label}</td>
        {playerStats.map((s, i) => {
          const v = Number(s[key]);
          const isBest = !isNaN(v) && v === best && valid.length > 1;
          return (
            <td key={i} className={`p-1.5 text-center text-sm font-mono ${isBest ? 'text-amber-400 font-bold' : 'text-slate-200'}`}>
              {isNaN(v) ? '-' : isRate ? fmtRate(v) : v.toFixed(dec)}
            </td>
          );
        })}
      </tr>
    );
  };

  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto scrollbar anim-in" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-slate-900 border-b border-slate-800 px-5 py-3 flex items-center justify-between">
          <h2 className="text-base font-bold">선수 비교 ({players.length}명)</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1"><X size={18}/></button>
        </div>
        <div className="p-5">
          <div className="text-[10px] text-slate-500 mb-2 text-right">
            ※ 통산 우선 표시, 없으면 가장 최근 시즌
          </div>
          <table className="w-full">
            <thead>
              <tr className="border-b-2 border-slate-700">
                <th className="text-left p-2 text-xs text-slate-500"></th>
                {players.map((p, i) => {
                  const s = playerStats[i];
                  return (
                    <th key={p.id} className="p-2 text-center">
                      <div className="text-xs font-mono text-slate-500">#{p.index}</div>
                      <div className="text-sm font-bold text-slate-100 truncate max-w-[120px] mx-auto">{p.name}</div>
                      <div className="flex justify-center mt-1"><StarRating value={p.rating||0} size="sm" readonly/></div>
                      {s && (s.season || s.isCareer) && (
                        <div className={`text-[9px] mt-0.5 ${s.isCareer ? 'text-amber-400 font-bold' : 'text-slate-500'}`}>
                          {s.isCareer ? '통산' : s.season}
                        </div>
                      )}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              <tr className="border-b border-slate-800">
                <td className="p-1.5 text-xs text-slate-400">포지션</td>
                {players.map(p => {
                  const main = p.positions || [];
                  const sub = p.subPositions || [];
                  return (
                    <td key={p.id} className="p-1.5 text-center text-xs">
                      <div className="flex flex-wrap gap-0.5 justify-center">
                        {main.map(pv => {
                          const po = POS_BY_VALUE[pv];
                          return po ? <span key={pv} className={`px-1 rounded font-mono font-bold ${po.color} bg-slate-800`}>{po.short}</span> : null;
                        })}
                      </div>
                      {sub.length > 0 && (
                        <div className="flex flex-wrap gap-0.5 justify-center mt-1 items-center">
                          <span className="text-[9px] text-slate-600 font-mono">+</span>
                          {sub.map(pv => {
                            const po = POS_BY_VALUE[pv];
                            return po ? <span key={pv} className={`px-1 rounded font-mono font-bold text-[10px] ${po.color} opacity-75 border border-dashed border-current/40`}>{po.short}</span> : null;
                          })}
                        </div>
                      )}
                      {main.length === 0 && sub.length === 0 && '-'}
                    </td>
                  );
                })}
              </tr>
              <tr className="border-b border-slate-800">
                <td className="p-1.5 text-xs text-slate-400">희망 P</td>
                {players.map(p => (
                  <td key={p.id} className="p-1.5 text-center text-sm font-mono text-emerald-400 font-bold">{p.targetP || '-'}</td>
                ))}
              </tr>
              {anyH && (<>
                <tr className="bg-slate-950"><td colSpan={players.length + 1} className="p-1 text-[10px] tracking-widest text-slate-500 uppercase">타격</td></tr>
                {hStats.map(renderRow)}
              </>)}
              {anyP && (<>
                <tr className="bg-slate-950"><td colSpan={players.length + 1} className="p-1 text-[10px] tracking-widest text-slate-500 uppercase">투구</td></tr>
                {pStats.map(renderRow)}
              </>)}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// BEST 12 PANEL
// ============================================================
function Best12({ best12, allPlayers, statusMap, myStartP, onUpdateSlot, onPlayerClick }) {
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState('');
  const total = best12.reduce((s, sl) => s + (sl.targetP || 0), 0);
  const over = total > myStartP;
  const opts = useMemo(() => {
    if (!search) return [];
    return allPlayers.filter(p => matchSearch(p, search)).slice(0, 6);
  }, [search, allPlayers]);

  const addC = (slotId, p) => {
    const s = best12.find(x => x.id === slotId);
    if (s.candidates.includes(p.id)) return;
    onUpdateSlot(slotId, { ...s, candidates: [...s.candidates, p.id] });
    setSearch('');
  };
  const rmC = (slotId, pid) => {
    const s = best12.find(x => x.id === slotId);
    onUpdateSlot(slotId, { ...s, candidates: s.candidates.filter(x => x !== pid) });
  };
  const toggleSlotPos = (slotId, pv) => {
    const s = best12.find(x => x.id === slotId);
    const cur = s.positions || [];
    const next = cur.includes(pv) ? cur.filter(x => x !== pv) : [...cur, pv];
    onUpdateSlot(slotId, { ...s, positions: next });
  };
  const [posEditing, setPosEditing] = useState(null);

  return (
    <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-3">
      <div className="flex items-center justify-between mb-2">
        <div className="text-[10px] font-bold tracking-widest text-slate-300 uppercase flex items-center gap-1">
          <Trophy size={12} className="text-amber-400"/> Best 12
        </div>
        <div className={`text-xs font-mono font-bold ${over ? 'text-red-400' : 'text-emerald-400'}`}>
          {total}P / {myStartP}P {over && <Alert size={10} className="inline"/>}
        </div>
      </div>
      <div className="space-y-1">
        {best12.map(sl => {
          const slotPositions = sl.positions || [];
          const isEditingPos = posEditing === sl.id;
          return (
            <div key={sl.id} className="bg-slate-950/50 border border-slate-800 rounded-lg p-1.5">
              <div className="flex items-center justify-between mb-1">
                <div className="flex items-center gap-1.5 flex-1 min-w-0">
                  <button
                    onClick={() => setPosEditing(isEditingPos ? null : sl.id)}
                    className="flex gap-0.5 flex-shrink-0 hover:bg-slate-800 rounded px-1 py-0.5"
                    title="포지션 편집">
                    {slotPositions.length === 0 ? (
                      <span className="text-[9px] font-mono text-slate-600">*</span>
                    ) : slotPositions.slice(0, 4).map(pv => {
                      const p = POS_BY_VALUE[pv];
                      return p ? <span key={pv} className={`text-[9px] font-mono font-bold ${p.color}`}>{p.short}</span> : null;
                    })}
                    {slotPositions.length > 4 && <span className="text-[8px] text-slate-500">+{slotPositions.length - 4}</span>}
                  </button>
                  <input type="text" value={sl.label}
                    onChange={e => onUpdateSlot(sl.id, { ...sl, label: e.target.value })}
                    className="bg-transparent text-xs text-slate-200 font-medium outline-none border-b border-transparent focus:border-slate-700 px-0.5 flex-1 min-w-0"/>
                </div>
                <div className="flex items-center gap-0.5">
                  <input type="number" step="5" min="0" value={sl.targetP || 0}
                    onChange={e => onUpdateSlot(sl.id, { ...sl, targetP: Number(e.target.value) || 0 })}
                    className="w-10 bg-transparent text-[11px] font-mono text-emerald-400 text-right outline-none border-b border-slate-800 focus:border-emerald-500"/>
                  <span className="text-[9px] text-slate-500">P</span>
                </div>
              </div>
              {isEditingPos && (
                <div className="mb-1 p-1 bg-slate-900/80 border border-slate-700 rounded">
                  <div className="grid grid-cols-5 gap-0.5">
                    {POSITIONS.map(p => {
                      const on = slotPositions.includes(p.value);
                      return (
                        <button key={p.value}
                          onClick={() => toggleSlotPos(sl.id, p.value)}
                          className={`text-[10px] py-0.5 rounded font-mono font-bold ${on ? `${p.bg} ${p.color} ring-1 ring-current` : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>
                          {p.short}
                        </button>
                      );
                    })}
                  </div>
                  <button onClick={() => setPosEditing(null)} className="w-full mt-1 text-[9px] py-0.5 text-slate-500 hover:text-slate-300">닫기</button>
                </div>
              )}
              <div className="space-y-0.5">
                {sl.candidates.map((id, idx) => {
                  const p = allPlayers.find(x => x.id === id);
                  if (!p) return null;
                  const st = statusMap[p.id];
                  return (
                    <div key={id} onClick={() => onPlayerClick(p)}
                      className={`flex items-center gap-1 px-1 py-0.5 rounded text-[11px] cursor-pointer hover:bg-slate-800 ${st === STATUS.TAKEN ? 'opacity-40 line-through' : st === STATUS.MINE ? 'text-cyan-300' : 'text-slate-300'}`}>
                      <span className="font-mono text-slate-600 w-3 text-[9px]">{idx + 1}</span>
                      <span className="font-mono text-slate-500 text-[10px]">#{p.index}</span>
                      <span className="flex-1 truncate">{p.name}</span>
                      <StarRating value={p.rating||0} size="sm" readonly/>
                      <button onClick={(e) => { e.stopPropagation(); rmC(sl.id, id); }} className="text-slate-600 hover:text-red-400"><X size={9}/></button>
                    </div>
                  );
                })}
              </div>
              {editing === sl.id ? (
                <div className="mt-1 relative">
                  <input type="text" autoFocus value={search}
                    onChange={e => setSearch(e.target.value)}
                    onBlur={() => setTimeout(() => { setEditing(null); setSearch(''); }, 200)}
                    className="w-full bg-slate-900 border border-slate-700 rounded text-[11px] px-1.5 py-0.5 outline-none focus:border-slate-500"
                    placeholder="검색..."/>
                  {opts.length > 0 && (
                    <div className="absolute top-full mt-0.5 left-0 right-0 bg-slate-800 border border-slate-700 rounded shadow-lg z-30">
                      {opts.map(p => (
                        <button key={p.id} onMouseDown={(e) => e.preventDefault()}
                          onClick={() => addC(sl.id, p)}
                          className="w-full text-left px-2 py-1 hover:bg-slate-700 flex items-center gap-1.5 text-[11px]">
                          <span className="font-mono text-slate-500 text-[10px]">#{p.index}</span>
                          <span className="text-slate-200 truncate">{p.name}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <button onClick={() => setEditing(sl.id)}
                  className="mt-0.5 text-[9px] text-slate-600 hover:text-slate-400 flex items-center gap-0.5">
                  <Plus size={9}/> 추가
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MgrPanel({ managers, allPlayers, settings, onUpdate, onSetMy, onShowDiamond }) {
  // 감독별 포지션 분포 계산
  const distByMgr = useMemo(() => {
    const d = {};
    managers.forEach(m => {
      const counts = { P: 0, IF: 0, OF: 0, H: 0 };
      m.picks.forEach(pk => {
        const p = allPlayers.find(x => x.id === pk.playerId);
        if (!p) return;
        const main = p.positions || [];
        // 주포지션 기준으로 그룹 카운트
        const groups = new Set(main.map(pv => POS_BY_VALUE[pv]?.group).filter(Boolean));
        groups.forEach(g => { if (counts[g] !== undefined) counts[g]++; });
      });
      d[m.id] = counts;
    });
    return d;
  }, [managers, allPlayers]);

  return (
    <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-3">
      <div className="text-[10px] font-bold tracking-widest text-slate-300 uppercase mb-2 flex items-center gap-1">
        <Users size={12} className="text-cyan-400"/> 감독
      </div>
      <div className="space-y-1">
        {managers.map(m => {
          const me = m.id === settings.myManagerId;
          const low = m.remainP < 30;
          const dist = distByMgr[m.id] || { P:0, IF:0, OF:0, H:0 };
          return (
            <div key={m.id} className={`p-1.5 rounded-lg border ${me ? 'bg-cyan-950/30 border-cyan-500/40' : 'bg-slate-950/50 border-slate-800'}`}>
              <div className="flex items-center justify-between gap-1.5">
                <div className="flex items-center gap-1.5 min-w-0 flex-1">
                  <PlayerPhoto player={m} settings={settings} size={28}/>
                  <button onClick={() => onSetMy(m.id)}
                    className={`text-[8px] font-bold px-1 py-0.5 rounded flex-shrink-0 ${me ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-500 hover:bg-slate-700'}`}>
                    {me ? '나' : 'ME'}
                  </button>
                  <input type="text" value={m.name}
                    onChange={e => onUpdate(m.id, { ...m, name: e.target.value })}
                    className="bg-transparent text-xs text-slate-200 font-medium outline-none border-b border-transparent focus:border-slate-700 px-0.5 flex-1 min-w-0 truncate"/>
                </div>
                <div className="flex items-center gap-0.5 flex-shrink-0">
                  <input type="number" value={m.remainP}
                    onChange={e => onUpdate(m.id, { ...m, remainP: Number(e.target.value) || 0 })}
                    className={`w-10 bg-transparent text-[11px] font-mono text-right outline-none border-b border-slate-800 ${low ? 'text-red-400' : 'text-emerald-400'}`}/>
                  <span className="text-[9px] text-slate-500">P</span>
                </div>
              </div>
              {/* 포지션 분포 + 인덱스 입력 */}
              <div className="flex items-center gap-1.5 mt-1 text-[9px]">
                <input type="text" value={m.index || ''}
                  onChange={e => onUpdate(m.id, { ...m, index: e.target.value.trim() })}
                  className="w-9 bg-slate-900 border border-slate-800 rounded px-1 text-[9px] font-mono text-slate-500 text-center outline-none focus:border-slate-600"
                  placeholder="#"
                  title="프로필 사진 인덱스"/>
                <span className="text-slate-500">{m.picks.length}/12</span>
                <div className="flex items-center gap-1 font-mono">
                  <span className={dist.P > 0 ? 'text-sky-400 font-bold' : 'text-slate-700'}>P:{dist.P}</span>
                  <span className={dist.IF > 0 ? 'text-emerald-400 font-bold' : 'text-slate-700'}>IF:{dist.IF}</span>
                  <span className={dist.OF > 0 ? 'text-orange-400 font-bold' : 'text-slate-700'}>OF:{dist.OF}</span>
                  {dist.H > 0 && <span className="text-rose-400 font-bold">DH:{dist.H}</span>}
                </div>
                {m.picks.length > 0 && onShowDiamond && (
                  <button onClick={() => onShowDiamond(m)}
                    className="ml-auto px-1.5 py-0.5 rounded bg-slate-800 hover:bg-emerald-900/60 text-slate-400 hover:text-emerald-300 text-[9px] font-bold flex items-center gap-0.5"
                    title="로스터 다이아몬드 보기">
                    ⚾ 보기
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// LOG PANEL — 타임라인 + 라운드별 그룹 + 통계
// ============================================================
function LogPanel({ log, allPlayers, managers, onUndo, onClear }) {
  const [viewMode, setViewMode] = useState('timeline'); // timeline | round | stats

  const fmtTime = (ts) => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  };

  const pickLog = useMemo(() => log.filter(e => e.type === 'pick'), [log]);

  // 라운드별 그룹: managerId/pickIdx 기반 round 추출
  const roundGroups = useMemo(() => {
    const groups = {};
    ROUND_LABELS.forEach(r => groups[r] = []);

    // 감독별 picks 배열 만들고, 명시적 round 우선 + 빈 라운드 자동 채움
    managers.forEach(m => {
      if (m.id === 'UNKNOWN') return;
      const picks = m.picks || [];
      const usedRounds = new Set();
      const remainingIdxs = [];
      picks.forEach((p, i) => {
        if (p.round && ROUND_LABELS.includes(p.round)) {
          usedRounds.add(p.round);
        } else {
          remainingIdxs.push(i);
        }
      });
      let ri = 0;
      const pickToRound = {};
      picks.forEach((p, i) => {
        if (p.round && ROUND_LABELS.includes(p.round)) {
          pickToRound[i] = p.round;
        }
      });
      for (const r of ROUND_LABELS) {
        if (!usedRounds.has(r) && remainingIdxs[ri] !== undefined) {
          pickToRound[remainingIdxs[ri]] = r;
          ri++;
        }
      }
      picks.forEach((p, i) => {
        const r = pickToRound[i];
        if (r) {
          const player = allPlayers.find(x => x.id === p.playerId);
          if (player) groups[r].push({ player, manager: m, cost: p.cost || 0 });
        }
      });
    });

    return groups;
  }, [managers, allPlayers]);

  // 통계
  const stats = useMemo(() => {
    const totalPicks = pickLog.length;
    const totalSpent = pickLog.reduce((s, e) => s + (e.cost || 0), 0);
    const totalBonus = pickLog.reduce((s, e) => s + ((e.bonusIds?.length || 0) * (e.bonusAmount || 0)), 0);
    const avgCost = totalPicks > 0 ? Math.round(totalSpent / totalPicks * 10) / 10 : 0;
    const highCost = pickLog.reduce((max, e) => (e.cost || 0) > (max?.cost || 0) ? e : max, null);
    const highPlayer = highCost ? allPlayers.find(p => p.id === highCost.playerId) : null;
    return { totalPicks, totalSpent, totalBonus, avgCost, highCost, highPlayer };
  }, [pickLog, allPlayers]);

  return (
    <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-3">
      <div className="flex items-center justify-between mb-2">
        <div className="text-[10px] font-bold tracking-widest text-slate-300 uppercase flex items-center gap-1">
          <FileTxt size={12} className="text-purple-400"/> 드래프트 로그 ({log.length})
        </div>
        {log.length > 0 && (
          <button onClick={() => { if (confirm('로그 전체 삭제?')) onClear(); }}
            className="text-[9px] text-slate-500 hover:text-red-400 underline">삭제</button>
        )}
      </div>

      {/* 뷰 모드 탭 */}
      <div className="flex bg-slate-950/60 rounded p-0.5 mb-2">
        {[
          { v: 'timeline', l: '시간순' },
          { v: 'round', l: '라운드별' },
          { v: 'stats', l: '통계' }
        ].map(t => (
          <button key={t.v} onClick={() => setViewMode(t.v)}
            className={`flex-1 text-[10px] py-1 rounded-sm ${viewMode === t.v ? 'bg-slate-700 text-slate-100' : 'text-slate-500 hover:text-slate-300'}`}>
            {t.l}
          </button>
        ))}
      </div>

      {log.length === 0 ? (
        <div className="text-center text-slate-500 text-xs py-6">
          아직 기록이 없습니다<br/>
          <span className="text-slate-600 text-[10px]">LIVE 모드에서 픽을 마킹하면 자동 기록됩니다</span>
        </div>
      ) : viewMode === 'timeline' ? (
        // 시간순 (최신 위)
        <div className="space-y-1 max-h-[600px] overflow-y-auto scrollbar pr-1">
          {log.map((entry, idx) => {
            const player = entry.playerId ? allPlayers.find(p => p.id === entry.playerId) : null;
            const mgr = entry.managerId ? managers.find(m => m.id === entry.managerId) : null;
            const bonusMgrs = entry.bonusIds ? entry.bonusIds.map(id => managers.find(m => m.id === id)).filter(Boolean) : [];
            return (
              <div key={idx} className="bg-slate-950/60 border border-slate-800 rounded-md p-1.5 text-[11px] hover:bg-slate-900/60 group">
                <div className="flex items-center justify-between mb-0.5">
                  <span className="font-mono text-slate-600 text-[9px]">{fmtTime(entry.ts)}</span>
                  <div className="flex items-center gap-1">
                    {entry.type === 'pick' && (
                      <span className="text-[8px] px-1 py-0 rounded font-bold tracking-wider bg-red-500/20 text-red-300">PICK</span>
                    )}
                    {idx === 0 && onUndo && (
                      <button onClick={() => onUndo(entry)} className="text-[9px] text-amber-500 hover:text-amber-400 opacity-0 group-hover:opacity-100 underline">
                        되돌리기
                      </button>
                    )}
                  </div>
                </div>
                <div className="text-slate-200 flex items-center gap-1 flex-wrap">
                  <span className="font-mono text-slate-500 text-[10px]">#{player?.index || '?'}</span>
                  <span className="font-semibold truncate flex-1">{player?.name || '?'}</span>
                  {entry.cost > 0 && <span className="font-mono text-emerald-400 text-[10px]">{entry.cost}P</span>}
                </div>
                <div className="text-slate-400 text-[10px] mt-0.5">
                  → <span className="text-slate-200">{mgr?.name || '?'}</span>
                </div>
                {bonusMgrs.length > 0 && (
                  <div className="mt-1 pt-1 border-t border-slate-800/60">
                    <div className="text-[9px] text-amber-400 font-mono">위로 +{entry.bonusAmount || 5}P × {bonusMgrs.length}명:</div>
                    <div className="text-[9px] text-slate-400 truncate">{bonusMgrs.map(m => m.name).join(', ')}</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ) : viewMode === 'round' ? (
        // 라운드별 그룹
        <div className="space-y-2 max-h-[600px] overflow-y-auto scrollbar pr-1">
          {ROUND_LABELS.map(r => {
            const items = roundGroups[r] || [];
            const c = ROUND_COLORS[r];
            const total = items.reduce((s, x) => s + x.cost, 0);
            return (
              <div key={r} className={`border rounded ${c.border || 'border-slate-800'} overflow-hidden`}>
                <div className={`${c.head} px-2 py-1 flex items-center justify-between`}>
                  <span className="font-mono font-bold text-xs">{r}</span>
                  <div className="text-[10px] font-mono opacity-80">{items.length}픽 / {total}P</div>
                </div>
                {items.length === 0 ? (
                  <div className="text-[10px] text-slate-600 px-2 py-1.5 italic">아직 없음</div>
                ) : (
                  <div className="bg-slate-950/60 divide-y divide-slate-800/60">
                    {items.map((it, i) => (
                      <div key={i} className="px-2 py-1 flex items-center gap-1.5 text-[10px] hover:bg-slate-900/60">
                        <span className="font-mono text-slate-500 w-10 truncate">{it.manager.name.slice(0, 4)}</span>
                        <span className="font-mono text-slate-600 text-[9px]">#{it.player.index || '?'}</span>
                        <span className="text-slate-200 flex-1 truncate font-semibold">{it.player.name}</span>
                        <span className={`font-mono font-bold ${c.text}`}>{it.cost}P</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ) : (
        // 통계
        <div className="space-y-2 max-h-[600px] overflow-y-auto scrollbar pr-1 text-xs">
          <div className="bg-slate-950/60 rounded p-2 space-y-1">
            <div className="flex justify-between"><span className="text-slate-400">총 픽 수</span><span className="font-mono font-bold text-slate-100">{stats.totalPicks}</span></div>
            <div className="flex justify-between"><span className="text-slate-400">총 사용 P</span><span className="font-mono font-bold text-emerald-400">{stats.totalSpent}P</span></div>
            <div className="flex justify-between"><span className="text-slate-400">평균 입찰가</span><span className="font-mono font-bold text-slate-100">{stats.avgCost}P</span></div>
            <div className="flex justify-between border-t border-slate-800 pt-1"><span className="text-slate-400">위로 보너스 합계</span><span className="font-mono font-bold text-amber-400">{stats.totalBonus}P</span></div>
          </div>

          {stats.highPlayer && (
            <div className="bg-slate-950/60 rounded p-2">
              <div className="text-[10px] text-slate-500 mb-1 tracking-widest uppercase">최고가 픽</div>
              <div className="flex items-center gap-1.5">
                <span className="font-mono text-slate-600 text-[10px]">#{stats.highPlayer.index || '?'}</span>
                <span className="text-slate-100 font-semibold flex-1 truncate">{stats.highPlayer.name}</span>
                <span className="font-mono font-black text-emerald-400">{stats.highCost.cost}P</span>
              </div>
            </div>
          )}

          {/* 감독별 사용 P */}
          <div className="bg-slate-950/60 rounded p-2">
            <div className="text-[10px] text-slate-500 mb-1.5 tracking-widest uppercase">감독별 사용 P</div>
            <div className="space-y-0.5">
              {managers.filter(m => m.id !== 'UNKNOWN').map(m => {
                const used = (m.picks || []).reduce((s, p) => s + (p.cost || 0), 0);
                const pct = stats.totalSpent > 0 ? (used / stats.totalSpent * 100) : 0;
                return (
                  <div key={m.id}>
                    <div className="flex justify-between text-[10px]">
                      <span className="text-slate-300 truncate flex-1 mr-1">{m.name}</span>
                      <span className="font-mono text-slate-500">{m.picks.length}픽 · </span>
                      <span className="font-mono font-bold text-emerald-400 ml-1">{used}P</span>
                    </div>
                    <div className="h-1 bg-slate-800 rounded-full overflow-hidden mt-0.5">
                      <div className="h-full bg-emerald-500/60" style={{ width: `${pct}%` }}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// ROSTER DIAMOND — 감독 로스터를 야구 필드 그래픽으로 시각화
// ============================================================
function RosterDiamondModal({ manager, allPlayers, settings, onClose, onPlayerClick }) {
  if (!manager) return null;

  // 픽한 선수들을 포지션별로 배정 (주포지션 → 부포지션 순으로 할당)
  const assignments = useMemo(() => {
    const slots = { P: [], C: [], '1B': [], '2B': [], '3B': [], SS: [], LF: [], CF: [], RF: [], DH: [], BENCH: [] };
    const players = (manager.picks || [])
      .map(p => allPlayers.find(x => x.id === p.playerId))
      .filter(Boolean);

    // 1단계: 주포지션이 단 1개인 선수를 우선 그 포지션에 배정
    const assigned = new Set();
    players.forEach(p => {
      const main = p.positions || [];
      if (main.length === 1 && slots[main[0]]) {
        slots[main[0]].push(p);
        assigned.add(p.id);
      }
    });

    // 2단계: 주포지션이 여러 개인 선수는 비어있는 슬롯 우선
    players.forEach(p => {
      if (assigned.has(p.id)) return;
      const main = p.positions || [];
      for (const pos of main) {
        if (slots[pos] && slots[pos].length === 0) {
          slots[pos].push(p);
          assigned.add(p.id);
          break;
        }
      }
    });

    // 3단계: 남은 주포지션 선수는 첫 번째 주포지션에 (여러 명 쌓일 수 있음)
    players.forEach(p => {
      if (assigned.has(p.id)) return;
      const main = p.positions || [];
      if (main.length > 0 && slots[main[0]]) {
        slots[main[0]].push(p);
        assigned.add(p.id);
      }
    });

    // 4단계: 부포지션만 있는 선수는 빈 슬롯에
    players.forEach(p => {
      if (assigned.has(p.id)) return;
      const sub = p.subPositions || [];
      for (const pos of sub) {
        if (slots[pos] && slots[pos].length === 0) {
          slots[pos].push(p);
          assigned.add(p.id);
          break;
        }
      }
    });

    // 5단계: 어디에도 못 들어간 선수는 벤치
    players.forEach(p => {
      if (assigned.has(p.id)) return;
      slots.BENCH.push(p);
    });

    return slots;
  }, [manager, allPlayers]);

  // 다이아몬드 좌표 (SVG viewBox 800x600 기준)
  const positions = [
    { key: 'CF',  x: 400, y: 100, label: 'CF' },
    { key: 'LF',  x: 180, y: 160, label: 'LF' },
    { key: 'RF',  x: 620, y: 160, label: 'RF' },
    { key: '2B',  x: 320, y: 270, label: '2B' },
    { key: 'SS',  x: 480, y: 270, label: 'SS' },
    { key: '3B',  x: 200, y: 350, label: '3B' },
    { key: '1B',  x: 600, y: 350, label: '1B' },
    { key: 'P',   x: 400, y: 380, label: 'P' },
    { key: 'C',   x: 400, y: 500, label: 'C' },
    { key: 'DH',  x: 720, y: 530, label: 'DH' }
  ];

  const totalSpent = (manager.picks || []).reduce((s, p) => s + (p.cost || 0), 0);
  const photoUrl = manager.index ? settings.photoUrlTemplate.replace('{index}', manager.index) : '';

  const renderSlot = (key, x, y, label) => {
    const players = assignments[key] || [];
    const POS = POS_BY_VALUE[key];
    const colorClass = POS ? POS.color : 'text-slate-400';
    const bgClass = POS ? POS.bg : 'bg-slate-800';

    return (
      <g key={key}>
        {/* 포지션 박스 */}
        <foreignObject x={x - 75} y={y - 35} width="150" height="70">
          <div xmlns="http://www.w3.org/1999/xhtml" className={`rounded-lg border-2 ${players.length === 0 ? 'border-slate-700 border-dashed bg-slate-900/40' : 'border-slate-600 bg-slate-900/90'} p-1 h-full`}>
            <div className={`text-[10px] font-bold tracking-widest text-center ${colorClass} mb-0.5`}>{label}</div>
            {players.length === 0 ? (
              <div className="text-[9px] text-slate-600 text-center italic">비어있음</div>
            ) : (
              <div className="space-y-0.5">
                {players.slice(0, 2).map(p => (
                  <div key={p.id} onClick={() => onPlayerClick && onPlayerClick(p)}
                    className="flex items-center gap-1 cursor-pointer hover:bg-slate-800/60 rounded px-0.5">
                    <PlayerPhoto player={p} settings={settings} size={16}/>
                    <span className="text-[10px] text-slate-100 truncate font-semibold">{p.name}</span>
                  </div>
                ))}
                {players.length > 2 && (
                  <div className="text-[9px] text-slate-500 text-center">+{players.length - 2}명</div>
                )}
              </div>
            )}
          </div>
        </foreignObject>
      </g>
    );
  };

  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 anim-in" onClick={onClose}>
      <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-5xl w-full max-h-[92vh] flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
        {/* 헤더 */}
        <div className="px-4 py-3 border-b border-slate-700 flex items-center gap-3">
          {photoUrl && manager.index && <PlayerPhoto player={manager} settings={settings} size={48}/>}
          <div className="flex-1">
            <div className="text-base font-bold text-slate-100">{manager.name}</div>
            <div className="text-[11px] text-slate-500 font-mono">
              로스터 {(manager.picks || []).length}/11 · 사용 {totalSpent}P · 잔여 {manager.remainP}P
            </div>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1">
            <X size={20}/>
          </button>
        </div>

        {/* 다이아몬드 */}
        <div className="flex-1 overflow-auto p-4 bg-slate-950/40">
          <svg viewBox="0 0 800 620" className="w-full max-w-3xl mx-auto" xmlns="http://www.w3.org/2000/svg">
            {/* 외야 그라운드 (펜스) */}
            <path d="M 100,470 Q 100,200 400,80 Q 700,200 700,470 Z"
              fill="#1a3a1a" fillOpacity="0.3" stroke="#3a5a3a" strokeWidth="2"/>
            {/* 내야 다이아몬드 */}
            <path d="M 400,460 L 280,340 L 400,220 L 520,340 Z"
              fill="#8b6a3a" fillOpacity="0.25" stroke="#a07a4a" strokeWidth="2"/>
            {/* 마운드 원 */}
            <circle cx="400" cy="380" r="32" fill="#a07a4a" fillOpacity="0.4" stroke="#a07a4a" strokeWidth="1"/>
            {/* 홈플레이트 */}
            <polygon points="395,455 405,455 410,465 400,475 390,465" fill="#fff" fillOpacity="0.6"/>
            {/* 베이스 */}
            <rect x="395" y="335" width="10" height="10" transform="rotate(45 400 340)" fill="#fff" fillOpacity="0.5"/>
            <rect x="275" y="335" width="10" height="10" transform="rotate(45 280 340)" fill="#fff" fillOpacity="0.5"/>
            <rect x="515" y="335" width="10" height="10" transform="rotate(45 520 340)" fill="#fff" fillOpacity="0.5"/>

            {/* 포지션 슬롯 */}
            {positions.map(pos => renderSlot(pos.key, pos.x, pos.y, pos.label))}
          </svg>

          {/* 벤치 (어디에도 안 들어간 선수) */}
          {assignments.BENCH.length > 0 && (
            <div className="mt-4 max-w-3xl mx-auto bg-slate-900 border border-slate-700 rounded-lg p-3">
              <div className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">벤치 / 미배정 ({assignments.BENCH.length})</div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5">
                {assignments.BENCH.map(p => (
                  <div key={p.id} onClick={() => onPlayerClick && onPlayerClick(p)}
                    className="flex items-center gap-1.5 bg-slate-950/60 rounded p-1.5 cursor-pointer hover:bg-slate-800/60">
                    <PlayerPhoto player={p} settings={settings} size={24}/>
                    <div className="flex-1 min-w-0">
                      <div className="text-[11px] text-slate-100 font-semibold truncate">{p.name}</div>
                      <div className="text-[9px] text-slate-500 font-mono">{(p.positions||[]).join('/')}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="text-[10px] text-slate-600 mt-3 text-center italic max-w-3xl mx-auto">
            💡 주포지션 1개인 선수 우선 배정 → 다중 포지션 선수는 빈 슬롯 우선 → 부포지션 → 벤치. 한 포지션에 여러 명이면 처음 2명만 표시 (+N 표시).
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// DEPTH CHART MODAL — 야구장 다이아몬드 + 4슬롯(주전+백업3) + 내 픽 자동 추천
// ============================================================
function DepthChartModal({ depth, allPlayers, managers, myManagerId, statusMap, settings, onUpdateDepth, onClose, onPlayerClick }) {
  const [pickSlot, setPickSlot] = useState(null); // { key, idx }
  const [search, setSearch] = useState('');

  // 다이아몬드 좌표 (% 기반, 카드 다 컨테이너 안에 들어오도록 안쪽으로 배치)
  // 야구 정석: 타자 기준 2B는 우측 내야, SS는 좌측 내야
  const fieldPos = {
    CF:  { x: 50,  y: 13 },
    LF:  { x: 14,  y: 23 },
    RF:  { x: 86,  y: 23 },
    SS:  { x: 33,  y: 41 },
    '2B':{ x: 67,  y: 41 },
    '3B':{ x: 13,  y: 58 },
    '1B':{ x: 87,  y: 58 },
    P:   { x: 50,  y: 58 },
    C:   { x: 50,  y: 88 },
    DH:  { x: 87,  y: 88 }
  };

  const batterKeys = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

  // 픽 슬롯에 들어가는 ID: 선수(playerId) 또는 감독(managerId)
  const myManager = useMemo(() => managers?.find(m => m.id === myManagerId), [managers, myManagerId]);
  const findEntity = (id) => {
    if (!id) return null;
    return allPlayers.find(p => p.id === id) || (managers || []).find(m => m.id === id) || null;
  };
  const isManagerEntity = (id) => !!id && (managers || []).some(m => m.id === id);

  const allDepthIds = useMemo(() => {
    const ids = new Set();
    Object.values(depth || {}).forEach(arr => {
      (arr || []).forEach(id => { if (id) ids.add(id); });
    });
    return ids;
  }, [depth]);

  const minePicks = useMemo(() => {
    return allPlayers.filter(p => statusMap[p.id] === STATUS.MINE);
  }, [allPlayers, statusMap]);

  const bench = useMemo(() => {
    return minePicks.filter(p => !allDepthIds.has(p.id));
  }, [minePicks, allDepthIds]);

  const setSlot = (key, idx, playerId) => {
    onUpdateDepth(d => {
      const arr = [...(d[key] || ['','','',''])];
      arr[idx] = playerId;
      return { ...d, [key]: arr };
    });
  };

  // 드래그 드롭: 두 슬롯 간 선수 swap
  const handleSlotDrop = (from, to) => {
    if (!from || !to) return;
    if (from.key === to.key && from.idx === to.idx) return;
    onUpdateDepth(d => {
      const newD = { ...d };
      const arrFrom = [...(d[from.key] || ['','','',''])];
      const arrTo = from.key === to.key ? arrFrom : [...(d[to.key] || ['','','',''])];
      const tmpFrom = arrFrom[from.idx];
      const tmpTo = arrTo[to.idx];
      arrFrom[from.idx] = tmpTo;
      arrTo[to.idx] = tmpFrom;
      if (from.key === to.key) {
        newD[from.key] = arrFrom;
      } else {
        newD[from.key] = arrFrom;
        newD[to.key] = arrTo;
      }
      return newD;
    });
  };

  const slotPosition = pickSlot ? (
    pickSlot.key === 'P_starter' || pickSlot.key === 'P_sub' ? 'P' : pickSlot.key
  ) : null;

  const candidates = useMemo(() => {
    if (!pickSlot) return [];
    const q = search.trim().toLowerCase();
    const matchPos = (p) => {
      if (!slotPosition) return false;
      return (p.positions || []).includes(slotPosition) || (p.subPositions || []).includes(slotPosition);
    };
    const pool = myManager ? [myManager, ...allPlayers] : allPlayers;
    let arr = pool;
    if (q) {
      arr = arr.filter(p => {
        if (!p.name) return false;
        return p.name.toLowerCase().includes(q) || String(p.index || '').includes(q) || matchSearch(p.name, search);
      });
    }
    arr = [...arr].sort((a, b) => {
      const aIsMgr = a.id === myManagerId ? 1 : 0;
      const bIsMgr = b.id === myManagerId ? 1 : 0;
      if (aIsMgr !== bIsMgr) return bIsMgr - aIsMgr;
      // ★ 최우선: 내 픽 + 포지션 매칭 (둘 다 만족)
      const aBest = !aIsMgr && statusMap[a.id] === STATUS.MINE && matchPos(a) ? 1 : 0;
      const bBest = !bIsMgr && statusMap[b.id] === STATUS.MINE && matchPos(b) ? 1 : 0;
      if (aBest !== bBest) return bBest - aBest;
      const aMine = statusMap[a.id] === STATUS.MINE ? 1 : 0;
      const bMine = statusMap[b.id] === STATUS.MINE ? 1 : 0;
      if (aMine !== bMine) return bMine - aMine;
      const aPos = matchPos(a) ? 1 : 0;
      const bPos = matchPos(b) ? 1 : 0;
      if (aPos !== bPos) return bPos - aPos;
      return (b.rating || 0) - (a.rating || 0);
    });
    return arr.slice(0, q ? 24 : 18);
  }, [allPlayers, search, pickSlot, slotPosition, statusMap, myManager, myManagerId]);

  const slotStatusStyle = (entityId) => {
    if (!entityId) return { box: 'border-slate-700 border-dashed bg-slate-900/40', icon: null, textCls: 'text-slate-500' };
    // 감독 본인은 항상 "본인" 상태
    if (isManagerEntity(entityId)) {
      return { box: 'border-cyan-500/70 bg-cyan-950/40 ring-1 ring-cyan-500/40', icon: '👑', iconColor: 'text-cyan-300', textCls: 'text-cyan-100' };
    }
    const st = statusMap[entityId];
    if (st === STATUS.MINE) return { box: 'border-emerald-500/70 bg-emerald-950/40 ring-1 ring-emerald-500/40', icon: '✓', iconColor: 'text-emerald-400', textCls: 'text-slate-100' };
    if (st === STATUS.TAKEN) return { box: 'border-red-500/40 bg-red-950/30 opacity-65', icon: '✗', iconColor: 'text-red-400', textCls: 'text-slate-300 line-through' };
    return { box: 'border-slate-600 border-dashed bg-slate-900/70', icon: '🎯', iconColor: 'text-slate-500', textCls: 'text-slate-100' };
  };

  // 액션 버튼 (호버 시에만 표시)
  const ActionButtons = ({ slotKey, slotIdx, isActive }) => (
    <div className="flex gap-1 flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
      <button onClick={(e) => { e.stopPropagation(); setPickSlot(isActive ? null : { key: slotKey, idx: slotIdx }); }}
        className="w-6 h-6 rounded bg-slate-800 hover:bg-amber-700 text-slate-300 hover:text-amber-100 text-sm flex items-center justify-center border border-slate-700"
        title="교체">⟳</button>
      <button onClick={(e) => { e.stopPropagation(); setSlot(slotKey, slotIdx, ''); }}
        className="w-6 h-6 rounded bg-slate-800 hover:bg-red-900 text-slate-300 hover:text-red-200 text-sm flex items-center justify-center border border-slate-700"
        title="제거">×</button>
    </div>
  );

  // 드래그 드롭 핸들러 (재사용)
  const dragHandlers = (key, idx, hasPlayer) => ({
    draggable: hasPlayer,
    onDragStart: hasPlayer ? (e) => {
      e.dataTransfer.setData('application/json', JSON.stringify({ key, idx }));
      e.dataTransfer.effectAllowed = 'move';
    } : undefined,
    onDragOver: (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    },
    onDrop: (e) => {
      e.preventDefault();
      try {
        const data = JSON.parse(e.dataTransfer.getData('application/json'));
        if (data && data.key !== undefined && data.idx !== undefined) {
          handleSlotDrop(data, { key, idx });
        }
      } catch(err) {}
    }
  });

  // 주전 슬롯
  const renderStarter = (key, idx, label) => {
    const slotId = (depth[key] || [])[idx] || '';
    const player = slotId ? findEntity(slotId) : null;
    const isManager = slotId ? isManagerEntity(slotId) : false;
    const isActive = pickSlot && pickSlot.key === key && pickSlot.idx === idx;
    const s = slotStatusStyle(slotId);

    if (!player) {
      return (
        <button onClick={() => setPickSlot(isActive ? null : { key, idx })}
          {...dragHandlers(key, idx, false)}
          className={`w-full rounded-lg border-2 p-2 transition-all flex items-center justify-center ${isActive ? 'border-amber-400 bg-amber-950/30 ring-2 ring-amber-400' : 'border-slate-700 border-dashed bg-slate-900/40 hover:border-amber-500 hover:bg-amber-950/10'}`}
          style={{ minHeight: '64px' }}>
          <div className="text-center">
            <div className="text-[9px] font-mono text-slate-500 mb-0.5">{label}</div>
            <div className="text-xs text-slate-500">+ 추가</div>
          </div>
        </button>
      );
    }

    return (
      <div {...dragHandlers(key, idx, true)}
        className={`rounded-lg border-2 p-2 relative group cursor-move ${s.box} ${isActive ? 'ring-2 ring-amber-400' : ''}`}>
        <div className="flex items-start gap-2">
          <PlayerPhoto player={player} settings={settings} size={48}/>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1 mb-0.5">
              <span className="text-[9px] font-mono text-slate-500">{label}</span>
              {s.icon && <span className={`text-xs ${s.iconColor}`}>{s.icon}</span>}
              {isManager && <span className="text-[8px] font-bold tracking-wider text-cyan-300 bg-cyan-500/20 px-1 rounded">감독</span>}
            </div>
            <div className={`text-xs font-bold truncate ${isManager ? '' : 'cursor-pointer hover:underline'} ${s.textCls}`}
              onClick={() => !isManager && onPlayerClick && onPlayerClick(player)} title={player.name}>
              {player.name}
            </div>
            <div className="text-[9px] font-mono text-slate-500 flex items-center gap-1.5">
              {player.index && <span>#{player.index}</span>}
              {!isManager && player.rating > 0 && <span className="text-amber-400">★{player.rating}</span>}
            </div>
          </div>
          <ActionButtons slotKey={key} slotIdx={idx} isActive={isActive}/>
        </div>
      </div>
    );
  };

  // 백업 슬롯 (작지만 명확하게)
  const renderBackup = (key, idx) => {
    const slotId = (depth[key] || [])[idx] || '';
    const player = slotId ? findEntity(slotId) : null;
    const isManager = slotId ? isManagerEntity(slotId) : false;
    const isActive = pickSlot && pickSlot.key === key && pickSlot.idx === idx;
    const label = `B${idx}`;
    const s = slotStatusStyle(slotId);

    if (!player) {
      return (
        <button onClick={() => setPickSlot(isActive ? null : { key, idx })}
          {...dragHandlers(key, idx, false)}
          className={`w-full rounded border-2 px-2 py-1.5 transition-all flex items-center gap-2 ${isActive ? 'border-amber-400 bg-amber-950/30 ring-1 ring-amber-400' : 'border-slate-700 border-dashed bg-slate-900/40 hover:border-amber-500'}`}>
          <span className="text-[10px] font-mono font-bold text-slate-500 w-6">{label}</span>
          <div className="w-6 h-6 rounded bg-slate-800/60 border border-slate-700 flex items-center justify-center text-slate-500 text-sm">+</div>
          <span className="text-[10px] text-slate-500 italic flex-1 text-left">추가</span>
        </button>
      );
    }

    return (
      <div {...dragHandlers(key, idx, true)}
        className={`rounded border-2 px-1.5 py-1 relative group cursor-move ${s.box} ${isActive ? 'ring-1 ring-amber-400' : ''}`}>
        <div className="flex items-center gap-1.5">
          <span className="text-[10px] font-mono font-bold text-slate-500 w-6">{label}</span>
          <PlayerPhoto player={player} settings={settings} size={26}/>
          <div className="flex-1 min-w-0">
            <div className={`text-[11px] font-semibold truncate ${isManager ? '' : 'cursor-pointer hover:underline'} ${s.textCls}`}
              onClick={() => !isManager && onPlayerClick && onPlayerClick(player)} title={player.name}>
              {player.name}
            </div>
          </div>
          {isManager && <span className="text-[8px] font-bold tracking-wider text-cyan-300 bg-cyan-500/20 px-1 rounded flex-shrink-0">감독</span>}
          {!isManager && s.icon && <span className={`text-xs ${s.iconColor} flex-shrink-0`}>{s.icon}</span>}
          <ActionButtons slotKey={key} slotIdx={idx} isActive={isActive}/>
        </div>
      </div>
    );
  };

  // 한 포지션 카드
  const renderPosCard = (key) => {
    const pos = POS_BY_VALUE[key];
    const slots = depth[key] || ['', '', '', ''];
    // 백업 슬롯 진행적 표시: B1 항상, B2는 B1 차야, B3는 B2 차야
    const isPickActive = (idx) => pickSlot && pickSlot.key === key && pickSlot.idx === idx;
    const showB2 = !!slots[1] || isPickActive(2);
    const showB3 = !!slots[2] || isPickActive(3);

    return (
      <div className={`bg-slate-950/85 backdrop-blur rounded-lg border-2 ${pos.color.replace('text-','border-')}/40 p-1.5 shadow-2xl`}
        style={{ width: '218px' }}>
        <div className={`text-[10px] font-black tracking-widest text-center mb-1.5 ${pos.color}`}>
          {pos.short} · {pos.label || key}
        </div>
        {renderStarter(key, 0, '주전')}
        <div className="space-y-1 mt-1.5">
          {renderBackup(key, 1)}
          {showB2 && renderBackup(key, 2)}
          {showB3 && renderBackup(key, 3)}
        </div>
      </div>
    );
  };

  // 마운드의 1선발 표시 (P_starter[0]) — 컴팩트 카드
  const renderMound = () => {
    const slotId = (depth.P_starter || [])[0] || '';
    const player = slotId ? findEntity(slotId) : null;
    const isManager = slotId ? isManagerEntity(slotId) : false;
    const isActive = pickSlot && pickSlot.key === 'P_starter' && pickSlot.idx === 0;
    const s = slotStatusStyle(slotId);

    if (!player) {
      return (
        <button onClick={() => setPickSlot(isActive ? null : { key: 'P_starter', idx: 0 })}
          {...dragHandlers('P_starter', 0, false)}
          className={`rounded-xl border-2 p-2 transition-all backdrop-blur ${isActive ? 'border-amber-400 bg-amber-950/40 ring-2 ring-amber-400' : 'border-sky-400/60 border-dashed bg-gradient-to-b from-sky-950/40 to-slate-950/85 hover:border-sky-300'} shadow-2xl flex flex-col`}
          style={{ width: '200px', minHeight: '180px' }}>
          <div className="text-[11px] font-black tracking-widest text-sky-300 text-center mb-1.5">⚾ P · 1선발</div>
          <div className="flex-1 flex items-center justify-center">
            <div className="w-24 h-24 rounded-full bg-slate-900/60 border-2 border-dashed border-sky-500/40 flex items-center justify-center">
              <span className="text-3xl text-sky-500/60">+</span>
            </div>
          </div>
          <div className="text-[11px] text-slate-500 text-center mt-1.5">선수 추가</div>
        </button>
      );
    }

    return (
      <div {...dragHandlers('P_starter', 0, true)}
        className={`rounded-xl border-2 p-1.5 relative group cursor-move backdrop-blur ${isManager ? 'border-cyan-400 bg-gradient-to-b from-cyan-950/50 to-slate-950/95 ring-2 ring-cyan-500/40' : 'border-sky-400 bg-gradient-to-b from-sky-950/50 to-slate-950/95 ring-2 ring-sky-500/40'} ${isActive ? 'ring-2 ring-amber-400' : ''} shadow-2xl`}
        style={{ width: '200px' }}>
        {/* 헤더 */}
        <div className={`text-[11px] font-black tracking-widest text-center mb-1 ${isManager ? 'text-cyan-300' : 'text-sky-300'}`}>
          ⚾ P · 1선발
        </div>
        {/* 사진 */}
        <div className="relative mx-auto rounded-lg overflow-hidden border border-slate-700"
          style={{ width: '180px', height: '128px' }}>
          <div className="absolute inset-0 flex items-center justify-center bg-slate-900">
            <PlayerPhoto player={player} settings={settings} size={128}/>
          </div>
          {s.icon && (
            <div className={`absolute top-1 right-1 ${s.iconColor} text-sm bg-slate-950/80 rounded-full w-6 h-6 flex items-center justify-center`}>
              {s.icon}
            </div>
          )}
        </div>
        {/* 이름 + 정보 */}
        <div className="text-center mt-1.5">
          {isManager && <div className="mb-0.5"><span className="text-[9px] font-bold tracking-wider text-cyan-300 bg-cyan-500/20 px-1.5 py-0.5 rounded">👑 감독</span></div>}
          <div className={`text-sm font-black truncate ${isManager ? '' : 'cursor-pointer hover:underline'} ${s.textCls}`}
            onClick={() => !isManager && onPlayerClick && onPlayerClick(player)} title={player.name}>
            {player.name}
          </div>
          <div className="text-[10px] font-mono text-slate-400 mt-0.5 flex items-center justify-center gap-2">
            {player.index && <span>#{player.index}</span>}
            {!isManager && player.rating > 0 && <span className="text-amber-400">★{player.rating}</span>}
          </div>
        </div>
        {/* 액션 버튼 */}
        <div className="absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity flex gap-0.5">
          <button onClick={(e) => { e.stopPropagation(); setPickSlot(isActive ? null : { key: 'P_starter', idx: 0 }); }}
            className="w-6 h-6 rounded bg-slate-800 hover:bg-amber-700 text-slate-300 text-sm flex items-center justify-center border border-slate-700"
            title="교체">⟳</button>
          <button onClick={(e) => { e.stopPropagation(); setSlot('P_starter', 0, ''); }}
            className="w-6 h-6 rounded bg-slate-800 hover:bg-red-900 text-slate-300 text-sm flex items-center justify-center border border-slate-700"
            title="제거">×</button>
        </div>
      </div>
    );
  };

  const slotLabel = pickSlot ? (() => {
    if (pickSlot.key === 'P_starter') return `투수 주전 #${pickSlot.idx + 1}`;
    if (pickSlot.key === 'P_sub') return `투수 서브 #${pickSlot.idx + 1}`;
    const pos = POS_BY_VALUE[pickSlot.key];
    const slotName = pickSlot.idx === 0 ? '주전' : `백업${pickSlot.idx}`;
    return `${pos?.label || pickSlot.key} ${slotName}`;
  })() : null;

  return (
    <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex flex-col anim-in" onClick={onClose}>
      <div className="bg-slate-900 border border-slate-700 m-2 rounded-xl flex-1 flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
        {/* 헤더 */}
        <div className="px-4 py-2 border-b border-slate-700 flex items-center gap-3 flex-shrink-0">
          <div className="text-base font-bold text-slate-100 flex items-center gap-2">
            <span>📋</span> 내 뎁스차트
          </div>
          <div className="text-[11px] text-slate-500 flex items-center gap-2 flex-wrap">
            <span className="flex items-center gap-1"><span className="text-emerald-400">✓</span>내 픽 ({minePicks.length})</span>
            <span className="flex items-center gap-1"><span className="text-slate-500">🎯</span>노림</span>
            <span className="flex items-center gap-1"><span className="text-red-400">✗</span>놓침</span>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1 ml-auto">
            <X size={20}/>
          </button>
        </div>

        {/* 본문 (스크롤) */}
        <div className="flex-1 overflow-auto p-3 scrollbar bg-slate-950/40">
          {/* 야구장 다이아몬드 */}
          <div className="relative mx-auto" style={{ width: '100%', maxWidth: '1400px', height: '900px', minWidth: '1100px' }}>
            <svg viewBox="0 0 1400 900" className="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
              {/* 외야 (펜스 곡선) */}
              <path d="M 60,780 Q 60,230 700,143 Q 1340,230 1340,780 Z"
                fill="#1e3a1e" fillOpacity="0.25" stroke="#3a5a3a" strokeWidth="2"/>
              {/* 내야 다이아몬드 (홈은 C 위치, 베이스는 60% 라인) */}
              <path d="M 700,765 L 410,540 L 700,286 L 990,540 Z"
                fill="#8b6a3a" fillOpacity="0.18" stroke="#a07a4a" strokeWidth="2"/>
              {/* 마운드 (52%) */}
              <circle cx="700" cy="468" r="56" fill="#a07a4a" fillOpacity="0.25" stroke="#a07a4a" strokeWidth="1"/>
              {/* 홈 베이스 (C 위치) */}

              <div className="bg-slate-950/60 rounded-lg border border-sky-500/40 overflow-hidden">
                <div className="px-3 py-1.5 bg-sky-500/20 flex items-center justify-between">
                  <div className="text-xs font-bold text-sky-300">⚾ 주전 투수 (선발 로테이션)</div>
                  <div className="text-[10px] text-sky-400/70 font-mono">P · STARTER</div>
                </div>
                <div className="p-2 grid grid-cols-5 gap-2">
                  {[0,1,2,3,4].map(i => (
                    <div key={i}>{renderStarter('P_starter', i, `선발 #${i+1}`)}</div>
                  ))}
                </div>
              </div>
              <div className="bg-slate-950/60 rounded-lg border border-sky-700/40 overflow-hidden">
                <div className="px-3 py-1.5 bg-sky-700/20 flex items-center justify-between">
                  <div className="text-xs font-bold text-sky-200">🥎 서브 투수 (불펜·롱릴리프)</div>
                  <div className="text-[10px] text-sky-300/70 font-mono">P · SUB</div>
                </div>
                <div className="p-2 grid grid-cols-5 gap-2">
                  {[0,1,2,3,4].map(i => (
                    <div key={i}>{renderStarter('P_sub', i, `서브 #${i+1}`)}</div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* 벤치 */}
          <div className="mt-4 max-w-6xl mx-auto">
            <div className="text-[10px] tracking-widest text-slate-400 uppercase mb-2 font-bold flex items-center gap-2">
              🪑 벤치 / 미배정
              <span className="text-[10px] text-slate-500 normal-case tracking-normal">
                ({bench.length}명 · 내 픽인데 슬롯에 안 들어간 선수)
              </span>
            </div>
            {bench.length === 0 ? (
              <div className="text-[11px] text-slate-600 italic text-center py-3 bg-slate-950/40 rounded">
                벤치 비어있음 — 모든 내 픽 선수가 뎁스차트에 배치됨
              </div>
            ) : (
              <div className="grid grid-cols-3 md:grid-cols-6 lg:grid-cols-8 gap-1.5">
                {bench.map(p => (
                  <div key={p.id} className="bg-slate-900/70 border border-slate-700 rounded p-1 flex items-center gap-1.5 cursor-pointer hover:bg-slate-800"
                    onClick={() => onPlayerClick && onPlayerClick(p)}>
                    <PlayerPhoto player={p} settings={settings} size={26}/>
                    <div className="flex-1 min-w-0">
                      <div className="text-[10px] text-slate-100 font-semibold truncate">{p.name}</div>
                      <div className="text-[9px] text-slate-500 font-mono">{(p.positions||[]).join('/')}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* 검색 도크 */}
        {pickSlot && (
          <div className="border-t-2 border-amber-500 bg-slate-950 px-3 py-2 flex-shrink-0">
            <div className="flex items-center gap-3 mb-2">
              <div className="text-xs flex items-center gap-1.5">
                <span className="text-slate-500">슬롯:</span>
                <span className="text-amber-300 font-bold">{slotLabel}</span>
                {slotPosition && <span className="text-[9px] text-slate-600">({slotPosition} 포지션 우선 추천)</span>}
              </div>
              <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                placeholder="검색하지 않아도 내 픽 자동 추천 · 일본어→한국어 발음도 지원"
                autoFocus
                className="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100 outline-none focus:border-amber-500"/>
              <button onClick={() => { setPickSlot(null); setSearch(''); }}
                className="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs">
                취소
              </button>
            </div>
            {candidates.length > 0 ? (
              <div className="grid grid-cols-3 md:grid-cols-6 lg:grid-cols-9 gap-1 max-h-32 overflow-auto scrollbar">
                {candidates.map(p => {
                  const isMgr = isManagerEntity(p.id);
                  const st = statusMap[p.id];
                  const isMine = !isMgr && st === STATUS.MINE;
                  const isTaken = !isMgr && st === STATUS.TAKEN;
                  const matchPos = !isMgr && slotPosition && ((p.positions || []).includes(slotPosition) || (p.subPositions || []).includes(slotPosition));
                  const isBest = isMine && matchPos; // ★ 내 픽 + 포지션 모두 만족
                  const borderCls = isMgr ? 'border-cyan-500/70 bg-cyan-950/40'
                    : isBest ? 'border-amber-400 bg-emerald-950/60 ring-2 ring-amber-400'
                    : isMine ? 'border-emerald-500/70 bg-emerald-950/40'
                    : isTaken ? 'border-red-500/40 opacity-60'
                    : matchPos ? 'border-amber-500/40 bg-amber-950/20'
                    : 'border-slate-700 bg-slate-900';
                  return (
                    <button key={p.id}
                      onClick={() => { setSlot(pickSlot.key, pickSlot.idx, p.id); setPickSlot(null); setSearch(''); }}
                      className={`flex items-center gap-1.5 border rounded p-1 hover:brightness-125 text-left ${borderCls}`}>
                      <PlayerPhoto player={p} settings={settings} size={22}/>
                      <div className="flex-1 min-w-0">
                        <div className="text-[10px] text-slate-100 font-semibold truncate flex items-center gap-1">
                          {isBest && <span className="text-amber-300">★</span>}
                          {p.name}
                          {isMgr && <span className="text-[8px] text-cyan-300 bg-cyan-500/20 px-0.5 rounded">감독</span>}
                        </div>
                        <div className="text-[9px] text-slate-500 font-mono truncate flex items-center gap-1">
                          {isBest && <span className="text-amber-300 font-bold">추천</span>}
                          {!isMgr && (p.positions||[]).slice(0,3).join('/')}
                          {isMgr && '나(감독)'}
                          {isMine && !isBest && <span className="text-emerald-400 ml-auto">✓</span>}
                          {isBest && <span className="text-emerald-400 ml-auto">✓✓</span>}
                          {isTaken && <span className="text-red-400 ml-auto">✗</span>}
                          {isMgr && <span className="text-cyan-300 ml-auto">👑</span>}
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            ) : (
              <div className="text-[11px] text-slate-500 italic text-center py-2">
                {search ? '검색 결과 없음' : '추천할 선수가 없습니다'}
              </div>
            )}
            <div className="text-[9px] text-slate-600 italic mt-1">
              💡 <b className="text-emerald-400">내 픽</b> + <b className="text-amber-400">해당 포지션 가능 선수</b> 우선 추천. 별점 높은 순.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
// BUDGET PANEL — 라운드/섹션별 예산 계획 + 실사용 비교
// ============================================================
function BudgetPanel({ budget, myPicks, myStartP, onUpdateBudget }) {
  // 라운드별 실제 사용 P 계산 (pick.round 명시된 것 우선, 나머지는 순서대로)
  const usedByRound = useMemo(() => {
    const map = {};
    ROUND_LABELS.forEach(r => map[r] = 0);
    const picks = myPicks || [];
    const usedRounds = new Set();
    const remainingPickIdxs = [];

    picks.forEach((p, i) => {
      if (p.round && ROUND_LABELS.includes(p.round)) {
        map[p.round] = (map[p.round] || 0) + (p.cost || 0);
        usedRounds.add(p.round);
      } else {
        remainingPickIdxs.push(i);
      }
    });

    let ri = 0;
    for (const r of ROUND_LABELS) {
      if (!usedRounds.has(r) && remainingPickIdxs[ri] !== undefined) {
        map[r] = (map[r] || 0) + (picks[remainingPickIdxs[ri]].cost || 0);
        ri++;
      }
    }
    return map;
  }, [myPicks]);

  // 섹션 그룹 (S1, S2, S3, S4)
  const sectionGroups = [
    { name: 'S1', rounds: ['S1-1', 'S1-2'], color: ROUND_COLORS['S1-1'] },
    { name: 'S2', rounds: ['S2-1', 'S2-2'], color: ROUND_COLORS['S2-1'] },
    { name: 'S3', rounds: ['S3-1', 'S3-2', 'S3-3', 'S3-4'], color: ROUND_COLORS['S3-1'] },
    { name: 'S4', rounds: ['S4-1', 'S4-2', 'S4-3'], color: ROUND_COLORS['S4-1'] }
  ];

  // 합계 계산
  const totalPlan = Object.values(budget || {}).reduce((s, v) => s + (Number(v) || 0), 0);
  const totalUsed = Object.values(usedByRound).reduce((s, v) => s + v, 0);
  const myStart = myStartP || 150;

  return (
    <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-3">
      <div className="flex items-center justify-between mb-2">
        <div className="text-[10px] font-bold tracking-widest text-slate-300 uppercase flex items-center gap-1">
          💰 예산 계획
        </div>
        <button onClick={() => { if (confirm('예산 계획 전부 초기화?')) onUpdateBudget({}); }}
          className="text-[9px] text-slate-500 hover:text-slate-300">초기화</button>
      </div>

      {/* 전체 요약 */}
      <div className="bg-slate-950/60 rounded p-2 mb-2 text-xs space-y-1">
        <div className="flex justify-between"><span className="text-slate-400">시작 P</span><span className="font-mono font-bold text-slate-100">{myStart}</span></div>
        <div className="flex justify-between"><span className="text-slate-400">계획 합계</span>
          <span className={`font-mono font-bold ${totalPlan > myStart ? 'text-red-400' : 'text-cyan-400'}`}>
            {totalPlan}{totalPlan > myStart && ' ⚠'}
          </span>
        </div>
        <div className="flex justify-between"><span className="text-slate-400">실제 사용</span><span className="font-mono font-bold text-amber-400">{totalUsed}</span></div>
        <div className="flex justify-between border-t border-slate-800 pt-1"><span className="text-slate-400">계획 대비</span>
          <span className={`font-mono font-bold ${totalUsed > totalPlan ? 'text-red-400' : 'text-emerald-400'}`}>
            {totalUsed > totalPlan ? '+' : ''}{totalUsed - totalPlan}
          </span>
        </div>
      </div>

      {/* 섹션 그룹별 */}
      <div className="space-y-3">
        {sectionGroups.map(sg => {
          const sgPlan = sg.rounds.reduce((s, r) => s + (Number(budget?.[r]) || 0), 0);
          const sgUsed = sg.rounds.reduce((s, r) => s + (usedByRound[r] || 0), 0);
          const overPlan = sgUsed > sgPlan && sgPlan > 0;
          return (
            <div key={sg.name} className={`border rounded-lg overflow-hidden ${sg.color.border || 'border-slate-800'}`}>
              {/* 섹션 헤더 */}
              <div className={`${sg.color.head} px-2 py-1 flex justify-between items-center`}>
                <span className="text-xs font-bold">{sg.name}</span>
                <div className="text-[10px] font-mono flex gap-2">
                  <span>계획 <b>{sgPlan}P</b></span>
                  <span className="opacity-80">사용 <b>{sgUsed}P</b></span>
                  {sgPlan > 0 && (
                    <span className={overPlan ? 'text-red-300 font-bold' : 'text-emerald-300'}>
                      ({sgUsed - sgPlan > 0 ? '+' : ''}{sgUsed - sgPlan})
                    </span>
                  )}
                </div>
              </div>
              {/* 라운드별 입력 */}
              <div className="bg-slate-950/60 divide-y divide-slate-800">
                {sg.rounds.map(r => {
                  const used = usedByRound[r] || 0;
                  const plan = Number(budget?.[r]) || 0;
                  const diff = used - plan;
                  return (
                    <div key={r} className="flex items-center gap-1.5 px-2 py-1">
                      <span className={`text-[10px] font-mono font-bold w-12 ${sg.color.text}`}>{r}</span>
                      <input type="number" min="0" step="5"
                        value={budget?.[r] || ''}
                        onChange={e => onUpdateBudget({ ...budget, [r]: e.target.value })}
                        placeholder="0"
                        className="w-14 bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5 text-xs text-slate-100 font-mono text-right outline-none focus:border-slate-600"/>
                      <span className="text-[10px] text-slate-500 flex-1">계획</span>
                      <span className="text-[10px] text-slate-500">사용</span>
                      <span className="text-[10px] font-mono font-bold text-amber-400 w-8 text-right">{used}P</span>
                      {plan > 0 && (
                        <span className={`text-[9px] font-mono font-bold w-10 text-right ${diff > 0 ? 'text-red-400' : diff < 0 ? 'text-emerald-400' : 'text-slate-500'}`}>
                          {diff > 0 ? '+' : ''}{diff}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="text-[9px] text-slate-600 mt-2 leading-relaxed">
        💡 각 라운드의 입찰 계획 포인트를 입력하면 실제 사용량과 비교돼요. 빨강 = 초과, 초록 = 절약.
      </div>
    </div>
  );
}

// ============================================================
// TOP PICKS PANEL — 남아있는 선수 중 별점 높은 순 (포지션 그룹별)
// ============================================================
function TopPicksPanel({ topPicks, allPlayers, statusMap, settings, mode, onPlayerClick, onMarkMine, onMarkTaken }) {
  const [filter, setFilter] = useState('all'); // all | P | IF | OF | H
  const [minRating, setMinRating] = useState(3);
  const [limit, setLimit] = useState(20);
  const [favOnly, setFavOnly] = useState(false);

  const filtered = useMemo(() => {
    let arr = topPicks.filter(p => (p.rating || 0) >= minRating);
    if (favOnly) arr = arr.filter(p => p.favorite);
    if (filter !== 'all') {
      const sg = POS_SUBGROUPS.find(s => s.value === filter);
      const members = sg ? sg.members : [];
      arr = arr.filter(p => {
        const all = [...(p.positions||[]), ...(p.subPositions||[])];
        return all.some(pv => members.includes(pv));
      });
    }
    return arr.slice(0, limit);
  }, [topPicks, filter, minRating, limit, favOnly]);

  return (
    <div className="bg-slate-900/40 border border-slate-800 rounded-xl p-3">
      <div className="flex items-center justify-between mb-2">
        <div className="text-[10px] font-bold tracking-widest text-slate-300 uppercase flex items-center gap-1">
          <Zap size={12} className="text-amber-400"/> 우선 픽 ({filtered.length})
        </div>
        <button onClick={() => setFavOnly(f => !f)}
          className={`text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5 ${favOnly ? 'bg-rose-500/20 text-rose-300 ring-1 ring-rose-400/40' : 'bg-slate-800 text-slate-500 hover:text-slate-300'}`}
          title="즐겨찾기만 보기">
          <Heart size={10} fill={favOnly ? 'currentColor' : 'none'}/> {favOnly ? '즐찾' : '모두'}
        </button>
      </div>

      {/* 세분화 포지션 그룹 필터 - 2단 그리드 */}
      <div className="grid grid-cols-4 gap-0.5 mb-2">
        <button onClick={() => setFilter('all')}
          className={`text-[9px] py-1 rounded ${filter === 'all' ? 'bg-slate-700 text-slate-100 font-bold' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>
          전체
        </button>
        {POS_SUBGROUPS.map(sg => {
          // 그룹 멤버의 첫 포지션 색상 가져오기
          const firstPos = POS_BY_VALUE[sg.members[0]];
          const active = filter === sg.value;
          return (
            <button key={sg.value} onClick={() => setFilter(sg.value)}
              className={`text-[9px] py-1 rounded ${active ? `${firstPos.bg} ${firstPos.color} ring-1 ring-current font-bold` : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}
              title={sg.members.join(', ')}>
              {sg.label}
            </button>
          );
        })}
      </div>

      {/* 별점 슬라이더 */}
      <div className="flex items-center gap-2 mb-2 text-[10px] text-slate-500">
        <span>별점 ≥</span>
        <input type="range" min="0" max="5" step="0.5" value={minRating}
          onChange={e => setMinRating(Number(e.target.value))}
          className="flex-1 accent-amber-400"/>
        <span className="font-mono text-amber-400 w-6 text-right">{minRating}</span>
      </div>

      {/* 리스트 */}
      <div className="space-y-1 max-h-[500px] overflow-y-auto scrollbar -mr-1 pr-1">
        {filtered.length === 0 ? (
          <div className="text-center text-slate-500 text-xs py-6">조건에 맞는 선수가 없습니다</div>
        ) : filtered.map((p, idx) => {
          const main = p.positions || [];
          return (
            <div key={p.id} className="bg-slate-950/60 hover:bg-slate-900 border border-slate-800 rounded p-1.5 cursor-pointer transition-colors"
              onClick={() => onPlayerClick(p)}>
              <div className="flex items-center gap-1.5">
                <span className="text-[9px] font-mono text-slate-600 w-4 text-center">{idx + 1}</span>
                <PlayerPhoto player={p} settings={settings} size={28}/>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1">
                    {p.favorite && <Heart size={9} className="text-rose-400" fill="currentColor"/>}
                    <span className="text-[9px] font-mono text-slate-500">#{p.index}</span>
                    {main.slice(0, 3).map(pv => {
                      const po = POS_BY_VALUE[pv];
                      return po ? <span key={pv} className={`text-[9px] font-mono font-bold ${po.color}`}>{po.short}</span> : null;
                    })}
                    <span className="text-[8px] text-slate-600">{p.section}</span>
                  </div>
                  <div className="text-xs text-slate-100 font-semibold truncate">{p.name}</div>
                  <div className="flex items-center justify-between mt-0.5">
                    <StarRating value={p.rating || 0} size="sm" readonly/>
                    {p.targetP > 0 && <span className="text-[9px] font-mono text-emerald-400 font-bold">{p.targetP}P</span>}
                  </div>
                </div>
              </div>
              {mode === 'live' && (
                <div className="flex gap-1 mt-1 pt-1 border-t border-slate-800/60">
                  <button onClick={(e) => { e.stopPropagation(); onMarkMine(p); }}
                    className="flex-1 text-[9px] py-0.5 rounded bg-cyan-600/80 hover:bg-cyan-500 text-white font-bold">
                    내 픽
                  </button>
                  <button onClick={(e) => { e.stopPropagation(); onMarkTaken(p); }}
                    className="flex-1 text-[9px] py-0.5 rounded bg-red-600/60 hover:bg-red-600 text-white font-bold">
                    뽑힘
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {filtered.length >= limit && topPicks.length > limit && (
        <button onClick={() => setLimit(l => l + 20)}
          className="w-full mt-2 text-[10px] py-1 text-slate-500 hover:text-slate-300 border border-slate-800 rounded">
          더 보기
        </button>
      )}
    </div>
  );
}
