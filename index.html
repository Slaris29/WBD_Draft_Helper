<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBD 드래프트 헬퍼</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Noto Sans JP", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .input { width: 100%; background: rgb(15 23 42); border: 1px solid rgb(51 65 85); border-radius: 6px; padding: 6px 10px; color: rgb(226 232 240); font-size: 13px; outline: none; transition: border 0.12s; }
  .input:focus { border-color: rgb(148 163 184); }
  .btn { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: all 0.12s; cursor: pointer; border: none; letter-spacing: 0.2px; }
  .btn-primary { background: rgb(8 145 178); color: white; }
  .btn-primary:hover { background: rgb(14 165 233); }
  .btn-secondary { background: rgb(30 41 59); color: rgb(226 232 240); }
  .btn-secondary:hover { background: rgb(51 65 85); }
  .btn-danger { background: rgb(127 29 29); color: rgb(254 226 226); }
  .btn-danger:hover { background: rgb(153 27 27); }
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }
  .scrollbar::-webkit-scrollbar-thumb { background: rgb(51 65 85); border-radius: 3px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: rgb(71 85 105); }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .anim-in { animation: pop 0.18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .slide-in-r { animation: slideR 0.22s ease-out; }
  @keyframes slideR { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  kbd { background: rgb(30 41 59); border: 1px solid rgb(51 65 85); padding: 1px 6px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 11px; color: rgb(203 213 225); }
  .kbd { background: rgb(30 41 59); border: 1px solid rgb(51 65 85); padding: 1px 6px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 10px; color: rgb(203 213 225); display: inline-block; min-width: 14px; text-align: center; }
  ::selection { background: rgb(217 119 6); color: rgb(15 23 42); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

// ============================================================
// 모의드래프트 시뮬레이터 (IIFE 캡슐화 · helperPlayers props로 헬퍼 선수 데이터 연동)
// ============================================================
const SimApp = (function() {
  const { useState, useEffect, useMemo, useRef, Fragment } = React;
const __WBD_BUILD = 'BUILD_2026-06-11_AI_HUMAN_v2'; 
    const SEED_PLAYERS = [];

// ============================================================
// SHARED CONSTANTS / HELPERS
// ============================================================
const START_P = 150;
const COMFORT_BONUS = 5;
const PICK_STEP = 5;
const PHOTO_URL_DEFAULT = 'https://images.vrcbaseball.com/pfp/{index}.png';
const STORAGE_KEY = 'wbd-sim-v4h';

const SECTION_SLOTS = { S1: 2, S2: 2, S3: 4, S4: 3 };  // 한 감독 총 11명 (2+2+4+3)
const SECTION_LABELS = {
  'S1-1': '1차 1라운드 - 개별 입찰',
  'S1-2': '1차 2라운드 - 순서 입찰',
  'S2': '2차 - 6명 그룹 자유 입찰',
  'S3': '3차 - 3명 그룹 자유 입찰',
  'S4': '4차 - 잔여 순서 입찰',
  'finished': '드래프트 완료',
};
const SEASON_PRIORITY = {'25 FW KR':100,'25 Summer KR':90,'26 Season4 JP':80,'25 Season3 JP':70,'25 Summer JP':60,'25 Spring JP':50,'26 EN':40,'통산 KR':20};
const SECTION_KO = { S1: '1차(특A)', S2: '2차(A)', 'S3/4': '3차/4차' };

// (IIFE 내부에서 이미 가져옴)

const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const getPhoto = (p, tpl) => (tpl && p.index) ? tpl.replace('{index}', p.index) : null;

// ===== 헬퍼와 동일한 풍부한 표시 정보 (포지션/지역/별점/성적) =====
const POS_BY_VALUE_SIM = {
  P:  { short: 'P',  label: '투수', color: 'text-sky-400',     bg: 'bg-sky-500/15' },
  C:  { short: 'C',  label: '포수', color: 'text-amber-400',   bg: 'bg-amber-500/15' },
  '1B': { short: '1B', label: '1루', color: 'text-emerald-400', bg: 'bg-emerald-500/15' },
  '2B': { short: '2B', label: '2루', color: 'text-emerald-400', bg: 'bg-emerald-500/15' },
  '3B': { short: '3B', label: '3루', color: 'text-emerald-400', bg: 'bg-emerald-500/15' },
  SS: { short: 'SS', label: '유격', color: 'text-emerald-400', bg: 'bg-emerald-500/15' },
  LF: { short: 'LF', label: '좌익', color: 'text-orange-400',  bg: 'bg-orange-500/15' },
  CF: { short: 'CF', label: '중견', color: 'text-orange-400',  bg: 'bg-orange-500/15' },
  RF: { short: 'RF', label: '우익', color: 'text-orange-400',  bg: 'bg-orange-500/15' },
  DH: { short: 'DH', label: '지타', color: 'text-rose-400',    bg: 'bg-rose-500/15' }
};
const REGION_BY_VALUE_SIM = {
  KR: { label: 'KR', flag: '🇰🇷', color: 'text-rose-300',   bg: 'bg-rose-500/15',   border: 'border-rose-500/40' },
  JP: { label: 'JP', flag: '🇯🇵', color: 'text-violet-300', bg: 'bg-violet-500/15', border: 'border-violet-500/40' },
  EN: { label: 'EN', flag: '🌐', color: 'text-sky-300',    bg: 'bg-sky-500/15',    border: 'border-sky-500/40' }
};
const getStarColorSim = (r) => {
  if (r >= 4.5) return 'bg-gradient-to-b from-amber-300 to-amber-500';
  if (r >= 3.5) return 'bg-gradient-to-b from-red-400 to-red-600';
  if (r >= 2.5) return 'bg-gradient-to-b from-orange-400 to-orange-600';
  if (r >= 1.5) return 'bg-gradient-to-b from-yellow-600 to-yellow-700';
  if (r >= 0.5) return 'bg-slate-500';
  return 'bg-slate-800';
};
const HIT_KEYS_SIM = ['games','PA','AB','H','_2B','_3B','HR','RBI','R','SB','BB','SO','AVG','OBP','SLG','OPS','wOBA','wRC_plus','wRC','ISO','FPCT'];
const PIT_KEYS_SIM = ['games_p','IP','W','L','SV','HLD','QS','K','H_a','HR_a','ER','BB_p','HBP_p','WP','ERA','WHIP','ERA_plus','K_9','BB_9','K_pct','BB_pct'];
const isValidNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v)) && Number(v) !== 0;
const hasHitStatsSim = s => s && HIT_KEYS_SIM.some(k => isValidNum(s[k]));
const hasPitStatsSim = s => s && PIT_KEYS_SIM.some(k => isValidNum(s[k]));
const fmtRateSim = v => { const n = Number(v); return isNaN(n) ? '-' : n.toFixed(3).replace(/^0/, ''); };
const seasonPrioritySim = (s) => {
  if (!s) return 0;
  if (s.isCareer) return SEASON_PRIORITY['통산 KR'] || 20;
  return SEASON_PRIORITY[s.season] !== undefined ? SEASON_PRIORITY[s.season] : 10;
};
// 유효한 값이 있는 시즌 우선, 우선순위 정렬
const getDisplayStat = (stats) => {
  if (!Array.isArray(stats) || stats.length === 0) return null;
  const valid = stats.filter(s => hasHitStatsSim(s) || hasPitStatsSim(s));
  const pool = valid.length > 0 ? valid : stats;
  return [...pool].sort((a,b) => seasonPrioritySim(b) - seasonPrioritySim(a))[0];
};
// 헬퍼 player에서 시즌 데이터를 일관되게 꺼내기 (seedStats 또는 stats 둘 다 지원)
const getPlayerStats = (p) => p.seedStats || p.stats || [];

// ============================================================
// STAR RATING (read-only 미니)
// ============================================================
const StarRatingSim = ({ value = 0, size = 11 }) => {
  if (!value) return null;
  return (
    <span className="inline-flex items-center gap-0.5" style={{ height: size }}>
      {[0,1,2,3,4].map(i => {
        const filled = value >= i + 1;
        const half = !filled && value >= i + 0.5;
        return (
          <span key={i} className="relative inline-block" style={{ width: size, height: size }}>
            <svg viewBox="0 0 24 24" width={size} height={size} className="absolute inset-0 text-slate-700" fill="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            {filled && (
              <svg viewBox="0 0 24 24" width={size} height={size} className="absolute inset-0 text-amber-400" fill="currentColor">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            )}
            {half && (
              <span className="absolute inset-0 overflow-hidden" style={{ width: '50%' }}>
                <svg viewBox="0 0 24 24" width={size} height={size} className="text-amber-400" fill="currentColor">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
              </span>
            )}
          </span>
        );
      })}
    </span>
  );
};

// ============================================================
// PRESENTATIONAL
// ============================================================
const PlayerPhoto = memo(function PlayerPhoto({ player, photoTpl, size = 40 }) {
  const url = getPhoto(player, photoTpl);
  const [err, setErr] = useState(false);
  useEffect(() => { setErr(false); }, [url]);
  if (!url || err) {
    return <div className="rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 font-mono flex-shrink-0"
      style={{ width: size, height: size, fontSize: size < 30 ? 9 : 10 }}>
      {player?.index ? '#' + player.index : '⚾'}
    </div>;
  }
  return <img key={url} src={url} alt={player.name||''} onError={()=>setErr(true)} loading="lazy"
    className="rounded object-cover bg-slate-800 border border-slate-700 flex-shrink-0"
    style={{ width: size, height: size }}/>;
});

const MiniPlayerCard = ({ player, photoTpl, onClick, selected, dim, badge }) => {
  const stats = getPlayerStats(player);
  const ds = getDisplayStat(stats);
  const showHit = ds && hasHitStatsSim(ds);
  const showPit = ds && hasPitStatsSim(ds);
  const mainPos = player.positions || [];
  const subPos = player.subPositions || [];
  const region = REGION_BY_VALUE_SIM[player.region];
  return (
    <button onClick={onClick} disabled={!onClick}
      className={`flex items-center gap-2 p-2 rounded text-left w-full transition ${
        selected ? 'bg-emerald-700/40 border border-emerald-400' :
        dim ? 'bg-slate-900/30 border border-slate-800 opacity-40' :
        'bg-slate-900/60 border border-slate-700 hover:border-emerald-500'
      }`}>
      <PlayerPhoto player={player} photoTpl={photoTpl} size={40}/>
      <span className="flex-1 min-w-0 block">
        {/* 상단: 인덱스 + 지역 + 이름 */}
        <span className="flex items-center gap-1.5 mb-0.5">
          {player.index && <span className="text-[9px] font-mono text-slate-500 tabular-nums">#{player.index}</span>}
          {region && (
            <span className={`text-[8px] px-1 rounded font-mono font-bold ${region.color} ${region.bg} border ${region.border}`}>{region.label}</span>
          )}
          <span className="font-bold text-sm text-emerald-200 truncate">{player.name}</span>
        </span>
        {/* 중단: 주/부 포지션 */}
        <span className="flex items-center gap-1 flex-wrap">
          {mainPos.slice(0,4).map(pv => {
            const po = POS_BY_VALUE_SIM[pv];
            return po ? <span key={'m'+pv} className={`text-[9px] px-1 rounded font-mono font-bold ${po.color} bg-slate-800/80`}>{po.short}</span> : null;
          })}
          {subPos.length > 0 && (
            <>
              <span className="text-[8px] text-slate-600 font-mono">+</span>
              {subPos.slice(0,3).map(pv => {
                const po = POS_BY_VALUE_SIM[pv];
                return po ? <span key={'s'+pv} className={`text-[9px] font-mono font-bold ${po.color} opacity-60`}>{po.short}</span> : null;
              })}
            </>
          )}
        </span>
        {/* 하단: 간단 성적 */}
        {ds && (showHit || showPit) && (
          <span className="flex items-center gap-1.5 mt-1 text-[9px] font-mono">
            {ds.isCareer ? <span className="text-amber-400 font-bold">통산</span> : <span className="text-slate-500">{ds.season}</span>}
            {showHit && (
              <span className="text-slate-300">
                {ds.HR ? <><span className="text-orange-400 font-bold">{ds.HR}</span>HR </> : ''}
                {ds.AVG ? <span className="text-orange-300 font-bold">{fmtRateSim(ds.AVG)}</span> : ''}
              </span>
            )}
            {showPit && (
              <span className="text-slate-300">
                {ds.ERA ? <><span className="text-sky-400 font-bold">{Number(ds.ERA).toFixed(2)}</span> </> : ''}
                {ds.K ? <><span className="text-sky-300 font-bold">{ds.K}</span>K</> : ''}
              </span>
            )}
          </span>
        )}
      </span>
      {badge && <span className="text-xs flex-shrink-0">{badge}</span>}
    </button>
  );
};

// ============================================================
// CURRENT PLAYER BIG CARD (S1-1, S4 매물 표시용)
// ============================================================
const CurrentPlayerCard = ({ player, photoTpl, onOpenDetail, accent = 'amber', subtitle, sectionLabel }) => {
  const stats = getPlayerStats(player);
  const ds = getDisplayStat(stats);
  const showHit = ds && hasHitStatsSim(ds);
  const showPit = ds && hasPitStatsSim(ds);
  const mainPos = player.positions || [];
  const subPos = player.subPositions || [];
  const region = REGION_BY_VALUE_SIM[player.region];
  const ACCENTS = {
    amber: { wrap: 'from-amber-900/30 to-amber-800/20 border-amber-500/50', name: 'text-amber-200 hover:text-amber-100', secBg: 'bg-amber-700/40 text-amber-200', subTxt: 'text-amber-300/80' },
    blue:  { wrap: 'from-blue-900/30 to-blue-800/20 border-blue-500/50',   name: 'text-blue-200 hover:text-blue-100',   secBg: 'bg-blue-700/40 text-blue-200',   subTxt: 'text-blue-300/80' },
  };
  const A = ACCENTS[accent] || ACCENTS.amber;
  return (
    <div className={`bg-gradient-to-r ${A.wrap} border-2 rounded-lg p-5 mb-4`}>
      <div className="flex items-start gap-4">
        <button onClick={onOpenDetail} className="hover:scale-105 transition flex-shrink-0">
          <PlayerPhoto player={player} photoTpl={photoTpl} size={100}/>
        </button>
        <div className="flex-1 min-w-0">
          {/* 이름 줄: #인덱스 + 이름 */}
          <div className="flex items-baseline gap-2 mb-1 flex-wrap">
            {player.index && <span className="text-sm text-slate-400 font-mono">#{player.index}</span>}
            <button onClick={onOpenDetail} className={`text-3xl font-bold ${A.name} truncate`}>
              {player.name}
            </button>
          </div>
          {/* 섹션 + 지역 + 주포지션 + 부포지션 */}
          <div className="flex flex-wrap gap-1.5 text-xs mb-2 items-center">
            {sectionLabel && <span className={`px-2 py-0.5 rounded ${A.secBg}`}>{sectionLabel}</span>}
            {region && (
              <span className={`px-2 py-0.5 rounded font-bold ${region.color} ${region.bg} border ${region.border}`}>{region.flag} {region.label}</span>
            )}
            {mainPos.length > 0 && (
              <>
                <span className="text-[9px] text-slate-500 font-bold tracking-wider ml-1">주</span>
                {mainPos.slice(0, 5).map(pv => {
                  const po = POS_BY_VALUE_SIM[pv];
                  return po ? <span key={'m'+pv} className={`px-1.5 py-0.5 rounded font-mono font-bold ${po.color} ${po.bg} border border-current/30`}>{po.short}</span> : null;
                })}
              </>
            )}
            {subPos.length > 0 && (
              <>
                <span className="text-[9px] text-slate-500 font-bold tracking-wider ml-1">부</span>
                {subPos.slice(0, 4).map(pv => {
                  const po = POS_BY_VALUE_SIM[pv];
                  return po ? <span key={'s'+pv} className={`px-1.5 py-0.5 rounded font-mono font-bold ${po.color} bg-slate-800/60 opacity-75`}>{po.short}</span> : null;
                })}
              </>
            )}
          </div>
          {/* 간단 성적 */}
          {ds && (showHit || showPit) && (
            <div className="flex items-center flex-wrap gap-x-3 gap-y-1 text-[11px] font-mono mb-1.5">
              {ds.isCareer ? <span className="text-amber-400 font-bold">통산</span> : <span className="text-slate-400">{ds.season}</span>}
              {showHit && (
                <span className="text-slate-200 flex items-center flex-wrap gap-x-2 gap-y-0.5">
                  {ds.HR ? <span><span className="text-orange-400 font-bold">{ds.HR}</span><span className="text-slate-500">HR</span></span> : null}
                  {ds.AVG ? <span><span className="text-slate-500">AVG </span><span className="text-orange-300 font-bold">{fmtRateSim(ds.AVG)}</span></span> : null}
                  {ds.OPS ? <span><span className="text-slate-500">OPS </span><span className="font-bold">{fmtRateSim(ds.OPS)}</span></span> : null}
                  {ds.wRC_plus ? <span><span className="text-slate-500">wRC+ </span><span className="text-amber-300 font-bold">{Math.round(ds.wRC_plus)}</span></span> : null}
                  {ds.SB ? <span><span className="text-emerald-400 font-bold">{ds.SB}</span><span className="text-slate-500">SB</span></span> : null}
                </span>
              )}
              {showPit && (
                <span className="text-slate-200 flex items-center flex-wrap gap-x-2 gap-y-0.5">
                  {ds.ERA ? <span><span className="text-slate-500">ERA </span><span className="text-sky-300 font-bold">{Number(ds.ERA).toFixed(2)}</span></span> : null}
                  {ds.WHIP ? <span><span className="text-slate-500">WHIP </span><span className="font-bold">{Number(ds.WHIP).toFixed(2)}</span></span> : null}
                  {ds.K ? <span><span className="text-sky-400 font-bold">{ds.K}</span><span className="text-slate-500">K</span></span> : null}
                  {ds.IP ? <span><span className="text-slate-500">IP </span><span className="font-bold">{ds.IP}</span></span> : null}
                  {ds.ERA_plus ? <span><span className="text-slate-500">ERA+ </span><span className="text-amber-300 font-bold">{Math.round(ds.ERA_plus)}</span></span> : null}
                </span>
              )}
            </div>
          )}
          {/* 자기소개 1줄 */}
          {player.intro && (
            <button onClick={onOpenDetail} className="block text-[11px] text-slate-400 italic truncate text-left max-w-full hover:text-slate-300" title="클릭해서 전체 보기">
              💬 {player.intro.split('\n').filter(l => l.trim())[0] || ''}
            </button>
          )}
          {/* 부가 메시지 (무작위 추첨됨 등) */}
          {subtitle && <div className={`text-xs ${A.subTxt} mt-1`}>{subtitle}</div>}
        </div>
        <button onClick={onOpenDetail} className="text-xs text-slate-400 hover:text-slate-100 underline whitespace-nowrap flex-shrink-0" title="자세히 보기">
          상세 →
        </button>
      </div>
    </div>
  );
};

function PlayerDetailModal({ player, photoTpl, onClose }) {
  const stats = getPlayerStats(player);
  const [selectedSeasonIdx, setSelectedSeasonIdx] = useState(0);
  // 우선순위 정렬된 유효 시즌
  const sortedStats = useMemo(() => {
    const valid = stats.filter(s => hasHitStatsSim(s) || hasPitStatsSim(s));
    const pool = valid.length > 0 ? valid : stats;
    return [...pool].sort((a,b) => seasonPrioritySim(b) - seasonPrioritySim(a));
  }, [stats]);
  const stat = sortedStats[selectedSeasonIdx] || sortedStats[0] || null;
  const showHit = stat && hasHitStatsSim(stat);
  const showPit = stat && hasPitStatsSim(stat);
  const mainPos = player.positions || [];
  const subPos = player.subPositions || [];
  const region = REGION_BY_VALUE_SIM[player.region];
  return (
    <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="bg-slate-900 border border-slate-700 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        {/* 상단: 사진 + 이름 + 인덱스/지역/주포/부포 */}
        <div className="p-5 border-b border-slate-700 flex items-start gap-4">
          <PlayerPhoto player={player} photoTpl={photoTpl} size={88}/>
          <div className="flex-1 min-w-0">
            <div className="flex items-baseline gap-2 mb-2 flex-wrap">
              {player.index && <span className="text-xs text-slate-500 font-mono">#{player.index}</span>}
              <span className="text-2xl font-bold text-emerald-300 truncate">{player.name}</span>
            </div>
            <div className="flex flex-wrap gap-1 text-xs">
              {player.section && <span className="px-2 py-0.5 bg-emerald-700/40 text-emerald-200 rounded">{SECTION_KO[player.section]||player.section}</span>}
              {region && (
                <span className={`px-2 py-0.5 rounded font-bold ${region.color} ${region.bg} border ${region.border}`}>{region.flag} {region.label}</span>
              )}
            </div>
            {/* 포지션 - 주/부 명확히 구분 */}
            {(mainPos.length > 0 || subPos.length > 0) && (
              <div className="mt-2 space-y-1">
                {mainPos.length > 0 && (
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="text-[10px] text-slate-500 font-bold tracking-wider">주포지션</span>
                    {mainPos.map(pv => {
                      const po = POS_BY_VALUE_SIM[pv];
                      return po ? (
                        <span key={'m'+pv} className={`text-xs px-2 py-0.5 rounded font-mono font-bold ${po.color} ${po.bg} border border-current/30`}>{po.short} <span className="text-[9px] opacity-60">{po.label}</span></span>
                      ) : null;
                    })}
                  </div>
                )}
                {subPos.length > 0 && (
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="text-[10px] text-slate-500 font-bold tracking-wider">부포지션</span>
                    {subPos.map(pv => {
                      const po = POS_BY_VALUE_SIM[pv];
                      return po ? (
                        <span key={'s'+pv} className={`text-xs px-2 py-0.5 rounded font-mono font-bold ${po.color} bg-slate-800/60 opacity-75`}>{po.short}</span>
                      ) : null;
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl leading-none">×</button>
        </div>

        <div className="p-5 space-y-4">
          {/* 자기소개 */}
          {player.intro && (
            <div>
              <div className="text-xs font-bold text-slate-400 mb-1">📝 자기소개</div>
              <div className="text-sm text-slate-200 whitespace-pre-wrap bg-slate-800/50 rounded p-3 max-h-48 overflow-y-auto leading-relaxed">{player.intro}</div>
            </div>
          )}
          {/* 성적 - 다중 시즌 토글 */}
          {sortedStats.length > 0 && stat && (
            <div>
              <div className="text-xs font-bold text-slate-400 mb-1 flex items-center justify-between">
                <span>📊 주요 기록</span>
                {sortedStats.length > 1 && (
                  <span className="text-[10px] text-slate-500 font-normal">시즌 클릭으로 전환</span>
                )}
              </div>
              {sortedStats.length > 1 && (
                <div className="flex flex-wrap gap-1 mb-2">
                  {sortedStats.map((s, i) => (
                    <button key={i} onClick={() => setSelectedSeasonIdx(i)}
                      className={`text-[10px] px-2 py-0.5 rounded font-mono transition-colors ${
                        i === selectedSeasonIdx
                          ? 'bg-emerald-600 text-white font-bold'
                          : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                      } ${s.isCareer ? 'border border-amber-500/40' : ''}`}>
                      {s.isCareer ? '통산' : (s.season || '?')}
                    </button>
                  ))}
                </div>
              )}
              {showHit && (
                <div className="mb-2">
                  <div className="text-[10px] text-orange-400 font-bold mb-1">타격</div>
                  <div className="grid grid-cols-4 gap-2 bg-slate-800/50 rounded p-3 text-xs">
                    {stat.AVG !== undefined && isValidNum(stat.AVG) && <div><span className="text-slate-500">AVG</span> <b className="text-orange-300">{fmtRateSim(stat.AVG)}</b></div>}
                    {stat.OBP !== undefined && isValidNum(stat.OBP) && <div><span className="text-slate-500">OBP</span> <b>{fmtRateSim(stat.OBP)}</b></div>}
                    {stat.SLG !== undefined && isValidNum(stat.SLG) && <div><span className="text-slate-500">SLG</span> <b>{fmtRateSim(stat.SLG)}</b></div>}
                    {stat.OPS !== undefined && isValidNum(stat.OPS) && <div><span className="text-slate-500">OPS</span> <b>{fmtRateSim(stat.OPS)}</b></div>}
                    {stat.HR !== undefined && isValidNum(stat.HR) && <div><span className="text-slate-500">HR</span> <b className="text-orange-400">{stat.HR}</b></div>}
                    {stat.RBI !== undefined && isValidNum(stat.RBI) && <div><span className="text-slate-500">RBI</span> <b>{stat.RBI}</b></div>}
                    {stat.SB !== undefined && isValidNum(stat.SB) && <div><span className="text-slate-500">SB</span> <b>{stat.SB}</b></div>}
                    {stat.wRC_plus !== undefined && isValidNum(stat.wRC_plus) && <div><span className="text-slate-500">wRC+</span> <b className="text-amber-300">{Math.round(stat.wRC_plus)}</b></div>}
                    {stat.games !== undefined && isValidNum(stat.games) && <div><span className="text-slate-500">G</span> <b>{stat.games}</b></div>}
                    {stat.PA !== undefined && isValidNum(stat.PA) && <div><span className="text-slate-500">PA</span> <b>{stat.PA}</b></div>}
                    {stat.H !== undefined && isValidNum(stat.H) && <div><span className="text-slate-500">H</span> <b>{stat.H}</b></div>}
                    {stat.ISO !== undefined && isValidNum(stat.ISO) && <div><span className="text-slate-500">ISO</span> <b>{fmtRateSim(stat.ISO)}</b></div>}
                  </div>
                </div>
              )}
              {showPit && (
                <div>
                  <div className="text-[10px] text-sky-400 font-bold mb-1">투구</div>
                  <div className="grid grid-cols-4 gap-2 bg-slate-800/50 rounded p-3 text-xs">
                    {stat.ERA !== undefined && isValidNum(stat.ERA) && <div><span className="text-slate-500">ERA</span> <b className="text-sky-300">{Number(stat.ERA).toFixed(2)}</b></div>}
                    {stat.WHIP !== undefined && isValidNum(stat.WHIP) && <div><span className="text-slate-500">WHIP</span> <b>{Number(stat.WHIP).toFixed(2)}</b></div>}
                    {stat.ERA_plus !== undefined && isValidNum(stat.ERA_plus) && <div><span className="text-slate-500">ERA+</span> <b className="text-amber-300">{Math.round(stat.ERA_plus)}</b></div>}
                    {stat.K !== undefined && isValidNum(stat.K) && <div><span className="text-slate-500">K</span> <b className="text-sky-400">{stat.K}</b></div>}
                    {stat.IP !== undefined && isValidNum(stat.IP) && <div><span className="text-slate-500">IP</span> <b>{stat.IP}</b></div>}
                    {stat.W !== undefined && isValidNum(stat.W) && <div><span className="text-slate-500">W</span> <b>{stat.W}</b></div>}
                    {stat.L !== undefined && isValidNum(stat.L) && <div><span className="text-slate-500">L</span> <b>{stat.L}</b></div>}
                    {stat.SV !== undefined && isValidNum(stat.SV) && <div><span className="text-slate-500">SV</span> <b>{stat.SV}</b></div>}
                    {stat.K_9 !== undefined && isValidNum(stat.K_9) && <div><span className="text-slate-500">K/9</span> <b>{Number(stat.K_9).toFixed(2)}</b></div>}
                    {stat.BB_9 !== undefined && isValidNum(stat.BB_9) && <div><span className="text-slate-500">BB/9</span> <b>{Number(stat.BB_9).toFixed(2)}</b></div>}
                    {stat.QS !== undefined && isValidNum(stat.QS) && <div><span className="text-slate-500">QS</span> <b>{stat.QS}</b></div>}
                    {stat.HLD !== undefined && isValidNum(stat.HLD) && <div><span className="text-slate-500">HLD</span> <b>{stat.HLD}</b></div>}
                  </div>
                </div>
              )}
              {!showHit && !showPit && (
                <div className="text-xs text-slate-500 italic bg-slate-800/30 rounded p-3">기록된 성적이 없습니다</div>
              )}
            </div>
          )}
          {sortedStats.length === 0 && (
            <div className="text-xs text-slate-500 italic">성적 데이터 없음</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// QUICK INPUT 공통 컴포넌트 (간이 모드용)
// ============================================================
// 매물 1개용: [감독 다중 체크 - 1명 단독/2명+ 동률] + P + 위로
function QuickSimpleInput({ state, activeMgrIds, allowZero, onSubmit }) {
  const [pickMgrs, setPickMgrs] = useState([]);
  const [cost, setCost] = useState('');
  const [comfort, setComfort] = useState([]);
  const elig = state.managers.filter(m => activeMgrIds.includes(m.id));
  const togglePick = mid => {
    setPickMgrs(c => c.includes(mid) ? c.filter(x=>x!==mid) : [...c, mid]);
    setComfort(c => c.filter(x => x !== mid));  // 픽 감독은 위로에서 자동 제거
  };
  const toggleComfort = mid => setComfort(c => c.includes(mid) ? c.filter(x=>x!==mid) : [...c, mid]);
  const handle = () => {
    if (pickMgrs.length === 0) { alert('픽 감독 선택 (1명=단독, 2명+=동률)'); return; }
    const c = parseInt(cost || 0);
    if (!allowZero && c <= 0) { alert('이 섹션은 1P 이상'); return; }
    if (c % PICK_STEP !== 0) { alert(`${PICK_STEP}P 단위`); return; }
    for (const mid of pickMgrs) {
      const m = state.managers.find(mm => mm.id === mid);
      if (c > m.p) { alert(`${m.name}: 잔여 P (${m.p}) 초과`); return; }
    }
    let winner, autoComfort;
    if (pickMgrs.length === 1) {
      winner = pickMgrs[0];
      autoComfort = [];
    } else {
      // 동률 → 랜덤 1명 픽, 나머지 자동 위로
      winner = pickMgrs[Math.floor(Math.random() * pickMgrs.length)];
      autoComfort = pickMgrs.filter(mid => mid !== winner);
    }
    const allComfort = Array.from(new Set([...comfort, ...autoComfort]));
    onSubmit({ mgrId: winner, cost: c, comfortMgrs: allComfort });
    setPickMgrs([]); setCost(''); setComfort([]);
  };
  const isTie = pickMgrs.length >= 2;
  return (
    <div className="bg-slate-800/50 rounded-lg p-4">
      <div className="text-sm font-bold text-emerald-300 mb-1">⚡ 결과 입력 (간이)</div>
      <div className="text-xs text-slate-400 mb-3">1명 체크 = 단독 픽 · 2명 이상 = 동률 (🎲 랜덤 1명 픽 + 나머지 자동 위로)</div>

      <div className="mb-3">
        <div className="text-xs text-slate-400 mb-1.5">픽 감독 (활성 {elig.length}명 중 1~여러 명 · 동률은 다중 체크)</div>
        <div className="grid grid-cols-3 gap-1">
          {elig.map(m => (
            <label key={m.id} className={`flex items-center gap-1.5 p-1.5 rounded cursor-pointer text-xs ${pickMgrs.includes(m.id)?(isTie?'bg-purple-900/40 border border-purple-500':'bg-emerald-900/40 border border-emerald-500'):'bg-slate-900/60 border border-slate-700 hover:border-emerald-500'}`}>
              <input type="checkbox" checked={pickMgrs.includes(m.id)} onChange={()=>togglePick(m.id)}/>
              <span className="truncate">{m.name} ({m.p}P)</span>
            </label>
          ))}
        </div>
      </div>

      <div className="flex items-center gap-2 mb-3">
        <span className="text-xs text-slate-400 w-12">최종 P</span>
        <input type="number" min={0} step={PICK_STEP} value={cost} onChange={e=>setCost(e.target.value)}
          placeholder={allowZero?"0,5,10":"5,10..."} 
          className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm text-right focus:outline-none focus:border-emerald-500"/>
        <span className="text-xs text-slate-500">P {isTie && '(동률 풀 모두에서 차감)'}</span>
      </div>

      <div className="mb-3">
        <div className="text-xs text-slate-400 mb-1.5">💝 추가 위로 받은 감독 (각 +{COMFORT_BONUS}P) · 픽 감독 자동 제외 · 동률 시 못 받은 동률 후보는 자동 위로</div>
        {elig.filter(m => !pickMgrs.includes(m.id)).length === 0 ? (
          <div className="text-[10px] text-slate-500 italic bg-slate-900/40 p-2 rounded">위로 받을 활성 감독 없음</div>
        ) : (
          <div className="grid grid-cols-3 gap-1">
            {elig.filter(m => !pickMgrs.includes(m.id)).map(m => (
              <label key={m.id} className={`flex items-center gap-1.5 p-1.5 rounded cursor-pointer text-xs ${comfort.includes(m.id)?'bg-amber-900/40 border border-amber-600':'bg-slate-900/60 border border-slate-700 hover:border-amber-500'}`}>
                <input type="checkbox" checked={comfort.includes(m.id)} onChange={()=>toggleComfort(m.id)}/>
                <span className="truncate">{m.name}</span>
              </label>
            ))}
          </div>
        )}
      </div>

      <button onClick={handle} disabled={pickMgrs.length === 0}
        className={`w-full py-2.5 rounded font-bold text-sm text-white ${pickMgrs.length===0?'bg-slate-700 cursor-not-allowed':isTie?'bg-purple-600 hover:bg-purple-500':'bg-emerald-600 hover:bg-emerald-500'}`}>
        {pickMgrs.length === 0 ? '픽 감독 선택 필요' : isTie ? `🎲 동률 랜덤 픽 (${pickMgrs.length}명 중) → 다음` : '✅ 단독 픽 → 다음'}
      </button>
    </div>
  );
}

// 매물 N개용: 매물별 [감독 다중 체크 - 1명 단독/2명+ 동률] + P + 위로 + (S3 유찰)
function QuickMultiInput({ state, players, activeMgrIds, allowZero, showRelegation, onSubmit, onPickOne, onOpenDetail }) {
  const [matches, setMatches] = useState({});  // {playerId: {mgrIds: [...], cost}}
  const [comfort, setComfort] = useState([]);
  const [relegations, setRelegations] = useState({});
  const [expandedId, setExpandedId] = useState(null);  // 픽 UI 펼친 매물 ID
  const [search, setSearch] = useState('');
  const togglePickMgr = (pid, mid) => setMatches(m => {
    const cur = m[pid]?.mgrIds || [];
    const next = cur.includes(mid) ? cur.filter(x=>x!==mid) : [...cur, mid];
    return {...m, [pid]: {...(m[pid]||{}), mgrIds: next}};
  });
  const updateMatchCost = (pid, v) => setMatches(m => ({...m, [pid]: {...(m[pid]||{}), cost: v}}));
  const updateReleg = (pid, mid) => setRelegations(r => ({...r, [pid]: mid}));
  const toggleComfort = mid => setComfort(c => c.includes(mid) ? c.filter(x=>x!==mid) : [...c, mid]);
  const elig = state.managers.filter(m => activeMgrIds.includes(m.id));

  // 매물에 픽된 감독 ID들 (단독 + 동률 풀 합산)
  const allPickedMgrs = Object.values(matches).flatMap(m => m.mgrIds || []);

  // 검색 필터
  const filteredPlayers = useMemo(() => {
    if (!search.trim()) return players;
    const q = search.toLowerCase();
    return players.filter(p =>
      (p.name && p.name.toLowerCase().includes(q)) ||
      (p.index && String(p.index).includes(q)) ||
      (Array.isArray(p.positions) && p.positions.some(pv => {
        const po = POS_BY_VALUE_SIM[pv];
        return po && (po.short.toLowerCase().includes(q) || po.label.toLowerCase().includes(q));
      })) ||
      (p.region && (REGION_BY_VALUE_SIM[p.region]?.label.toLowerCase().includes(q)))
    );
  }, [players, search]);

  // ★ 매물 1개 즉시 처리 (순차 처리 모드)
  const handlePickOne = (pid) => {
    const m = matches[pid];
    const p = players.find(pp => pp.id === pid);
    if (!m || !m.mgrIds || m.mgrIds.length === 0) { alert('감독 선택 필요'); return; }
    const c = parseInt(m.cost || 0);
    if (!allowZero && c <= 0) { alert(`${p?.name}: 0P 불가`); return; }
    if (c % PICK_STEP !== 0) { alert(`${p?.name}: ${PICK_STEP}P 단위`); return; }
    for (const mid of m.mgrIds) {
      const mgr = state.managers.find(mm => mm.id === mid);
      if (c > mgr.p) { alert(`${p?.name}: ${mgr.name} 잔여 P 초과`); return; }
    }
    if (!onPickOne) return;
    const otherChecked = new Set();
    Object.entries(matches).forEach(([opid, om]) => {
      if (opid !== pid) (om.mgrIds || []).forEach(mid => otherChecked.add(mid));
    });
    onPickOne({ playerId: pid, mgrIds: m.mgrIds, cost: c, otherCheckedMgrIds: Array.from(otherChecked) });
    setMatches(s => { const ns = {...s}; delete ns[pid]; return ns; });
    setExpandedId(null);
  };

  const handle = () => {
    const matchList = [];
    const tieAutoComfort = [];
    for (const p of players) {
      const m = matches[p.id];
      if (!m || !m.mgrIds || m.mgrIds.length === 0) continue;
      const c = parseInt(m.cost || 0);
      if (!allowZero && c <= 0) { alert(`${p.name}: 0P 불가`); return; }
      if (c % PICK_STEP !== 0) { alert(`${p.name}: ${PICK_STEP}P 단위`); return; }
      for (const mid of m.mgrIds) {
        const mgr = state.managers.find(mm => mm.id === mid);
        if (c > mgr.p) { alert(`${p.name}: ${mgr.name} 잔여 P 초과`); return; }
      }
      let winner;
      if (m.mgrIds.length === 1) {
        winner = m.mgrIds[0];
      } else {
        winner = m.mgrIds[Math.floor(Math.random() * m.mgrIds.length)];
        m.mgrIds.filter(mid => mid !== winner).forEach(mid => tieAutoComfort.push(mid));
      }
      matchList.push({ playerId: p.id, mgrId: winner, cost: c });
    }
    const relegList = [];
    if (showRelegation) {
      for (const p of players) {
        if ((matches[p.id]?.mgrIds || []).length > 0) continue;
        const rmid = relegations[p.id];
        if (rmid) relegList.push({ playerId: p.id, mgrId: rmid });
      }
    }
    const allComfort = Array.from(new Set([...comfort, ...tieAutoComfort]));
    onSubmit({ matches: matchList, comfortMgrs: allComfort, relegations: relegList });
    setMatches({}); setComfort([]); setRelegations({}); setExpandedId(null);
  };

  // S4 같이 풀이 크면 그리드 모드 권장
  const useGrid = players.length > 9;

  return (
    <div className="bg-slate-800/50 rounded-lg p-4">
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <div className="text-sm font-bold text-emerald-300">⚡ 매물 목록 ({filteredPlayers.length}{filteredPlayers.length !== players.length ? `/${players.length}` : ''}명)</div>
        {players.length > 6 && (
          <input
            type="text" value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="🔎 이름·#·포지션·지역 검색"
            className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs w-56 focus:outline-none focus:border-emerald-500"/>
        )}
      </div>
      <div className="text-[11px] text-slate-400 mb-3">
        <b className="text-purple-300">📷 사진 클릭</b> = 픽 입력 펼치기 ·
        <b className="text-blue-300"> 📋 정보 영역 클릭</b> = 상세 정보 ·
        체크 1명=단독, 2명+=동률(랜덤)
      </div>

      <div className={useGrid ? "grid grid-cols-2 gap-2 mb-3" : "space-y-2 mb-3"}>
        {filteredPlayers.map(p => {
          const match = matches[p.id] || {mgrIds: [], cost: ''};
          const mgrIds = match.mgrIds || [];
          const isTie = mgrIds.length >= 2;
          const isPicked = mgrIds.length > 0;
          const isExpanded = expandedId === p.id;
          const canProcess = mgrIds.length > 0 && match.cost !== '' && match.cost !== undefined && !!onPickOne;
          const usedSingleMgrs = onPickOne ? [] : Object.values(matches).filter(m => (m.mgrIds||[]).length === 1).flatMap(m => m.mgrIds);
          const eligForThis = elig.filter(m => mgrIds.includes(m.id) || !usedSingleMgrs.includes(m.id));
          const stats = getPlayerStats(p);
          const ds = getDisplayStat(stats);
          const showHit = ds && hasHitStatsSim(ds);
          const showPit = ds && hasPitStatsSim(ds);
          const region = REGION_BY_VALUE_SIM[p.region];
          const mainPos = p.positions || [];
          const subPos = p.subPositions || [];

          return (
            <div key={p.id} className={`bg-slate-900/60 rounded-lg overflow-hidden transition-all ${
              isExpanded ? 'border-2 border-purple-500 shadow-lg shadow-purple-500/20' :
              isTie ? 'border border-purple-500/50' :
              isPicked ? 'border border-emerald-500/50' :
              'border border-slate-700/50'
            }`}>
              {/* 메인 카드: 사진 영역(=픽 토글) + 정보 영역(=모달) */}
              <div className="flex items-stretch gap-2 p-2">
                {/* 사진 클릭 → 픽 UI 펼치기 */}
                <button onClick={() => setExpandedId(isExpanded ? null : p.id)}
                  className={`flex-shrink-0 relative rounded overflow-hidden transition hover:ring-2 ${
                    isExpanded ? 'ring-2 ring-purple-400' : 'ring-1 ring-slate-700 hover:ring-purple-500'
                  }`}
                  title={isExpanded ? '픽 UI 접기' : '픽 입력 펼치기'}>
                  <PlayerPhoto player={p} photoTpl={state.photoTpl} size={useGrid ? 56 : 72}/>
                  {/* 상태 배지 */}
                  {isPicked && (
                    <div className={`absolute bottom-0 inset-x-0 text-[9px] text-center font-bold py-0.5 ${isTie ? 'bg-purple-700/95 text-purple-100' : 'bg-emerald-700/95 text-emerald-100'}`}>
                      {mgrIds.length === 1 ? '단독' : `동률${mgrIds.length}🎲`}
                    </div>
                  )}
                  {/* 호버 힌트 (선택 안 됐을 때만) */}
                  {!isPicked && !isExpanded && (

                        <span className="text-slate-300">
                          {ds.HR ? <><span className="text-orange-400 font-bold">{ds.HR}</span><span className="text-slate-500">HR </span></> : ''}
                          {ds.AVG ? <><span className="text-slate-500">AVG </span><span className="text-orange-300 font-bold">{fmtRateSim(ds.AVG)} </span></> : ''}
                          {ds.OPS ? <><span className="text-slate-500">OPS </span><span className="font-bold">{fmtRateSim(ds.OPS)} </span></> : ''}
                          {ds.wRC_plus ? <><span className="text-slate-500">wRC+ </span><span className="text-amber-300 font-bold">{Math.round(ds.wRC_plus)} </span></> : ''}

                      )}
                      {showPit && (
                        <span className="text-slate-300">
                          {ds.ERA ? <><span className="text-slate-500">ERA </span><span className="text-sky-300 font-bold">{Number(ds.ERA).toFixed(2)} </span></> : ''}
                          {ds.WHIP ? <><span className="text-slate-500">WHIP </span><span className="font-bold">{Number(ds.WHIP).toFixed(2)} </span></> : ''}
                          {ds.K ? <><span className="text-sky-400 font-bold">{ds.K}</span><span className="text-slate-500">K </span></> : ''}
                          {ds.ERA_plus ? <><span className="text-slate-500">ERA+ </span><span className="text-amber-300 font-bold">{Math.round(ds.ERA_plus)}</span></> : ''}
                        </span>
                      )}
                    </div>
                  )}
                  {p.intro && !useGrid && (
                    <div className="text-[10px] text-slate-500 italic truncate mt-0.5">💬 {p.intro.split('\n').filter(l => l.trim())[0] || ''}</div>
                  )}
                </button>
              </div>

              {/* expand 영역: 픽 입력 UI */}
              {isExpanded && (
                <div className="bg-slate-950/60 border-t border-purple-500/30 p-3 space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <div className="text-[11px] font-bold text-purple-300">📷 픽 입력 — {p.name}</div>
                    <button onClick={() => setExpandedId(null)} className="text-[10px] text-slate-500 hover:text-slate-300">접기 ×</button>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] text-slate-400">최종 P</span>
                    <input type="number" min={0} step={PICK_STEP} value={match.cost ?? ''} onChange={e=>updateMatchCost(p.id, e.target.value)}
                      placeholder={allowZero ? "0 이상 (5단위)" : "5 이상"}
                      className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-right focus:outline-none focus:border-emerald-500"/>
                    <span className="text-[10px] text-slate-500 w-16 text-center">
                      {mgrIds.length === 0 ? '미픽' : mgrIds.length === 1 ? '단독' : `동률 ${mgrIds.length}명 🎲`}
                    </span>
                    {onPickOne && (
                      <button onClick={() => handlePickOne(p.id)} disabled={!canProcess}
                        className={`text-[11px] px-3 py-1 rounded font-bold transition ${canProcess ? 'bg-purple-600 hover:bg-purple-500 text-white' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}
                        title="이 매물만 즉시 처리">
                        🎲 처리
                      </button>
                    )}
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-500 mb-1">감독 선택 (1명=단독 · 2명+=동률 랜덤)</div>
                    <div className="grid grid-cols-3 gap-1">
                      {eligForThis.map(m => (
                        <label key={m.id} className={`flex items-center gap-1 px-1.5 py-1 rounded cursor-pointer text-[10px] ${mgrIds.includes(m.id)?(isTie?'bg-purple-900/40 border border-purple-500':'bg-emerald-900/40 border border-emerald-500'):'bg-slate-800/50 border border-slate-700/50 hover:border-emerald-500'}`}>
                          <input type="checkbox" checked={mgrIds.includes(m.id)} onChange={()=>togglePickMgr(p.id, m.id)} className="scale-75"/>
                          <span className="truncate">{m.name} ({m.p})</span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {showRelegation && (
        <div className="bg-orange-900/20 border border-orange-700/40 rounded p-3 mb-3">
          <div className="text-xs font-bold text-orange-300 mb-2">🥉 유찰 처리 (안 가져간 매물 → 유찰 선수가 감독 선택, 0P)</div>
          {players.filter(p => (matches[p.id]?.mgrIds||[]).length === 0).length === 0 ? (
            <div className="text-[10px] text-slate-500 italic">유찰 매물 없음</div>
          ) : (
            <div className="space-y-1">
              {players.filter(p => (matches[p.id]?.mgrIds||[]).length === 0).map(p => {
                const pickedMgrs = Object.values(matches).flatMap(m => m.mgrIds||[]);
                const otherRelegMgrs = Object.entries(relegations).filter(([pid,mid]) => pid !== p.id && mid).map(([pid,mid]) => mid);
                const exclude = new Set([...pickedMgrs, ...otherRelegMgrs]);
                const relegElig = state.managers.filter(m => !exclude.has(m.id));
                return (
                  <div key={p.id} className="flex items-center gap-2">
                    <PlayerPhoto player={p} photoTpl={state.photoTpl} size={20}/>
                    <span className="text-xs flex-1 truncate">{p.name}</span>
                    <select value={relegations[p.id] || ''} onChange={e=>updateReleg(p.id, e.target.value)}
                      className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs w-36">
                      <option value="">— 유찰 (S4로) —</option>
                      {relegElig.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                    </select>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      <div className="mb-3">
        <div className="text-xs text-slate-400 mb-1.5">💝 추가 위로 받은 감독 (각 +{COMFORT_BONUS}P) · 픽 감독 자동 제외 · 동률 시 못 받은 동률 후보는 자동 위로</div>
        {elig.filter(m => !allPickedMgrs.includes(m.id)).length === 0 ? (
          <div className="text-[10px] text-slate-500 italic bg-slate-900/40 p-2 rounded">위로 받을 활성 감독 없음 (모든 활성 감독 픽 받음)</div>
        ) : (
          <div className="grid grid-cols-3 gap-1">
            {elig.filter(m => !allPickedMgrs.includes(m.id)).map(m => (
              <label key={m.id} className={`flex items-center gap-1.5 p-1.5 rounded cursor-pointer text-xs ${comfort.includes(m.id)?'bg-amber-900/40 border border-amber-600':'bg-slate-900/60 border border-slate-700 hover:border-amber-500'}`}>
                <input type="checkbox" checked={comfort.includes(m.id)} onChange={()=>toggleComfort(m.id)}/>
                <span className="truncate">{m.name}</span>
              </label>
            ))}
          </div>
        )}
      </div>

      <button onClick={handle}
        className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold text-sm">
        ✅ 결과 기록 (동률은 자동 랜덤 처리) → 다음
      </button>
    </div>
  );
}

// ============================================================
// S4 PICK LIST — 순서 입찰 픽 단계 큰 목록 (28명 풀 대응)
// ============================================================
function S4PickList({ state, players, curMgr, curCost, onPick, onOpenDetail }) {
  const [search, setSearch] = useState('');
  const [confirmId, setConfirmId] = useState(null);
  const filtered = useMemo(() => {
    if (!search.trim()) return players;
    const q = search.toLowerCase();
    return players.filter(p =>
      (p.name && p.name.toLowerCase().includes(q)) ||
      (p.index && String(p.index).includes(q)) ||
      (Array.isArray(p.positions) && p.positions.some(pv => {
        const po = POS_BY_VALUE_SIM[pv];
        return po && (po.short.toLowerCase().includes(q) || po.label.toLowerCase().includes(q));
      })) ||
      (p.region && (REGION_BY_VALUE_SIM[p.region]?.label.toLowerCase().includes(q)))
    );
  }, [players, search]);
  return (
    <div className="bg-slate-800/50 rounded-lg p-4">
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <div className="text-sm font-bold text-emerald-300">📋 매물 풀 ({filtered.length}{filtered.length !== players.length ? `/${players.length}` : ''}명) · 사진 클릭=픽 · 정보 클릭=상세</div>
        {players.length > 6 && (
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="🔎 이름·#·포지션·지역"
            className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs w-56 focus:outline-none focus:border-emerald-500"/>
        )}
      </div>
      <div className="grid grid-cols-2 gap-2">
        {filtered.map(p => {
          const stats = getPlayerStats(p);
          const ds = getDisplayStat(stats);
          const showHit = ds && hasHitStatsSim(ds);
          const showPit = ds && hasPitStatsSim(ds);
          const region = REGION_BY_VALUE_SIM[p.region];
          const mainPos = p.positions || [];
          const subPos = p.subPositions || [];
          const isConfirming = confirmId === p.id;
          return (
            <div key={p.id} className={`bg-slate-900/60 rounded-lg overflow-hidden border ${isConfirming ? 'border-2 border-amber-500' : 'border-slate-700/50'}`}>
              <div className="flex items-stretch gap-2 p-2">
                <button onClick={() => setConfirmId(isConfirming ? null : p.id)}
                  className={`flex-shrink-0 relative rounded overflow-hidden transition hover:ring-2 ${
                    isConfirming ? 'ring-2 ring-amber-400' : 'ring-1 ring-slate-700 hover:ring-emerald-500'
                  }`} title="픽하기">
                  <PlayerPhoto player={p} photoTpl={state.photoTpl} size={56}/>
                  {!isConfirming && (
                    <div className="absolute inset-0 bg-emerald-900/0 hover:bg-emerald-900/40 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                      <span className="text-[10px] font-bold text-emerald-100 bg-emerald-900/80 px-1.5 py-0.5 rounded">픽</span>
                    </div>
                  )}
                </button>
                <button onClick={() => onOpenDetail && onOpenDetail(p)}
                  className="flex-1 min-w-0 text-left hover:bg-slate-800/60 rounded p-1 -m-1 transition" title="상세 정보">
                  <div className="flex items-baseline gap-1.5 mb-1 flex-wrap">
                    {p.index && <span className="text-[10px] text-slate-500 font-mono">#{p.index}</span>}
                    <span className="font-bold text-sm text-emerald-200 truncate">{p.name}</span>
                    {region && <span className={`text-[8px] px-1 rounded font-mono font-bold ${region.color} ${region.bg} border ${region.border}`}>{region.label}</span>}
                  </div>
                  <div className="flex items-center gap-1 flex-wrap mb-1">
                    {mainPos.slice(0, 4).map(pv => {
                      const po = POS_BY_VALUE_SIM[pv];
                      return po ? <span key={'m'+pv} className={`text-[9px] px-1 rounded font-mono font-bold ${po.color} bg-slate-800/80`}>{po.short}</span> : null;
                    })}
                    {subPos.length > 0 && (
                      <>
                        <span className="text-[8px] text-slate-600">+</span>
                        {subPos.slice(0, 2).map(pv => {
                          const po = POS_BY_VALUE_SIM[pv];
                          return po ? <span key={'s'+pv} className={`text-[9px] font-mono font-bold ${po.color} opacity-60`}>{po.short}</span> : null;
                        })}
                      </>
                    )}
                  </div>
                  {ds && (showHit || showPit) && (
                    <div className="flex items-center flex-wrap gap-x-2 gap-y-0.5 text-[10px] font-mono">
                      {ds.isCareer ? <span className="text-amber-400 font-bold">통산</span> : <span className="text-slate-500">{ds.season}</span>}
                      {showHit && (
                        <span className="text-slate-300">
                          {ds.HR ? <><span className="text-orange-400 font-bold">{ds.HR}</span><span className="text-slate-500">HR </span></> : ''}
                          {ds.AVG ? <><span className="text-slate-500">AVG </span><span className="text-orange-300 font-bold">{fmtRateSim(ds.AVG)} </span></> : ''}
                          {ds.OPS ? <><span className="text-slate-500">OPS </span><span className="font-bold">{fmtRateSim(ds.OPS)} </span></> : ''}
                          {ds.wRC_plus ? <><span className="text-slate-500">wRC+ </span><span className="text-amber-300 font-bold">{Math.round(ds.wRC_plus)}</span></> : ''}
                        </span>
                      )}
                      {showPit && (
                        <span className="text-slate-300">
                          {ds.ERA ? <><span className="text-slate-500">ERA </span><span className="text-sky-300 font-bold">{Number(ds.ERA).toFixed(2)} </span></> : ''}
                          {ds.K ? <><span className="text-sky-400 font-bold">{ds.K}</span><span className="text-slate-500">K </span></> : ''}
                          {ds.ERA_plus ? <><span className="text-slate-500">ERA+ </span><span className="text-amber-300 font-bold">{Math.round(ds.ERA_plus)}</span></> : ''}
                        </span>
                      )}
                    </div>
                  )}
                </button>
              </div>
              {isConfirming && (
                <div className="bg-amber-950/50 border-t border-amber-500/30 p-2 flex items-center justify-between gap-2">
                  <div className="text-[11px] text-amber-200">
                    <b className="text-amber-300">{curMgr?.name}</b>{' → '}<b>{p.name}</b>{' '}
                    <span className="text-amber-100">{curCost}P</span>로 픽
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => { onPick(p.id); setConfirmId(null); }}
                      className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[11px] font-bold">
                      ✅ 확정
                    </button>
                    <button onClick={() => setConfirmId(null)}
                      className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px]">
                      취소
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SimDraftBoardModal({ state, onClose }) {
  // 픽 정보: managers[i].picks = [{ playerId, playerName, cost, round, ... }]
  // round 예: 'S1-1', 'S1-2', 'S2-1', ... 'S4-3'
  const allRounds = ['S1-1','S1-2','S2-1','S2-2','S3-1','S3-2','S3-3','S3-4','S4-1','S4-2','S4-3'];
  const roundColors = {
    'S1-1':'bg-cyan-500/20 text-cyan-200 border-cyan-500/40',
    'S1-2':'bg-cyan-500/15 text-cyan-300 border-cyan-500/30',
    'S2-1':'bg-violet-500/20 text-violet-200 border-violet-500/40',
    'S2-2':'bg-violet-500/15 text-violet-300 border-violet-500/30',
    'S3-1':'bg-amber-500/20 text-amber-200 border-amber-500/40',
    'S3-2':'bg-amber-500/18 text-amber-200 border-amber-500/35',
    'S3-3':'bg-amber-500/15 text-amber-300 border-amber-500/30',
    'S3-4':'bg-amber-500/12 text-amber-300 border-amber-500/25',
    'S4-1':'bg-rose-500/20 text-rose-200 border-rose-500/40',
    'S4-2':'bg-rose-500/15 text-rose-300 border-rose-500/30',
    'S4-3':'bg-rose-500/12 text-rose-300 border-rose-500/25'
  };
  // 그리드: 라운드(세로) × 감독(가로)
  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-3" onClick={onClose}>
      <div className="bg-slate-900 border border-slate-700 rounded-lg shadow-2xl w-full max-w-[1500px] max-h-[92vh] flex flex-col" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-4 border-b border-slate-700">
          <div>
            <div className="text-lg font-bold text-emerald-400">📋 드래프트 보드</div>
            <div className="text-xs text-slate-400 mt-0.5">9감독 라운드별 픽 현황 · 총 {state.managers.reduce((s,m)=>s+m.picks.length,0)}픽</div>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl leading-none px-2">×</button>
        </div>
        <div className="overflow-auto p-3">
          <table className="w-full text-xs border-collapse">
            <thead className="sticky top-0 bg-slate-900 z-10">
              <tr>
                <th className="text-left p-2 text-slate-400 border-b border-slate-700 w-16">라운드</th>
                {state.managers.map(m => (
                  <th key={m.id} className="text-left p-2 border-b border-slate-700 min-w-[120px]">
                    <div className="font-bold text-slate-100 truncate">{m.name}</div>
                    <div className="text-[10px] text-emerald-400 font-mono mt-0.5">{m.p}P · {m.picks.length}픽</div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {allRounds.map(rd => {
                // 이 라운드에 픽이 하나라도 있는 감독이 있는지
                const anyPick = state.managers.some(m => m.picks.some(p => p.round === rd));
                if (!anyPick) return null;
                return (
                  <tr key={rd} className="border-b border-slate-800/60">
                    <td className={"p-1.5 border-r border-slate-800 align-top"}>
                      <span className={"inline-block px-1.5 py-0.5 rounded text-[10px] font-bold border " + (roundColors[rd] || 'bg-slate-700/30 text-slate-300 border-slate-600')}>{rd}</span>
                    </td>
                    {state.managers.map(m => {
                      const picks = m.picks.filter(p => p.round === rd);
                      return (
                        <td key={m.id} className="p-1 align-top border-r border-slate-800/40">
                          {picks.length === 0 ? <span className="text-slate-700">·</span> :
                            picks.map((p, idx) => (
                              <div key={idx} className="bg-slate-800/50 rounded px-1.5 py-1 mb-1 flex items-center justify-between gap-1">
                                <span className="text-slate-100 truncate flex-1">{p.playerName || '?'}</span>
                                <span className="text-amber-300 font-mono text-[10px] font-bold flex-shrink-0">{p.cost}P</span>
                              </div>
                            ))
                          }
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
              {state.managers.every(m => m.picks.length === 0) && (
                <tr><td colSpan={state.managers.length+1} className="p-6 text-center text-slate-500">아직 픽 없음</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

              </div>
            );
          })}
        </div>
      </div>
      <div className="bg-slate-800/40 rounded p-3">
        <div className="text-xs font-bold text-slate-400 mb-2">📋 최근 로그 ({state.log.length})</div>
        <div className="space-y-1 text-[10.5px] max-h-80 overflow-y-auto">
          {state.log.length===0 ? <div className="text-slate-600 italic">아직 없음</div> :
            state.log.slice().reverse().slice(0,30).map((l,i) => (
              <div key={i} className="bg-slate-900/60 p-1 rounded flex items-center gap-1.5">
                <span className="text-purple-300 font-mono w-12 flex-shrink-0">{l.round}</span>
                <span className="text-emerald-300 truncate flex-1">{l.playerName}</span>
                <span className="text-slate-400 truncate max-w-[60px]">{l.winnerMgrName}</span>
                <span className="text-amber-300 font-bold">{l.cost}P</span>
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

// AI 입찰 시스템
// ============================================================
const AI_PERSONALITIES = {
  STAR_HUNTER:    { label: '스타 컬렉터',  mult: 1.10, starBoost: 1.30, noise: 0.18 },
  CONSERVATIVE:   { label: '안정형',       mult: 0.85, capRatio: 0.55,  noise: 0.12 },
  PITCHER_FIRST:  { label: '마운드 광',    mult: 1.00, pitcherMult: 1.40, noise: 0.15 },
  HITTER_FIRST:   { label: '타격 광',      mult: 1.00, hitterMult: 1.40, noise: 0.15 },
  VETERAN_LOVER:  { label: '통산 신뢰형',  mult: 1.00, careerWeight: 1.5, rookieExtraPenalty: 0.8, noise: 0.13 },
  ROOKIE_GAMBLER: { label: '도박꾼',       mult: 1.00, rookieMult: 1.20, noise: 0.40 },
  BALANCED:       { label: '균형형',       mult: 1.00, noise: 0.15 },
  POSITION_NICHE: { label: '포지션 광',    mult: 0.90, focusBonus: 1.50, noise: 0.18 }
};
const PERSONALITY_KEYS = Object.keys(AI_PERSONALITIES);

// 선수의 객관적 공개 가치 계산 (감독 무관, 0~50 정도 범위)
function computePublicValue(player, careerWeight = 1.0) {
  const stats = player.stats || player.seedStats || [];
  if (!stats.length) return { value: 0, isRookie: true, hit: 0, pit: 0 };
  const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  let hitScore = 0, pitScore = 0, hitCount = 0, pitCount = 0;
  stats.forEach(s => {
    const weight = s.isCareer ? careerWeight : 1.0;
    // 타격: AVG, OBP, SLG, HR 가중
    const avg = num(s.AVG), obp = num(s.OBP), slg = num(s.SLG), hr = num(s.HR);
    if (avg > 0 || obp > 0 || slg > 0) {
      hitScore += weight * (avg * 30 + obp * 25 + slg * 30 + Math.min(hr, 30) * 0.3);
      hitCount += weight;
    }
    // 투수: ERA, WHIP, IP, K 가중 (낮을수록 좋음)
    const era = num(s.ERA), whip = num(s.WHIP), ip = num(s.IP), k = num(s.K);
    if (era > 0 || whip > 0 || ip > 0) {
      const eraScore = era > 0 && era < 99 ? Math.max(0, 30 - era * 4) : 0;
      const whipScore = whip > 0 ? Math.max(0, 25 - whip * 12) : 0;
      pitScore += weight * (eraScore + whipScore + Math.min(ip, 100) * 0.15);
      pitCount += weight;
    }
  });
  const hit = hitCount > 0 ? hitScore / hitCount : 0;
  const pit = pitCount > 0 ? pitScore / pitCount : 0;
  // 타자/투수 둘 중 큰 점수 + 작은 점수 일부 (멀티 포지션 보너스)
  const value = Math.max(hit, pit) + Math.min(hit, pit) * 0.2;
  const isRookie = (hitCount + pitCount) < 1.5;
  return { value, isRookie, hit, pit };
}

// 포지션 희소성 (전체 선수 풀 기준)
function computePositionScarcity(allPlayers) {
  const counts = {};
  allPlayers.forEach(p => {
    if (p.takenBy) return;  // 이미 픽된 선수 제외
    (p.positions || []).forEach(pos => { counts[pos] = (counts[pos] || 0) + 1; });
  });
  const scarcity = {};
  Object.entries(counts).forEach(([pos, n]) => {
    scarcity[pos] = 1 + 8 / Math.max(1, n);  // 적을수록 가치 ↑ (최대 ×9)
  });
  return scarcity;
}

// AI 감독의 선수 관심도 (0~1): 진짜 원하면 1, 아예 관심 없으면 0
function computeInterest(player, manager, pub, allPlayers, allManagers) {
  const pKey = manager.personality || 'BALANCED';
  const pConf = AI_PERSONALITIES[pKey] || AI_PERSONALITIES.BALANCED;
  const posList = player.positions || [];
  const isP = posList.includes('P');
  const isFielder = posList.some(p => p !== 'P');

  let interest = 0.20;  // 기본 낮춤 (찜/로스터 보너스가 추가 신호라 베이스 ↓)

  // 선수 객관 가치 (성적 기반) — 가장 큰 신호
  if (pub.value >= 55) interest += 0.40;
  else if (pub.value >= 40) interest += 0.25;
  else if (pub.value >= 25) interest += 0.10;
  else if (pub.value < 15) interest -= 0.10;

  // === 찜 리스트 (드래프트 전 계획) — 사람의 일관된 의지 ===
  if (manager.targets) {
    const t = manager.targets;
    if (t.tier1 && t.tier1.includes(player.id)) interest += 0.30;       // 무조건 잡고 싶은 선수
    else if (t.tier2 && t.tier2.includes(player.id)) interest += 0.15;  // 노리는 선수
    else if (t.watch && t.watch.includes(player.id)) interest += 0.07;  // 관심 선수
    // 찜 1순위를 놓친 만큼 남은 찜에 절실해짐
    if (allPlayers && (t.tier1.includes(player.id) || t.tier2.includes(player.id))) {
      const missedT1 = t.tier1.filter(id => {
        const pp = allPlayers.find(x => x.id === id);
        return pp && pp.takenBy && pp.takenBy !== manager.id;
      }).length;
      interest += missedT1 * 0.04;
    }
  }

  // === 내 로스터 구멍 인식 ===
  if (manager.picks && manager.picks.length > 0 && allPlayers) {
    const myPosCount = {};
    let myPitchers = 0;
    manager.picks.forEach(pk => {
      const pp = allPlayers.find(x => x.id === pk.playerId);
      if (!pp) return;
      (pp.positions || []).forEach(pos => {
        myPosCount[pos] = (myPosCount[pos] || 0) + 1;
        if (pos === 'P') myPitchers++;
      });
    });
    // 이 선수 포지션이 내 로스터에 하나도 없으면 +
    const fillsHole = posList.some(pos => !myPosCount[pos]);
    if (fillsHole) interest += 0.06;
    // 모든 포지션이 이미 2명+ 과적재면 -
    const allStuffed = posList.length > 0 && posList.every(pos => (myPosCount[pos] || 0) >= 2);
    if (allStuffed) interest -= 0.12;
    // 투수 0명인데 픽 4개 이상 진행됐으면 투수 절실
    if (isP && myPitchers === 0 && manager.picks.length >= 4) interest += 0.12;
  }

  // === 경쟁 인식 (다른 감독들도 이 포지션 비었으면 수요 ↑ → 선점 심리) ===
  if (allManagers && allPlayers && posList.length > 0) {
    let demand = 0;
    allManagers.forEach(om => {
      if (om.id === manager.id || !om.picks) return;
      const omPos = {};
      om.picks.forEach(pk => {
        const pp = allPlayers.find(x => x.id === pk.playerId);
        if (pp) (pp.positions || []).forEach(pos => { omPos[pos] = 1; });
      });
      if (posList.some(pos => !omPos[pos])) demand++;
    });
    if (demand >= 5) interest += 0.03;  // 수요 많음 → 살짝 선점 심리
  }

  // 성격 매칭
  if (pConf.pitcherMult && isP) interest += 0.20;
  if (pConf.hitterMult && isFielder && !isP) interest += 0.20;
  if (pConf.focusBonus && manager.favPositions && manager.favPositions.length) {
    if (posList.some(p => manager.favPositions.includes(p))) interest += 0.30;
  }
  if (pConf.starBoost && pub.value >= 40) interest += 0.20;

  // 신규(데이터 부족) 처리
  if (pub.isRookie) {
    interest -= 0.20;
    if (pConf.rookieExtraPenalty) interest -= 0.10;
    if (pConf.rookieMult) interest += 0.30;  // 도박꾼은 신규 좋아함 (페널티 상쇄)
  }
  // 보수형: 전반적 관심 낮춤
  if (pConf.capRatio) interest -= 0.15;
  // 감독 개인 관심도 편향 (감독별로 다름)
  interest += (manager.interestBias || 0);
  // 노이즈 ±0.20 (찜 리스트가 일관성 제공하니 노이즈 약간 줄임)
  interest += (Math.random() - 0.5) * 0.40;
  // 0~1 클램프
  return Math.max(0, Math.min(1, interest));
}

// AI 감독의 한 선수에 대한 입찰 P 계산 (관심도 그라데이션)
function computeAIBid(player, manager, allPlayers, options = {}) {
  const pKey = manager.personality || 'BALANCED';
  const pConf = AI_PERSONALITIES[pKey] || AI_PERSONALITIES.BALANCED;
  const careerWeight = pConf.careerWeight || 1.0;
  const pub = computePublicValue(player, careerWeight);
  const interest = computeInterest(player, manager, pub, allPlayers, options.allManagers);
  const minBid = options.minBid || 5;  // 1라운드는 최소 5P (룰)

  // 관심도 그라데이션:
  //  0.00~0.25 : 안전 (5P 견제만)
  //  0.25~0.45 : 혹시 싸게? (5~10P)
  //  0.45~0.65 : 가벼운 본격 (10~15P 정도)
  //  0.65~0.85 : 본격 베팅 (15~22P)
  //  0.85+     : 핵심 (20~30P, 진짜 원함)
  let bid;
  const valueBase = Math.max(15, pub.value);  // 가치 기준선 (너무 낮은 가치도 베이스 보장)

  if (interest < 0.20) {
    // 매우 무관심: 거의 5P, 가끔 10P
    bid = Math.random() < 0.85 ? minBid : minBid + 5;
  } else if (interest < 0.45) {
    // 혹시 싸게: 5/10/15 분포 (5P가 가장 많음)
    const r = Math.random();
    bid = r < 0.45 ? minBid : (r < 0.85 ? minBid + 5 : minBid + 10);
  } else if (interest < 0.65) {
    // 가벼운 본격: 가치의 20~28%
    const ratio = 0.20 + ((interest - 0.45) / 0.20) * 0.08;
    bid = valueBase * ratio;
  } else if (interest < 0.85) {
    // 본격: 가치의 28~38%
    const ratio = 0.28 + ((interest - 0.65) / 0.20) * 0.10;
    bid = valueBase * ratio;
  } else {
    // 핵심: 가치의 38~52%
    const ratio = 0.38 + ((interest - 0.85) / 0.15) * 0.14;
    bid = valueBase * ratio;
  }

  // 본격 베팅(관심 0.45+)에만 추가 가중치 적용
  if (interest >= 0.45) {
    bid *= (pConf.mult || 1.0);
    bid *= (manager.bidScale || 1.0);
    // 잔여 P / 잔여 슬롯 적응: P가 평균 이상 남으면 베팅 ↑ (P 남기지 않으려는 본능)
    const totalSlots = 11;  // S1:2 + S2:2 + S3:4 + S4:3 (TARGET_PICKS)
    const filledSlots = (manager.picks || []).length;
    const slotsLeft = Math.max(1, totalSlots - filledSlots);
    const avgPerSlot = manager.p / slotsLeft;
    // 기준: 평균 12.5P/슬롯 (150P/12슬롯). 그 이상 남으면 베팅 강화
    const budgetMult = Math.max(0.75, Math.min(1.7, avgPerSlot / 12));
    bid *= budgetMult;
    // === 예산 계획 (감독의 머릿속 라운드별 배분) ===
    if (manager.budgetPlan && options.sectionKey) {
      const sk = options.sectionKey;  // 'S1' | 'S2' | 'S3' | 'S4'
      const planned = START_P * (manager.budgetPlan[sk] || 0.25);
      const spentInSection = (manager.picks || [])
        .filter(pk => (pk.round || '').startsWith(sk === 'S1' ? 'S1' : sk))
        .reduce((sum, pk) => sum + (pk.cost || 0), 0);
      const remainInPlan = planned - spentInSection;
      if (remainInPlan <= 0) bid *= 0.6;            // 계획 초과: 절제
      else if (remainInPlan < bid) bid *= 0.85;     // 계획 거의 소진: 약간 절제
      else if (remainInPlan > bid * 2.5) bid *= 1.05;  // 계획 많이 남음: 살짝 여유
    }
    // === 감정: 동률 패배 누적 → 분함 → 베팅 ↑ ===
    if (manager.frustration > 0) {
      bid *= 1 + Math.min(3, manager.frustration) * 0.05;  // 최대 +15%
    }
    // 포지션 약한 가중 (성적 우선이라 약하게)
    const isP = (player.positions || []).includes('P');
    if (isP && pConf.pitcherMult) bid *= 1 + (pConf.pitcherMult - 1) * 0.4;
    if (!isP && pConf.hitterMult) bid *= 1 + (pConf.hitterMult - 1) * 0.4;
    // 신규 페널티
    if (pub.isRookie) {
      bid *= 0.6;
      if (pConf.rookieMult) bid *= pConf.rookieMult / 0.6;
    }
    // 노이즈 ±45% (동률 줄이기 위해 분산 증가)
    const noise = 1 + (Math.random() - 0.5) * 0.90;
    bid *= noise;
    // 한 픽 최대 비율 캡
    const maxBidRatio = options.maxBidRatio || 0.22;
    bid = Math.min(bid, manager.p * maxBidRatio);
    // 보수형 추가 캡
    if (pConf.capRatio) bid = Math.min(bid, manager.p * pConf.capRatio);
  }

  // 5P 단위 확률 라운딩 (7.5P → 50% 5P, 50% 10P — 동률 줄임)
  const div = bid / 5;
  const floor = Math.floor(div) * 5;
  const frac = div - Math.floor(div);
  bid = (Math.random() < frac) ? floor + 5 : floor;
  // 최소/최대 클램프
  bid = Math.max(minBid, Math.min(bid, manager.p));
  return bid;
}

// 모든 감독에게 자동 입찰 적용 (활성 감독만, 사용자 제외 옵션)
function applyAIBidsToActive(state, activeMgrIds, players, options = {}) {
  const scarcity = computePositionScarcity(state.players);
  const excludeIds = new Set(options.excludeMgrIds || []);
  const bids = {};
  activeMgrIds.forEach(mid => {
    if (excludeIds.has(mid)) return;
    const mgr = state.managers.find(m => m.id === mid);
    if (!mgr) return;
    const targetPlayer = Array.isArray(players) ? players[0] : players;
    if (!targetPlayer) return;
    bids[mid] = computeAIBid(targetPlayer, mgr, state.players, {
      scarcity, minBid: options.minBid || 5, maxBidRatio: options.maxBidRatio,
      allManagers: state.managers, sectionKey: options.sectionKey
    });
  });
  return bids;
}

function createInitialState(customPlayers) {
  const MANAGER_NAMES = ['HANA_ARASHI', '濃いめのラー油', 'あおいぬ', '눈꽃', 'encounter v', 'Gonyong', '-라후이-', 'ke ro', '-Alta-'];
  const source = (customPlayers && customPlayers.length > 0) ? customPlayers : SEED_PLAYERS;
  const players = source.map((p,i)=>({...p, id:'P'+i, takenBy:null, cost:null, round:null}));
  // 성격별 라운드 예산 계획 (감독의 머릿속 계획)
  const BUDGET_PLANS = {
    STAR_HUNTER:    { S1: 0.52, S2: 0.22, S3: 0.16, S4: 0.10 },
    CONSERVATIVE:   { S1: 0.28, S2: 0.26, S3: 0.26, S4: 0.20 },
    PITCHER_FIRST:  { S1: 0.42, S2: 0.26, S3: 0.20, S4: 0.12 },
    HITTER_FIRST:   { S1: 0.42, S2: 0.26, S3: 0.20, S4: 0.12 },
    VETERAN_LOVER:  { S1: 0.38, S2: 0.28, S3: 0.20, S4: 0.14 },
    ROOKIE_GAMBLER: { S1: 0.32, S2: 0.24, S3: 0.26, S4: 0.18 },
    BALANCED:       { S1: 0.40, S2: 0.25, S3: 0.20, S4: 0.15 },
    POSITION_NICHE: { S1: 0.36, S2: 0.28, S3: 0.22, S4: 0.14 }
  };
  const managers = Array.from({length:9},(_,i)=>{
      const shuffled = [...PERSONALITY_KEYS].sort(() => Math.random() - 0.5);
      const personality = shuffled[i % shuffled.length];
      const allPos = ['P','C','1B','2B','3B','SS','LF','CF','RF'];
      const favPositions = personality === 'POSITION_NICHE' ? [allPos[Math.floor(Math.random() * allPos.length)]] : [];
      const bidScale = 0.7 + Math.random() * 0.6;
      const interestBias = (Math.random() - 0.5) * 0.20;
      return {
        id:'M'+i, name: MANAGER_NAMES[i] || `감독${i+1}`, p:START_P, picks:[],
        sectionCounts: {S1:0, S2:0, S3:0, S4:0},
        personality, favPositions, bidScale, interestBias,
        budgetPlan: BUDGET_PLANS[personality] || BUDGET_PLANS.BALANCED,
        frustration: 0  // 동률 패배 누적 (분함 → 다음 베팅 ↑)
      };
    });
  // === 드래프트 전 찜 리스트: 각 AI 감독이 전체 선수를 자기 기준으로 평가 ===
  managers.forEach(m => {
    const pConf = AI_PERSONALITIES[m.personality] || AI_PERSONALITIES.BALANCED;
    const scored = players.map(p => {
      const pub = computePublicValue(p, pConf.careerWeight || 1.0);
      let score = pub.value;
      const posL = p.positions || [];
      const isP = posL.includes('P');
      // 성격 취향 반영
      if (isP && pConf.pitcherMult) score *= pConf.pitcherMult;
      if (!isP && pConf.hitterMult) score *= pConf.hitterMult;
      if (pConf.focusBonus && m.favPositions.length && posL.some(x => m.favPositions.includes(x))) score *= 1.4;
      if (pub.isRookie) score *= pConf.rookieMult ? 1.1 : 0.55;
      // 개인 취향 노이즈 (감독마다 다른 찜)
      score *= 1 + (Math.random() - 0.5) * 0.5;
      return { id: p.id, score };
    }).sort((a, b) => b.score - a.score);
    m.targets = {
      tier1: scored.slice(0, 3).map(x => x.id),      // 무조건 잡고 싶은 3명
      tier2: scored.slice(3, 8).map(x => x.id),      // 나오면 노리는 5명
      watch: scored.slice(8, 18).map(x => x.id)      // 관심 10명
    };
  });
  return {
    myManagerId: null,  // 사용자 감독 ID (Setup에서 지정)
    players,
    managers,
    photoTpl: PHOTO_URL_DEFAULT,
    phase: 'setup',
    mode: 'detailed',  // 'detailed' | 'quick'
    section: 'S1-1',

    // 간이 모드
    quick_section_idx: 0,  // 0:S1-1, 1:S1-2, 2:S2, 3:S3, 4:S4
    quick_results: {},     // { playerId: {mgrId, cost} }

    // S1-1
    s1_1_cycle: 0,
    s1_1_currentPlayerId: null,
    s1_1_bids: {},
    s1_1_tieStage: 0,
    s1_1_tieList: [],
    s1_1_tieBids: {},

    // S1-2
    s1_2_step: 'bid',
    s1_2_bids: {},
    s1_2_groups: [],
    s1_2_currentGroupIdx: 0,
    s1_2_groupSelections: {},
    s1_2_currentTie: null,
    s1_2_tieBids: {},
    s1_2_currentGroupMgrs: [],  // 현재 그룹에서 아직 픽 못한 감독 ids

    // S2
    s2_group_idx: 0,
    s2_step: 'lot',
    s2_currentLot: [],
    s2_bids: {},
    s2_tieQueue: [],
    s2_currentTie: null,
    s2_tieBids: {},
    s2_inRelegation: false,
    s2_relegPool: [],

    // S3
    s3_pool: [],
    s3_group_idx: 0,
    s3_step: 'lot',
    s3_currentLot: [],
    s3_bids: {},
    s3_tieQueue: [],
    s3_currentTie: null,

  };
}

// 픽 적용 헬퍼
function applyPickStateUpdate(s, winnerMgrId, playerId, cost, round, comfortMgrIds, sectionKey) {
  const player = s.players.find(p => p.id === playerId);
  const newPlayers = s.players.map(p => p.id === playerId
    ? {...p, takenBy: winnerMgrId, cost, round} : p);
  const newManagers = s.managers.map(m => {
    if (m.id === winnerMgrId) {
      return {
        ...m, p: m.p - cost,
        picks: [...m.picks, { playerId, playerName: player?.name, cost, round }],
        sectionCounts: {...m.sectionCounts, [sectionKey]: m.sectionCounts[sectionKey] + 1},
        frustration: 0  // 픽 성공 → 분함 해소
      };
    } else if (comfortMgrIds.includes(m.id)) {
      // 동률 패배 (선수가 다른 팀 선택) → 위로 P + 분함 +1
      return {...m, p: m.p + COMFORT_BONUS, frustration: Math.min(3, (m.frustration || 0) + 1)};
    }
    return m;
  });
  const newLog = [...s.log, {
    round, playerId, playerName: player?.name,
    winnerMgrId, winnerMgrName: s.managers.find(m=>m.id===winnerMgrId)?.name,
    cost, comfort: comfortMgrIds,
  }];
  return {...s, players: newPlayers, managers: newManagers, log: newLog};
}

// 자유 픽 적용 (S3 유찰: 입찰 없이 선수가 감독 선택)
function applyFreePick(s, mgrId, playerId, round, sectionKey) {
  const player = s.players.find(p => p.id === playerId);
  const newPlayers = s.players.map(p => p.id === playerId
    ? {...p, takenBy: mgrId, cost: 0, round} : p);
  const newManagers = s.managers.map(m => m.id === mgrId
    ? {...m, picks: [...m.picks, { playerId, playerName: player?.name, cost: 0, round }],
       sectionCounts: {...m.sectionCounts, [sectionKey]: m.sectionCounts[sectionKey] + 1}}
    : m);
  const newLog = [...s.log, {
    round, playerId, playerName: player?.name,
    winnerMgrId: mgrId, winnerMgrName: s.managers.find(m=>m.id===mgrId)?.name,
    cost: 0, comfort: [], isRelegation: true,
  }];
  return {...s, players: newPlayers, managers: newManagers, log: newLog};
}
